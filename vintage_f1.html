<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>GRAND PRIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#05070a;display:flex;align-items:center;justify-content:center;height:100vh;}
</style>
</head>
<body>
<canvas id="g" width="520" height="680"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=520,H=680,HY=50;
// the gravel/runoff fringe drawn around every track (see buildTrack) extends
// a flat 23px beyond the tarmac on each side, regardless of that track's TW.
// It used to be treated as fully off-track the instant you touched it; now
// it's a genuinely usable, pace-neutral part of the surface, so cars (player
// and AI alike) can run wide through fast corners without being punished —
// true "off track" now only starts once you're past the gravel, in the grass.
const GRAVEL_SAFE=23;
// how far ahead (px) an AI car looks for a blocker to set up a pass on, and
// how wide a forward cone (as a fraction of distance, ~53° half-angle) counts
// as "ahead" rather than beside/behind — see the overtaking logic in update().
const OVERTAKE_RANGE=70, OVERTAKE_CONE=0.6;

// ══════════════════════════════════════════════════════════════════
// TRACK GENERATION — star-shaped polar curve => guaranteed simple loop
// ══════════════════════════════════════════════════════════════════
function wrapPi(a){ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; }

function genCP(cfg){
  const NCP=cfg.ncp||30, cps=[];
  for(let i=0;i<NCP;i++){
    const theta=i/NCP*Math.PI*2;
    let r=cfg.R0+cfg.wobbleAmp*Math.sin(cfg.wobbleFreq*theta+cfg.wobblePhase);
    cfg.features.forEach(f=>{
      let dt=theta-f.a0;
      dt=((dt+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      r+=f.depth*Math.exp(-(dt*dt)/(2*f.width*f.width));
    });
    cps.push([cfg.cx+Math.cos(theta)*r, cfg.cy+Math.sin(theta)*r]);
  }
  return cps;
}
function catmull(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return[
    .5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
function buildPath(CP,steps){
  const N=CP.length, PATH=[];
  for(let i=0;i<N;i++){
    const p0=CP[(i-1+N)%N],p1=CP[i],p2=CP[(i+1)%N],p3=CP[(i+2)%N];
    for(let s=0;s<steps;s++) PATH.push(catmull(p0,p1,p2,p3,s/steps));
  }
  return PATH;
}
function nearestOnPath(PATH,gx,gy){
  const PN=PATH.length; let best=1e15,bi=0,bt=0;
  for(let i=0;i<PN;i++){
    const a=PATH[i],b=PATH[(i+1)%PN];
    const dx=b[0]-a[0],dy=b[1]-a[1],ll=dx*dx+dy*dy||1;
    const t=Math.max(0,Math.min(1,((gx-a[0])*dx+(gy-a[1])*dy)/ll));
    const px=a[0]+dx*t,py=a[1]+dy*t;
    const d=(gx-px)**2+(gy-py)**2;
    if(d<best){best=d;bi=i;bt=t;}
  }
  return {progress:(bi+bt)/PN, dist:Math.sqrt(best), idx:bi};
}
function computeHeadingCurv(PATH){
  const PN=PATH.length, heading=new Array(PN), rawCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    const a=PATH[i], b=PATH[(i+1)%PN];
    heading[i]=Math.atan2(b[1]-a[1],b[0]-a[0]);
  }
  for(let i=0;i<PN;i++) rawCurv[i]=wrapPi(heading[i]-heading[(i-1+PN)%PN]);
  const WIN=10, smoothCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN;k<=WIN;k++) s+=rawCurv[(i+k+PN)%PN];
    smoothCurv[i]=s/(WIN*2+1);
  }
  return {heading,smoothCurv};
}
function buildRaceLine(PATH,heading,smoothCurv,TW){
  const PN=PATH.length, GAIN=34, maxOff=TW*0.64;
  const raw=new Array(PN);
  for(let i=0;i<PN;i++) raw[i]=Math.max(-maxOff,Math.min(maxOff,-smoothCurv[i]*GAIN));
  const WIN2=5, off2=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN2;k<=WIN2;k++) s+=raw[(i+k+PN)%PN];
    off2[i]=s/(WIN2*2+1);
  }
  const line=new Array(PN);
  for(let i=0;i<PN;i++){
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    line[i]=[PATH[i][0]+nx*off2[i], PATH[i][1]+ny*off2[i]];
  }
  return line;
}

// Locate genuinely straight sections (low curvature) for DRS zone placement,
// instead of guessing from feature angles (corner features have wide gaussian tails).
function findDrsZones(smoothCurv, want){
  const PN=smoothCurv.length, thresh=0.014;
  const ext=smoothCurv.concat(smoothCurv);
  const runs=[]; let runStart=-1;
  for(let k=0;k<ext.length;k++){
    const low=Math.abs(ext[k])<thresh;
    if(low){ if(runStart<0) runStart=k; }
    else if(runStart>=0){ runs.push([runStart,k]); runStart=-1; }
  }
  const clean=runs.filter(([s,e])=>s<PN&&(e-s)<PN).sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  const zones=[], usedCenters=[];
  for(const [s,e] of clean){
    if(zones.length>=want) break;
    const len=e-s;
    if(len<PN*0.10) continue;
    const center=(s+e)/2;
    if(usedCenters.some(c=>Math.abs(((c-center+PN*1.5)%PN)-PN*0.5)<PN*0.12)) continue;
    const trim=len*0.20;
    const ts=s+trim, te=e-trim;
    const a=((ts%PN)+PN)%PN/PN, b=((te%PN)+PN)%PN/PN;
    zones.push({a,b});
    usedCenters.push(center);
  }
  return zones;
}

function buildTrack(cfg){
  const CP=genCP(cfg);
  const PATH=buildPath(CP,18);
  const PN=PATH.length;
  const {heading,smoothCurv}=computeHeadingCurv(PATH);
  const raceLine=buildRaceLine(PATH,heading,smoothCurv,cfg.TW);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const pad=cfg.TW*4+40;
  minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const bw=Math.ceil(maxX-minX), bh=Math.ceil(maxY-minY);

  // ── prerender background ──
  const bg=document.createElement('canvas'); bg.width=bw; bg.height=bh;
  const bx=bg.getContext('2d');
  const ox=-minX, oy=-minY; // world -> bg canvas offset
  bx.fillStyle='#0d1a0f'; bx.fillRect(0,0,bw,bh);
  for(let i=0;i<1400;i++){
    bx.fillStyle=`rgba(${20+Math.random()*26},${60+Math.random()*40},${20+Math.random()*18},.55)`;
    bx.fillRect(Math.random()*bw,Math.random()*bh,1+Math.random(),2+Math.random()*5);
  }
  function tPath(ctxr){
    ctxr.beginPath();
    ctxr.moveTo(PATH[0][0]+ox,PATH[0][1]+oy);
    for(let i=1;i<PN;i++) ctxr.lineTo(PATH[i][0]+ox,PATH[i][1]+oy);
    ctxr.closePath();
  }
  bx.lineCap='round'; bx.lineJoin='round';
  // gravel/runoff fringe
  bx.strokeStyle='#7a6c54'; bx.lineWidth=cfg.TW*2+46; tPath(bx); bx.stroke();
  // tarmac border + surface
  bx.strokeStyle='#15151c'; bx.lineWidth=cfg.TW*2+10; tPath(bx); bx.stroke();
  bx.strokeStyle='#33333e'; bx.lineWidth=cfg.TW*2; tPath(bx); bx.stroke();
  bx.strokeStyle='rgba(255,255,255,.025)'; bx.lineWidth=cfg.TW*2-14; tPath(bx); bx.stroke();
  // graffiti tags painted directly on the tarmac, laid down before the edge
  // lines/curbs/start-finish markings so those stay crisp on top — street
  // circuit flavour for 'city' tracks. scatterGraffiti/dGraffiti are plain
  // function declarations defined further down in this same function body,
  // which JS hoists to the top of buildTrack(), so calling them here is safe.
  if(cfg.graffiti) scatterGraffiti(28);
  // edge lines
  bx.strokeStyle='rgba(241,245,249,.55)'; bx.lineWidth=2.4; tPath(bx); bx.stroke();
  // curbs on hard corners (red/white)
  const CURB_T=0.034;
  for(let i=0;i<PN;i+=2){
    if(Math.abs(smoothCurv[i])<CURB_T) continue;
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    [1,-1].forEach(side=>{
      const px=PATH[i][0]+nx*side*(cfg.TW+2), py=PATH[i][1]+ny*side*(cfg.TW+2);
      bx.save(); bx.translate(px+ox,py+oy); bx.rotate(h);
      bx.fillStyle=(Math.floor(i/2)%2===0)?'#d63a2e':'#f1f5f9';
      bx.fillRect(-4,-6,8,12);
      bx.restore();
    });
  }
  // start/finish checker
  const sfAng=heading[0], sfPerp=sfAng+Math.PI/2, [sfx,sfy]=PATH[0];
  for(let k=0;k<10;k++){
    const t=(k/10-.5)*(cfg.TW*2-4);
    bx.save(); bx.translate(sfx+ox+Math.cos(sfPerp)*t, sfy+oy+Math.sin(sfPerp)*t);
    bx.rotate(sfAng); bx.fillStyle=k%2?'#111':'#eee'; bx.fillRect(-4,-9,8,18);
    bx.restore();
  }
  // sector tick marks (1/3, 2/3)
  [Math.floor(PN/3), Math.floor(PN*2/3)].forEach(idx=>{
    const h=heading[idx], perp=h+Math.PI/2, [px,py]=PATH[idx];
    bx.strokeStyle='rgba(250,204,21,.85)'; bx.lineWidth=2.5; bx.setLineDash([4,4]);
    bx.beginPath();
    bx.moveTo(px+ox+Math.cos(perp)*cfg.TW, py+oy+Math.sin(perp)*cfg.TW);
    bx.lineTo(px+ox-Math.cos(perp)*cfg.TW, py+oy-Math.sin(perp)*cfg.TW);
    bx.stroke(); bx.setLineDash([]);
  });
  // DRS zone tint + markers
  const drsZones=findDrsZones(smoothCurv, cfg.drsCount||1);
  drsZones.forEach(z=>{
    const i0=Math.floor(z.a*PN), i1raw=Math.floor(z.b*PN), i1=i1raw<i0?i1raw+PN:i1raw;
    for(let i=i0;i<i1;i+=2){
      const ii=i%PN;
      const [px,py]=PATH[ii];
      bx.strokeStyle='rgba(168,85,247,.22)'; bx.lineWidth=cfg.TW*2-6;
      bx.beginPath();
      bx.moveTo(px+ox, py+oy);
      const nx=PATH[(ii+2)%PN];
      bx.lineTo(nx[0]+ox, nx[1]+oy);
      bx.stroke();
    }
    const mid=Math.floor(((i0+i1)/2))%PN;
    const [mx,my]=PATH[mid], mh=heading[mid];
    bx.save(); bx.translate(mx+ox,my+oy); bx.rotate(mh+Math.PI/2);
    bx.fillStyle='#a855f7'; bx.font='bold 11px Courier New'; bx.textAlign='center';
    bx.fillText('DRS',0,-cfg.TW-10);
    bx.restore();
  });
  bx.globalAlpha=1;

  // ── terrain decoration, themed per track ──
  // scattered only where they're clearly clear of the tarmac+gravel (a 26px
  // buffer beyond the pace-neutral gravel edge), so they read purely as
  // scenery — never mistakable for part of the drivable surface. Drawn last,
  // on top of the fully-finished track render, so there's zero chance of a
  // decoration bleeding onto an edge line or curb.
  function distToPath(x,y){
    let best=1e15;
    for(let i=0;i<PN;i++){
      const dx=x-PATH[i][0], dy=y-PATH[i][1];
      const d=dx*dx+dy*dy;
      if(d<best) best=d;
    }
    return Math.sqrt(best);
  }
  const CLEAR=cfg.TW+GRAVEL_SAFE+26;
  function scatterTerrain(count,minSpace,draw){
    const pts=[]; let tries=0;
    while(pts.length<count && tries<count*16){
      tries++;
      const x=Math.random()*bw, y=Math.random()*bh;
      if(distToPath(x-ox,y-oy)<CLEAR) continue;
      if(pts.some(p=>{const dx=p[0]-x,dy=p[1]-y;return dx*dx+dy*dy<minSpace*minSpace;})) continue;
      pts.push([x,y]);
      draw(x,y);
    }
  }
  function dTree(x,y,s){
    bx.save(); bx.translate(x,y);
    const shades=['#14532d','#1b6b3a','#0f3d22'];
    for(let k=0;k<3;k++){
      bx.fillStyle=shades[k%shades.length];
      bx.beginPath(); bx.arc((Math.random()-.5)*6*s,(Math.random()-.5)*6*s-4*s,7*s+Math.random()*3*s,0,Math.PI*2); bx.fill();
    }
    bx.fillStyle='#4a3420'; bx.fillRect(-1.5*s,2*s,3*s,6*s);
    bx.restore();
  }
  function dRock(x,y,s,tint){
    bx.save(); bx.translate(x,y);
    bx.fillStyle=tint||(Math.random()<.5?'#5b5b63':'#6b6b74');
    bx.beginPath();
    const n=5+Math.floor(Math.random()*2);
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, r=(6+Math.random()*4)*s;
      const px=Math.cos(a)*r, py=Math.sin(a)*r*.8;
      k===0?bx.moveTo(px,py):bx.lineTo(px,py);
    }
    bx.closePath(); bx.fill();
    bx.strokeStyle='rgba(255,255,255,.08)'; bx.lineWidth=1; bx.stroke();
    bx.restore();
  }
  function dHedge(x,y,s){
    bx.save(); bx.translate(x,y); bx.rotate(Math.random()*Math.PI);
    bx.fillStyle='#1d5a35';
    const w=14*s,h=9*s;
    bx.beginPath();
    if(bx.roundRect) bx.roundRect(-w/2,-h/2,w,h,3); else bx.rect(-w/2,-h/2,w,h);
    bx.fill();
    bx.fillStyle='rgba(255,255,255,.07)'; bx.fillRect(-w/2,-h/2,w,h*0.3);
    bx.restore();
  }
  function dBush(x,y,s){
    bx.save(); bx.translate(x,y);
    bx.fillStyle=Math.random()<.5?'#7a7a42':'#8a8350';
    bx.beginPath(); bx.arc(0,0,5*s,0,Math.PI*2); bx.fill();
    bx.fillStyle='#5f5c33';
    bx.beginPath(); bx.arc(3*s,1*s,3*s,0,Math.PI*2); bx.fill();
    bx.restore();
  }
  function dLavaRock(x,y,s){
    bx.save(); bx.translate(x,y);
    bx.fillStyle='#2b2320';
    bx.beginPath();
    const n=5+Math.floor(Math.random()*2);
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, r=(6+Math.random()*5)*s;
      const px=Math.cos(a)*r, py=Math.sin(a)*r*.85;
      k===0?bx.moveTo(px,py):bx.lineTo(px,py);
    }
    bx.closePath(); bx.fill();
    if(Math.random()<.35){ bx.fillStyle='rgba(249,115,22,.75)'; bx.beginPath(); bx.arc(0,0,1.6*s,0,Math.PI*2); bx.fill(); }
    bx.restore();
  }
  function dLavaPool(x,y,s){
    bx.save(); bx.translate(x,y);
    bx.fillStyle='rgba(40,20,15,.85)'; bx.beginPath(); bx.arc(0,0,9*s,0,Math.PI*2); bx.fill();
    bx.fillStyle='rgba(234,88,12,.85)'; bx.beginPath(); bx.arc(0,0,6*s,0,Math.PI*2); bx.fill();
    bx.fillStyle='rgba(253,186,116,.6)'; bx.beginPath(); bx.arc(-1.5*s,-1.5*s,2.4*s,0,Math.PI*2); bx.fill();
    bx.restore();
  }
  function dGrandstand(x,y,ang,w,h){
    bx.save(); bx.translate(x,y); bx.rotate(ang);
    bx.fillStyle='#2b2b33'; bx.fillRect(-w/2,-h/2,w,h);
    bx.fillStyle='#3a3a44'; bx.fillRect(-w/2,-h/2,w,h*0.3);
    const cols=['#ef4444','#38bdf8','#eab308','#f1f5f9'];
    for(let r=0;r<3;r++) for(let c=0;c<Math.floor(w/7);c++){
      bx.fillStyle=cols[(r+c)%cols.length];
      bx.fillRect(-w/2+4+c*7, -h/2+6+r*7, 3,3);
    }
    bx.restore();
  }
  // city street-circuit building, drawn "standing up" out of the gravel —
  // a tinted facade block with a lit-window grid and an optional rooftop
  // plant unit, so the skyline reads instantly as urban rather than forest.
  function dBuilding(x,y,s,pal){
    bx.save(); bx.translate(x,y);
    const h=(20+Math.random()*30)*s, w=(11+Math.random()*7)*s;
    bx.fillStyle=pal||'#2d3344';
    bx.fillRect(-w/2,-h,w,h);
    bx.fillStyle='rgba(255,255,255,.07)'; bx.fillRect(-w/2,-h,w*.35,h);
    bx.fillStyle='rgba(250,204,21,.6)';
    const rows=Math.floor(h/7), cols=Math.max(1,Math.floor(w/5));
    for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++){
      if(Math.random()<0.4) continue;
      bx.fillRect(-w/2+3+cc*5, -h+4+r*7, 2.4,3.2);
    }
    if(Math.random()<.5){ bx.fillStyle='#1b1f29'; bx.fillRect(-w*.18,-h-6*s,w*.36,6*s); }
    bx.restore();
  }
  // spray-paint tag: a bold ellipse blob plus a couple of drip lines, drawn
  // straight onto the tarmac at a random lateral offset within the track
  // width — graffiti on the racing surface itself, not off-track scenery.
  function dGraffiti(x,y,ang,scale){
    bx.save(); bx.translate(x,y); bx.rotate(ang);
    const palette=['#f472b6','#facc15','#34d399','#38bdf8','#fb923c','#a78bfa'];
    const c1=palette[Math.floor(Math.random()*palette.length)];
    const c2=palette[Math.floor(Math.random()*palette.length)];
    bx.globalAlpha=0.5;
    bx.fillStyle=c1;
    bx.beginPath(); bx.ellipse(0,0,10*scale,5*scale,0,0,Math.PI*2); bx.fill();
    bx.strokeStyle=c2; bx.lineWidth=1.6; bx.stroke();
    bx.strokeStyle=c2; bx.lineWidth=1.2;
    for(let k=0;k<3;k++){
      bx.beginPath();
      const ox2=(k-1)*6*scale;
      bx.moveTo(ox2,-4*scale); bx.lineTo(ox2+(Math.random()-.5)*3,6*scale+Math.random()*4*scale);
      bx.stroke();
    }
    bx.globalAlpha=1;
    bx.restore();
  }
  function scatterGraffiti(count){
    for(let i=0;i<count;i++){
      const idx=Math.floor(Math.random()*PN);
      const [px,py]=PATH[idx], h=heading[idx];
      const latMax=cfg.TW-10; if(latMax<4) continue;
      const side=Math.random()<0.5?-1:1;
      const lat=side*(4+Math.random()*(latMax-4));
      const nx=-Math.sin(h), ny=Math.cos(h);
      dGraffiti(px+nx*lat+ox, py+ny*lat+oy, h+Math.PI/2, 0.8+Math.random()*0.6);
    }
  }
  const terrain=cfg.terrain||'forest';
  if(terrain==='mountain'){
    scatterTerrain(75,22,(x,y)=>dRock(x,y,0.9+Math.random()*0.6));
    scatterTerrain(42,26,(x,y)=>dTree(x,y,0.65+Math.random()*0.35));
  } else if(terrain==='forest'){
    scatterTerrain(120,20,(x,y)=>dTree(x,y,0.8+Math.random()*0.5));
    scatterTerrain(20,24,(x,y)=>dRock(x,y,0.8+Math.random()*0.4));
  } else if(terrain==='parkland'){
    scatterTerrain(75,24,(x,y)=>dTree(x,y,0.7+Math.random()*0.4));
  } else if(terrain==='hedge'){
    scatterTerrain(95,22,(x,y)=>dHedge(x,y,0.9+Math.random()*0.3));
  } else if(terrain==='arid'){
    scatterTerrain(80,18,(x,y)=>dBush(x,y,0.8+Math.random()*0.5));
    scatterTerrain(36,22,(x,y)=>dRock(x,y,0.7+Math.random()*0.5,'#8a7a66'));
  } else if(terrain==='volcanic'){
    scatterTerrain(90,18,(x,y)=>dLavaRock(x,y,0.8+Math.random()*0.6));
    scatterTerrain(14,40,(x,y)=>dLavaPool(x,y,1.1+Math.random()*0.5));
  } else if(terrain==='city'){
    scatterTerrain(46,30,(x,y)=>dBuilding(x,y,1+Math.random()*0.6,cfg.cityPal));
    scatterTerrain(55,14,(x,y)=>dBush(x,y,0.5+Math.random()*0.3));
  }
  // grandstands flank the start/finish straight on the high-speed temple track
  if(cfg.name==='AUTODROMO'){
    const standOffs=cfg.TW+GRAVEL_SAFE+40;
    [1,-1].forEach(side=>{
      const px=sfx+Math.cos(sfPerp)*standOffs*side, py=sfy+Math.sin(sfPerp)*standOffs*side;
      dGrandstand(px+ox,py+oy, sfAng, 120, 26);
    });
  }

  return {CP,PATH,PN,heading,smoothCurv,raceLine,TW:cfg.TW,name:cfg.name,info:cfg.info,
    drsZones,bg,bgOx:ox,bgOy:oy,bgMinX:minX,bgMinY:minY,sfAng,sfx,sfy};
}

// The three original tracks are redesigned around real circuit-design
// vocabulary (researched: racetrackdesign.com's design-principles guide, and
// corner-sequence writeups of Spa-Francorchamps/Monza) instead of generic
// procedural wobble — each is deliberately an entry/mid/exit corner sequence
// with real low-curvature straights between the features, not just a blob:
//  - MONTE SPIRA: a tight mountain pass — kink out of the line, a fast sweep
//    into the signature tightening hairpin ("spira"), a quick esses pair,

// AI difficulty tiers — rebuilt so the tiers are differentiated by TECHNIQUE,
// not raw straight-line pace. baseMax (flat-out speed) is now nearly IDENTICAL
// across every tier (≈6% spread total, down from the old ~51%) — on a clean
// straight, an ENKEL car and an ULTRA car accelerate to almost the same top
// speed. The entire difficulty gap instead comes from how a tier actually
// *drives*:
//  - curveK: cornering confidence. HIGHEST on ENKEL, LOWEST on ULTRA — a weak
//    driver lifts off far more than a corner actually needs (overly cautious,
//    loses time), a great driver stays confident and carries speed through
//    the bend. This is the single biggest technique lever.
//  - steerPrec / overspeed: how tightly a tier holds its line and its braking
//    margin into a corner — sloppier and more cautious on ENKEL, razor-sharp
//    on ULTRA.
//  - mistakeChance: occasional misjudged braking points — frequent on ENKEL,
//    literally zero on ULTRA.
//  - overtakeCommit: how decisively a tier executes a passing move (bigger,
//    more sustained swing around a blocker) — a weak driver half-commits and
//    often doesn't complete the pass, a great driver fully commits.
//  - defendSkill: genuine defensive driving — the probability (per frame,
//    only ever applied on a low-curvature straight/braking zone, never mid-
//    corner) that this car reacts to an attacker closing from behind by
//    moving to cover that side of the track. ENKEL barely defends at all;
//    ULTRA defends its position hard.
//  - ersSkill: how well a tier manages its battery (see the ERS system in
//    update()) — a sharp driver deploys it when it matters (on a straight or
//    mid-overtake/defend), a weak driver uses it more on a whim.
// NOTE on lookAhead: this is held constant (11) across every tier on purpose.
// It sets how far down the race line the AI steers toward each frame; pushing
// it higher (as a naive "better driver sees further" tier scale once did)
// makes the AI aim straight at a race-line point that cuts across the inside
// of hairpins, driving it off-track almost permanently.
// All of the above was recalibrated via automated lap testing across every
// track to keep off-track time near 0% while still giving each tier a
// clearly distinct *feel* to race against, without a dominant pace gap.

class Car{

    this.sectorIdx=0;this.sectorStartT=0;this.lapStartT=0;this.lapTimes=[];
    this.aiIdx=0;this.aiSpd=2.25+Math.random()*.45;
    this.skillVar=0.94+Math.random()*0.12; // overwritten per grid slot for AI, see buildCars()
    this.num=1; // driver number within the team (1 or 2)
    this.rubberMul=1; this.mistakeT=0;
    this.stuckRefDist=0; this.stuckT=180; // stuck-in-gravel recovery bookkeeping (AI only)
    this.overtakeSide=0; this.overtakeT=0; // which way (and for how long) this AI is currently swinging out to pass a blocker ahead
    this.defendSide=0; this.defendT=0; // which way (and for how long) this AI is currently covering to defend against an attacker from behind
    this.trail=[];this.finished=false;this.place=1;
    this.offtrack=false;this.drsActive=false;
    this.battery=100; this.ersActive=false; // ERS/battery: 0-100%, see update()

function buildCars(){
  cars=[];
  const PN=TR.PN;
  // full 20-car identity pool (10 teams × 2 drivers), shuffled so grid
  // colours/numbers vary race to race — then the PLAYER is always pulled
  // out for the very last grid slot, and the 19 AI identities fill the
  // slots ahead in the shuffled order. Real overtaking through the whole
  // field is therefore mandatory, every single race.
  const pool=[];
  TEAMS.forEach(t=>{ for(let n=1;n<=DRIVERS_PER_TEAM;n++) pool.push({team:t,num:n}); });
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  const playerId=pool.pop(); // removed from the AI pool entirely

  // Grid slots are placed by walking BACKWARD along the actual track path
  // (not a straight-line projection from the start point), so the grid
  // stays glued to the real geometry even on a tight track where the
  // pre-start straight curves. The 19 AI cars fill two-wide rows 0-8 plus
  // a lone car in row 9; the player then gets its OWN row 10, strictly
  // further back than every AI car. This has to be a physical placement,
  // not a one-off progress-value override: curProg gets recomputed from
  // the car's real (x,y) every single frame once the race is live (see
  // the nearestOnPath call in the main update loop below), so anything
  // that doesn't come from genuinely being further back on the tarmac
  // gets silently overwritten the instant the lights go out. A dedicated
  // last row is the only thing that survives that recompute, which is
  // what actually guarantees the player is always dead last at the start.
  const ROW_IDX_STEP=2, COL_OFFSET=14;
  function gridPose(row,col){
    const idx=((0-row*ROW_IDX_STEP)%PN+PN)%PN;
    const [px,py]=TR.PATH[idx], h=TR.heading[idx];
    const nx=-Math.sin(h), ny=Math.cos(h);
    return {x:px+nx*col*COL_OFFSET, y:py+ny*col*COL_OFFSET, ang:h};
  }
  // Grid rows parked behind the start/finish line land at raw path-progress
  // close to 1.0 (idx counts backward from the line toward PN), while pole
  // position sits at progress≈0 right on the line. Left as-is, that makes
  // raceDist/place sort the whole grid BACKWARDS at the green light — the
  // deeper in the field a car starts, the LARGER its raw progress number,
  // so it would rank ahead of cars in front of it. Un-wrap it once here:
  // anything parked behind the line (progress>0.5) is still finishing a
  // lap that never really happened, so treat it as slightly negative
  // instead, preserving true grid order from pole all the way back.
  function initRaceDist(c){
    c.raceDist = c.curProg>0.5 ? c.curProg-1 : c.curProg;
    c.stuckRefDist=c.raceDist; // so the first stuck-check window measures from each car's real start, not a shared 0
  }

  const AI_COUNT=NUM_CARS-1; // 19
  for(let p=0;p<AI_COUNT;p++){
    const id=pool[p];
    const row=Math.floor(p/2), col=(p%2===0)?-1:1;
    const {x,y,ang}=gridPose(row,col);
    const c=new Car(x,y,ang,id.team,false);
    c.num=id.num;
    c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
    c.prevProg=c.curProg;
    initRaceDist(c);
    // pace spread across the grid: pole-sitters are the tiers' strongest
    // drivers, backmarkers (just ahead of the player) are its weakest —
    // so starting last means picking off easy traffic first before facing
    // real resistance up front, instead of 19 identical clones.
    const posFactor=1.08-0.22*(p/(AI_COUNT-1));
    c.skillVar=posFactor*(0.97+Math.random()*0.06);
    cars.push(c);
  }
  {
    const lastAiRow=Math.floor((AI_COUNT-1)/2);
    const row=lastAiRow+1, col=0;
    const {x,y,ang}=gridPose(row,col);
    const c=new Car(x,y,ang,playerId.team,true);
    c.num=playerId.num;
    c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
    c.prevProg=c.curProg;
    initRaceDist(c);
    cars.push(c);
  }
  player=cars.find(c=>c.isPlayer);
  camX=player.x; camY=player.y; camAngle=player.angle;
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function update(){
  // decay / animate regardless of state
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life-=p.d;return p.life>0;});
  texts=texts.filter(t=>{t.y+=t.vy;t.life-=.018;return t.life>0;});
  toasts=toasts.filter(t=>{t.life-=.01;return t.life>0;});
  if(shake>0){shake*=.85; if(shake<.08)shake=0;}
  if(state==='win'){ winTimer++; confetti=confetti.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.vy+=.02;return f.y<H+20;}); }

  if(state==='countdown'){
    cntTimer--; if(cntTimer<=0) state='playing';
    return;
  }
  if(state!=='playing' && state!=='practice') return;
  raceTime++;

  cars.forEach(c=>{
    if(c.finished)return;
    let gas=false,steerL=false,steerR=false,brake=false,drsKey=false;
    if(c.isPlayer){
      gas=!!(keys['ArrowUp']||keys['w']||keys['W']);
      brake=!!(keys['ArrowDown']||keys['s']||keys['S']);
      steerL=!!(keys['ArrowLeft']||keys['a']||keys['A']);
      steerR=!!(keys['ArrowRight']||keys['d']||keys['D']);
      drsKey=!!(keys[' ']);
      // ERS deploy is its own key (Shift), separate from DRS (Space) — a
      // real F1 car can run both systems at once.
      c.ersActive=!!(keys['Shift']||keys['ShiftLeft']||keys['ShiftRight']) && c.battery>0;
    } else {
      const PN=TR.PN;
      const D=DIFFICULTIES[difficulty];
      const li=Math.floor(c.curProg*PN);

      // overtaking: scan for the closest car in a forward cone ahead. If one
      // is found, commit to passing it on one side for a short persistent
      // window (so the choice doesn't flip-flop frame to frame), and nudge
      // the steering target laterally so this car actually swings around the
      // blocker instead of just nose-to-tailing it via collision-separation.
      const cosA=Math.cos(c.angle), sinA=Math.sin(c.angle);
      // single pass over the field finds both a blocker ahead (to overtake)
      // and an attacker behind (to defend against) — genuine technique on
      // both sides of a fight, not just a one-way AI chasing the player.
      let blockerLat=0, blockerFound=false, blockerD=Infinity;
      let attackerLat=0, attackerFound=false, attackerD=Infinity;
      for(let bi=0;bi<cars.length;bi++){
        const o=cars[bi];
        if(o===c||o.finished) continue;
        const dx=o.x-c.x, dy=o.y-c.y, d=Math.hypot(dx,dy);
        if(d>OVERTAKE_RANGE) continue;
        const fwd=dx*cosA+dy*sinA, lat=-dx*sinA+dy*cosA;
        if(fwd>0 && fwd>=d*OVERTAKE_CONE){
          if(d<blockerD){ blockerD=d; blockerLat=lat; blockerFound=true; }
        } else if(fwd<0 && -fwd>=d*OVERTAKE_CONE && o.speed>c.speed*1.02){
          if(d<attackerD){ attackerD=d; attackerLat=lat; attackerFound=true; }
        }
      }
      if(c.overtakeT>0) c.overtakeT--;
      if(blockerFound){
        if(c.overtakeT<=0){
          // swing away from whichever side the blocker currently sits on; if
          // it's dead-center ahead, fall back to a stable per-car side bias
          // (driver #1 of each team defaults right, #2 defaults left).
          c.overtakeSide = Math.abs(blockerLat)>2 ? -Math.sign(blockerLat) : (c.num===1?1:-1);
        }
        // overtakeCommit: how long/decisively a tier holds the passing move —
        // a weak driver barely commits before bailing back onto the racing line.
        c.overtakeT=20+25*D.overtakeCommit;
      }
      const curvNow=Math.abs(TR.smoothCurv[li]);

      // defending: react to an attacker closing from behind by moving to
      // cover that side — but only ever on a low-curvature stretch (a real
      // driver defends on the straight/braking zone, never mid-corner).
      // defendSkill sets both how often this tier even reacts, and (below)
      // how far it's willing to move to do it.
      if(c.defendT>0) c.defendT--;
      if(attackerFound && D.defendSkill>0 && Math.abs(curvNow)<0.012 && Math.random()<D.defendSkill*0.08){
        c.defendSide = Math.abs(attackerLat)>2 ? -Math.sign(attackerLat) : (c.num===1?1:-1);
        c.defendT=50;
      }

      const curvAllow=1/(1+curvNow*D.curveK*1.5); // ease the swing off deep in tight corners
      const ramp=Math.min(1,c.overtakeT/20);
      const maxOvertakeOffset=TR.TW*0.5*D.overtakeCommit;
      const overtakeOffset = c.overtakeT>0 ? c.overtakeSide*maxOvertakeOffset*curvAllow*ramp : 0;
      const defendRamp=Math.min(1,c.defendT/25);
      const maxDefendOffset=TR.TW*0.4*D.defendSkill;
      const defendOffset = c.defendT>0 ? c.defendSide*maxDefendOffset*defendRamp*curvAllow : 0;
      const lateralOffset = overtakeOffset+defendOffset;

      const lookI=(li+D.lookAhead)%PN;
      const [rtx,rty]=TR.raceLine[lookI];
      const hd=TR.heading[lookI];
      const tx=rtx-Math.sin(hd)*lateralOffset, ty=rty+Math.cos(hd)*lateralOffset;
      const da=Math.atan2(ty-c.y,tx-c.x);
      let diff=wrapPi(da-c.angle);
      steerL=diff<-D.steerPrec; steerR=diff>D.steerPrec;

      // occasional misjudged braking point — more frequent on easier tiers,
      // never happens on ULTRA. While active, the AI brakes far less than it
      // should for the upcoming corner, so it genuinely runs wide/off-track.
      if(c.mistakeT>0) c.mistakeT--;
      else if(D.mistakeChance>0 && Math.random()<D.mistakeChance) c.mistakeT=40;
      const effK = c.mistakeT>0 ? D.curveK*0.25 : D.curveK;

      // real corner-speed planning: scan ahead (window grows with current
      // speed, like a real braking distance) for the sharpest upcoming bend
      // and set a target speed for it, instead of just following a fixed
      // speed cap blindly into every hairpin.
      const win=Math.round(20+c.speed*9);
      let maxCurv=0;
      for(let k=0;k<win;k++){
        const cv=Math.abs(TR.smoothCurv[(li+k)%PN]);
        if(cv>maxCurv) maxCurv=cv;
      }
      const corner=c.skillVar*D.baseMax/(1+maxCurv*effK);

      // light rubber-band: keeps the pack from drifting absurdly far apart
      // over a full race, but it's now a small multiplier on top of genuine
      // skill-based pace rather than the main driver of AI speed.
      const gap=c.raceDist-player.raceDist;
      c.rubberMul=Math.max(.85,Math.min(1.18,c.rubberMul+(gap>D.rubberThresh?-D.rubberRate:gap<-D.rubberThresh?D.rubberRate:0)));

      c.aiSpd=corner*c.rubberMul;
      gas = c.speed < c.aiSpd;
      brake = c.speed > c.aiSpd*D.overspeed;

      // ERS deploy: a sharper tier (higher ersSkill) saves its battery for
      // when it actually matters — an overtake/defend fight or a straight —
      // instead of spending it the instant it's available.
      c.ersActive = c.battery>25 && (blockerFound||attackerFound||Math.abs(curvNow)<0.008)
        && Math.random()<(0.35+0.5*D.ersSkill);
    }

    const near=nearestOnPath(TR.PATH,c.x,c.y);
    const dist=near.dist;
    const wasOff=c.offtrack;
    // the gravel/runoff fringe (GRAVEL_SAFE px beyond the tarmac, see top of
    // file) is now a genuinely usable, pace-neutral part of the surface —
    // true off-track only starts once you're past the gravel, in the grass.
    c.offtrack = dist>TR.TW+GRAVEL_SAFE;
    const deepOff = dist>TR.TW*2.3+GRAVEL_SAFE;
    if(c.offtrack && !wasOff && c.isPlayer){
      toast('UTENFOR BANEN — taper fart!','#ef4444');
    }
    if(!c.offtrack && wasOff && c.isPlayer){
      toast('TILBAKE PÅ ASFALT','#4ade80');
    }

    // stuck-in-gravel recovery (AI only) — if an AI car makes essentially no
    // lap progress for 3s straight (overshot a corner, wedged on the outer
    // wall, whatever the cause), snap it back onto the track centerline
    // instead of leaving it permanently stranded for the rest of the race.
    if(!c.isPlayer){
      c.stuckT--;
      if(c.stuckT<=0){
        if(c.raceDist-c.stuckRefDist<0.015){
          const [px,py]=TR.PATH[near.idx];
          c.x=px; c.y=py; c.angle=TR.heading[near.idx];
          c.speed=1.2; c.vx=Math.cos(c.angle)*1.2; c.vy=Math.sin(c.angle)*1.2;
          c.offtrack=false;
        }
        c.stuckRefDist=c.raceDist; c.stuckT=180;
      }
    }

    const DRSon = c.isPlayer ? (drsKey && inDRSZone(c.curProg)) : inDRSZone(c.curProg);
    c.drsActive = DRSon;

    // battery/ERS: drains while deployed, recharges while braking (fast) or
    // simply lifting off the throttle (slow) — real hybrid energy management,
    // not a free boost. c.ersActive was already decided above (player: Shift
    // key + battery>0; AI: its own deploy decision) — here we just apply it.
    const ersOn = c.ersActive && c.battery>0;
    c.ersActive = ersOn;
    if(ersOn) c.battery=Math.max(0,c.battery-1.1);
    else if(brake) c.battery=Math.min(100,c.battery+0.75);
    else if(!gas) c.battery=Math.min(100,c.battery+0.3);

    let MAX=(c.isPlayer?4.8:c.aiSpd)*(DRSon?1.12:1)*(ersOn?1.08:1);
    let GRIP=0.82, accelMul=1, dragMul=1;
    if(c.offtrack){
      accelMul = deepOff? 0.28 : 0.45;
      MAX *= deepOff? 0.5 : 0.68;
      dragMul = deepOff? 0.90 : 0.95;
      GRIP = 0.6;
      if(Math.random()<.6) dust(c.x-Math.cos(c.angle)*8,c.y-Math.sin(c.angle)*8, deepOff?'rgba(122,108,84,.8)':'rgba(70,110,60,.7)');
      if(c.isPlayer) raceTime += 1.0; // time penalty: lose extra time off-track
    }
    if(ersOn) accelMul*=1.18;

    if(gas)    c.speed=Math.min(MAX,c.speed+.17*accelMul);
    else       c.speed*=.978;
    if(brake)  c.speed*=.86;
    c.speed*=dragMul;
    c.speed=Math.max(0,Math.min(c.speed,MAX*1.02));

    const turnRate=0.046*(0.32+0.68*Math.min(1,c.speed/((c.isPlayer?4.8:c.aiSpd))));
    if(steerL)c.angle-=turnRate;
    if(steerR)c.angle+=turnRate;

    c.vx+=(Math.cos(c.angle)*c.speed-c.vx)*GRIP;
    c.vy+=(Math.sin(c.angle)*c.speed-c.vy)*GRIP;
    const preX=c.x+c.vx, preY=c.y+c.vy;
    // soft outer wall far beyond gravel
    const farD=Math.hypot(preX-TR.PATH[near.idx][0],preY-TR.PATH[near.idx][1]);
    if(farD>TR.TW*3.0+GRAVEL_SAFE){
      c.speed*=0.5; c.vx*=0.35; c.vy*=0.35;
      if(c.isPlayer) addShake(Math.min(9,c.speed*1.6));
      for(let i=0;i<6;i++){
        const a=Math.random()*Math.PI*2, s=Math.random()*2.2+.5;
        particles.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.05,r:Math.random()*1.6+.6,clr:'#fde68a'});
      }
    } else {
      c.x=preX; c.y=preY;
    }

    // skid trail
    const slip=Math.abs(c.vx*Math.sin(c.angle)-c.vy*Math.cos(c.angle));
    if(slip>.42||c.speed>4.6){
      c.trail.push({x:c.x-Math.cos(c.angle)*7,y:c.y-Math.sin(c.angle)*7,life:.85,d:.02});
    }
    c.trail=c.trail.filter(t=>{t.life-=t.d;return t.life>0;});

    // DRS exhaust spark
    if(c.drsActive && Math.random()<.4){
      const a=c.angle+Math.PI+(Math.random()-.5)*.5;
      particles.push({x:c.x,y:c.y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,life:.6,d:.04,r:1.8,clr:'#c084fc'});
    }
    // ERS deploy spark — cyan, distinct from the purple DRS spark
    if(c.ersActive && Math.random()<.5){
      const a=c.angle+Math.PI+(Math.random()-.5)*.5;
      particles.push({x:c.x,y:c.y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,life:.6,d:.04,r:1.8,clr:'#38bdf8'});
    }

    // progress / lap / sector tracking
    const pr=near.progress;
    // continuous wrap-aware distance tracker for ranking/gap/stuck checks —
    // unlike lap+curProg, this never jumps at the start/finish crossing, so
    // it stays honest even before the anti-cheese seenHalf lap-gate below
    // has registered a real lap (see initRaceDist() in buildCars()).
    let dRace=pr-c.prevProg; if(dRace<-0.5)dRace+=1; else if(dRace>0.5)dRace-=1;
    c.raceDist+=dRace;
    c.curProg=pr;
    if(pr>.38&&pr<.62)c.seenHalf=true;
    const sOf=Math.min(2,Math.floor(pr*3));
    if(sOf!==c.sectorIdx && ((c.sectorIdx+1)%3)===sOf){
      const t=(raceTime-c.sectorStartT)/60;
      if(c.isPlayer){
        const sNum=c.sectorIdx+1;
        let clr='#f1f5f9';
        if(t<bestSector[c.sectorIdx]){bestSector[c.sectorIdx]=t;clr='#c084fc';}
        toast(`SEKTOR ${sNum}: ${t.toFixed(2)}s`,clr);
      }
      c.sectorIdx=sOf; c.sectorStartT=raceTime;
    }
    if(c.prevProg>.88&&pr<.12&&c.seenHalf){
      c.lap++; c.seenHalf=false; c.sectorIdx=0; c.sectorStartT=raceTime;
      if(c.isPlayer){
        const lt=((raceTime-c.lapStartT)/60).toFixed(2);
        c.lapTimes.push(lt);
        c.lapStartT=raceTime;
        if(state==='practice') toast(`RUNDE ${c.lap} FERDIG: ${lt}s`,'#38bdf8');
      }
      if(state==='playing' && c.lap>=LAPS){
        c.finished=true;
        if(c.isPlayer){ state='win'; winTimer=0; if(c.place===1) spawnConfetti(); }
      }
    }
    c.prevProg=pr;
  });

  // car-vs-car contact: prevents free pass-through so overtaking is a real,
  // contested act (bump and lose speed if a pass is misjudged).
  if(cars.length>1){
    for(let i=0;i<cars.length;i++){
      for(let j=i+1;j<cars.length;j++){
        const a=cars[i], b=cars[j];
        if(a.finished||b.finished) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), minD=15;
        if(d>0&&d<minD){
          const overlap=(minD-d)/2, nx=dx/d, ny=dy/d;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          a.speed*=.92; b.speed*=.92;
          a.vx-=nx*.4; a.vy-=ny*.4; b.vx+=nx*.4; b.vy+=ny*.4;
          if(a.isPlayer||b.isPlayer) addShake(3);
        }
      }
    }
  }

  [...cars].sort((a,b)=>b.raceDist-a.raceDist).forEach((c,i)=>c.place=i+1);
  camX+=(player.x-camX)*.14;
  camY+=(player.y-camY)*.14;
  camAngle+=wrapPi(player.angle-camAngle)*.12;
}

// ══════════════════════════════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════════════════════════════
function drawCar(c){
  // player's car renders its chosen SKIN livery instead of the team colours
  // whenever a non-default skin is picked; AI always races in team colours.
  const skin = c.isPlayer ? SKINS[skinSel] : null;
  const col = (skin && skin.color) || c.team.color;
  const dark = (skin && skin.dark) || c.team.dark;
  c.trail.forEach(t=>{ ctx.globalAlpha=t.life*.22; ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.arc(t.x,t.y,2.6,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-12,5,24,6); // shadow
  // rear wing
  ctx.fillStyle=dark; ctx.fillRect(-13,-8,3,16);
  // rear tires
  ctx.fillStyle='#111'; ctx.fillRect(-9,-8,5,5); ctx.fillRect(-9,3,5,5);
  // body
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(13,0); ctx.lineTo(7,-3.2); ctx.lineTo(-10,-4.2); ctx.lineTo(-11,4.2); ctx.lineTo(7,3.2);
  ctx.closePath(); ctx.fill();
  // sidepods
  ctx.fillStyle=dark; ctx.fillRect(-6,-4.6,6,2); ctx.fillRect(-6,2.6,6,2);
  // halo/cockpit
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(1,0,3.2,2.1,0,0,Math.PI*2); ctx.fill();
  // front wing
  ctx.fillStyle=dark; ctx.fillRect(11,-6,2.4,12);
  // front tires
  ctx.fillStyle='#111'; ctx.fillRect(5,-7,4,4); ctx.fillRect(5,3,4,4);
  if(c.drsActive){ ctx.fillStyle='rgba(192,132,252,.9)'; ctx.fillRect(-13,-7,3,14); }
  if(c.ersActive){ ctx.fillStyle='rgba(56,189,248,.85)'; ctx.fillRect(-6,-5.2,6,2.4); ctx.fillRect(-6,2.8,6,2.4); }
  if(!c.isPlayer){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(-3,-3,7,6);
    ctx.fillStyle='#fff'; ctx.font='bold 5px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.place,0.5,0);
  }
  ctx.restore();
}

// Chase-cam: world is rotated so the player's heading always points "up"
// on screen, with the camera anchored behind/below the car (CHASE_Y).
function worldToScreen(wx,wy){
  const dx=wx-camX, dy=wy-camY;
  const rot=-(camAngle+Math.PI/2);
  const cs=Math.cos(rot), sn=Math.sin(rot);
  return [dx*cs-dy*sn+W/2, dx*sn+dy*cs+CHASE_Y];
}

function drawTrackScene(){
  ctx.save();
  ctx.translate(W/2,CHASE_Y);
  ctx.rotate(-(camAngle+Math.PI/2));
  ctx.translate(-camX,-camY);

  ctx.drawImage(TR.bg, TR.bgMinX, TR.bgMinY);

  // animated racing line overlay
  ctx.save();
  ctx.strokeStyle='rgba(56,189,248,.8)'; ctx.lineWidth=2.2;
  ctx.setLineDash([8,10]); ctx.lineDashOffset=-raceTime*.6;
  ctx.beginPath();
  const rl=TR.raceLine;
  ctx.moveTo(rl[0][0],rl[0][1]);
  for(let i=1;i<rl.length;i++) ctx.lineTo(rl[i][0],rl[i][1]);
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.clr;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // cars — already inside the camera transform, draw directly in world space
  [...cars].sort((a,b)=>a.place-b.place).reverse().forEach(drawCar);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const shx=shake?(Math.random()-.5)*shake:0, shy=shake?(Math.random()-.5)*shake:0;
  ctx.save(); ctx.translate(shx,shy);

  ctx.fillStyle='#05070a'; ctx.fillRect(0,0,W,H);

  if(state==='menu'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#e10600'; ctx.font='bold 42px Courier New'; ctx.fillText('GRAND PRIX',W/2,H/2-150);
    ctx.fillStyle='#64748b'; ctx.font='10px Courier New'; ctx.fillText('ekte F1-stil · 6 baner · 20 sjåfører · øvingsmodus · 4 AI-nivåer',W/2,H/2-122);
    ctx.fillStyle='#334155'; ctx.font='10px Courier New';
    [['↑ / W','Gass'],['↓ / S','Brems'],['← → / A D','Styr'],['SPACE','DRS i lilla sone'],['SHIFT','ERS-boost (batteri)']].forEach(([k,v],i)=>{
      ctx.fillStyle='#e10600'; ctx.textAlign='right'; ctx.fillText(k,W/2-6,H/2-70+i*20);
      ctx.fillStyle='#64748b'; ctx.textAlign='left'; ctx.fillText(v,W/2+6,H/2-70+i*20);
    });
    ctx.fillStyle='#94a3b8'; ctx.font='11px Courier New'; ctx.textAlign='center';
    ctx.fillText('Utenfor banen = du mister fart og tid.',W/2,H/2+30);
    ctx.fillStyle='#e10600'; ctx.font='bold 14px Courier New';
    ctx.fillText('ENTER — velg bane',W/2,H/2+70);
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H-20);
    ctx.restore(); return;
  }

  if(state==='trackselect'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 20px Courier New'; ctx.fillText('VELG BANE',W/2,70);
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('← → bytt   ENTER kjør løp',W/2,94);
    ctx.fillStyle='#38bdf8'; ctx.fillText('P — øvingskjøring (ingen motstandere)',W/2,110);
    {
      const D=DIFFICULTIES[difficulty];
      ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('↑ ↓ bytt vanskelighetsgrad',W/2,124);
      ctx.fillStyle=D.clr; ctx.font='bold 12px Courier New'; ctx.fillText(`AI: ${D.name}`,W/2,140);
      ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText(`BANE ${trackSel+1} / ${TRACKS.length}  ·  20 sjåfører på startgrid`,W/2,152);
    }
    // carousel: only render prev/current/next out of all TRACKS, so the
    // 6-track (and growing) roster still fits the 520px-wide canvas.
    const N=TRACKS.length;
    [-1,0,1].forEach(d=>{
      const ti=((trackSel+d)%N+N)%N;
      const t=TRACKS[ti];
      const sel=d===0;
      const bx0=60+(d+1)*150, by0=158, bw0=130, bh0=420;
      ctx.fillStyle=sel?'rgba(225,6,0,.12)':'rgba(255,255,255,.03)';
      ctx.fillRect(bx0,by0,bw0,bh0);
      ctx.strokeStyle=sel?'#e10600':'#1e293b'; ctx.lineWidth=sel?2.5:1;
      ctx.strokeRect(bx0,by0,bw0,bh0);
      // mini track preview
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
      t.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
      const pw=bw0-20, ph=180;
      const sc=Math.min(pw/(maxX-minX),ph/(maxY-minY))*.92;
      const ccx=bx0+bw0/2, ccy=by0+30+ph/2;
      ctx.save();
      ctx.strokeStyle='#475569'; ctx.lineWidth=6; ctx.beginPath();
      t.PATH.forEach(([x,y],j)=>{
        const px=ccx+(x-(minX+maxX)/2)*sc, py=ccy+(y-(minY+maxY)/2)*sc;
        j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      });
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle=sel?'#38bdf8':'#334155'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
      ctx.fillStyle=sel?'#f1f5f9':'#64748b'; ctx.font='bold 13px Courier New';
      ctx.fillText(t.name,ccx,by0+ph+40);
      ctx.fillStyle='#475569'; ctx.font='8px Courier New';
      ctx.fillText(t.info,ccx,by0+ph+58);
      ctx.fillText(`Bredde ${t.TW*2}  ·  DRS-zoner ${t.drsZones.length}`,ccx,by0+ph+74);
    });
    // ── distance (laps) selector ──
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('Q E bytt rundelengde',W/2,598);
    ctx.fillStyle='#facc15'; ctx.font='bold 12px Courier New'; ctx.fillText(`DISTANSE: ${LAPS} RUNDER`,W/2,614);
    // ── skin selector ──
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('Z X bytt bil-skin',W/2,632);
    {
      const sk=SKINS[skinSel], swCol=sk.color||TEAMS[0].color;
      ctx.fillStyle='#f1f5f9'; ctx.font='bold 12px Courier New'; ctx.textAlign='right';
      ctx.fillText(`SKIN: ${sk.name}`,W/2+34,648);
      ctx.fillStyle=swCol; ctx.fillRect(W/2+44,641,16,10);
      ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(W/2+44,641,16,10);
      ctx.textAlign='center';
    }
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H-16);
    ctx.restore(); return;
  }

  // ── racing scene ──
  drawTrackScene();

  // speed-lines vignette
  if(state==='playing'||state==='practice'){
    const pspd=Math.hypot(player.vx,player.vy);
    if(pspd>4.4){
      const amt=Math.min(1,(pspd-4.4)/2.4);
      ctx.save(); ctx.globalAlpha=amt*.45; ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1.2;
      const ccx=W/2, ccy=HY+(H-HY)/2;
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2+raceTime*.01;
        const r1=Math.max(W,H)*.46, r2=r1+14+amt*20;
        ctx.beginPath(); ctx.moveTo(ccx+Math.cos(a)*r1,ccy+Math.sin(a)*r1); ctx.lineTo(ccx+Math.cos(a)*r2,ccy+Math.sin(a)*r2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── top HUD bar ──
  ctx.fillStyle='rgba(5,7,10,.92)'; ctx.fillRect(0,0,W,HY);
  ctx.fillStyle=TEAMS[0].color; ctx.fillRect(0,HY-3,W,3);
  ctx.textBaseline='middle';
  if(state==='practice'){
    ctx.fillStyle='#38bdf8'; ctx.font='bold 14px Courier New'; ctx.textAlign='left'; ctx.fillText('ØVING',8,HY/2);
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${player.lap+1}  ·  ${TR.name}`,W/2,HY/2-9);
  } else {
    const posLbl=`P${player.place}`;
    const posClr=player.place===1?'#4ade80':player.place===2?'#38bdf8':player.place===3?'#f97316':player.place<=10?'#f1f5f9':'#64748b';
    ctx.fillStyle=posClr; ctx.font='bold '+(player.place>=10?18:22)+'px Courier New'; ctx.textAlign='left'; ctx.fillText(posLbl,8,HY/2);
    const displayLap=Math.min(player.lap+1,LAPS);
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${displayLap}/${LAPS}  ·  ${TR.name}  ·  ${DIFFICULTIES[difficulty].name}`,W/2,HY/2-9);
  }
  const ts=raceTime/60;
  ctx.fillStyle='#64748b'; ctx.font='9px Courier New';
  ctx.fillText(`${Math.floor(ts/60).toString().padStart(2,'0')}:${(ts%60).toFixed(2).padStart(5,'0')}`,W/2,HY/2+9);
  const spd=Math.round(Math.hypot(player.vx,player.vy)*56);
  const gear=Math.min(8,1+Math.floor(spd/48));
  ctx.fillStyle='#94a3b8'; ctx.font='bold 13px Courier New'; ctx.textAlign='right';
  ctx.fillText(`${spd} km/t  G${gear}`,W-8,HY/2-8);
  // DRS indicator
  const drsReady=inDRSZone(player.curProg);
  ctx.font='bold 10px Courier New'; ctx.textAlign='right';
  ctx.fillStyle = player.drsActive?'#c084fc' : drsReady?'rgba(168,85,247,.5)':'#334155';
  ctx.fillText('DRS',W-8,HY/2+9);
  // ERS/battery indicator
  const ersPct=Math.round(player.battery);
  ctx.fillStyle = player.ersActive?'#38bdf8' : ersPct>50?'#4ade80' : ersPct>20?'#f97316':'#ef4444';
  ctx.fillText(`ERS ${ersPct}%`,W-46,HY/2+9);

  // off-track indicator
  if((state==='playing'||state==='practice') && player.offtrack){
    ctx.fillStyle='rgba(239,68,68,.9)'; ctx.font='bold 10px Courier New'; ctx.textAlign='center';
    ctx.fillText('UTENFOR BANEN',W/2,HY+16);
  }

  // toasts
  toasts.forEach((t,i)=>{
    ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.fillStyle=t.clr; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(t.t,W/2,HY+34+i*16);
  });
  ctx.globalAlpha=1;

  // countdown overlay
  if(state==='countdown'){
    const sec=Math.ceil(cntTimer/60);
    const a=((cntTimer%60)/60);
    ctx.fillStyle=`rgba(5,7,10,${a*.5})`; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(sec>0){ ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.font=`bold ${80+a*20}px Courier New`; ctx.fillText(sec,W/2,H/2); }
    else { ctx.fillStyle='#4ade80'; ctx.font='bold 56px Courier New'; ctx.fillText('LIGHTS OUT!',W/2,H/2); }
  }

  // ── leaderboard panel (top-right) ── with 20 cars on track, show only the
  // top 5 plus the player's own row (with a "···" gap) instead of all 20.
  if(state!=='practice'){
    const ordered=[...cars].sort((a,b)=>a.place-b.place);
    const top=ordered.slice(0,5);
    const rows = player.place<=5 ? top.map((c,i)=>({c,rank:i+1})) :
      [...top.map((c,i)=>({c,rank:i+1})), {gap:true}, {c:player,rank:player.place}];
    const lbX=W-116, lbY=HY+8, lbW=108;
    ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(lbX,lbY,lbW,18+rows.length*16);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(lbX,lbY,lbW,18+rows.length*16);
    ctx.fillStyle='#475569'; ctx.font='bold 8px Courier New'; ctx.textAlign='left'; ctx.fillText('LEDERTAVLE',lbX+6,lbY+11);
    rows.forEach((row,i)=>{
      const ry=lbY+24+i*16;
      if(row.gap){
        ctx.fillStyle='#334155'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
        ctx.fillText('···',lbX+lbW/2,ry); ctx.textAlign='left';
        return;
      }
      const c=row.c;
      ctx.fillStyle=c.team.color; ctx.fillRect(lbX+6,ry-5,8,8);
      ctx.fillStyle=c.isPlayer?'#f1f5f9':'#94a3b8'; ctx.font='bold 9px Courier New';
      ctx.fillText(`${row.rank}. ${c.isPlayer?'DU':c.team.name+' '+c.num}`,lbX+18,ry);
    });
  } else {
    ctx.fillStyle='rgba(5,7,10,.7)'; ctx.font='bold 8px Courier New'; ctx.textAlign='right';
    ctx.fillText('T bane-valg · R restart',W-8,HY+16);
  }

  // ── minimap (bottom-left) ──
  const mmX=10,mmY=H-92,mmS=82;
  ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(mmX-2,mmY-2,mmS+4,mmS+4);
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(mmX-2,mmY-2,mmS+4,mmS+4);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  TR.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const msc=mmS/Math.max(maxX-minX,maxY-minY)*.9;
  const mox=mmX+(mmS-(maxX-minX)*msc)/2-minX*msc;
  const moy=mmY+(mmS-(maxY-minY)*msc)/2-minY*msc;
  function mmPt(gx,gy){return[mox+gx*msc,moy+gy*msc];}
  ctx.strokeStyle='#334155'; ctx.lineWidth=5; ctx.beginPath();
  const [mp0x,mp0y]=mmPt(TR.PATH[0][0],TR.PATH[0][1]); ctx.moveTo(mp0x,mp0y);
  for(let i=1;i<TR.PN;i++){ const [mpx,mpy]=mmPt(TR.PATH[i][0],TR.PATH[i][1]); ctx.lineTo(mpx,mpy); }
  ctx.closePath(); ctx.stroke();
  cars.forEach(c=>{
    const [mcx,mcy]=mmPt(c.x,c.y);
    ctx.fillStyle=c.isPlayer?(SKINS[skinSel].color||c.team.color):c.team.color; ctx.globalAlpha=c.isPlayer?1:.8;
    ctx.beginPath(); ctx.arc(mcx,mcy,c.isPlayer?3.2:2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── win screen ──
  if(state==='win'){
    ctx.fillStyle='rgba(5,7,10,.84)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const won=player.place===1;
    if(won){
      const pulse=.75+.25*Math.sin(winTimer*.08);
      ctx.save(); ctx.shadowColor='#4ade80'; ctx.shadowBlur=18*pulse; ctx.fillStyle='#4ade80';
      ctx.font='bold 34px Courier New'; ctx.fillText('SEIER!',W/2,H/2-150);
      ctx.restore();
    } else {
      ctx.fillStyle='#94a3b8'; ctx.font='bold 34px Courier New'; ctx.fillText('FERDIG!',W/2,H/2-150);
    }
    ctx.fillStyle='#64748b'; ctx.font='12px Courier New';
    ctx.fillText(`${player.place}. plass · Totaltid: ${(raceTime/60).toFixed(1)}s`,W/2,H/2-116);
    player.lapTimes.forEach((lt,i)=>{
      ctx.fillStyle='#334155'; ctx.font='10px Courier New';
      ctx.fillText(`Runde ${i+1}: ${lt}s`,W/2,H/2-88+i*18);
    });
    // compact final standings: top 5 + the player's own row (20-car field
    // is too long to list in full on a 680px-tall canvas).
    ctx.font='9px Courier New';
    {
      const ordered=[...cars].sort((a,b)=>a.place-b.place);
      const top=ordered.slice(0,5);
      const rows = player.place<=5 ? top.map((c,i)=>({c,rank:i+1})) :
        [...top.map((c,i)=>({c,rank:i+1})), {gap:true}, {c:player,rank:player.place}];
      rows.forEach((row,i)=>{
        const ry=H/2-10+i*16;
        if(row.gap){ ctx.fillStyle='#334155'; ctx.fillText('···',W/2,ry); return; }
        const c=row.c;
        ctx.fillStyle=c.team.color;
        ctx.fillText(`${row.rank}. ${c.isPlayer?'DU':c.team.name+' '+c.num}`,W/2,ry);
      });
      const listRows=rows.length;
      const promptY=H/2-10+listRows*16+22;
      ctx.fillStyle='#e10600'; ctx.font='bold 12px Courier New';
      ctx.fillText('ENTER — kjør igjen',W/2,promptY);
      ctx.fillStyle='#38bdf8'; ctx.font='bold 11px Courier New';
      ctx.fillText('T — velg bane',W/2,promptY+22);
      ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,promptY+44);
    }

    confetti.forEach(f=>{
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.globalAlpha=Math.min(1,f.life);
      ctx.fillStyle=f.clr; ctx.fillRect(-f.w/2,-f.w*.6,f.w,f.w*1.2);
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }

  ctx.textBaseline='alphabetic';
  ctx.restore();
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(e.key==='Enter'){
    if(state==='menu') state='trackselect';
    else if(state==='trackselect') startRace();
    else if(state==='win') startRace();
  }
  if(state==='trackselect'){
    if(e.key==='ArrowLeft') trackSel=(trackSel+TRACKS.length-1)%TRACKS.length;
    if(e.key==='ArrowRight') trackSel=(trackSel+1)%TRACKS.length;
    if(e.key==='ArrowUp') difficulty=(difficulty+DIFFICULTIES.length-1)%DIFFICULTIES.length;
    if(e.key==='ArrowDown') difficulty=(difficulty+1)%DIFFICULTIES.length;
    if(e.key==='p'||e.key==='P') startPractice();
    if(e.key==='q'||e.key==='Q'){ lapsIdx=(lapsIdx+LAP_OPTIONS.length-1)%LAP_OPTIONS.length; LAPS=LAP_OPTIONS[lapsIdx]; }
    if(e.key==='e'||e.key==='E'){ lapsIdx=(lapsIdx+1)%LAP_OPTIONS.length; LAPS=LAP_OPTIONS[lapsIdx]; }
    if(e.key==='z'||e.key==='Z') skinSel=(skinSel+SKINS.length-1)%SKINS.length;
    if(e.key==='x'||e.key==='X') skinSel=(skinSel+1)%SKINS.length;
  }
  if(state==='win' && (e.key==='t'||e.key==='T')) state='trackselect';
  if(state==='practice'){
    if(e.key==='t'||e.key==='T') state='trackselect';
    if(e.key==='r'||e.key==='R') startPractice();
  }
  if(e.key===' ')e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>

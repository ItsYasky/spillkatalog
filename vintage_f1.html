  const msc=mmS/Math.max(maxX-minX,maxY-minY)*.9;
  const mox=mmX+(mmS-(maxX-minX)*msc)/2-minX*msc;
  const moy=mmY+(mmS-(maxY-minY)*msc)/2-minY*msc;
  function mmPt(gx,gy){return[mox+gx*msc,moy+gy*msc];}
  ctx.strokeStyle='#334155'; ctx.lineWidth=5; ctx.beginPath();
  const [mp0x,mp0y]=mmPt(TR.PATH[0][0],TR.PATH[0][1]); ctx.moveTo(mp0x,mp0y);
  for(let i=1;i<TR.PN;i++){ const [mpx,mpy]=mmPt(TR.PATH[i][0],TR.PATH[i][1]); ctx.lineTo(mpx,mpy); }
  ctx.closePath(); ctx.stroke();
  cars.forEach(c=>{
    const [mcx,mcy]=mmPt(c.x,c.y);
    ctx.fillStyle=teamInk(c.isPlayer?(skinAt(skinSel).base||c.team.color):c.team.color); ctx.globalAlpha=c.isPlayer?1:.8;
    ctx.beginPath(); ctx.arc(mcx,mcy,c.isPlayer?3.2:2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  } // state!=='win'

  // ── win screen: full podium ceremony ──
  // Always shows the actual top-3 finishers (by current race place), not
  // just the player — a real race has a podium ceremony whether or not you
  // were on it. Grandstand crowd backdrop + three height-coded blocks (2nd
  // left, 1st centre/tallest, 3rd right) each carrying a team-colour car
  // blob and flag, with a gold trophy pulsing over P1, confetti layered on
  // top for the win case.
  if(state==='win'){
    ctx.fillStyle='rgba(5,7,10,.88)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // Rekkefølgen kommer fra finalizeResults(), ikke fra c.place: c.place
    // kjenner ikke straffetid, og en spiller med +10 s skal falle bakover her
    // selv om bilen fysisk krysset streken først.
    if(!finalResults) finalizeResults();
    const ordered=finalResults.map(r=>r.car);
    const won=player.finalPlace===1;
    const podium=ordered.slice(0,3);

    if(won){
      const tpulse=.75+.25*Math.sin(winTimer*.08);
      ctx.save(); ctx.shadowColor='#4ade80'; ctx.shadowBlur=18*tpulse; ctx.fillStyle='#4ade80';
      ctx.font='bold 28px Courier New'; ctx.fillText('SEIER!',W/2,62);
      ctx.restore();
    } else {
      ctx.fillStyle='#94a3b8'; ctx.font='bold 28px Courier New'; ctx.fillText('FERDIG!',W/2,62);
    }

    // grandstand crowd backdrop
    const standX0=W/2-150, standY=94, standW=300, standH=40;
    ctx.fillStyle='#15151c'; ctx.fillRect(standX0-6,standY-8,standW+12,standH+10);
    ctx.fillStyle='#22222c'; ctx.fillRect(standX0-6,standY-8,standW+12,9);
    podiumCrowd.forEach(d=>{
      ctx.fillStyle=d.clr;
      ctx.beginPath(); ctx.arc(standX0+8+d.x*7.2, standY+6+d.y*8,1.6,0,Math.PI*2); ctx.fill();
    });

    // three podium blocks: left=2nd, centre=1st (tallest), right=3rd
    const blockW=64, gap=10, BASE=272;
    const totalW=blockW*3+gap*2, startX=W/2-totalW/2;
    const slots=[
      {rank:2, cx:startX+blockW/2,                 h:70},
      {rank:1, cx:startX+blockW+gap+blockW/2,       h:100},
      {rank:3, cx:startX+(blockW+gap)*2+blockW/2,   h:50}
    ];
    slots.forEach(slot=>{
      const car=podium[slot.rank-1];
      const top=BASE-slot.h;
      ctx.fillStyle='#2b2b33'; ctx.fillRect(slot.cx-blockW/2,top,blockW,slot.h);
      ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fillRect(slot.cx-blockW/2,top,blockW,7);
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(slot.cx-blockW/2,top,9,slot.h);
      ctx.fillStyle='rgba(255,255,255,.18)'; ctx.font='bold 34px Courier New';
      ctx.fillText(String(slot.rank),slot.cx,top+slot.h/2+12);
      if(!car) return;
      // Bilen på pallen er nå den EKTE bilen, tegnet med samme funksjon som på
      // banen. Før var den en egen liten klump av avrundede rektangler med en
      // aksentstripe og en halo-ring — en forenkling som ikke lignet på noe av
      // det du nettopp kjørte, og som verken viste mønsteret eller vingene.
      // Den peker oppover (−90°) så den står «mot kamera» på podiet, og den er
      // stor nok (3,4×) til at mønsteret faktisk leses.
      ctx.save(); ctx.translate(slot.cx,top-26);
      drawCarShape(ctx,liveryOf(car),{x:0,y:0,angle:-Math.PI/2,scale:3.4,shadow:false});
      ctx.restore();
      // team flag on the block's outer edge
      const outer=slot.cx<=W/2?-1:1;
      const flagX=slot.cx+outer*(blockW/2+4);
      ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(flagX,top-2); ctx.lineTo(flagX,top-30); ctx.stroke();
      ctx.fillStyle=teamInk(car.team.color);
      ctx.beginPath();
      if(outer>0){ ctx.moveTo(flagX,top-30); ctx.lineTo(flagX+14,top-25); ctx.lineTo(flagX,top-20); }
      else { ctx.moveTo(flagX,top-30); ctx.lineTo(flagX-14,top-25); ctx.lineTo(flagX,top-20); }
      ctx.closePath(); ctx.fill();
      // gold trophy pulsing over P1
      if(slot.rank===1){
        const tpulse=.8+.2*Math.sin(winTimer*.1);
        ctx.save(); ctx.translate(slot.cx,top-32);
        ctx.shadowColor='#facc15'; ctx.shadowBlur=10*tpulse; ctx.fillStyle='#facc15';
        ctx.beginPath(); ctx.moveTo(-7,-14); ctx.quadraticCurveTo(-9,-2,0,0); ctx.quadraticCurveTo(9,-2,7,-14); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#facc15'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(-10,-10,3.5,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(10,-10,3.5,0,Math.PI*2); ctx.stroke();
        ctx.fillRect(-1.5,0,3,5); ctx.fillRect(-6,5,12,3);
        ctx.restore();
      }
      // driver name under the block
      // Under selve blokka står bare lagnavn + bilnummer. Podieblokkene står
      // 74 px fra senter til senter, og det FULLE navnet får ikke plass der:
      // «Fjellbor Industri» alene er 92 px på 9 px Courier, så to naboer ville
      // lagt seg oppå hverandre. Mindre skrift er ikke et alternativ (9 px er
      // gulvet). Det fulle navnet vises i stedet på egen linje under podiet,
      // der det er 520 px å ta av.
      ctx.fillStyle=teamInk(car.team.color); ctx.font='bold 9px Courier New';
      ctx.fillText((car.isPlayer?'DU':car.team.name+' '+car.num)+penaltyLabel(car),slot.cx,BASE+15);
    });

    // Vinnerens fulle navn — tittelsponsor + lag — på egen linje over hele
    // bredden, siden det ikke fikk plass under blokka.
    if(podium[0]){
      const w0=podium[0];
      ctx.font='bold 11px Courier New'; ctx.fillStyle=teamInk(w0.team.color);
      ctx.fillText(`${teamFullName(w0.team)} ${w0.num}`,W/2,BASE+38);
    }
    ctx.fillStyle='#64748b'; ctx.font='12px Courier New';
    // Totaltiden er løpstid PLUSS straffetid, altså det samme tallet lista
    // rangeres på. Hadde den stått uten straffen, ville spilleren sett en
    // plassering som ikke stemte med tiden rett ved siden av.
    ctx.fillText(`${player.finalPlace}. plass · Totaltid: ${finalTimeSec(player).toFixed(1)}s`,W/2,BASE+58);
    if(player.penaltySec>0){
      ctx.fillStyle='#ef4444'; ctx.font='10px Courier New';
      ctx.fillText(`Inkludert +${player.penaltySec}s straff · ${player.limitViolations} banegrensebrudd`,W/2,BASE+74);
    }
    if(player.lapTimes.length){
      const best=Math.min(...player.lapTimes.map(Number)).toFixed(2);
      ctx.fillStyle='#334155'; ctx.font='10px Courier New';
      ctx.fillText(`Beste runde: ${best}s`,W/2,BASE+(player.penaltySec>0?90:76));
    }

    // compact final standings: top 5 + the player's own row (20-car field
    // is too long to list in full on a 680px-tall canvas).
    ctx.font='9px Courier New';
    {
      const top=ordered.slice(0,5);
      const rows = player.finalPlace<=5 ? top.map((c,i)=>({c,rank:i+1})) :
        [...top.map((c,i)=>({c,rank:i+1})), {gap:true}, {c:player,rank:player.finalPlace}];
      const listY0=BASE+100;
      rows.forEach((row,i)=>{
        const ry=listY0+i*15;
        if(row.gap){ ctx.fillStyle='#334155'; ctx.fillText('···',W/2,ry); return; }
        const c=row.c;
        ctx.fillStyle=teamInk(c.team.color);
        // Fullt navn her — lista er sentrert over hele bredden, så det er god
        // plass til «Fjellbor Industri GRANITT 2» (162 px på 9 px Courier).
        ctx.fillText(`${row.rank}. ${c.isPlayer?'DU':teamFullName(c.team)+' '+c.num}${penaltyLabel(c)}`,W/2,ry);
      });
      const listRows=rows.length;
      const promptY=listY0+listRows*15+20;
      ctx.fillStyle='#e10600'; ctx.font='bold 12px Courier New';
      ctx.fillText('ENTER — kjør igjen',W/2,promptY);
      ctx.fillStyle='#38bdf8'; ctx.font='bold 11px Courier New';
      ctx.fillText('T — velg bane',W/2,promptY+20);
      ctx.fillStyle='#1e293b'; ctx.font='9px Courier New'; ctx.fillText('ESC Katalog',W/2,promptY+40);
    }

    confetti.forEach(f=>{
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.globalAlpha=Math.min(1,f.life);
      ctx.fillStyle=f.clr; ctx.fillRect(-f.w/2,-f.w*.6,f.w,f.w*1.2);
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }

  ctx.textBaseline='alphabetic';
  ctx.restore();
}

// store letter/digit keys case-normalized (modifier-independent) so that
// holding Shift (boost) doesn't cause a "stuck key": without this, releasing
// e.g. W while Shift is still held fires keyup with e.key==='W' (uppercase),
// which would never clear the keys['w'] set by the original lowercase
// keydown — leaving gas/steer/brake permanently stuck on. Arrow keys, Space,
// Shift, Escape, Enter etc. are untouched (their e.key isn't case-shifted).
function normKey(k){ return k.length===1 ? k.toLowerCase() : k; }
document.addEventListener('keydown',e=>{
  keys[normKey(e.key)]=true;
  // Lagoversikten er et lag OVER baneutvalget, ikke en egen del av spillet, så
  // ESC skal lukke den og gå tilbake dit — ikke helt ut til katalogen. Denne
  // sjekken må derfor stå før den globale ESC-håndteringen under.
  if(state==='teams'){
    if(e.key==='Escape'||e.key==='l'||e.key==='L'){ state='trackselect'; return; }
    return; // ingen andre taster gjør noe mens oversikten er oppe
  }
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(e.key==='Enter'){
    // Nytt lag trekkes når du går inn i baneutvalget, ikke når løpet starter,
    // slik at bil-forhåndsvisningen viser det laget du faktisk skal kjøre for.
    if(state==='menu'){ rollPlayerIdent(); state='trackselect'; }
    else if(state==='trackselect') startRace();
    else if(state==='win') startRace();
  }
  if(state==='menu' && e.key==='Tab'){
    e.preventDefault(); // Tab normally shifts page focus — this is a game control
    REALISTIC=!REALISTIC;
    DIFFICULTIES=REALISTIC?DIFFICULTIES_REALISTIC:DIFFICULTIES_CASUAL;
  }
  if(state==='trackselect'){
    if(e.key==='ArrowLeft') trackSel=(trackSel+TRACKS.length-1)%TRACKS.length;
    if(e.key==='ArrowRight') trackSel=(trackSel+1)%TRACKS.length;
    if(e.key==='ArrowUp') difficulty=(difficulty+DIFFICULTIES.length-1)%DIFFICULTIES.length;
    if(e.key==='ArrowDown') difficulty=(difficulty+1)%DIFFICULTIES.length;
    if(e.key==='p'||e.key==='P') startPractice();
    if(e.key==='q'||e.key==='Q'){ lapsIdx=(lapsIdx+LAP_OPTIONS.length-1)%LAP_OPTIONS.length; LAPS=LAP_OPTIONS[lapsIdx]; }
    if(e.key==='e'||e.key==='E'){ lapsIdx=(lapsIdx+1)%LAP_OPTIONS.length; LAPS=LAP_OPTIONS[lapsIdx]; }
    if(e.key==='z'||e.key==='Z') skinSel=(skinSel+SKINS.length-1)%SKINS.length;
    if(e.key==='x'||e.key==='X') skinSel=(skinSel+1)%SKINS.length;
    if(e.key==='l'||e.key==='L') state='teams';
    if(e.key==='c'||e.key==='C') todIdx=(todIdx+TOD.length-1)%TOD.length;
    if(e.key==='v'||e.key==='V') todIdx=(todIdx+1)%TOD.length;
  }
  if(state==='win' && (e.key==='t'||e.key==='T')) state='trackselect';
  if(state==='practice'){
    if(e.key==='t'||e.key==='T') state='trackselect';
    if(e.key==='r'||e.key==='R') startPractice();
    // ghostOn nullstilles IKKE av startPractice: har du slått spøkelset av,
    // skal det bli liggende av når du starter økta på nytt med R.
    if(e.key==='g'||e.key==='G'){
      ghostOn=!ghostOn;
      toast(ghostOn?'SPØKELSE PÅ':'SPØKELSE AV',GHOST_COL);
    }
  }
  if(e.key===' ')e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[normKey(e.key)]=false;});

// ══════════════════════════════════════════════════════════════════
// FAST TIDSSTEG (Glenn Fiedler «Fix Your Timestep», akkumulator-metoden)
// ══════════════════════════════════════════════════════════════════
// update() over kaller raceTime++ én gang per kall og alle fysikk-/AI-/
// tidtakingskonstanter (speed, GRIP, D.baseMax, osv.) er tunet med den
// forutsetningen at update() kjøres nøyaktig 60 ganger i sekundet. Før
// denne fiksen ble update() kalt én gang per requestAnimationFrame — på
// en 120 Hz- eller 144 Hz-skjerm kjører rAF 2–2,4x oftere enn 60/s, så
// hele spillet (fart, styring, AI, rundetider) gikk like mye for fort og
// raceTime/60 ga feil sekundtall. Løsningen: mål ekte forløpt tid mellom
// frames med performance.now() (tidsstempelet rAF selv gir callbacken),
// legg den i en akkumulator, og kjør update() i faste 1000/60 ms-biter
// så lenge akkumulatoren har nok tid liggende — resten tas med videre
// til neste frame. draw() tegnes fortsatt nøyaktig én gang per frame,
// uavhengig av hvor mange update()-steg som kjørte.
const STEP_MS = 1000/60;
const MAX_STEPS_PER_FRAME = 5; // tak per frame, så en hengende maskin ikke går i en "spiral of death" av flere og flere steg
let lastFrameT = null, accumulator = 0;

function loop(t){
  if(lastFrameT===null) lastFrameT=t; // første frame: ingen delta å spille inn ennå
  let frameDt = t - lastFrameT;
  lastFrameT = t;
  // etter en ekte lang pause (fanen har vært skjult, maskinen hang i over
  // 250ms, e.l.) skal vi IKKE spille inn den tapte tiden — det ville gitt
  // et skippete byks av mange update()-steg i ett jafs når man kommer
  // tilbake. Nullstill i stedet og fortsett i realtid fra akkurat nå.
  if(frameDt>250 || frameDt<0) frameDt=0;
  accumulator += frameDt;
  let steps=0;
  while(accumulator>=STEP_MS && steps<MAX_STEPS_PER_FRAME){
    update();
    accumulator -= STEP_MS;
    steps++;
  }
  // maskinen hang så mye at vi traff taket over — kast resten av den
  // oppsamlede tiden i stedet for å la den henge igjen og kreve enda
  // flere steg neste frame også (det er selve "spiral of death"-faren).
  if(steps>=MAX_STEPS_PER_FRAME) accumulator=0;
  draw();
  requestAnimationFrame(loop);
}
// samme nullstilling når fanen blir skjult og synlig igjen — uten dette
// ville tiden fanen var borte blitt stående i akkumulatoren og brukt opp
// i et stort byks av update()-kall (begrenset av MAX_STEPS_PER_FRAME,
// men fortsatt synlig som et hopp) i det fanen blir aktiv igjen.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ lastFrameT=null; accumulator=0; }
});
requestAnimationFrame(loop);
</script>

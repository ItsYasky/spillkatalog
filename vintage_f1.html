<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>GRAND PRIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#05070a;display:flex;align-items:center;justify-content:center;height:100vh;}
</style>
</head>
<body>
<canvas id="g" width="520" height="680"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=520,H=680,HY=50;
// the gravel/runoff fringe drawn around every track (see buildTrack) extends
// a flat 23px beyond the tarmac on each side, regardless of that track's TW.
// It used to be treated as fully off-track the instant you touched it; now
// it's a genuinely usable, pace-neutral part of the surface, so cars (player
// and AI alike) can run wide through fast corners without being punished —
// true "off track" now only starts once you're past the gravel, in the grass.
const GRAVEL_SAFE=23;
// how far ahead (px) an AI car looks for a blocker to set up a pass on, and
// how wide a forward cone (as a fraction of distance, ~53° half-angle) counts
// as "ahead" rather than beside/behind — see the overtaking logic in update().
const OVERTAKE_RANGE=70, OVERTAKE_CONE=0.6;
// slipstream/draft: how far behind another car (px) the tow effect reaches,
// and how tight the cone behind them has to be (as fwd/dist — close to 1.0
// means "almost dead straight behind", not just "somewhere ahead-ish" like
// the wider overtake cone above) — see the slipstream block in update().
const SLIP_RANGE=95, SLIP_CONE=0.92;

// ══════════════════════════════════════════════════════════════════
// GAME MODE: CASUAL vs REALISTISK — chosen on the main menu before you ever
// touch the track-select screen. CASUAL is the original, forgiving feel
// (steering alone can carry any corner). REALISTISK is a straight-up higher
// top speed PLUS a genuine, universal grip-loss mechanic (PHYS_K/turnPenalty/
// gripPenalty, wired into update() below) that does not exist in casual —
// carry too much speed into a bend relative to its actual curvature and you
// lose steering authority AND grip, so you run wide/lose the car if you
// don't brake, for player and AI alike. This used to be a separate file
// (f1_realistic.html); it's now just a mode switch on the same game.
// ══════════════════════════════════════════════════════════════════
let REALISTIC=false;
const PLAYER_MAX_CASUAL=4.8,     PLAYER_MAX_REALISTIC=6.8;
const PHYS_K=2.6;       // how hard curvature clamps the realistic safe-speed ceiling
// Hvor mye FART det koster å ligge over physSafe. HVORFOR den måtte inn: før
// gikk overRatio bare til styreutslag (turnPenalty) og grep (gripPenalty),
// aldri til farten — `MAX` ble ikke rørt av den i det hele tatt. Taket fantes
// altså på papiret, men kostet ingenting, og det eneste en sving tok fra deg
// var en bredere linje, som banebredden svelget. Målt med gassen i bånn og
// ALDRI en bremsing kom bilen rundt ARDENNE 3,0 % raskere enn «full toppfart
// hele runden», og med Shift+Space 6,0 % raskere, uten ETT banegrensebrudd.
// Med denne kostnaden ligger samme runde på −0,9 % til +3,0 % av den
// teoretiske tiden, altså omtrent der den bør ligge.
//
// Verdien er ikke en hard vegg, med vilje: dette er negativ tilbakekobling, så
// farten legger seg litt OVER physSafe i likevekt (ved physSafe 5,3 blir det
// ca. 5,6). Man skal fremdeles kunne kjøre bevisst for hardt inn og ta igjen
// på utgangen — det skal bare koste noe.
const PHYS_SCRUB=0.8;
const TURN_BASE=0.046;  // full steering-rack rate available under the safe speed (realistic)

// ══════════════════════════════════════════════════════════════════
// TRACK GENERATION — star-shaped polar curve => guaranteed simple loop
// ══════════════════════════════════════════════════════════════════
function wrapPi(a){ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; }

function genCP(cfg){
  const NCP=cfg.ncp||30, cps=[];
  for(let i=0;i<NCP;i++){
    const theta=i/NCP*Math.PI*2;
    let r=cfg.R0+cfg.wobbleAmp*Math.sin(cfg.wobbleFreq*theta+cfg.wobblePhase);
    cfg.features.forEach(f=>{
      let dt=theta-f.a0;
      dt=((dt+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      r+=f.depth*Math.exp(-(dt*dt)/(2*f.width*f.width));
    });
    cps.push([cfg.cx+Math.cos(theta)*r, cfg.cy+Math.sin(theta)*r]);
  }
  return cps;
}
function catmull(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return[
    .5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
function buildPath(CP,steps){
  const N=CP.length, PATH=[];
  for(let i=0;i<N;i++){
    const p0=CP[(i-1+N)%N],p1=CP[i],p2=CP[(i+1)%N],p3=CP[(i+2)%N];
    for(let s=0;s<steps;s++) PATH.push(catmull(p0,p1,p2,p3,s/steps));
  }
  return PATH;
}
function nearestOnPath(PATH,gx,gy){
  const PN=PATH.length; let best=1e15,bi=0,bt=0;
  for(let i=0;i<PN;i++){
    const a=PATH[i],b=PATH[(i+1)%PN];
    const dx=b[0]-a[0],dy=b[1]-a[1],ll=dx*dx+dy*dy||1;
    const t=Math.max(0,Math.min(1,((gx-a[0])*dx+(gy-a[1])*dy)/ll));
    const px=a[0]+dx*t,py=a[1]+dy*t;
    const d=(gx-px)**2+(gy-py)**2;
    if(d<best){best=d;bi=i;bt=t;}
  }
  return {progress:(bi+bt)/PN, dist:Math.sqrt(best), idx:bi};
}
function computeHeadingCurv(PATH){
  const PN=PATH.length, heading=new Array(PN), rawCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    const a=PATH[i], b=PATH[(i+1)%PN];
    heading[i]=Math.atan2(b[1]-a[1],b[0]-a[0]);
  }
  for(let i=0;i<PN;i++) rawCurv[i]=wrapPi(heading[i]-heading[(i-1+PN)%PN]);
  const WIN=10, smoothCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN;k<=WIN;k++) s+=rawCurv[(i+k+PN)%PN];
    smoothCurv[i]=s/(WIN*2+1);
  }
  // severity: unsigned local turning intensity — a short window SUM of
  // |rawCurv| around each point, instead of a wide SIGNED average like
  // smoothCurv. A tight chicane (sharp left immediately followed by a sharp
  // right) can net out close to zero in smoothCurv's signed average, which
  // is exactly wrong for "how much is actually happening here" — severity
  // doesn't cancel, so it stays high through a whole chicane just like it
  // does through a sustained hairpin. Used for runoff-area sizing on
  // walled tracks (buildTrack) and the AI's hairpin-caution braking (update()).
  const SWIN=6, severity=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-SWIN;k<=SWIN;k++) s+=Math.abs(rawCurv[(i+k+PN)%PN]);
    severity[i]=s/(SWIN*2+1);
  }
  return {heading,smoothCurv,severity};
}
function buildRaceLine(PATH,heading,smoothCurv,TW){
  const PN=PATH.length, GAIN=34, maxOff=TW*0.64;
  const raw=new Array(PN);
  for(let i=0;i<PN;i++) raw[i]=Math.max(-maxOff,Math.min(maxOff,-smoothCurv[i]*GAIN));
  const WIN2=5, off2=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN2;k<=WIN2;k++) s+=raw[(i+k+PN)%PN];
    off2[i]=s/(WIN2*2+1);
  }
  const line=new Array(PN);
  for(let i=0;i<PN;i++){
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    line[i]=[PATH[i][0]+nx*off2[i], PATH[i][1]+ny*off2[i]];
  }
  return line;
}

// Locate genuinely straight sections (low curvature) for rett-modus-soner,
// instead of guessing from feature angles (corner features have wide gaussian tails).
function findStraightZones(smoothCurv, want){
  const PN=smoothCurv.length, thresh=0.014;
  const ext=smoothCurv.concat(smoothCurv);
  const runs=[]; let runStart=-1;
  for(let k=0;k<ext.length;k++){
    const low=Math.abs(ext[k])<thresh;
    if(low){ if(runStart<0) runStart=k; }
    else if(runStart>=0){ runs.push([runStart,k]); runStart=-1; }
  }
  const clean=runs.filter(([s,e])=>s<PN&&(e-s)<PN).sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  const zones=[], usedCenters=[];
  for(const [s,e] of clean){
    if(zones.length>=want) break;
    const len=e-s;
    if(len<PN*0.10) continue;
    const center=(s+e)/2;
    if(usedCenters.some(c=>Math.abs(((c-center+PN*1.5)%PN)-PN*0.5)<PN*0.12)) continue;
    const trim=len*0.20;
    const ts=s+trim, te=e-trim;
    const a=((ts%PN)+PN)%PN/PN, b=((te%PN)+PN)%PN/PN;
    zones.push({a,b});
    usedCenters.push(center);
  }
  return zones;
}

// iOS Safari nekter å allokere et canvas over ca. 16,7 millioner piksler, og
// returnerer da en blank/ubrukelig flate i stedet for å feile tydelig. De
// største banene her (TEMPIO 21,8M, VISTANOTTE 20,5M, DESERTO 19,7M, CAMPAGNA
// 17,8M) ligger over den grensen, så de kunne rett og slett ikke vises på
// iPhone/iPad. Bakgrunner over dette taket tegnes derfor i redusert
// oppløsning og skaleres opp igjen ved tegning (se buildTrackBg og
// drawTrackScene) — samme bilde, færre piksler.
const MAX_BG_PX=16e6;

// ── seedet tilfeldighet for bakgrunnen ─────────────────────────────────────
// HVORFOR denne finnes: etter at bakgrunnsbyggingen ble gjort lat (bygges
// først når banen faktisk startes, se ensureTrackBg) kjøres buildTrackBg på
// nytt hver gang du går inn på en bane. Med Math.random() i tegnekoden betød
// det at trær, steiner, tribunefolk og tagger FLYTTET SEG mellom hvert løp på
// samme bane. En bane du har kjørt tjue runder på skal kjennes igjen, og et
// skogholt du bruker som bremsepunkt kan ikke stå et annet sted neste løp.
//
// Frøet er banenavnet, ikke en teller: da er bildet det samme i dag og om et
// år, uansett hvilken rekkefølge banene ble bygget i, og uansett om spilleren
// har vært inne på tre andre baner først.
//
// MERK at dette med vilje BARE gjelder bakgrunnsbyggingen. AI, fysikk,
// partikler og tribunenes kamerablitz bruker fortsatt Math.random() — de SKAL
// variere mellom løp.
function seedFromName(navn){
  // FNV-1a over navnet. Trenger ikke være kryptografisk, bare spre to navn som
  // ligner («DESERTO»/«DISCESA») til helt ulike frø.
  let h=0x811c9dc5;
  for(let i=0;i<navn.length;i++){ h^=navn.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h>>>0;
}
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    let t=a;
    t=Math.imul(t^(t>>>15),1|t);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

// ── verdistøy ──────────────────────────────────────────────────────────────
// To jobber i runde 4 trenger det SAMME organiske mønsteret: bakketonene (store
// myke flekker i stedet for 1400 jevnt spredte prikker) og hvor vegetasjonen
// får stå (skogholt og lunder i stedet for jevnt strødde trær). Deler de én
// støyfunksjon, havner lundene faktisk der bakken er mørkest og grønnest, og
// terrenget leser som ett landskap i stedet for to lag som ikke vet om hverandre.
//
// Verdistøy på et 64×64-rutenett med smoothstep-interpolasjon og to oktaver.
// Perlin/simplex ville vært finere, men dette er store myke flater i
// bakgrunnen — forskjellen er usynlig, og dette er tjue linjer uten tabeller.
const NOISE_N=64;
function makeNoise(rnd){
  const g=new Float32Array(NOISE_N*NOISE_N);
  for(let i=0;i<g.length;i++) g[i]=rnd();
  function at(ix,iy){ return g[(iy&(NOISE_N-1))*NOISE_N+(ix&(NOISE_N-1))]; }
  function oktav(x,y,f){
    const fx=x*f, fy=y*f;
    const ix=Math.floor(fx), iy=Math.floor(fy);
    let tx=fx-ix, ty=fy-iy;
    tx=tx*tx*(3-2*tx); ty=ty*ty*(3-2*ty);
    const a=at(ix,iy), b=at(ix+1,iy), c=at(ix,iy+1), d=at(ix+1,iy+1);
    return (a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
  }
  // x,y forventes i [0,1) over banens bakgrunn. Returnerer [0,1).
  return function(x,y){ return oktav(x,y,7)*0.65+oktav(x+0.37,y+0.71,19)*0.35; };
}

// Å bygge en bane er delt i to deler, fordi de koster vilt forskjellig:
//
//  1. buildTrack()   — geometrien. Billig, og må finnes for ALLE baner med én
//                      gang: banevalg-skjermen tegner minikart rett fra PATH
//                      og viser antall rett-modus-soner, og wallOffsArr må ligge
//                      klart før første frame siden kollisjonen i update()
//                      leser det.
//  2. buildTrackBg() — det forhåndstegnede bakgrunnscanvaset. Dyrt: flere
//                      tusen piksler i hver retning, og terrengspredningen
//                      måler avstand til banen for hvert eneste objekt.
//
// Før denne delingen gjorde buildTrack() begge deler for alle 13 banene ved
// oppstart: 164M piksler bakgrunn (~650 MB) lå i minnet samtidig før
// spilleren i det hele tatt hadde valgt bane, oppstarten var treg, og de fire
// største banene sprengte iOS-grensen over. Nå bygges bakgrunnen først når
// banen faktisk startes, og bare én av dem holdes i minnet (se ensureTrackBg).
function buildTrack(cfg){
  const CP=genCP(cfg);
  const PATH=buildPath(CP,18);
  const PN=PATH.length;
  const {heading,smoothCurv,severity}=computeHeadingCurv(PATH);
  const raceLine=buildRaceLine(PATH,heading,smoothCurv,cfg.TW);
  const straightZones=findStraightZones(smoothCurv, cfg.straightCount||1);
  const sfAng=heading[0], [sfx,sfy]=PATH[0]; // start/mål ligger alltid på PATH[0]
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const pad=cfg.TW*4+40;
  minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const bw=Math.ceil(maxX-minX), bh=Math.ceil(maxY-minY);
  // Barriere-avstanden på gatebanene (cfg.walls) er IKKE en flat konstant:
  // severity[] (den fortegnsløse svingintensiteten fra computeHeadingCurv)
  // skyver veggen lenger bak kjørelinjen i chicaner og hårnåler, så det
  // faktisk finnes en runoff-buffer der — slik en ekte gatebane gir mer margin
  // i en trang chicane enn langs en strake der veggen trygt kan ligge tett.
  // Dette er geometri, ikke pynt: BÅDE den tegnede barrieren (i buildTrackBg)
  // og kollisjonsgrensen i update() leser fra dette samme per-punkt-arrayet,
  // så det du ser er nøyaktig det du treffer. Derfor beregnes det her, og
  // ligger klart før første frame uansett om bakgrunnen er bygget ennå.
  let wallOffsArr=null;
  if(cfg.walls){
    const RUNOFF_BASE=8, RUNOFF_MAX=46, RUNOFF_LO=0.075, RUNOFF_HI=0.15;
    const rawOffs=new Array(PN);
    for(let i=0;i<PN;i++){
      const t=Math.max(0,Math.min(1,(severity[i]-RUNOFF_LO)/(RUNOFF_HI-RUNOFF_LO)));
      const st=t*t*(3-2*t); // smoothstep — eases the runoff bulge in/out instead of a hard edge
      rawOffs[i]=cfg.TW+GRAVEL_SAFE+RUNOFF_BASE+st*RUNOFF_MAX;
    }
    // one more light smoothing pass so the barrier polygon's offset doesn't
    // jump point-to-point (the geometry amplifies any raw discretization
    // right where curvature is already highest) — purely cosmetic, doesn't
    // change which corners get runoff, just how smoothly it blends in.
    wallOffsArr=new Array(PN); const SW=4;
    for(let i=0;i<PN;i++){
      let s=0; for(let k=-SW;k<=SW;k++) s+=rawOffs[(i+k+PN)%PN];
      wallOffsArr[i]=s/(SW*2+1);
    }
  }
  // bgScale<1 = banen er for stor for ett canvas, bakgrunnen tegnes nedskalert
  return {CP,PATH,PN,heading,smoothCurv,severity,raceLine,TW:cfg.TW,name:cfg.name,info:cfg.info,
    straightZones,sfAng,sfx,sfy,walls:!!cfg.walls,wallOffsArr,terrain:cfg.terrain||'forest',cfg,
    // Temaet hører til geometri-halvdelen selv om det bare styrer pynt:
    // baneutvalget tegner minikart i banens egen bakketone, og det skjer før
    // bakgrunnen noensinne bygges.
    theme:makeTheme(cfg.name),
    bgW:bw,bgH:bh,bgScale:Math.min(1,Math.sqrt(MAX_BG_PX/(bw*bh))),
    bgOx:-minX,bgOy:-minY,bgMinX:minX,bgMinY:minY,
    // Polsteret utenfor banens omriss følger med videre fordi det er den eneste
    // plassen landemerkene har å vokse i — se `plasser`. Det sendes som TALL og
    // regnes ikke ut på nytt i bakgrunnsbyggingen: to kopier av `TW*4+40` er to
    // steder å glemme å endre den.
    bgPad:pad,
    bg:null,standRects:null,flagPoles:null,marshalPosts:null,floodlights:null,nightLights:null,
    groundTile:null,groundPat:null};
}

// Den dyre halvdelen: baker underlag, asfalt, høydeskygge, curbs, barrierer,
// rett-modus-soner, terreng og tribuner inn i ett forhåndstegnet canvas, og plasserer
// samtidig det levende lagets posisjoner (tribuner/flagg/marshaler/flomlys),
// som må finnes før første frame av løpet. Idempotent: er bakgrunnen allerede
// bygget, er det ingenting å gjøre — å kjøre samme bane om igjen etter et løp
// skal ikke koste noe.
// Den finkornede prikketeksturen i bakken. Lagt i en egen funksjon fordi den
// brukes to steder — i bakgrunnsbildet og i bakkeflisen under det — og de to
// MÅ være samme tekstur, ellers ser man hvor bildet slutter.
// Merk at hver gren bruker nøyaktig TRE `rnd()`-kall. Det er ikke tilfeldig:
// bakgrunnen er seedet på banenavnet og skal være bit-identisk fra gang til
// gang, så en gren som trakk et annet antall tall ville flyttet alt som tegnes
// etterpå. Legges en ny `speckle`-type inn, må den også bruke tre.
function speckleFarge(speckle,rnd){
  if(speckle==='arid') return `rgba(${150+rnd()*70},${118+rnd()*55},${65+rnd()*40},.4)`;
  if(speckle==='dune') return `rgba(${205+rnd()*40},${160+rnd()*45},${120+rnd()*35},.4)`;
  if(speckle==='snow') return `rgba(${195+rnd()*45},${205+rnd()*35},${215+rnd()*30},.3)`;
  if(speckle==='autumn') return `rgba(${110+rnd()*70},${60+rnd()*40},${18+rnd()*22},.5)`;
  if(speckle==='dry') return `rgba(${100+rnd()*50},${95+rnd()*45},${40+rnd()*30},.45)`;
  // 'ash' er ny i runde 4: kald vulkansk aske, ikke varm ørkensand.
  if(speckle==='ash') return `rgba(${70+rnd()*40},${66+rnd()*34},${68+rnd()*34},.4)`;
  return `rgba(${20+rnd()*26},${60+rnd()*40},${20+rnd()*18},.55)`;
}

// Bakkeflis: et lite, gjentakbart utsnitt av banens egen bakke.
//
// HVORFOR den trengs: bakgrunnsbildet har bare `pad` (= TW*4+40) piksler
// utenfor banens omriss — ~230 px på MONTE SPIRA — mens et skjermhjørne kan
// ligge 545 px fra bilen, fordi bildet roterer med kjøreretningen og hjørnet
// svinger utover. Kjører man nær yttersiden, kom kanten av bakgrunnsbildet inn
// i bildet som en knivrett strek mot svart.
//
// HVORFOR ikke bare større bakgrunn: de fire største banene er alt klemt under
// 16 MP-taket (`bgScale<1`), og arealet vokser med kvadratet av marginen. En
// flis koster 256×256 piksler én gang, uansett hvor stor banen er.
const GROUND_TILE=256;
// Bredden på den uttonede ytterkanten av bakgrunnsbildet. Tallet står her
// fordi BEGGE sidene av skjøten må kjenne det: `buildTrackBg` toner ut akkurat
// så mange piksler, og `drawTrackScene` må vite hvor langt inn bildet er helt
// ugjennomsiktig for å kunne la være å tegne mønster under der.
const BG_FJAER=80;
function buildGroundTile(TH,navn,bw,bh){
  const N=GROUND_TILE;
  const c=document.createElement('canvas');
  c.width=N; c.height=N;
  const q=c.getContext('2d');
  // Eget frø. Flisen MÅ ikke trekke fra bakgrunnens `rnd`-sekvens — gjør den
  // det, flytter alt som tegnes etterpå seg, og de tretten banene er ikke
  // lenger de samme bildene som før.
  const rnd=mulberry32(seedFromName(navn+'|flis'));
  // Verdistøyen bakgrunnen bruker går ikke opp i seg selv, så en flis skåret
  // ut av den får en synlig rutenettstrek hver 256. piksel. Feltet bygges
  // derfor av plane bølger med HELTALLIGE frekvenser: de er periodiske per
  // konstruksjon, og med tilfeldig retning og fase leses summen som myke
  // flekker og ikke som bølger.
  const boelger=[];
  for(let k=0;k<6;k++){
    let fx=Math.floor(rnd()*5)-2, fy=Math.floor(rnd()*5)-2;
    if(fx===0&&fy===0) fx=1;
    boelger.push({fx,fy,fase:rnd()*Math.PI*2,amp:1/(1+k*0.6)});
  }
  const sumAmp=boelger.reduce((a,b)=>a+b.amp,0);
  const toner=TH.ground.map(h=>{
    const n=parseInt(h.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  });
  const seg=toner.length-1;
  // Feltet summeres opp SEPARABELT: sin(A+B) = sinA·cosB + cosA·sinB, der A
  // bare avhenger av x og B bare av y. Da trengs 4·256 sinusoppslag per bølge
  // i stedet for ett per piksel. Målt kuttet det flisen fra 6,7 til 0,9 ms per
  // bane — den naive løkka var 393 000 Math.sin-kall, og alene stod den for
  // hele økningen i byggetid.
  const felt=new Float32Array(N*N);
  for(let k=0;k<boelger.length;k++){
    const b=boelger[k];
    const sA=new Float64Array(N), cA=new Float64Array(N);
    const sB=new Float64Array(N), cB=new Float64Array(N);
    for(let i=0;i<N;i++){
      const a=2*Math.PI*b.fx*i/N+b.fase, bb=2*Math.PI*b.fy*i/N;
      sA[i]=Math.sin(a); cA[i]=Math.cos(a);
      sB[i]=Math.sin(bb); cB[i]=Math.cos(bb);
    }
    for(let y=0;y<N;y++){
      const sBy=sB[y], cBy=cB[y], rad=y*N;
      for(let x=0;x<N;x++) felt[rad+x]+=b.amp*(sA[x]*cBy+cA[x]*sBy);
    }
  }
  const img=q.createImageData(N,N), d=img.data;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    let v=0.5+0.5*(felt[y*N+x]/sumAmp);
    // Samme båndinndeling som bakgrunnen bruker, så flisen får NØYAKTIG samme
    // tonefordeling — det er den som avgjør om skjøten synes.
    const f=Math.max(0,Math.min(0.999999,v))*seg;
    const i0=Math.floor(f), i1=Math.min(seg,i0+1);
    let t=f-i0; t=t*t*(3-2*t);
    const a=toner[i0], b2=toner[i1];
    const o=(y*N+x)*4;
    d[o]  =a[0]+(b2[0]-a[0])*t;
    d[o+1]=a[1]+(b2[1]-a[1])*t;
    d[o+2]=a[2]+(b2[2]-a[2])*t;
    d[o+3]=255;
  }
  q.putImageData(img,0,0);
  // Prikkene legges i samme TETTHET som i bakgrunnen (420 over hele banen),
  // ikke i samme antall — ellers ville en flis på 65 000 piksler fått like
  // mange prikker som en bane på 7 millioner, og mønsteret lest som et
  // rutenett av grus. Hver prikk tegnes i ni kopier (±N i begge retninger)
  // slik at de som ligger inntil kanten fortsetter på den andre siden; uten
  // det blir hver flisskjøt en stripe med halve prikker.
  const antall=Math.max(3,Math.min(24,Math.round(420*N*N/(bw*bh))));
  for(let i=0;i<antall;i++){
    q.fillStyle=speckleFarge(TH.speckle,rnd);
    const px=rnd()*N, py=rnd()*N, pw=1+rnd(), ph=2+rnd()*5;
    for(let gx=-1;gx<=1;gx++) for(let gy=-1;gy<=1;gy++) q.fillRect(px+gx*N,py+gy*N,pw,ph);
  }
  return c;
}

function buildTrackBg(TR){
  if(TR.bg) return;
  const cfg=TR.cfg;
  const {PATH,PN,heading,smoothCurv,severity,wallOffsArr,sfAng,sfx,sfy}=TR;
  const bw=TR.bgW, bh=TR.bgH;
  const ox=TR.bgOx, oy=TR.bgOy; // world -> bg canvas offset
  const pad=TR.bgPad;            // px lerret utenfor omrisset, taket for landemerkehøyde
  const bg=document.createElement('canvas');
  bg.width=Math.ceil(bw*TR.bgScale); bg.height=Math.ceil(bh*TR.bgScale);
  const bx=bg.getContext('2d');
  // All tegnekoden under regner i verdenskoordinater (+ox/+oy). Er banen for
  // stor for ett canvas, skaleres hele konteksten én gang her i stedet for at
  // hver enkelt tegnelinje skal måtte vite om nedskaleringen — bildet blir
  // identisk, bare med færre piksler, og drawTrackScene blåser det opp til
  // full verdensstørrelse igjen.
  if(TR.bgScale!==1) bx.scale(TR.bgScale,TR.bgScale);

  const TH=TR.theme;
  // ALL tilfeldighet under denne linjen går gjennom `rnd`, aldri Math.random().
  // Frøet er banenavnet, så samme bane ser bit-identisk ut hver gang den
  // bygges — se seedFromName/mulberry32 for hvorfor det måtte til.
  const rnd=mulberry32(seedFromName(cfg.name));
  const noise=makeNoise(rnd);
  // Støyen slås opp i normaliserte bane-koordinater, slik at mønsteret skalerer
  // med banen og ikke blir finere på en stor bane enn på en liten.
  function nAt(x,y){ return noise(x/bw,y/bh); }

  // ── nattlys ──────────────────────────────────────────────────────────────
  // Vinduer, gatelys, havnelys og neonskilt er malt inn i bakgrunnen som
  // flate fargeflater — de ser riktige ut på DAG, men på NATT skal de GLØDE,
  // og en glød kan ikke bakes inn: den må tegnes over bilene og terrenget for
  // å lyse opp noe. Hvert lys som settes her får derfor to liv: flaten i
  // bakgrunnen (bakt én gang) og et punkt i denne lista, som drawTrackScene
  // tegner glød-sprite-en på når det er mørkt.
  //
  // Taket på 150 er ikke pynt: gløden er et drawImage med alpha per lys, og
  // på en bane som VISTANOTTE er det tusenvis av opplyste vinduer i
  // bakgrunnen. Uten taket ville nattløpet der kostet mer i glød enn i biler.
  // addLight slipper derfor stille det som kommer over taket — bakgrunnsflaten
  // står der uansett, så vinduet forsvinner ikke, det slutter bare å gløde.
  const NIGHT_LIGHT_MAX=150;
  const nightLights=[];
  function addLight(x,y,clr,size){
    if(nightLights.length>=NIGHT_LIGHT_MAX) return;
    // Lagres i VERDENSKOORDINATER, ikke bg-koordinater, fordi drawTrackScene
    // tegner dem i samme verdenstransform som bilene — samme regel som
    // standRects/floodlights alt følger.
    nightLights.push({x:x-ox,y:y-oy,clr,size});
  }

  // ── bakken: store myke flekker, ikke 1400 jevne prikker ──────────────────
  // HVORFOR en liten ImageData blåst opp, og ikke hundrevis av store sirkler:
  // flekkene skal dekke hele bakgrunnen (opptil 4,6k × 4,5k px). Tegnet som
  // sirkler med lav opasitet ble det titalls millioner piksler fyll, og
  // byggetiden gikk fra 8 ms til over 100 ms på de største banene. Her regnes
  // støyen i et 96×96-rutenett — 9216 piksler — og skaleres opp med
  // interpolering. Resultatet er mykere enn sirkler ville blitt, og koster
  // ett drawImage.
  {
    const GN=96;
    const liten=document.createElement('canvas');
    liten.width=GN; liten.height=GN;
    const lx=liten.getContext('2d');
    const img=lx.createImageData(GN,GN);
    const d=img.data;
    // Tonene parses én gang. 2 eller 3 toner: verdien fra støyen deler
    // intervallet [0,1) i like mange bånd, og det blandes mykt over grensene
    // slik at det blir flyter og ikke flekker med skarp kant.
    const toner=TH.ground.map(h=>{
      const n=parseInt(h.slice(1),16);
      return [(n>>16)&255,(n>>8)&255,n&255];
    });
    const seg=toner.length-1;
    for(let y=0;y<GN;y++) for(let x=0;x<GN;x++){
      const v=noise(x/GN,y/GN);
      const f=Math.max(0,Math.min(0.999999,v))*seg;
      const i0=Math.floor(f), i1=Math.min(seg,i0+1);
      let t=f-i0; t=t*t*(3-2*t);
      const a=toner[i0], b=toner[i1];
      const o=(y*GN+x)*4;
      d[o]  =a[0]+(b[0]-a[0])*t;
      d[o+1]=a[1]+(b[1]-a[1])*t;
      d[o+2]=a[2]+(b[2]-a[2])*t;
      d[o+3]=255;
    }
    lx.putImageData(img,0,0);
    bx.imageSmoothingEnabled=true;
    bx.imageSmoothingQuality='high';
    bx.drawImage(liten,0,0,bw,bh);
    liten.width=0; liten.height=0;   // slipp pikselbufferet med en gang
  }
  // Klippestriper i plenen (bare parkbanen): lyse og mørke bånd på skrå, slik
  // en gressklipper legger dem. Tegnes som brede streker med lav opasitet, så
  // de leses som klippemønster og ikke som malte linjer.
  if(TH.mow){
    const {ang,width}=TH.mow;
    const dx=Math.cos(ang), dy=Math.sin(ang);
    const diag=Math.hypot(bw,bh);
    bx.save();
    bx.lineWidth=width;
    for(let k=-Math.ceil(diag/width);k<=Math.ceil(diag/width);k++){
      bx.strokeStyle=k%2===0?'rgba(255,255,255,.045)':'rgba(0,0,0,.055)';
      const cx0=bw/2+(-dy)*k*width, cy0=bh/2+dx*k*width;
      bx.beginPath();
      bx.moveTo(cx0-dx*diag,cy0-dy*diag);
      bx.lineTo(cx0+dx*diag,cy0+dy*diag);
      bx.stroke();
    }
    bx.restore();
  }
  // Finkornet tekstur oppå flekkene. Antallet er nede fra 1400 til 420:
  // prikkene var før den ENESTE teksturen bakken hadde, og måtte dekke alt.
  // Nå gjør flekkene grovarbeidet, og prikkene skal bare bryte opp flatene.
  const speckle=TH.speckle;
  for(let i=0;i<420;i++){
    bx.fillStyle=speckleFarge(speckle,rnd);
    bx.fillRect(rnd()*bw,rnd()*bh,1+rnd(),2+rnd()*5);
  }
  function tPath(ctxr){
    ctxr.beginPath();
    ctxr.moveTo(PATH[0][0]+ox,PATH[0][1]+oy);
    for(let i=1;i<PN;i++) ctxr.lineTo(PATH[i][0]+ox,PATH[i][1]+oy);
    ctxr.closePath();
  }
  bx.lineCap='round'; bx.lineJoin='round';

  // ── avstandsrutenettet ───────────────────────────────────────────────────
  // Den gamle distToPath() skannet ALLE punktene på banen (PN = 540–1044) for
  // hvert forsøk på å plassere ETT objekt. Det holdt så lenge en bane hadde
  // 150–200 objekter. Runde 4 legger på reklameskilt, dekkvegger, bygningsrader,
  // landemerker og klyngebasert vegetasjon med mange flere forkastede forsøk
  // per treff, og da er den skanningen det som koster.
  //
  // I stedet regnes avstanden ut ÉN gang per bakgrunnsbygging, i et rutenett
  // med 16 × 16 px celler, og slås opp med to divisjoner.
  //
  // HVORFOR OPPSLAGET ER KONSERVATIVT — altså aldri slipper et objekt nærmere
  // banen enn den gamle koden gjorde:
  // For hver celle lagres den MINSTE avstanden fra noe punkt INNE I CELLEN til
  // et banepunkt, ikke avstanden fra cellens midtpunkt. Det regnes med
  // boks-til-punkt-avstand, som er eksakt. Oppslaget for (x,y) returnerer
  // dermed en verdi som per definisjon er ≤ den sanne avstanden fra (x,y), så
  // en test på `< CLEAR` forkaster minst like mye som før — litt mer, langs
  // cellegrensene, og det er riktig vei å ta feil.
  //
  // Celler som ligger lenger unna enn RMAX får RMAX. Det er fortsatt en gyldig
  // nedre grense (den sanne avstanden er større), og RMAX er satt med god
  // margin over den største klaringen noen kaller med.
  //
  // HVORFOR DEN STÅR HER, FØR BAKKELAGET, og ikke nede ved vegetasjonen der
  // den ble skrevet: `clearGrid` og `CLEAR` er `const`, altså i TDZ til
  // deklarasjonen er kjørt. Lå de nedenfor, ville `scene.avstand` kastet for et
  // bakkelag og virket for et landemerke — samme kall, to utfall, avhengig av
  // hvilken fase temaet ble kalt i. Rutenettet avhenger bare av PATH og
  // bg-størrelsen, så det kan like godt bygges før første tema slipper til.
  const CLEAR=cfg.TW+GRAVEL_SAFE+26;
  const GRID_CELL=16;
  const RMAX=CLEAR+160;
  const gw=Math.ceil(bw/GRID_CELL)+1, gh=Math.ceil(bh/GRID_CELL)+1;
  const clearGrid=new Float32Array(gw*gh).fill(RMAX);
  {
    const span=Math.ceil(RMAX/GRID_CELL)+1;
    for(let i=0;i<PN;i++){
      // Banepunktet i bg-canvasets koordinater, siden rutenettet dekker bg.
      const px=PATH[i][0]+ox, py=PATH[i][1]+oy;
      const cx=Math.floor(px/GRID_CELL), cy=Math.floor(py/GRID_CELL);
      const x0=Math.max(0,cx-span), x1=Math.min(gw-1,cx+span);
      const y0=Math.max(0,cy-span), y1=Math.min(gh-1,cy+span);
      for(let gy=y0;gy<=y1;gy++){
        const by0=gy*GRID_CELL, by1=by0+GRID_CELL;
        // Avstand fra punktet til cellens y-intervall (0 om punktet ligger inni).
        const dy=py<by0 ? by0-py : (py>by1 ? py-by1 : 0);
        if(dy>=RMAX) continue;
        const row=gy*gw;
        for(let gx=x0;gx<=x1;gx++){
          const bx0=gx*GRID_CELL, bx1=bx0+GRID_CELL;
          const dx=px<bx0 ? bx0-px : (px>bx1 ? px-bx1 : 0);
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<clearGrid[row+gx]) clearGrid[row+gx]=d;
        }
      }
    }
  }
  // Tar verdenskoordinater, som den gamle distToPath gjorde, slik at alle
  // kallestedene står uendret.
  function distToPath(x,y){
    const gx=Math.floor((x+ox)/GRID_CELL), gy=Math.floor((y+oy)/GRID_CELL);
    if(gx<0||gy<0||gx>=gw||gy>=gh) return RMAX;
    return clearGrid[gy*gw+gx];
  }

  // ── BAKKELAGET ───────────────────────────────────────────────────────────
  // De store formene som definerer STEDET: innsjøer, hav, åkre, rullebaner,
  // lavaelver, bygater. Tegnes her, altså ETTER bakken men FØR asfalten.
  //
  // HVORFOR rekkefølgen er hele poenget: alt som tegnes her havner UNDER banen
  // og grusen. Da trenger et bakkelag ingen avstandssjekk mot banen i det hele
  // tatt — en innsjø kan gjerne strekke seg inn under asfalten, for asfalten
  // males rett oppå den etterpå. Det er forskjellen på å kunne tegne en
  // innsjø som faktisk fyller innsiden av banen, og å måtte dytte den så langt
  // unna at den blir en pyttt i utkanten av bildet.
  // Byggeklossene er definert lenger ned i samme funksjonskropp. De er vanlige
  // funksjonsdeklarasjoner, som JS hoister til toppen av buildTrackBg, så de
  // finnes allerede her — samme mekanisme scatterGraffiti alt bygger på.
  //
  // `scene` er den ENE pakka alle temafunksjonene (bakkelag i steg A, landemerker
  // i steg B og C) får. HVORFOR en pakke og ikke ti argumenter: et tema skal
  // kunne tegne hva som helst uten at signaturen må endres hver gang et nytt
  // tema trenger én ting mer, og uten at tegnekoden kan rote seg til å lese
  // noe den ikke skal (som cfg.TW, som er geometri).
  // Vegetasjonssperrer. Et bakkelag legger vann eller asfalt OVER bakken, og
  // vegetasjonen strøs etterpå — scatterTerrain kjenner bare avstanden til
  // banen og støyen, så uten en sperre ville trærne i ARDENNE stått midt i elva
  // og buskene på DUNA ute i havet.
  //
  // Sonene er sirkler fordi vannflatene under ER bygget av sirkler: da er
  // sperra det samme tallet som det som faktisk ble tegnet, og kan ikke komme i
  // utakt med den. En sperre som var sin egen rektangelliste ville måttet
  // vedlikeholdes ved siden av tegnekoden, og det er nøyaktig slik en busk
  // havner i vannet to steg senere.
  const sperrer=[];
  function iSperre(x,y){
    for(let i=0;i<sperrer.length;i++){
      const s=sperrer[i], dx=x-s.x, dy=y-s.y;
      if(dx*dx+dy*dy<s.r*s.r) return true;
    }
    return false;
  }
  // Flate bygget av overlappende sirkler: kanten tegnes først som en bredere
  // flate UNDER, slik at flaten får en synlig bredd mot bakken i stedet for å
  // ende i en hard kant. Det er KANTEN som ligger ytterst mot bakken, og derfor
  // den av de to tonene som må måles mot bakketonene — ikke flaten.
  function dFlate(blobs,pal){
    bx.save();
    bx.fillStyle=pal.kant;
    blobs.forEach(b=>{ bx.beginPath(); bx.arc(b.x,b.y,b.r+7,0,Math.PI*2); bx.fill(); });
    bx.fillStyle=pal.flate;
    blobs.forEach(b=>{ bx.beginPath(); bx.arc(b.x,b.y,b.r,0,Math.PI*2); bx.fill(); });
    bx.restore();
    blobs.forEach(b=>sperrer.push({x:b.x,y:b.y,r:b.r+7}));
  }
  // Vann er den samme flaten PLUSS glimt. HVORFOR de to er skilt: glimtet er
  // det ENE som skiller en vannflate fra en tørr flate bygget likt — en
  // kornåker eller en olivenlund har ingen overflate å reflektere i, og glimt
  // på en åker leses som lys som ligger og flyter oppå kornet.
  function dVann(blobs,pal){
    dFlate(blobs,pal);
    // Lysrefleksene er korte vannrette streker, ikke sirkler: en sirkel leses
    // som en stein i vannet, en strek som et glimt på overflaten.
    //
    // Hvitt med lav opasitet er fast her, og står med vilje IKKE i den målte
    // lagPal-en: det er et glimt oppå vannflaten, ikke en farge som bærer
    // informasjon. Vannet skal være lesbart mot bakken uten glimtet — måles
    // glimtet i stedet for flaten, kan en vannfarge som forsvinner i bakken
    // snike seg gjennom testen på glansen sin.
    bx.save();
    bx.strokeStyle='rgba(255,255,255,.18)'; bx.lineWidth=2;
    blobs.forEach(b=>{
      for(let k=0;k<3;k++){
        const a=rnd()*Math.PI*2, d=rnd()*b.r*0.7;
        const gx=b.x+Math.cos(a)*d, gy=b.y+Math.sin(a)*d;
        bx.beginPath(); bx.moveTo(gx-b.r*0.18,gy); bx.lineTo(gx+b.r*0.18,gy); bx.stroke();
      }
    });
    bx.restore();
  }
  const scene={
    bx, bw, bh, ox, oy, PATH, PN, heading, severity, smoothCurv, TH, rnd, noise, nAt,
    TW:cfg.TW, name:cfg.name, sfx, sfy, sfAng, GRAVEL_SAFE,
    // Klaringen vegetasjonen bruker. Et landemerke som vil stå utenfor alt
    // annet leser den herfra i stedet for å gjenta regnestykket.
    CLEAR,
    // Avstand fra et punkt til nærmeste punkt på banen. Tar BG-koordinater,
    // altså de samme koordinatene temaet tegner i, slik at et tema ikke må
    // holde to koordinatsystemer i hodet for å sjekke om det er klar av banen.
    avstand(x,y){ return distToPath(x-ox,y-oy); },
    // Lyskilde som skal GLØDE om natta. Se nattlys-seksjonen øverst: flaten
    // males inn i bakgrunnen av temaet selv, dette er bare punktet gløden
    // tegnes på. Tar bg-koordinater, som alt annet et tema ser.
    lys: addLight,
    vann: dVann,
    // Samme flate uten glimt — til åkre, lunder og lavaelver. Se dVann.
    flate: dFlate,
    // Sperrer et område for vegetasjon uten å tegne noe — for landemerker som
    // legger sin egen flate (rullebanen på DESERTO, landsbytomta på ALPEN).
    sperr(x,y,r){ sperrer.push({x,y,r}); },
    // Fortegnet på normalen som peker BORT fra indre felt.
    //
    // En stor flate må ut hit. Legges havet innover, fyller det indre felt og
    // leses som en innsjø midt på rundbanen i stedet for et landskap banen går
    // langs — og indre felt er dessuten det ENE stedet spilleren aldri ser på
    // nært hold. Fortegnet stemmes fram over hele banen og ikke på ett punkt,
    // vektet med avstanden til tyngdepunktet, så en enkelt hårnål som snur
    // normalen lokalt ikke kan velte svaret.
    utside(){
      let cx=0, cy=0;
      for(let i=0;i<PN;i++){ cx+=PATH[i][0]; cy+=PATH[i][1]; }
      cx/=PN; cy/=PN;
      let sum=0;
      for(let i=0;i<PN;i+=8){
        const h=heading[i];
        sum+=(PATH[i][0]-cx)*-Math.sin(h)+(PATH[i][1]-cy)*Math.cos(h);
      }
      return sum>=0?1:-1;
    },
    // Et bånd av overlappende sirkler som FØLGER banen fra rundeposisjon t0 til
    // t1, lagt `avstand` px ut på én side og `rader` sirkelrekker bredt.
    // Byggeklossen for alle vannflatene i bakkelaget.
    //
    // HVORFOR langs banen og ikke på det åpneste punktet i bildet: det åpneste
    // punktet på en lukket rundbane er alltid midt i indre felt, flere hundre px
    // fra nærmeste asfalt. Spillvisningen ser ~500 px rundt bilen, så en flate
    // lagt der blir ALDRI sett under kjøring — den vises bare på
    // oversiktsbildet, og der ble alle fem banene like: samme runde dam midt i
    // bildet, i hver sin farge. En bane kjennes igjen på det du kjører FORBI.
    //
    // Avstanden mellom sirklene er en BRØKDEL av radien og ikke et fast tall:
    // ligger de lenger fra hverandre enn de er store, blir elva en prikkerekke
    // i stedet for en elv. Den fella gikk ARDENNE rett i.
    //
    // `sving` er hvor mange piksler båndet får drive UTOVER fra `avstand`
    // underveis, og den er ikke pynt: uten den løper båndet nøyaktig parallelt
    // med asfalten i et halvt rundt, og en elv som ligger i konstant avstand
    // fra en racerbane leses som en kanal gravd langs veien.
    //
    // To ting å vite om tallene. (1) Driften går bare UTOVER, aldri innover:
    // `avstand` er dermed et gulv, og driften kan ikke skyve en sirkel inn på
    // asfalten der den i stedet hadde blitt sløyfet. En toveis drift tømte
    // ARDENNE for elv. (2) `nAt` deler SELV på bildestørrelsen, så argumentet
    // er bg-piksler og ikke en brøk. `nAt(x,y)` svinger omtrent sju ganger over
    // bildet, altså ~500 px bølgelengde, som er meanderskala; kantruheten må
    // gange koordinatet OPP for å få kort bølgelengde. Å gange ned, slik en
    // «lav frekvens» intuitivt skulle tilsi, låser støyen til én konstant.
    belte(t0,t1,side,avstand,radius,rader,sving){
      const n=rader||1, blobs=[];
      const i0=Math.round(t0*PN), i1raw=Math.round(t1*PN);
      const i1=i1raw<=i0?i1raw+PN:i1raw;
      for(let rad=0;rad<n;rad++){
        const ut=avstand+rad*radius*1.15;
        let akk=1e9;                                  // slipp første sirkel med en gang
        for(let i=i0;i<i1;i++){
          const a=PATH[i%PN], b=PATH[(i+1)%PN];
          akk+=Math.hypot(b[0]-a[0],b[1]-a[1]);
          if(akk<radius*0.55) continue;
          akk=0;
          const h=heading[i%PN], nx=-Math.sin(h)*side, ny=Math.cos(h)*side;
          const r=radius*(0.72+nAt(a[0]*4,a[1]*4)*0.5);
          const d=ut+nAt(a[0],a[1])*(sving||0)+nAt(a[0]*9,a[1]*9)*radius*0.9;
          const x=a[0]+nx*d, y=a[1]+ny*d;
          // Treffer sirkelen asfalten, SLØYFES den — den skyves ikke utover.
          // Banen kommer tilbake mot seg selv i hårnåler, og der peker «lenger
          // ut fra mitt banepunkt» rett mot en helt annen del av banen: et
          // skyv endte som løsrevne sirkler strødd over hele bildet. Et hull
          // der banen kommer nær er dessuten riktig — det er der elva går i rør
          // under veien.
          if(distToPath(x,y)<CLEAR+r) continue;
          blobs.push({x:x+ox, y:y+oy, r});
        }
      }
      return blobs;
    },
    // Plasserer et landemerke ved rundeposisjon t: tangent-justert, på én side
    // av banen, og garantert klar av asfalten.
    //
    // Gjenbruker clearFootprint, som alt løser den vanskelige delen: en lang
    // flate ved en skarp sving kan svinge tilbake over banen selv om
    // midtpunktet ser klart ut. Den skrumper dessuten flaten i stedet for å gi
    // opp, så `halvLengde` i svaret er den som faktisk ble verifisert og ikke
    // den som ble bedt om — tegn landemerket i den størrelsen, ellers er
    // klaringen bare målt på papiret.
    // `hoyde` er byggets høyde i tegningen, og den er ikke pynt: et landemerke
    // tegnes i en ramme der lokal y peker BORT fra banen, så rekkevidden ut fra
    // asfalten er avstandUt PLUSS høyden. Bakgrunnslerretet har bare `pad`
    // (= TW*4+40) piksler utenfor banens omriss, og der banen ligger helt ute
    // ved omrisset blir alt over den grensa klippet av en knivrett lerretskant.
    // Det er nøyaktig det som skjedde med dueslaget på DISCESA: 155 px ut + 84
    // px høyt = 239, mot et lerret med 240 px å gi.
    //
    // Taket står HER og ikke i hvert tema, fordi det er en egenskap ved
    // lerretet og ikke ved bygget — et nytt landemerke i neste steg skal ikke
    // måtte finne ut av dette på nytt.
    plasser(t,side,halvLengde,avstandUt,hoyde){
      const p=this.atT(t);
      const tak=pad-(hoyde||0)-14;
      const ut=hoyde ? Math.min(avstandUt,tak) : avstandUt;
      const r=clearFootprint(p.x,p.y,p.h,side,halvLengde,ut,CLEAR,{allowFlip:true});
      return {x:r.cx+ox, y:r.cy+oy, ang:p.h, halvLengde:r.halfLen, side:r.side};
    },
    // Et punkt i landemerkets EGEN tegneramme, regnet om til bg-koordinater.
    //
    // Nattgløden er den eneste delen av et landemerke som tegnes utenfor
    // `translate`+`rotate`-rammen — `addLight` lagrer punkter `drawTrackScene`
    // bruker i sin egen transform — og hvert tema har derfor måttet gjøre
    // omregningen selv. To feil kom ut av det, begge skjermbildeverifiserte:
    // rammen roteres `p.ang+(side>0?π:0)`, så med `side>0` ligger et lokalt
    // punkt til høyre for midten til VENSTRE i verden (DUNAs fyrlampe havnet i
    // motsatt ende av moloen), og en glød satt på `lokal y = 0` havner ved
    // FOTEN av det som lyser, ikke på lyset (ALPENs vinduer står 25–45 px opp,
    // ARDENNEs 23, DUNAs lykt 97). Begge deler står nå ett sted.
    lokal(p,lx,ly){
      const vend=p.side>0?-1:1;
      const c=Math.cos(p.ang)*vend, s2=Math.sin(p.ang)*vend;
      return {x:p.x+lx*c-ly*s2, y:p.y+lx*s2+ly*c};
    },
    // Verdenspunktet ved rundeposisjon t (0–1) og enhetsnormalen der.
    atT(t){
      const i=((Math.round(t*PN)%PN)+PN)%PN;
      const h=heading[i];
      return {x:PATH[i][0],y:PATH[i][1],h,nx:-Math.sin(h),ny:Math.cos(h),i};
    },
    // Samme punkt, men i bg-canvasets koordinater (altså med +ox/+oy påsatt).
    bgAtT(t){ const p=this.atT(t); return {...p,x:p.x+ox,y:p.y+oy}; }
  };
  if(TH.groundLayer) TH.groundLayer(scene);

  // gravel/runoff fringe — fargen kommer fra temaet nå. Bredden er den SAMME
  // som før (cfg.TW*2+46): dette er bare maling, og GRAVEL_SAFE/fysikken leser
  // ikke herfra.
  bx.strokeStyle=TH.runoff.clr; bx.lineWidth=cfg.TW*2+46; tPath(bx); bx.stroke();
  // Asfaltert utkjøring: samme sone, men malt som asfalt med tverrstriper i
  // stedet for grus — det er slik moderne gate- og ørkenbaner ser ut.
  if(TH.runoff.type==='asfalt'){
    for(let i=0;i<PN;i+=3){
      const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
      const [px,py]=PATH[i];
      bx.save(); bx.translate(px+ox,py+oy); bx.rotate(h);
      bx.fillStyle=TH.runoff.stripe||'rgba(241,245,249,.25)';
      // To stolper, én på hver side, i det ytre tredjedelen av utkjøringen —
      // der ekte baner har dem, og langt nok ut at de ikke kan forveksles med
      // en kantlinje på selve banen.
      [1,-1].forEach(side=>{
        bx.fillRect(-2.5,side*(cfg.TW+GRAVEL_SAFE+6),5,14);
      });
      bx.restore();
    }
  }
  // tarmac border + surface
  bx.strokeStyle='#15151c'; bx.lineWidth=cfg.TW*2+10; tPath(bx); bx.stroke();
  bx.strokeStyle=TH.asphalt; bx.lineWidth=cfg.TW*2; tPath(bx); bx.stroke();
  bx.strokeStyle='rgba(255,255,255,.025)'; bx.lineWidth=cfg.TW*2-14; tPath(bx); bx.stroke();
  // elevation shading: a synthetic rolling-hill brightness gradient painted
  // along the surface — lighter where the road is "climbing", a touch darker
  // where it's "descending". Purely cosmetic (physics never sees this), but
  // it's what makes a flat procedural ribbon read as real terrain with hills
  // instead of a blueprint line. Two sine terms at track-specific frequency/
  // phase (seeded off the track name) give every circuit its own distinct
  // rolling-hill rhythm — 2-3 climbs and descents per lap.
  const elevSeed=[...cfg.name].reduce((a,c)=>a+c.charCodeAt(0),0)%100/100;
  function elevAt(t){
    return Math.sin(t*Math.PI*2*2+elevSeed*10)*0.6+Math.sin(t*Math.PI*2*3.3+elevSeed*17+1.7)*0.4;
  }
  for(let i=0;i<PN;i++){
    const e=elevAt(i/PN);
    const h=heading[i], [px,py]=PATH[i];
    bx.save(); bx.translate(px+ox,py+oy); bx.rotate(h);
    bx.fillStyle = e>0 ? `rgba(255,255,255,${(e*0.055).toFixed(3)})` : `rgba(0,0,0,${(-e*0.085).toFixed(3)})`;
    bx.fillRect(-11,-cfg.TW,22,cfg.TW*2);
    bx.restore();
  }
  // elevation-change chevrons ("hill ahead" trackside signage) at the 3
  // steepest points on that same elevation curve — a concrete, recognisable
  // "you're climbing/descending here" cue beyond just the surface shading.
  {
    const slopeSamples=[]; const step=6;
    for(let i=step;i<PN-step;i+=step){
      const e0=elevAt((i-step)/PN), e1=elevAt((i+step)/PN);
      slopeSamples.push({i,slope:e1-e0});
    }
    slopeSamples.sort((a,b)=>Math.abs(b.slope)-Math.abs(a.slope));
    const chosen=[];
    for(const s of slopeSamples){
      if(chosen.length>=3) break;
      if(Math.abs(s.slope)<0.02) break;
      if(chosen.some(c=>Math.abs(c.i-s.i)<PN*0.08)) continue;
      chosen.push(s);
    }
    chosen.forEach(s=>{
      const h=heading[s.i], [px,py]=PATH[s.i];
      const nx=-Math.sin(h), ny=Math.cos(h);
      const offs=cfg.TW+GRAVEL_SAFE+14;
      const dir=s.slope>0?1:-1; // chevron points the way the road climbs
      bx.save();
      bx.translate(px+ox+nx*offs,py+oy+ny*offs);
      bx.rotate(h+(dir>0?0:Math.PI));
      bx.fillStyle='rgba(241,245,249,.75)';
      for(let k=0;k<2;k++){
        bx.beginPath();
        const yy=k*9-4;
        bx.moveTo(-6,yy); bx.lineTo(6,yy); bx.lineTo(0,yy-8); bx.closePath(); bx.fill();
      }
      bx.restore();
    });
  }
  // graffiti tags painted directly on the tarmac, laid down before the edge
  // lines/curbs/start-finish markings so those stay crisp on top — street
  // circuit flavour for 'city' tracks. scatterGraffiti/dGraffiti are plain
  // function declarations defined further down in this same function body,
  // which JS hoists to the top of buildTrack(), so calling them here is safe.
  if(cfg.graffiti) scatterGraffiti(28);
  // edge lines
  bx.strokeStyle='rgba(241,245,249,.55)'; bx.lineWidth=2.4; tPath(bx); bx.stroke();
  // curbs on hard corners (red/white)
  const CURB_T=0.034;
  for(let i=0;i<PN;i+=2){
    if(Math.abs(smoothCurv[i])<CURB_T) continue;
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    [1,-1].forEach(side=>{
      const px=PATH[i][0]+nx*side*(cfg.TW+2), py=PATH[i][1]+ny*side*(cfg.TW+2);
      bx.save(); bx.translate(px+ox,py+oy); bx.rotate(h);
      // Mønsteret er det samme som før — bare de to fargene kommer fra temaet.
      bx.fillStyle=(Math.floor(i/2)%2===0)?TH.curb[0]:TH.curb[1];
      bx.fillRect(-4,-6,8,12);
      bx.restore();
    });
  }
  // street-circuit Armco barrier: a continuous wall hugging both sides of
  // the whole lap, right outside the gravel apron — Monaco-style, not just
  // "decoration at the hard corners" like the curbs above. Triple-stroke
  // (dark shadow + silver rail + bright top highlight) reads as a 3D guard
  // rail at this scale, plus red/white marker blocks at intervals like real
  // barrier end-plates. Only tracks with cfg.walls:true get this — see the
  // matching harsh wall-collision physics in update() (TR.walls).
  // Barrieren tegnes langs wallOffsArr, som er beregnet i buildTrack — samme
  // per-punkt-avstand som kollisjonsgrensen i update() leser, så den tegnede
  // veggen står nøyaktig der den faktisk treffes.
  if(cfg.walls){
    const GRAV_EDGE=cfg.TW+GRAVEL_SAFE;
    // extended gravel apron: fills the gap between the normal gravel edge
    // and the pulled-back barrier at runoff zones, so the extra buffer reads
    // as a real paved/gravel runoff area instead of the wall floating out in
    // open grass with a bare strip behind it.
    [1,-1].forEach(side=>{
      bx.beginPath();
      for(let i=0;i<PN;i++){
        const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
        const px=PATH[i][0]+nx*side*GRAV_EDGE+ox, py=PATH[i][1]+ny*side*GRAV_EDGE+oy;
        i===0?bx.moveTo(px,py):bx.lineTo(px,py);
      }
      for(let i=PN-1;i>=0;i--){
        const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
        const px=PATH[i][0]+nx*side*wallOffsArr[i]+ox, py=PATH[i][1]+ny*side*wallOffsArr[i]+oy;
        bx.lineTo(px,py);
      }
      bx.closePath();
      bx.fillStyle='#7a6c54';
      bx.fill();
    });
    [1,-1].forEach(side=>{
      bx.beginPath();
      for(let i=0;i<PN;i++){
        const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
        const px=PATH[i][0]+nx*side*wallOffsArr[i]+ox, py=PATH[i][1]+ny*side*wallOffsArr[i]+oy;
        i===0?bx.moveTo(px,py):bx.lineTo(px,py);
      }
      bx.closePath();
      bx.strokeStyle='#15161b'; bx.lineWidth=9; bx.stroke();
      bx.strokeStyle='#8a94a3'; bx.lineWidth=6; bx.stroke();
      bx.strokeStyle='rgba(255,255,255,.35)'; bx.lineWidth=2; bx.stroke();
    });
    for(let i=0;i<PN;i+=5){
      const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
      [1,-1].forEach(side=>{
        const px=PATH[i][0]+nx*side*wallOffsArr[i]+ox, py=PATH[i][1]+ny*side*wallOffsArr[i]+oy;
        bx.save(); bx.translate(px,py); bx.rotate(h);
        bx.fillStyle=(Math.floor(i/5)%2===0)?'#d63a2e':'#f1f5f9';
        bx.fillRect(-3,-4,6,8);
        bx.restore();
      });
    }
  }
  // start/finish checker
  const sfPerp=sfAng+Math.PI/2;
  for(let k=0;k<10;k++){
    const t=(k/10-.5)*(cfg.TW*2-4);
    bx.save(); bx.translate(sfx+ox+Math.cos(sfPerp)*t, sfy+oy+Math.sin(sfPerp)*t);
    bx.rotate(sfAng); bx.fillStyle=k%2?'#111':'#eee'; bx.fillRect(-4,-9,8,18);
    bx.restore();
  }
  // sector tick marks (1/3, 2/3)
  [Math.floor(PN/3), Math.floor(PN*2/3)].forEach(idx=>{
    const h=heading[idx], perp=h+Math.PI/2, [px,py]=PATH[idx];
    bx.strokeStyle='rgba(250,204,21,.85)'; bx.lineWidth=2.5; bx.setLineDash([4,4]);
    bx.beginPath();
    bx.moveTo(px+ox+Math.cos(perp)*cfg.TW, py+oy+Math.sin(perp)*cfg.TW);
    bx.lineTo(px+ox-Math.cos(perp)*cfg.TW, py+oy-Math.sin(perp)*cfg.TW);
    bx.stroke(); bx.setLineDash([]);
  });
  // Rett-modus-sone: lilla tint + merking på asfalten
  TR.straightZones.forEach(z=>{
    const i0=Math.floor(z.a*PN), i1raw=Math.floor(z.b*PN), i1=i1raw<i0?i1raw+PN:i1raw;
    for(let i=i0;i<i1;i+=2){
      const ii=i%PN;
      const [px,py]=PATH[ii];
      bx.strokeStyle='rgba(168,85,247,.22)'; bx.lineWidth=cfg.TW*2-6;
      bx.beginPath();
      bx.moveTo(px+ox, py+oy);
      const nx=PATH[(ii+2)%PN];
      bx.lineTo(nx[0]+ox, nx[1]+oy);
      bx.stroke();
    }
    const mid=Math.floor(((i0+i1)/2))%PN;
    const [mx,my]=PATH[mid], mh=heading[mid];
    bx.save(); bx.translate(mx+ox,my+oy); bx.rotate(mh+Math.PI/2);
    // Ett hakk ned fra 11 til 10 px: «RETT-MODUS» er ti tegn, og i 11 px
    // Courier blir det 66 px bredt. Teksten står på tvers av asfalten, og de
    // smaleste banene her er bare 76 px brede — da var det 5 px margin på hver
    // side og ordet berørte nærmest kerben. 60 px gir den luft på alle baner.
    //
    // Teksten er samtidig lysnet fra #a855f7 til #ddd6fe. HVORFOR: målt med
    // contrastRatio() mot bakgrunnen den faktisk står på — asfalt #33333e
    // tintet med sonens egen rgba(168,85,247,.22), altså #4d3a67 — ga den gamle
    // fargen 2,51:1. Det er under halvparten av kravet på 4,5, og ordet er nå
    // tre ganger så langt som «DRS» var, så det er mer tekst å ikke få lest.
    // #ddd6fe måler 7,15:1 på samme bakgrunn. Sonefargen selv er urørt — det er
    // bare bokstavene som er lysnet, så sonen leses fortsatt som lilla.
    bx.fillStyle='#ddd6fe'; bx.font='bold 10px Courier New'; bx.textAlign='center';
    bx.fillText('RETT-MODUS',0,-cfg.TW-10);
    bx.restore();
  });
  bx.globalAlpha=1;

  // ── terrain decoration, themed per track ──
  // scattered only where they're clearly clear of the tarmac+gravel (a 26px
  // buffer beyond the pace-neutral gravel edge), so they read purely as
  // scenery — never mistakable for part of the drivable surface. Drawn last,
  // on top of the fully-finished track render, so there's zero chance of a
  // decoration bleeding onto an edge line or curb.
  // ── landemerket ──────────────────────────────────────────────────────────
  // Det ENE bygget som gjør banen gjenkjennelig: fyrtårnet på DUNA, kirken i
  // ARDENNE, kontrolltårnet på DESERTO. Tegnes etter asfalten, men FØR
  // vegetasjonen og tribunene.
  //
  // HVORFOR før vegetasjonen, når et tre strødd oppå taket er nettopp det vi
  // ikke vil ha: landemerket avslutter med `s.sperr()`, og den sperra leses av
  // scatterTerrain etterpå. Det er sperra som holder trærne unna, ikke
  // rekkefølgen. Å tegne landemerket SIST ville dessuten vært feil vei —
  // tribunene står tettere på banen enn landemerket, altså nærmere kameraet,
  // og de skal ligge foran det.
  if(TH.landmark) TH.landmark(scene);
  // Klyngebasert spredning. `thresh` er terskelen i verdistøyen: et objekt får
  // bare stå der støyen er høy nok. Det er dette som gjør skog til SKOGHOLT og
  // lar det bli åpne sletter mellom, i stedet for trær strødd jevnt utover som
  // før runde 4.
  //
  // Forsøksbudsjettet er opp fra count*16 til count*45, fordi terskelen
  // forkaster en stor del av kandidatene. Uten det ville en bane med høy
  // terskel (ørkenen, vulkanen) endt med langt færre objekter enn bedt om, og
  // sett tomslitt ut i stedet for sparsom.
  function scatterTerrain(count,minSpace,draw,thresh){
    const t=thresh==null?TH.cluster:thresh;
    const pts=[]; let tries=0;
    while(pts.length<count && tries<count*45){
      tries++;
      const x=rnd()*bw, y=rnd()*bh;
      if(distToPath(x-ox,y-oy)<CLEAR) continue;
      if(iSperre(x,y)) continue;
      if(t>0 && nAt(x,y)<t) continue;
      if(pts.some(p=>{const dx=p[0]-x,dy=p[1]-y;return dx*dx+dy*dy<minSpace*minSpace;})) continue;
      pts.push([x,y]);
      draw(x,y);
    }
  }
  function dTree(x,y,s,tint){
    bx.save(); bx.translate(x,y);
    const shades=tint||['#14532d','#1b6b3a','#0f3d22'];
    for(let k=0;k<3;k++){
      bx.fillStyle=shades[k%shades.length];
      bx.beginPath(); bx.arc((rnd()-.5)*6*s,(rnd()-.5)*6*s-4*s,7*s+rnd()*3*s,0,Math.PI*2); bx.fill();
    }
    bx.fillStyle='#4a3420'; bx.fillRect(-1.5*s,2*s,3*s,6*s);
    bx.restore();
  }
  function dRock(x,y,s,tint){
    bx.save(); bx.translate(x,y);
    bx.fillStyle=tint||(rnd()<.5?'#5b5b63':'#6b6b74');
    bx.beginPath();
    const n=5+Math.floor(rnd()*2);
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, r=(6+rnd()*4)*s;
      const px=Math.cos(a)*r, py=Math.sin(a)*r*.8;
      k===0?bx.moveTo(px,py):bx.lineTo(px,py);
    }
    bx.closePath(); bx.fill();
    bx.strokeStyle='rgba(255,255,255,.08)'; bx.lineWidth=1; bx.stroke();
    bx.restore();
  }
  function dHedge(x,y,s){
    bx.save(); bx.translate(x,y); bx.rotate(rnd()*Math.PI);
    bx.fillStyle='#1d5a35';
    const w=14*s,h=9*s;
    bx.beginPath();
    if(bx.roundRect) bx.roundRect(-w/2,-h/2,w,h,3); else bx.rect(-w/2,-h/2,w,h);
    bx.fill();
    bx.fillStyle='rgba(255,255,255,.07)'; bx.fillRect(-w/2,-h/2,w,h*0.3);
    bx.restore();
  }
  function dBush(x,y,s,tint){
    bx.save(); bx.translate(x,y);
    const t=tint||['#7a7a42','#8a8350','#5f5c33'];
    bx.fillStyle=rnd()<.5?t[0]:t[1];
    bx.beginPath(); bx.arc(0,0,5*s,0,Math.PI*2); bx.fill();
    bx.fillStyle=t[2];
    bx.beginPath(); bx.arc(3*s,1*s,3*s,0,Math.PI*2); bx.fill();
    bx.restore();
  }
  function dLavaRock(x,y,s){
    bx.save(); bx.translate(x,y);
    bx.fillStyle='#2b2320';
    bx.beginPath();
    const n=5+Math.floor(rnd()*2);
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, r=(6+rnd()*5)*s;
      const px=Math.cos(a)*r, py=Math.sin(a)*r*.85;
      k===0?bx.moveTo(px,py):bx.lineTo(px,py);
    }
    bx.closePath(); bx.fill();
    if(rnd()<.35){ bx.fillStyle='rgba(249,115,22,.75)'; bx.beginPath(); bx.arc(0,0,1.6*s,0,Math.PI*2); bx.fill(); }
    bx.restore();
  }
  function dLavaPool(x,y,s){
    bx.save(); bx.translate(x,y);
    bx.fillStyle='rgba(40,20,15,.85)'; bx.beginPath(); bx.arc(0,0,9*s,0,Math.PI*2); bx.fill();
    bx.fillStyle='rgba(234,88,12,.85)'; bx.beginPath(); bx.arc(0,0,6*s,0,Math.PI*2); bx.fill();
    bx.fillStyle='rgba(253,186,116,.6)'; bx.beginPath(); bx.arc(-1.5*s,-1.5*s,2.4*s,0,Math.PI*2); bx.fill();
    bx.restore();
  }
  // a stand/cliff is a long rectangle drawn tangent-aligned (its "width"
  // runs parallel to the track direction at the single point it was sampled
  // from). A plain normal-offset from that one point is only safe if the
  // track stays straight across the whole footprint — but these are
  // deliberately placed at the SHARPEST curvature points, exactly where the
  // track bends fastest, so the footprint's far ends can swing back and
  // land on top of the track (or even the opposite side of a hairpin) while
  // the center point looks clear. Fix: sample several points along the
  // footprint's tangent span against the real track geometry, and if
  // anything's still too close, push the whole thing further out along the
  // normal and recheck — repeat until genuinely clear (or give up after a
  // reasonable number of tries so a pathological spot can't loop forever).
  // opts.allowFlip: if the requested side can't be cleared within the push-out
  // budget, try the OPPOSITE side too (a pathological bend — e.g. a nearby
  // switchback folding back close by on just one side — doesn't necessarily
  // affect the other). Only used for corner stands/cliffs, not the
  // start/finish stands (which are explicitly placed on both sides and must
  // stay there). If NEITHER side clears even after the push-out budget on
  // every shrink step, this is a genuinely pathological spot (seen on
  // LABIRINTO's tightest city hairpins) — rather than loop forever or leave
  // it sitting on the track, progressively shrink the footprint's tangent
  // span (a shorter stand/cliff is much easier to tuck into a tight gap than
  // a long one) and return the best candidate found, with its actual
  // halfLen, so the caller draws it at the size that was actually verified.
  function clearFootprint(px,py,h,side,halfLen,baseOffs,minClear,opts){
    opts=opts||{};
    const nx=-Math.sin(h), ny=Math.cos(h);
    const tx=Math.cos(h), ty=Math.sin(h);
    function tryClear(s,hl){
      let offs=baseOffs, cx=px, cy=py, minD=0;
      for(let iter=0;iter<16;iter++){
        cx=px+nx*offs*s; cy=py+ny*offs*s;
        minD=1e9;
        for(let k=-1;k<=1;k+=0.2){
          const sx=cx+tx*hl*k, sy=cy+ty*hl*k;
          const d=nearestOnPath(PATH,sx,sy).dist;
          if(d<minD) minD=d;
        }
        if(minD>=minClear) return {cx,cy,minD,ok:true,side:s,halfLen:hl};
        offs+=16;
      }
      return {cx,cy,minD,ok:false,side:s,halfLen:hl};
    }
    let best=tryClear(side,halfLen);
    if(best.ok) return best;
    if(opts.allowFlip){
      const opp=tryClear(-side,halfLen);
      if(opp.ok) return opp;
      if(opp.minD>best.minD) best=opp;
    }
    for(const shrink of [0.7,0.5,0.35,0.22]){
      const hl=halfLen*shrink;
      const a=tryClear(side,hl);
      if(a.ok) return a;
      if(a.minD>best.minD) best=a;
      if(opts.allowFlip){
        const b=tryClear(-side,hl);
        if(b.ok) return b;
        if(b.minD>best.minD) best=b;
      }
    }
    return best;
  }
  // walk the path at a fixed stride, dropping a decoration hugging the
  // trackside edge (alternating left/right if asked) — for stuff that
  // belongs right at the barrier line (lamps) rather than scattered loosely
  // out in the clear zone (trees/rocks/buildings use scatterTerrain instead).
  function scatterAlongTrack(step,offset,draw,altSides){
    for(let i=0;i<PN;i+=step){
      const h=heading[i], [px,py]=PATH[i];
      const nx=-Math.sin(h), ny=Math.cos(h);
      const side=altSides?((Math.floor(i/step)%2===0)?1:-1):1;
      draw(px+ox+nx*offset*side, py+oy+ny*offset*side, h);
    }
  }
  // drop jagged cliff-faces at the sharpest corners (mountain/volcano tracks)
  // on the outside edge, so the road reads as genuinely cut into the rock
  // on its hardest bends rather than floating in open terrain.
  function placeCliffs(count){
    const samples=[]; const cstep=4;
    for(let i=0;i<PN;i+=cstep) samples.push({i,c:smoothCurv[i]});
    samples.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
    const chosen=[];
    for(const s of samples){
      if(chosen.length>=count) break;
      if(Math.abs(s.c)<0.015) break;
      if(chosen.some(p=>Math.abs(p.i-s.i)<PN*0.1)) continue;
      chosen.push(s);
    }
    chosen.forEach(s=>{
      const h=heading[s.i], [px,py]=PATH[s.i];
      const side=s.c>=0?-1:1;
      const w=64+rnd()*28;
      // sit well past the grandstand ring (~TW+GRAVEL_SAFE+36..47) so the
      // cliff reads as a rock backdrop behind the scenery, not a smear over
      // the gravel fringe — and flip the draw angle by side so the jagged
      // silhouette always grows AWAY from the track, never back toward it.
      // clearFootprint nudges it further out if its tangent-aligned span
      // would otherwise clip back over the track on this sharp a bend.
      const baseOffs=cfg.TW+GRAVEL_SAFE+58;
      const r=clearFootprint(px,py,h,side,w/2,baseOffs,cfg.TW+GRAVEL_SAFE+20,{allowFlip:true});
      dCliff(r.cx+ox,r.cy+oy, h+(r.side>0?Math.PI:0), r.halfLen*2);
    });
  }
  function dGrandstand(x,y,ang,w,h){
    bx.save(); bx.translate(x,y); bx.rotate(ang);
    // roof overhang, casts the seating into shadow a touch
    bx.fillStyle='#1b1b22'; bx.fillRect(-w/2-4,-h/2-6,w+8,6);
    // structure
    bx.fillStyle='#2b2b33'; bx.fillRect(-w/2,-h/2,w,h);
    bx.fillStyle='#3a3a44'; bx.fillRect(-w/2,-h/2,w,h*0.3);
    // crowd — loose rows of small randomly-coloured dots (individual fans,
    // not a repeating flag pattern) with the occasional empty seat so it
    // reads as a real, organic crowd rather than a filled grid.
    const cols=['#ef4444','#38bdf8','#eab308','#f1f5f9','#4ade80','#fb923c','#f472b6'];
    const rows=Math.max(3,Math.floor(h/7));
    for(let r=0;r<rows;r++) for(let c=0;c<Math.floor(w/7);c++){
      if(rnd()<0.15) continue;
      bx.fillStyle=cols[Math.floor(rnd()*cols.length)];
      bx.beginPath(); bx.arc(-w/2+4+c*7,-h/2+6+r*7,1.6,0,Math.PI*2); bx.fill();
    }
    // barrier fence along the front edge
    bx.strokeStyle='rgba(241,245,249,.5)'; bx.lineWidth=1.4;
    bx.beginPath(); bx.moveTo(-w/2,h/2+2); bx.lineTo(w/2,h/2+2); bx.stroke();
    bx.restore();
  }
  // Fasadetonen for ETT bygg. Temaets cityPal er en PALETT på fire toner, ikke
  // den ene faste fargen cfg.cityPal hadde før runde 4: en by der hvert hus har
  // nøyaktig samme fasade leser som en kulisse, og det var nettopp det runde 4
  // skulle vekk fra. Plukkes med `rnd` og ikke Math.random(), slik at kvartalet
  // har de samme husene i de samme fargene hver gang banen bygges.
  //
  // At paletten ER en array håndheves av test_banetema.js, ikke av en sjekk
  // her: en tone oppgitt som streng ville plukket ut ett enkelt tegn («#») og
  // gitt en ugyldig farge, og det skal fanges av en test én gang for alle
  // temaer, ikke av en gren som gjør koden utydelig for alle tretten baner.
  function cityColour(){
    const p=TH.cityPal;
    if(!p) return null;   // dBuilding faller til sin egen standardtone
    return p[Math.floor(rnd()*p.length)];
  }
  // city street-circuit building, drawn "standing up" out of the gravel —
  // a tinted facade block with a lit-window grid and an optional rooftop
  // plant unit, so the skyline reads instantly as urban rather than forest.
  function dBuilding(x,y,s,pal){
    bx.save(); bx.translate(x,y);
    const h=(20+rnd()*30)*s, w=(11+rnd()*7)*s;
    bx.fillStyle=pal||'#2d3344';
    bx.fillRect(-w/2,-h,w,h);
    bx.fillStyle='rgba(255,255,255,.07)'; bx.fillRect(-w/2,-h,w*.35,h);
    bx.fillStyle='rgba(250,204,21,.6)';
    const rows=Math.floor(h/7), cols=Math.max(1,Math.floor(w/5));
    for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++){
      if(rnd()<0.4) continue;
      bx.fillRect(-w/2+3+cc*5, -h+4+r*7, 2.4,3.2);
    }
    if(rnd()<.5){ bx.fillStyle='#1b1f29'; bx.fillRect(-w*.18,-h-6*s,w*.36,6*s); }
    bx.restore();
  }
  // street lamp — warm glow pool + pole + head, lines the street-circuit
  // shoulders so the city tracks read as lit-up streets, not just a backdrop
  // of boxes. Especially fitting for SERPENTINA's evening setting.
  function dLamp(x,y){
    bx.save(); bx.translate(x,y);
    bx.fillStyle='rgba(250,204,21,.16)'; bx.beginPath(); bx.arc(0,-15,11,0,Math.PI*2); bx.fill();
    bx.fillStyle='#1b1f29'; bx.fillRect(-1.3,-15,2.6,15);
    bx.fillStyle='#facc15'; bx.beginPath(); bx.arc(0,-15,2.3,0,Math.PI*2); bx.fill();
    bx.restore();
  }
  // jagged cliff-face silhouette — hugs the outer edge of a sharp mountain/
  // volcano corner, suggesting the road is genuinely cut into the rock.
  function dCliff(x,y,ang,w){
    bx.save(); bx.translate(x,y); bx.rotate(ang);
    const pts=[]; const steps=6;
    for(let k=0;k<=steps;k++) pts.push([-w/2+k*(w/steps), -14-rnd()*20]);
    bx.fillStyle='#4a4038';
    bx.beginPath(); bx.moveTo(-w/2,0);
    pts.forEach(p=>bx.lineTo(p[0],p[1]));
    bx.lineTo(w/2,0); bx.closePath(); bx.fill();
    // lit highlight edge along the ridge line so it reads as rock, not a flat smear
    bx.strokeStyle='rgba(180,168,150,.55)'; bx.lineWidth=2; bx.lineJoin='round';
    bx.beginPath(); bx.moveTo(pts[0][0],pts[0][1]);
    pts.forEach(p=>bx.lineTo(p[0],p[1])); bx.stroke();
    bx.strokeStyle='rgba(0,0,0,.4)'; bx.lineWidth=1; bx.stroke();
    bx.restore();
  }
  // spray-paint tag: a bold ellipse blob plus a couple of drip lines, drawn
  // straight onto the tarmac at a random lateral offset within the track
  // width — graffiti on the racing surface itself, not off-track scenery.
  function dGraffiti(x,y,ang,scale){
    bx.save(); bx.translate(x,y); bx.rotate(ang);
    const palette=['#f472b6','#facc15','#34d399','#38bdf8','#fb923c','#a78bfa'];
    const c1=palette[Math.floor(rnd()*palette.length)];
    const c2=palette[Math.floor(rnd()*palette.length)];
    bx.globalAlpha=0.5;
    bx.fillStyle=c1;
    bx.beginPath(); bx.ellipse(0,0,10*scale,5*scale,0,0,Math.PI*2); bx.fill();
    bx.strokeStyle=c2; bx.lineWidth=1.6; bx.stroke();
    bx.strokeStyle=c2; bx.lineWidth=1.2;
    for(let k=0;k<3;k++){
      bx.beginPath();
      const ox2=(k-1)*6*scale;
      bx.moveTo(ox2,-4*scale); bx.lineTo(ox2+(rnd()-.5)*3,6*scale+rnd()*4*scale);
      bx.stroke();
    }
    bx.globalAlpha=1;
    bx.restore();
  }
  function scatterGraffiti(count){
    for(let i=0;i<count;i++){
      const idx=Math.floor(rnd()*PN);
      const [px,py]=PATH[idx], h=heading[idx];
      const latMax=cfg.TW-10; if(latMax<4) continue;
      const side=rnd()<0.5?-1:1;
      const lat=side*(4+rnd()*(latMax-4));
      const nx=-Math.sin(h), ny=Math.cos(h);
      dGraffiti(px+nx*lat+ox, py+ny*lat+oy, h+Math.PI/2, 0.8+rnd()*0.6);
    }
  }
  // ── vegetasjon og terreng, nå i KLYNGER ──────────────────────────────────
  // Antallene er opp fra før (f.eks. 120 → 190 trær i skog), men de dekker
  // mindre areal, fordi støyterskelen samler dem i holt. Netto blir det
  // tettere der det er skog og helt åpent der det ikke er — som er hele
  // poenget. Steiner og busker får en LAVERE terskel enn trærne på samme bane,
  // så de ligger som en spredt underskog rundt og mellom holtene i stedet for
  // å stå i nøyaktig de samme klyngene.
  const terrain=TR.terrain;
  const CL=TH.cluster;
  if(terrain==='mountain'){
    scatterTerrain(110,22,(x,y)=>dRock(x,y,0.9+rnd()*0.6,TH.rockTint),CL-0.08);
    scatterTerrain(70,26,(x,y)=>dTree(x,y,0.65+rnd()*0.35,TH.treeTint),CL+0.05);
    placeCliffs(5);
  } else if(terrain==='forest'){
    scatterTerrain(190,20,(x,y)=>dTree(x,y,0.8+rnd()*0.5,TH.treeTint),CL);
    scatterTerrain(34,24,(x,y)=>dRock(x,y,0.8+rnd()*0.4,TH.rockTint),CL-0.10);
  } else if(terrain==='parkland'){
    scatterTerrain(120,24,(x,y)=>dTree(x,y,0.7+rnd()*0.4,TH.treeTint),CL);
  } else if(terrain==='hedge'){
    scatterTerrain(140,22,(x,y)=>dHedge(x,y,0.9+rnd()*0.3),CL);
  } else if(terrain==='arid'){
    scatterTerrain(130,18,(x,y)=>dBush(x,y,0.8+rnd()*0.5,TH.bushTint),CL);
    scatterTerrain(55,22,(x,y)=>dRock(x,y,0.7+rnd()*0.5,TH.rockTint||'#8a7a66'),CL-0.12);
  } else if(terrain==='volcanic'){
    scatterTerrain(140,18,(x,y)=>dLavaRock(x,y,0.8+rnd()*0.6),CL-0.10);
    scatterTerrain(22,40,(x,y)=>dLavaPool(x,y,1.1+rnd()*0.5),CL+0.06);
    placeCliffs(4);
  } else if(terrain==='city'){
    // Byene får bygningene sine fra kvartalsrutenettet (dBuildingGrid) i
    // bakkelaget per bane i steg B og C. Det som blir igjen her er de spredte
    // enkeltbyggene i utkanten, busker i gatebildet og gatelysene.
    scatterTerrain(46,30,(x,y)=>dBuilding(x,y,1+rnd()*0.6,cityColour()),CL);
    scatterTerrain(70,14,(x,y)=>dBush(x,y,0.5+rnd()*0.3),CL-0.14);
    scatterAlongTrack(15,cfg.TW+GRAVEL_SAFE-6,(x,y)=>dLamp(x,y),true);
  }
  // grandstands + crowd flank the start/finish straight on every track — a
  // real circuit always has the main stand opposite the pits — plus a
  // handful more at the sharpest, most dramatic corners (found the same way
  // the hairpin curbs are above), alternating sides so the track doesn't
  // look lopsided. This replaces the old Autodromo-only special case: every
  // circuit now gets genuine spectator presence, not just the "temple of
  // speed" track.
  // standRects/flagPoles/marshalPosts/floodlights are all stored in WORLD
  // space (no +ox/+oy — that offset only applies when baking pixels into the
  // bg canvas) because, unlike the grandstands/trees/etc. above, these are
  // drawn LIVE every frame in drawTrackScene() straight into the same world-
  // space transform cars and the race line already use. That's what lets
  // them animate (flags flutter, floodlights glow, crowds flash) instead of
  // being frozen into the one-time prerendered background.
  const standRects=[], flagPoles=[], marshalPosts=[];
  {
    const standOffs=cfg.TW+GRAVEL_SAFE+40;
    [1,-1].forEach(side=>{
      // no allowFlip here — these are explicitly placed on both sides of the
      // pit straight, so flipping one would stack two stands on one side.
      const r=clearFootprint(sfx,sfy,sfAng,side,60,standOffs,cfg.TW+GRAVEL_SAFE+14);
      dGrandstand(r.cx+ox,r.cy+oy, sfAng, r.halfLen*2, 26);
      standRects.push({x:r.cx,y:r.cy,ang:sfAng,w:r.halfLen*2,h:26});
      // checkered flag pole at the outer end of each start/finish stand
      const tx=Math.cos(sfAng), ty=Math.sin(sfAng);
      flagPoles.push({x:r.cx+tx*(r.halfLen+6),y:r.cy+ty*(r.halfLen+6),checkered:true});
    });
    const curvSamples=[]; const cstep=5;
    for(let i=0;i<PN;i+=cstep) curvSamples.push({i,c:Math.abs(smoothCurv[i])});
    curvSamples.sort((a,b)=>b.c-a.c);
    const standSpots=[];
    for(const s of curvSamples){
      if(standSpots.length>=(cfg.standCount||3)) break;
      if(s.c<0.01) break;
      if(Math.abs(s.i-0)<PN*0.1) continue; // keep clear of the start/finish stands above
      if(standSpots.some(p=>Math.abs(p.i-s.i)<PN*0.12)) continue;
      standSpots.push(s);
    }
    standSpots.forEach((s,idx)=>{
      const h=heading[s.i], [px,py]=PATH[s.i];
      const side=idx%2===0?1:-1;
      const w=85+rnd()*35;
      const baseOffs=cfg.TW+GRAVEL_SAFE+36;
      // these sit at the sharpest curvature points on the whole track BY
      // DESIGN (most dramatic corner to watch from) — exactly where a plain
      // single-point normal offset is most likely to misjudge clearance, so
      // this is the main place clearFootprint earns its keep.
      const r=clearFootprint(px,py,h,side,w/2,baseOffs,cfg.TW+GRAVEL_SAFE+14,{allowFlip:true});
      dGrandstand(r.cx+ox,r.cy+oy, h, r.halfLen*2, 22);
      standRects.push({x:r.cx,y:r.cy,ang:h,w:r.halfLen*2,h:22});
      // team-neutral pennant at each corner stand's near end
      const tx=Math.cos(h), ty=Math.sin(h);
      flagPoles.push({x:r.cx-tx*(r.halfLen+5)*(idx%2===0?1:-1),y:r.cy-ty*(r.halfLen+5)*(idx%2===0?1:-1),checkered:false});
    });
  }
  // marshal posts: yellow-flag waypoints dropped at the highest-severity
  // corners on the lap (same severity metric runoff areas/AI hairpin caution
  // use) — real circuits post marshals exactly where incidents are most
  // likely, so this reuses data already computed above instead of guessing.
  {
    const sevSamples=[]; const sstep=5;
    for(let i=0;i<PN;i+=sstep) sevSamples.push({i,v:severity[i]});
    sevSamples.sort((a,b)=>b.v-a.v);
    const chosen=[];
    for(const s of sevSamples){
      if(chosen.length>=5) break;
      if(s.v<0.045) break;
      if(chosen.some(p=>Math.abs(p.i-s.i)<PN*0.08)) continue;
      chosen.push(s);
    }
    chosen.forEach(s=>{
      const h=heading[s.i], [px,py]=PATH[s.i];
      const side=rnd()<0.5?1:-1;
      const offs=(cfg.walls&&wallOffsArr?wallOffsArr[s.i]:cfg.TW+GRAVEL_SAFE+14)+9;
      const nx=-Math.sin(h), ny=Math.cos(h);
      marshalPosts.push({x:px+nx*offs*side,y:py+ny*offs*side});
    });
  }
  // floodlight pylons, spaced evenly around the whole lap, alternating
  // sides — only drawn/lit when a NATT (night) race is selected, see
  // drawTrackScene. Computed once here rather than every frame.
  const floodlights=[];
  {
    const fstep=Math.max(6,Math.floor(PN/26));
    for(let i=0,k=0;i<PN;i+=fstep,k++){
      const h=heading[i], [px,py]=PATH[i];
      const nx=-Math.sin(h), ny=Math.cos(h);
      const side=k%2===0?1:-1;
      const offs=(cfg.walls&&wallOffsArr?wallOffsArr[i]:cfg.TW+GRAVEL_SAFE+30)+14;
      floodlights.push({x:px+nx*offs*side,y:py+ny*offs*side});
    }
  }

  // Ytterkanten tones ut mot gjennomsiktig, slik at bakkeflisen under slipper
  // gjennom gradvis i stedet for at bildet slutter i en rett strek. 80 px er
  // valgt fordi det er bredt nok til at øyet ikke finner en grense, og smalt
  // nok til at det ikke spiser av marginen banen faktisk bruker: `pad` er
  // 184–280 px, så selv etter fjæra står det 100+ px helt dekket bakgrunn
  // utenfor banens omriss. Dette må stå HELT til slutt — alt som tegnes
  // etterpå ville lagt seg oppå den uttonede kanten igjen.
  {
    const FJAER=BG_FJAER;
    bx.save();
    bx.globalCompositeOperation='destination-out';
    const kant=(x0,y0,x1,y1,rx,ry,rw,rh)=>{
      const g=bx.createLinearGradient(x0,y0,x1,y1);
      g.addColorStop(0,'rgba(0,0,0,1)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      bx.fillStyle=g; bx.fillRect(rx,ry,rw,rh);
    };
    kant(0,0,FJAER,0,        0,0,FJAER,bh);
    kant(bw,0,bw-FJAER,0,    bw-FJAER,0,FJAER,bh);
    kant(0,0,0,FJAER,        0,0,bw,FJAER);
    kant(0,bh,0,bh-FJAER,    0,bh-FJAER,bw,FJAER);
    bx.restore();
  }

  // Alt er bakt/plassert — legg det på banen. standRects/flagPoles/
  // marshalPosts/floodlights settes sammen med bg, så det levende laget i
  // drawTrackScene alltid finnes så snart bg finnes (de kommer fra samme
  // clearFootprint-plassering som tribunene som er tegnet inn i bakgrunnen).
  TR.bg=bg;
  TR.groundTile=buildGroundTile(TH,cfg.name,bw,bh);
  TR.groundPat=null;
  TR.standRects=standRects; TR.flagPoles=flagPoles;
  TR.marshalPosts=marshalPosts; TR.floodlights=floodlights;
  TR.nightLights=nightLights;
}

// Bare én bakgrunn skal ligge i minnet om gangen: de største er over 20M
// piksler (~80 MB hver), så å beholde forrige bane når spilleren bytter ville
// bygget opp minnebruken bane for bane gjennom en spilleøkt.
let bgTrack=null;
function ensureTrackBg(t){
  if(bgTrack && bgTrack!==t){
    // nullstiller størrelsen før referansen slippes: det er dette som faktisk
    // frigjør pikselbufferet i WebKit med en gang, i stedet for å vente på at
    // GC rydder canvas-objektet en gang senere.
    if(bgTrack.bg){ bgTrack.bg.width=0; bgTrack.bg.height=0; }
    bgTrack.bg=null;
    bgTrack=null;
  }
  buildTrackBg(t);
  bgTrack=t;
}

// ══════════════════════════════════════════════════════════════════
// BANETEMA
// ══════════════════════════════════════════════════════════════════
// Før runde 4 var alle 13 banene bygget av NØYAKTIG de samme byggeklossene:
// samme asfalt (#33333e), samme grus (#7a6c54), samme rød-hvite kerb, og trær,
// steiner og busker strødd jevnt og tilfeldig utover. Det eneste som skilte dem
// var bakkefargen og fargen på trærne. To baner med samme terrain-type var
// praktisk talt umulige å skille på et skjermbilde uten å lese navnet.
//
// Temaet samler derfor ALT som bestemmer hvordan en bane ser ut, på ett sted:
//
//   ground    2–3 bakketoner. Tegnes som store myke flekker styrt av
//             verdistøyen (se makeNoise), ikke som jevnt spredte prikker.
//   speckle   den finkornede teksturen oppå. Samme nøkler som før, men med
//             langt færre prikker nå som flekkene gjør grovarbeidet.
//   asphalt   banedekkets egen tone. MÅLT: lysheten holder seg innenfor ±8 %
//             av det gamle felles #33333e (L=0,2216), slik at
//             lakkeringskontrasten fra runde 2 fortsatt holder på hver bane.
//             Verifiseres av test_banetema.js — ikke øyemål.
//   runoff    utkjøringssonen. 'grus' med egen farge, eller 'asfalt' (mørk
//             blågrå med malte striper). BARE FARGE: bredden og fysikken er
//             uendret, se GRAVEL_SAFE og gruskanten i buildTrackBg.
//   curb      de to kerbfargene. Mønsteret er det samme som før.
//   cluster   terskelen i støyen for hvor vegetasjon får stå. Lav = tett
//             skog overalt, høy = spredte lunder med åpne sletter mellom.
//   mow       klippestriper i plenen (bare TEMPIO).
//   ads       om banen har reklameskilt langs rettene (alle unntatt de helt
//             landlige).
//   groundLayer store landskapsflater UNDER vegetasjonen: elva, havet,
//             saltsletta, isen. Bygges av `belte()`, som følger banen — en
//             flate lagt midt i indre felt er det ENE stedet spilleren aldri
//             kommer nær nok til å se.
//   landmark  det ene bygget som gjør banen gjenkjennelig. Tegnes etter
//             asfalten, men før vegetasjonen og tribunene.
//   landmarkT rundeposisjonen landemerket står ved. Brukes to steder: av
//             `plasser()` når bygget settes ut, og av skjermbildetesten til å
//             sette kameraet der det faktisk er noe å se.
//   lagPal    landemerkets toner som DATA og ikke som hex inne i tegnekoden,
//             slik at test_banetema.js kan måle dem mot bakken.
//   lagMot    unntakene i den målingen: en tone som står mot en annen tone i
//             samme bygg (tak på vegg) og ikke mot bakken. Må finnes som data,
//             ellers er «måles mot noe annet» ikke til å skille fra «glemt».
//
// treeTint/rockTint/bushTint/cityPal lå løst på cfg før og er flyttet inn hit,
// slik at det ikke finnes to steder å lete etter «hvilken farge har denne banen».
// Asfalten alle banene hadde felles før runde 4, og som de nye tonene måles
// mot. Står her og ikke nede ved kontrastsjekken fordi makeTheme leser den, og

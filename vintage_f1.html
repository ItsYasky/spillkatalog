<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>GRAND PRIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0a06;display:flex;align-items:center;justify-content:center;height:100vh;}
</style>
</head>
<body>
<canvas id="g" width="480" height="620"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=480,H=620,HY=40;
const VMID=HY+90;                       // horizon row (math reference row)
const SEG_LEN=200;                      // world length of one road segment
const ROAD_W=420;                       // half-width of road, world units
const CAMERA_HEIGHT=480;
const FOV=100;
const CAMERA_DEPTH=1/Math.tan((FOV/2)*Math.PI/180);
const DRAW_DIST=150;                    // segments drawn per frame
const RUMBLE_LEN=3;

// ── Build the circuit: a lap made of straights + corners ──────────
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(a,b,t){return a+(b-a)*((1-Math.cos(t*Math.PI))/2);}
const segments=[];
function addSeg(curve){segments.push({index:segments.length,curve});}
function addRoad(enter,hold,leave,curve){
  for(let i=0;i<enter;i++) addSeg(easeInOut(0,curve,i/enter));
  for(let i=0;i<hold;i++) addSeg(curve);
  for(let i=0;i<leave;i++) addSeg(easeInOut(curve,0,i/leave));
}
addRoad(0,60,0,0);        // start/finish straight
addRoad(40,40,40,2.4);    // long sweeping right
addRoad(0,30,0,0);
addRoad(30,20,30,-3.8);   // tight left hairpin
addRoad(0,20,0,0);
addRoad(50,70,50,1.3);    // long fast right sweeper
addRoad(0,25,0,0);
addRoad(25,15,25,-2.6);   // left kink
addRoad(0,15,0,0);
addRoad(30,25,30,3.4);    // sharp right
addRoad(0,50,0,0);        // back straight
addRoad(30,20,30,-2.1);
addRoad(0,20,0,0);
const N=segments.length;
const TRACK_LEN=N*SEG_LEN;

function segAt(z){
  let i=Math.floor(z/SEG_LEN)%N;
  if(i<0)i+=N;
  return segments[i];
}

// ── Traffic field (the pack you must overtake) ─────────────────────
const LIVERIES=[
  {clr:'#a6192e',helmet:'#141210'},{clr:'#c0c0c0',helmet:'#0f5c33'},
  {clr:'#1e4a8c',helmet:'#e8e0c8'},{clr:'#e8a33d',helmet:'#141210'},
  {clr:'#6b4423',helmet:'#e8e0c8'},{clr:'#4a7c59',helmet:'#141210'},
  {clr:'#8a2be2',helmet:'#e8e0c8'},{clr:'#d4af37',helmet:'#141210'},
];
const TRAFFIC_COUNT=26;
let traffic=[];
function buildTraffic(){
  traffic=[];
  for(let i=0;i<TRAFFIC_COUNT;i++){
    const liv=LIVERIES[i%LIVERIES.length];
    traffic.push({
      z:700+((i+1)/(TRAFFIC_COUNT+1))*(TRACK_LEN-1000),
      x:[-0.55,0,0.55][i%3]+(Math.random()-0.5)*0.2,
      speed:14+Math.random()*8,
      clr:liv.clr,helmet:liv.helmet,
      swayPhase:Math.random()*Math.PI*2,
    });
  }
}

// ── Player ───────────────────────────────────────────────────────
const MAX_SPEED=62;             // world units per frame at top speed
const ACCEL=0.9,BRAKE=2.4,OFFROAD_DRAG=0.94,ENGINE_DRAG=0.985;
const STEER_RATE=0.026,CENTRIFUGAL=0.0021;
const LAPS=3;
let player,raceTime,score,overtakenCount,checkpointIdx,timeLeft,toastTimer,toastText,toastColor,state,cntTimer,keys={};
let particles=[],shake=0,confetti=[],toastPop=0;
const CHECKS_PER_LAP=4;
const CHECK_DIST=TRACK_LEN/CHECKS_PER_LAP;

function addShake(n){ shake=Math.min(16,shake+n); }
function spawnDust(x,y,n,clr){
  for(let i=0;i<n;i++){
    const a=Math.PI/2+(Math.random()-.5)*1.4, s=Math.random()*1.8+.4;
    particles.push({x,y,vx:Math.cos(a)*s*.5,vy:Math.sin(a)*s*.6+.4,life:1,d:.03+Math.random()*.03,r:Math.random()*2.4+1,clr});
  }
}
function spawnSparks(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.02+Math.random()*.03,r:Math.random()*2.2+.6,clr:Math.random()<.5?'#f97316':'#fde68a'});
  }
}
function spawnConfettiF1(){
  const clrs=['#c9a227','#e8e0c8','#4ade80','#38bdf8','#ef4444'];
  for(let i=0;i<70;i++){
    confetti.push({x:Math.random()*W,y:-10-Math.random()*H*.5,vx:(Math.random()-.5)*1.8,vy:1.4+Math.random()*2.2,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,clr:clrs[Math.floor(Math.random()*clrs.length)],w:4+Math.random()*3});
  }
}

function resetRace(){
  player={z:0,x:0,speed:0,crashTimer:0,lean:0};
  buildTraffic();
  raceTime=0;score=0;overtakenCount=0;checkpointIdx=0;timeLeft=48;
  toastTimer=0;toastText='';toastColor='#c9a227';toastPop=0;
  particles=[];shake=0;confetti=[];
  cntTimer=150;
}
function startRace(){resetRace();state='countdown';}
resetRace();
state='menu';

// ── Input ────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(e.key==='Enter'&&(state==='menu'||state==='over'||state==='win')){startRace();}
  if(e.key===' ')e.preventDefault();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// ── Update ───────────────────────────────────────────────────────
function update(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.96;p.life-=p.d;return p.life>0;});
  confetti=confetti.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.vy+=.02;return f.y<H+20;});
  if(shake>0){shake*=.84;if(shake<.08)shake=0;}
  if(toastPop>0)toastPop=Math.max(0,toastPop-.08);

  if(state==='countdown'){cntTimer--;if(cntTimer<=0)state='playing';return;}
  if(state!=='playing')return;
  raceTime++;

  const gas=!!(keys['ArrowUp']||keys['w']||keys['W']);
  const brake=!!(keys['ArrowDown']||keys['s']||keys['S']);
  const left=!!(keys['ArrowLeft']||keys['a']||keys['A']);
  const right=!!(keys['ArrowRight']||keys['d']||keys['D']);

  if(player.crashTimer>0){
    player.crashTimer--;
    player.speed*=0.96;
  } else {
    if(gas) player.speed=Math.min(MAX_SPEED,player.speed+ACCEL);
    else player.speed*=ENGINE_DRAG;
    if(brake) player.speed=Math.max(0,player.speed-BRAKE);
  }
  player.speed=Math.max(0,player.speed);

  const speedPct=player.speed/MAX_SPEED;
  let steerInput=0;
  if(player.crashTimer<=0){
    if(left){player.x-=STEER_RATE;steerInput=-1;}
    if(right){player.x+=STEER_RATE;steerInput=1;}
  }
  player.lean+=(steerInput-player.lean)*0.2;

  const curve=segAt(player.z).curve;
  player.x+=curve*speedPct*speedPct*CENTRIFUGAL;

  if(Math.abs(player.x)>1){
    player.speed*=OFFROAD_DRAG;
    player.x=Math.max(-1.7,Math.min(1.7,player.x));
  }

  player.z+=player.speed;

  // traffic advance + collisions
  for(const c of traffic){
    c.z+=c.speed;
    c.x+=Math.sin((raceTime*0.02)+c.swayPhase)*0.0025;
    const relZ=c.z-player.z;
    if(player.crashTimer<=0&&relZ>-140&&relZ<140&&Math.abs(c.x-player.x)<0.34){
      player.speed*=0.18;
      player.crashTimer=42;
      toastTimer=45;toastText='KRASJ!';toastColor='#ef4444';toastPop=1;
      addShake(13);
      spawnSparks(W/2+player.lean*14,H-78,24);
    }
  }

  // Tire dust behind the player — more/darker when off-road, light haze at speed
  const offroad=Math.abs(player.x)>1;
  if(player.speed>8&&Math.random()<.8){
    spawnDust(W/2+player.lean*14-10,H-60,offroad?3:1,offroad?'#6b5a3a':'rgba(220,210,190,.35)');
    spawnDust(W/2+player.lean*14+10,H-60,offroad?3:1,offroad?'#6b5a3a':'rgba(220,210,190,.35)');
  }

  // overtake scoring (based on how many traffic cars are now behind player)
  const newCount=traffic.filter(c=>player.z>c.z).length;
  if(newCount>overtakenCount){
    const gained=newCount-overtakenCount;
    score+=gained*100;
    if(toastTimer<=0||toastColor==='#c9a227'){
      toastTimer=40;toastText=gained>1?`${gained}x FORBIKJØRING!`:'FORBIKJØRING!';toastColor='#4ade80';
    }
  }
  overtakenCount=newCount;

  // checkpoints extend the clock
  const nextCheckZ=(checkpointIdx+1)*CHECK_DIST;
  if(player.z>=nextCheckZ){
    checkpointIdx++;
    timeLeft+=16;
    toastTimer=45;toastText='SJEKKPUNKT +16s';toastColor='#38bdf8';
  }

  timeLeft-=1/60;
  if(timeLeft<=0){timeLeft=0;state='over';}

  if(player.z>=TRACK_LEN*LAPS){
    score+=Math.round(timeLeft*20);
    state='win';
    spawnConfettiF1();
  }

  if(toastTimer>0)toastTimer--;
}

// ── Rendering helpers ───────────────────────────────────────────
function poly(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();
}
function projectAt(worldZRel,camX){
  const z=Math.max(worldZRel,1);
  const scale=CAMERA_DEPTH/z;
  return{
    x:W/2+scale*(-camX)*(W/2),
    y:VMID+scale*CAMERA_HEIGHT*(W/2),
    w:scale*ROAD_W*(W/2),
    scale
  };
}

function render(){
  ctx.clearRect(0,0,W,H);
  const shx=shake?(Math.random()-.5)*shake:0, shy=shake?(Math.random()-.5)*shake*.6:0;
  ctx.save(); ctx.translate(shx,shy);
  // sky
  ctx.fillStyle='#2a2013';ctx.fillRect(0,HY,W,VMID-HY);
  ctx.fillStyle='rgba(201,162,39,0.10)';
  for(let i=0;i<5;i++){
    const hx=(i*140-((player.z*0.02)%140));
    ctx.beginPath();ctx.moveTo(hx,VMID);ctx.lineTo(hx+70,VMID-38);ctx.lineTo(hx+140,VMID);ctx.closePath();ctx.fill();
  }

  const baseIndex=Math.floor(player.z/SEG_LEN);
  const basePercent=(player.z-baseIndex*SEG_LEN)/SEG_LEN;
  const baseCurve=segAt(player.z).curve;

  let x=0,dx=-(baseCurve*basePercent);
  const proj=[];
  for(let n=0;n<DRAW_DIST;n++){
    const segIndex=(baseIndex+n)%N;
    const seg=segments[segIndex];
    const zNear=(n-basePercent)*SEG_LEN;
    const zFar=(n+1-basePercent)*SEG_LEN;
    const camXbase=player.x*ROAD_W;
    const p1=projectAt(zNear,camXbase-x);
    x+=dx;
    dx+=seg.curve;
    const p2=projectAt(zFar,camXbase-x);
    proj.push({segIndex,curve:seg.curve,p1,p2,zNear,zFar});
  }

  // draw road back-to-front, and sprites belonging to each band
  for(let n=DRAW_DIST-2;n>=0;n--){
    const band=proj[n];
    const grp=Math.floor(band.segIndex/RUMBLE_LEN)%2;
    const grass=grp?'#3a3418':'#2e2a14';
    const road=grp?'#7d6b4a':'#786646';
    const rumble=grp?'#a6192e':'#e8e0c8';
    const p1=band.p1,p2=band.p2;
    if(p1.y<=p2.y)continue; // degenerate/behind-camera slice
    ctx.fillStyle=grass;ctx.fillRect(0,p2.y,W,Math.max(1,p1.y-p2.y+1));
    poly(p1.x-p1.w*1.14,p1.y,p1.x+p1.w*1.14,p1.y,p2.x+p2.w*1.14,p2.y,p2.x-p2.w*1.14,p2.y,rumble);
    poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y,road);
    if(grp===0){
      poly(p1.x-p1.w*0.045,p1.y,p1.x+p1.w*0.045,p1.y,p2.x+p2.w*0.045,p2.y,p2.x-p2.w*0.045,p2.y,'#eee8d5');
    }

    // sprites: traffic cars whose z falls in this band
    for(const c of traffic){
      const relZ=c.z-player.z;
      if(relZ>=band.zNear&&relZ<band.zFar){
        const t=(relZ-band.zNear)/Math.max(1,band.zFar-band.zNear);
        const sx=lerp(p1.x,p2.x,t)+lerp(p1.w,p2.w,t)*c.x;
        const sy=lerp(p1.y,p2.y,t);
        const sw=lerp(p1.w,p2.w,t);
        drawTrafficCar(sx,sy,sw,c);
      }
    }
  }

  // Tire dust / spark particles (screen-space, drawn behind the car sprite)
  particles.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.clr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  drawPlayerCar();

  // Speed-lines at high velocity for a sense of speed
  if(state==='playing'){
    const sp=player.speed/MAX_SPEED;
    if(sp>0.55){
      const amt=Math.min(1,(sp-0.55)/0.45);
      ctx.save(); ctx.globalAlpha=amt*.4; ctx.strokeStyle='#e8e0c8'; ctx.lineWidth=1.1;
      const cx=W/2, cy=VMID;
      for(let i=0;i<12;i++){
        const a=(i/12)*Math.PI*2+raceTime*.015;
        const r1=Math.max(W,H)*.5, r2=r1+16+amt*26;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.6);
        ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.6);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  drawHud();

  if(state==='countdown')drawCountdown();
  if(toastTimer>0)drawToast();
  if(state==='menu')drawMenu();
  if(state==='over')drawEnd(false);
  if(state==='win')drawEnd(true);

  ctx.restore();
}

function drawTrafficCar(sx,sy,sw,c){
  const s=Math.max(0.12,Math.min(2.4,sw/60));
  ctx.save();ctx.translate(sx,sy);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-10,5,20,7);
  ctx.fillStyle='#141210';
  ctx.fillRect(-9,-8,4,6);ctx.fillRect(5,-8,4,6);ctx.fillRect(-9,2,4,6);ctx.fillRect(5,2,4,6);
  ctx.fillStyle=c.clr;
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,-2);ctx.lineTo(9,7);ctx.lineTo(-9,7);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();
  ctx.fillStyle=c.helmet;ctx.beginPath();ctx.arc(0,-1,2.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawPlayerCar(){
  const sx=W/2+player.lean*14;
  const sy=H-78;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(player.lean*0.12);
  if(player.crashTimer>0)ctx.rotate(Math.sin(player.crashTimer*0.9)*0.5);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-24,20,48,16);
  ctx.fillStyle='#141210';
  ctx.fillRect(-22,-16,10,16);ctx.fillRect(12,-16,10,16);ctx.fillRect(-22,8,10,16);ctx.fillRect(12,8,10,16);
  ctx.fillStyle='#0f5c33';
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(20,-4);ctx.lineTo(20,20);ctx.lineTo(-20,20);ctx.lineTo(-20,-4);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(-7,-6,14,12);
  ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(0,-1,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(-13,2,5.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#141210';ctx.font='bold 7px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('5',-13,2.3);
  ctx.restore();
}

function drawHud(){
  ctx.fillStyle='rgba(20,15,8,.92)';ctx.fillRect(0,0,W,HY);
  ctx.textBaseline='middle';
  const spd=Math.round(player.speed/MAX_SPEED*340);
  ctx.fillStyle='#e8e0c8';ctx.font='bold 13px Courier New';ctx.textAlign='left';ctx.fillText(`${spd} km/t`,8,HY/2);
  ctx.fillStyle='#c9a227';ctx.font='bold 11px Courier New';ctx.textAlign='center';
  const lap=Math.min(Math.floor(player.z/TRACK_LEN)+1,LAPS);
  ctx.fillText(`RUNDE ${lap}/${LAPS}  ·  #${overtakenCount}/${TRAFFIC_COUNT} FORBIKJØRT`,W/2,HY/2-7);
  ctx.fillStyle='#8a7a5c';ctx.font='9px Courier New';
  ctx.fillText(`POENG ${score}`,W/2,HY/2+8);
  ctx.fillStyle=timeLeft<10?'#ef4444':'#4ade80';ctx.font='bold 13px Courier New';ctx.textAlign='right';
  ctx.fillText(`⏱ ${timeLeft.toFixed(1)}s`,W-8,HY/2);
}

function drawToast(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  const a=Math.min(1,toastTimer/12);
  const pop=1+toastPop*.6; // bounce-in scale
  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(W/2,HY+56); ctx.scale(pop,pop);
  if(toastColor==='#ef4444'){ ctx.shadowColor='#ef4444'; ctx.shadowBlur=14; }
  ctx.fillStyle=toastColor;ctx.font='bold 20px Courier New';
  ctx.fillText(toastText,0,0);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawCountdown(){
  const sec=Math.ceil(cntTimer/60);
  const a=((cntTimer%60)/60);
  ctx.fillStyle=`rgba(13,10,6,${a*.5})`;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(sec>0){
    ctx.fillStyle=`rgba(232,224,200,${a})`;ctx.font=`bold ${80+a*20}px Courier New`;
    ctx.fillText(sec,W/2,H/2);
  } else {
    ctx.fillStyle='#4ade80';ctx.font='bold 50px Courier New';ctx.fillText('KJØR!',W/2,H/2);
  }
}

function drawMenu(){
  ctx.fillStyle='rgba(13,10,6,.78)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#c9a227';ctx.font='bold 34px Courier New';ctx.fillText('GRAND PRIX',W/2,H/2-96);
  ctx.fillStyle='#c9a227';ctx.font='9px Courier New';ctx.fillText('─── 26-BILS STARTFELT · 1967 ───',W/2,H/2-70);
  ctx.fillStyle='#4a4030';ctx.font='10px Courier New';
  [['↑ / W','Gass'],['↓ / S','Brems'],['← → / A D','Styr'],['SJEKKPUNKT','+tid'],].forEach(([k,v],i)=>{
    ctx.fillStyle='#c9a227';ctx.textAlign='right';ctx.fillText(k,W/2-6,H/2-44+i*18);
    ctx.fillStyle='#4a4030';ctx.textAlign='left';ctx.fillText(v,W/2+6,H/2-44+i*18);
  });
  ctx.fillStyle='#8a7a5c';ctx.font='10px Courier New';ctx.textAlign='center';
  ctx.fillText('Start bakerst i feltet. Kjør forbi flest mulig',W/2,H/2+38);
  ctx.fillText('før klokka går ut — sjekkpunkt gir mer tid.',W/2,H/2+54);
  ctx.fillStyle='#c9a227';ctx.font='bold 13px Courier New';ctx.fillText('ENTER for å starte',W/2,H/2+86);
  ctx.fillStyle='#3a3226';ctx.font='8px Courier New';ctx.fillText('ESC Katalog',W/2,H-16);
}

function drawEnd(won){
  ctx.fillStyle='rgba(13,10,6,.86)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(won){
    const pulse=.75+.25*Math.sin(raceTime*.1);
    ctx.save(); ctx.shadowColor='#4ade80'; ctx.shadowBlur=18*pulse;
    ctx.fillStyle='#4ade80';
    ctx.font='bold 30px Courier New';ctx.fillText('MÅLFLAGG!',W/2,H/2-80);
    ctx.restore();
    // checkered flag strip
    for(let k=0;k<12;k++){
      ctx.fillStyle=k%2?'#141210':'#e8e0c8';
      ctx.fillRect(W/2-96+k*16,H/2-100,16,10);
    }
  } else {
    ctx.fillStyle='#ef4444';
    ctx.font='bold 30px Courier New';ctx.fillText('TIDEN UTE',W/2,H/2-80);
  }
  ctx.fillStyle='#8a7a5c';ctx.font='12px Courier New';
  ctx.fillText(`Forbikjøringer: ${overtakenCount} / ${TRAFFIC_COUNT}`,W/2,H/2-42);
  ctx.fillText(`Poeng: ${score}`,W/2,H/2-20);
  ctx.fillText(`Tid brukt: ${(raceTime/60).toFixed(1)}s`,W/2,H/2+2);
  ctx.fillStyle='#c9a227';ctx.font='bold 12px Courier New';ctx.fillText('ENTER — Kjør igjen',W/2,H/2+40);
  ctx.fillStyle='#3a3226';ctx.font='8px Courier New';ctx.fillText('ESC Katalog',W/2,H/2+60);

  if(won){
    confetti.forEach(f=>{
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
      ctx.fillStyle=f.clr; ctx.fillRect(-f.w/2,-f.w*.6,f.w,f.w*1.2);
      ctx.restore();
    });
  }
}

function loop(){update();render();requestAnimationFrame(loop);}
loop();
</script>
</body>

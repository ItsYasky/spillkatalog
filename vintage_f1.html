// `const` er i TDZ til deklarasjonen er kjørt — TRACKS bygges lenger ned, men
// THEMES/makeTheme er i bruk før kontrastseksjonen i det hele tatt er nådd.
const ASPHALT_BASE='#33333e';
const CURB_RW=['#d63a2e','#f1f5f9'];   // rød/hvit — standarden, som før
const THEMES={
  // Alpint fjellpass: kald granitt hele veien, og grusen er knust stein, ikke sand.
  'MONTE SPIRA':{ ground:['#232a2b','#2f3a36','#3c4441'], speckle:'grass', asphalt:'#32363b',
    runoff:{type:'grus',clr:'#6e7076'}, curb:CURB_RW, cluster:0.50, ads:true,
    treeTint:['#1d3b2e','#27503c','#152b22'], rockTint:'#7e858c',
    landmarkT:0.30,
    // Breelva er smeltevann og dermed LYSERE enn fjellet rundt, ikke mørk som
    // en skogstjern. Det er ikke pynt at den gikk den veien: granitten her er
    // mørk (#232a2b–#3c4441), og et mørkt vann ville ikke kommet over 3:1 mot
    // den i det hele tatt. Den fysisk riktige fargen var også den målbare.
    lagPal:{ vann:'#6f9aa8', vannKant:'#9ab4bd', stein:'#9a9fa6' },
    groundLayer(s){
      const P=s.TH.lagPal, R=Math.min(s.bw,s.bh)*0.012;

      // videre som en smal bekk gjennom et lengre parti. Samme byggekloss,
      // bare én rad — derfor følger sperresonene for vegetasjon bekken av seg
      // selv, uten en egen bekkesperre som kan komme i utakt.
      const u=s.utside(), ut=s.TW+s.GRAVEL_SAFE+36;
      s.vann(s.belte(0.60,0.76,u,ut,R,7,300),{flate:P.vann,kant:P.vannKant});
      s.vann(s.belte(0.76,0.96,u,ut,R*0.8,1,380),{flate:P.vann,kant:P.vannKant});
    },
    // Gammel jernbaneviadukt i stein, på rekke bak banen. Buerekken er den
    // tingen som sier «fjellpass» på et skjermbilde uten at navnet leses.
    landmark(s){
      const P=s.TH.lagPal, bx=s.bx;
      const p=s.plasser(s.TH.landmarkT,1,190,s.TW+s.GRAVEL_SAFE+95);
      const L=p.halvLengde*2, H=64, n=5, w=L/n;
      bx.save(); bx.translate(p.x,p.y);
      // Samme grep som dCliff: snu tegningen etter hvilken side den endte på,
      // så byggverket alltid vokser BORT fra banen og ikke inn over asfalten.
      bx.rotate(p.ang+(p.side>0?Math.PI:0));

      // bakgrunnen er alt malt under her, og en utskjæring (destination-out)

      bx.strokeStyle=P.stein; bx.lineWidth=8;
      for(let k=0;k<n;k++){
        bx.beginPath(); bx.arc(-L/2+k*w+w/2,-H+20,w/2-7,Math.PI,Math.PI*2); bx.stroke();
      }
      // Skyggen under dekket er fast lav opasitet og ikke en målt tone — den
      // ligger oppå steinen og bærer ingen informasjon, se lagPal-kommentaren.
      bx.fillStyle='rgba(0,0,0,.22)'; bx.fillRect(-L/2,-H+14,L,4);
      bx.restore();
      s.sperr(p.x,p.y,L*0.55);
    } },
  // Våt skog i en dal. Bakken er nesten svart-grønn, og asfalten har et kaldt
  // stikk — det er «regnbanen» i startfeltet.
  'ARDENNE':{ ground:['#0b1710','#122017','#1b2c1e'], speckle:'grass', asphalt:'#2e373b',
    runoff:{type:'grus',clr:'#6b6354'}, curb:CURB_RW, cluster:0.38, ads:true,
    treeTint:['#0e2e1c','#14472a','#071d12'],
    landmarkT:0.62,
    lagPal:{ vann:'#5e8a8f', vannKant:'#6b8f8a', mur:'#b8b2a2', tak:'#2f343b', vindu:'#facc15' },
    // Skifertaket er det ene unntaket på denne banen: det leses mot kirkeveggen
    // det ligger på, ikke mot skogbunnen. Målt mot bakken (#0b1710) måtte et
    // tak vært LYST for å nå 3:1 — altså motsatt av hva skifer er.
    lagMot:{ tak:'mur' },
    groundLayer(s){
      const P=s.TH.lagPal, R=Math.min(s.bw,s.bh)*0.009;
      // Elva følger dalbunnen langs nesten halve banen — det er LENGDEN som
      // leses som elv. Tre rader, så den har bredde: én rad sirkler blir en
      // grøft.
      s.vann(s.belte(0.20,0.62,s.utside(),s.TW+s.GRAVEL_SAFE+30,R,3,460),
        {flate:P.vann,kant:P.vannKant});
    },
    // Bygdekirke i stein. Det er SILHUETTEN som gjør en kirke gjenkjennelig på
    // et skjermbilde, så klokketårnet er bevisst høyere enn skipet og spisst.
    landmark(s){
      const P=s.TH.lagPal, bx=s.bx;
      const p=s.plasser(s.TH.landmarkT,-1,100,s.TW+s.GRAVEL_SAFE+78);
      const L=p.halvLengde*2, kH=42, tw=26, tH=kH+44;
      bx.save(); bx.translate(p.x,p.y); bx.rotate(p.ang+(p.side>0?Math.PI:0));
      bx.fillStyle=P.mur; bx.fillRect(-L/2,-kH,L,kH);
      bx.fillStyle=P.tak; bx.fillRect(-L/2-5,-kH-11,L+10,13);
      bx.fillStyle=P.mur; bx.fillRect(-L/2,-tH,tw,tH);
      bx.fillStyle=P.tak;
      bx.beginPath(); bx.moveTo(-L/2-5,-tH); bx.lineTo(-L/2+tw/2,-tH-30); bx.lineTo(-L/2+tw+5,-tH);
      bx.closePath(); bx.fill();
      bx.fillStyle=P.vindu;
      const n=4, steg=(L-tw-24)/n;
      for(let k=0;k<n;k++) bx.fillRect(-L/2+tw+12+k*steg,-kH+12,7,14);
      bx.restore();
      // Gløden settes i to punkter langs skipet og ikke ett per vindu: vinduene
      // står 4 px brede og tettere enn gløden er bred, så fire glød oppå
      // hverandre ville bare blitt en lysere flekk til fire ganger prisen.
      // ...men de to punktene må ligge i VINDUSRADA (lokal y −kH+19), ikke på
      // skipets senterlinje, ellers lyser bakken foran kirka og ikke kirka.
      // Radien opp fra 18 til 22 av samme grunn som på ALPEN: en glød blender,
      // og på vinduet den skal komme fra løfter den mindre enn på bar mur.
      // Målt sum lagt lys per glød: 32,2 før, 20,5 på vinduet med 18, 32,4 med 22.
      [-0.25,0.25].forEach(f=>{
        const w=s.lokal(p,L*f,-kH+19);
        s.lys(w.x,w.y,P.vindu,22);

      s.sperr(p.x,p.y,L*0.6);
    } },
  // Ørken: lys sand, og utkjøringen er asfaltert med malte striper slik moderne
  // ørkenbaner har det, ikke grus.
  'DESERTO':{ ground:['#5a4526','#6d5631','#836a40'], speckle:'arid', asphalt:'#403d38',
    runoff:{type:'asfalt',clr:'#2f3942',stripe:'rgba(241,245,249,.30)'}, curb:CURB_RW,
    cluster:0.58, ads:true, bushTint:['#6b7a3f','#7d8a4c','#4f5c2c'], rockTint:'#8a7a66',
    landmarkT:0.18,
    // MÅLT FUNN som styrte hele paletten her: ørkensanden ligger midt i
    // lysintervallet (#5a4526–#836a40), og da finnes det INGEN mørk tone som

    // den mørkeste sanden. Eneste retning som klarer kravet er LYSERE. Derfor
    // er rullebanen lys betong og ikke mørk asfalt, noe som tilfeldigvis også
    // er slik ørkenstriper faktisk ser ut. Se test_banetema.js.
    lagPal:{ salt:'#dcd5c8', saltKant:'#d2cabb', bane:'#cdd3d8', merke:'#2a2e33',
      taarn:'#e1e5e8', lys:'#67e8f9' },
    lagMot:{ merke:'bane' },
    groundLayer(s){
      const P=s.TH.lagPal, R=Math.min(s.bw,s.bh)*0.013;
      // Saltsletta bruker vannbyggeklossen med vilje: en saltslette er også en
      // flate uten vegetasjon, så sperresonene skal oppføre seg likt. Det er

      //
      // Ti rader på utsiden: en saltslette er flat så langt øyet rekker, og en

      s.vann(s.belte(0.26,0.56,s.utside(),s.TW+s.GRAVEL_SAFE+44,R,10,320),

    },
    // Ørkenflystripe med kontrolltårn. Rullebanelysene er det ene stedet

    landmark(s){
      const P=s.TH.lagPal, bx=s.bx;
      const p=s.plasser(s.TH.landmarkT,1,250,s.TW+s.GRAVEL_SAFE+110);

      const tx=Math.cos(p.ang), ty=Math.sin(p.ang);
      bx.save(); bx.translate(p.x,p.y); bx.rotate(p.ang+(p.side>0?Math.PI:0));
      bx.fillStyle=P.bane; bx.fillRect(-L/2,-B/2,L,B);
      // Midtstripe og terskelmerker i mørk maling. Terskelmerkene er det som
      // gjør flaten til en RULLEBANE og ikke bare en lys firkant.
      bx.fillStyle=P.merke;
      for(let x=-L/2+26;x<L/2-26;x+=50) bx.fillRect(x,-2.5,26,5);
      [-L/2+12, L/2-38].forEach(x=>{
        for(let k=0;k<5;k++) bx.fillRect(x,-B/2+6+k*9,26,5);
      });
      // Kontrolltårnet i enden: en smal stolpe med en bredere kabin på toppen.
      bx.fillStyle=P.taarn;
      bx.fillRect(-L/2-24,-B/2-46,14,46);
      bx.fillRect(-L/2-34,-B/2-62,34,17);
      bx.restore();
      // Kantlysene legges langs stripa i VERDENSRETNINGEN, ikke i den roterte
      // tegnetransformen: addLight lagrer punkter som drawTrackScene bruker i
      // sin egen transform, så de må regnes ut her.
      const nx=-Math.sin(p.ang), ny=Math.cos(p.ang);
      bx.fillStyle=P.lys;
      for(let k=-5;k<=5;k++){
        const lx=p.x+tx*(k*L/11), ly=p.y+ty*(k*L/11);
        [1,-1].forEach(side=>{
          const ex=lx+nx*(B/2)*side, ey=ly+ny*(B/2)*side;
          // Flaten males her, gløden legges oppå om natta — begge må til, ellers

          bx.beginPath(); bx.arc(ex,ey,3,0,Math.PI*2); bx.fill();

      s.sperr(p.x,p.y,L*0.55);
    } },
  // Middelhavsby: oker, rosa og krem med teglrøde tak. Bakken er tørr by-jord.
  'LABIRINTO':{ ground:['#43392c','#524636','#605343'], speckle:'dry', asphalt:'#3d3a37',
    runoff:{type:'grus',clr:'#7a6c54'}, curb:CURB_RW, cluster:0.52, ads:true,
    cityPal:['#b08d5a','#c9a37a','#d8b48c','#9c7f5e'], roofPal:'#8c3a2a',
    treeTint:['#2e4a28','#3d5c32','#1f3319'] },
  // Kveldsby: lilla og blått, asfaltert utkjøring, og kerben er blå/hvit i

  'SERPENTINA':{ ground:['#2a2338','#352c46','#403654'], speckle:'dry', asphalt:'#3a333e',
    runoff:{type:'asfalt',clr:'#2b2638',stripe:'rgba(199,210,254,.30)'}, curb:['#2563eb','#f1f5f9'],
    cluster:0.55, ads:true, cityPal:['#3a2d4a','#4a3a5e','#2b2138','#574468'],
    treeTint:['#1f3b2e','#2a4f3c','#15281f'] },
  // Vulkan: svart basalt, askegrå grus, og gul/svart kerb — fareskilt-fargene,
  // som er det ene stedet på banene de hører hjemme.
  'VULCANO':{ ground:['#17141a','#201c22','#2a252b'], speckle:'ash', asphalt:'#373331',
    runoff:{type:'grus',clr:'#5e5a58'}, curb:['#eab308','#1c1917'], cluster:0.60, ads:false,
    rockTint:'#332c29',
    landmarkT:0.72,
    // MÅLT FUNN som snudde lavaen: det er KANTEN som tegnes bredest og ligger
    // ytterst mot bakken, så den må bære målingen — og en mørk basaltskorpe
    // (#c2410c) klarer bare 2,90:1 mot den lyseste bakketonen og stryker. Eneste
    // retning som holder er lysere, altså gult senter og oransje ytterkant. Det
    // er tilfeldigvis også slik lava kjøles utover fra midten, men rekkefølgen
    // ble valgt av målingen og ikke av fysikken.
    lagPal:{ lava:'#fbbf24', lavaKant:'#ea580c', kuppel:'#d6d3d1', mur:'#a8a29e',
      mast:'#e7e5e4', lys:'#fcd34d' },
    groundLayer(s){
      const P=s.TH.lagPal, R=Math.min(s.bw,s.bh)*0.008;
      // MÅLT FEIL I FØRSTE FORSØKET, og den satt i STØRRELSEN, ikke i fargen:
      // tre rader med radius min*0,011 ble et belte på ~155 px, mot en asfalt
      // som her bare er 72 px bred (TW=36, den smaleste banen i katalogen). En
      // «elv» dobbelt så bred som veien leses ikke som en elv — i bildet ble

      //
      // Og den er bygget i TO LAG av samme grunn: ett lag der flaten og kanten
      // har samme tone er uansett en ensfarget flate, uansett hvor smal. Den
      // brede skorpa er oransje (avkjølt lava), og kjernen er en egen, tett rad
      // i gult inni den. Det er KONTRASTEN mellom de to som sier at noe renner
      // — en ensfarget stripe sier bare at noen har malt bakken.
      //
      // `sving` er halvert fra 300 til 150: med 300 var driften bredere enn
      // elva selv, så kjernen falt utenfor skorpa i stedet for å ligge i den.
      const u=s.utside(), ut=s.TW+s.GRAVEL_SAFE+34, bx=s.bx;
      // Skorpa er sirkler, og den RUFSETE kanten `belte` gir er riktig her —

      const skorpe=s.belte(0.10,0.30,u,ut,R,2,150);

      const tSkorpe=s.belte(0.30,0.46,u,ut,R*0.6,2,150);

      s.flate(tSkorpe,{flate:P.lavaKant,kant:P.lavaKant});
      // MÅLT FUNN, og det gjelder enhver smal flate bygget med `belte`:

      // `radius*0,9` sidelengs med ×9-støyleddet, og den støyen har ~48 px
      // bølgelengde mot et PATH-steg på 14–21 px — altså skifter den fortegn

      const kjerne=(t0,t1,avstandUt,halvbredde)=>{

      kPkt.forEach((b,i)=>{ if(i%12===0) s.lys(b.x,b.y,P.lava,26); });
    },
    // Vulkanobservatorium: kuppel i den ene enden, lav bygningskropp, antennemast

    landmark(s){

    groundLayer(s){
      const P=s.TH.lagPal, bx=s.bx, R=Math.min(s.bw,s.bh)*0.013;
      // Isen ligger på utsiden og er AVGRENSET (seks rader, ikke fjorten som
      // havet på DUNA): et fjellvann skal ha en motsatt bredd man ser.
      const blobs=s.belte(0.66,0.88,s.utside(),s.TW+s.GRAVEL_SAFE+40,R,6,220);
      s.vann(blobs,{flate:P.is,kant:P.isKant});
      // Sprekkene i isen er lav opasitet og ikke en målt tone: de ligger oppå
      // isflaten, og det er FLATEN som må være lesbar mot bakken. Måles
      // sprekkene i stedet, kan en is som forsvinner i snøen slippe gjennom på
      // strektegningen sin.
      //
      // De starter inne i en tilfeldig sirkel av isen og er korte nok til å bli
      // der: en sprekk som vandrer ut av isflaten leses som en kvist på snøen.
      bx.save();
      bx.strokeStyle='rgba(70,110,135,.45)'; bx.lineWidth=1.6;
      for(let k=0;k<blobs.length;k+=3){
        const b=blobs[k];
        let x=b.x, y=b.y, ret=s.rnd()*Math.PI*2;
        bx.beginPath(); bx.moveTo(x,y);
        for(let j=0;j<4;j++){
          ret+=(s.rnd()-0.5)*1.2;
          x+=Math.cos(ret)*b.r*0.4; y+=Math.sin(ret)*b.r*0.4;
          bx.lineTo(x,y);
        }
        bx.stroke();
      }
      bx.restore();
    },
    // Alpelandsby: en klynge hytter med spisse tak og lys i vinduene. Det er
    // KLYNGEN som leses som landsby — én hytte er bare et hus.
    landmark(s){
      const P=s.TH.lagPal, bx=s.bx;
      const p=s.plasser(s.TH.landmarkT,-1,160,s.TW+s.GRAVEL_SAFE+85);
      const L=p.halvLengde*2;
      const n=8;
      // Vinduene SAMLES mens de tegnes. Høyden kommer fra `rnd()`, så gløden
      // kan ikke regne seg fram til den i en egen løkke etterpå uten å kalle
      // `rnd()` en gang til og dermed flytte hele banens tilfeldighet.
      const vinduer=[];
      bx.save(); bx.translate(p.x,p.y); bx.rotate(p.ang+(p.side>0?Math.PI:0));
      for(let k=0;k<n;k++){
        const hx=-L/2+10+k*((L-20)/(n-1));
        // Annenhver hytte står litt lenger bak, slik at rekken leses som en
        // landsby i terrenget og ikke som en husrekke langs en gate.
        const hy=(k%2===0?0:-16), w=24+s.rnd()*10, h=24+s.rnd()*11;
        bx.fillStyle=P.hytte; bx.fillRect(hx-w/2,hy-h,w,h);
        bx.fillStyle=P.tak;
        bx.beginPath(); bx.moveTo(hx-w/2-5,hy-h); bx.lineTo(hx,hy-h-16); bx.lineTo(hx+w/2+5,hy-h);
        bx.closePath(); bx.fill();
        bx.fillStyle=P.vindu; bx.fillRect(hx-5,hy-h+8,10,8);
        vinduer.push([hx,hy-h+12]);
      }
      bx.restore();
      // Ett glød per hytte, ikke per vindu: hyttene står 15–20 px fra hverandre,
      // altså omtrent én glødbredde, så de leses som enkeltlys i en landsby.
      //
      // Radien er 23 og ikke 17 fordi gløden flyttet INN på vinduet: en glød
      // blender, så den løfter bare det som er mørkt, og over en lys vindusrute
      // tilfører den nesten ingenting. Målt sum lagt lys per hytte falt fra
      // 26,1 til 9,7 da den kom på plass — 23 gir 27 og altså det samme lyset
      // som før, men nå med vinduet som kilde.
      vinduer.forEach(v=>{ const w=s.lokal(p,v[0],v[1]); s.lys(w.x,w.y,P.vindu,23); });
      s.sperr(p.x,p.y,L*0.6);
    } },
  // Strandsand og grønt strandgress.
  'DUNA':{ ground:['#5c4729','#6d5634','#7e6742'], speckle:'dune', asphalt:'#403e39',

    // derfor grunt turkis, som er lysere enn sanden og klarer 3,15:1 — en
    // sjøfarge som er valgt av målingen, ikke av stemningen.
    lagPal:{ vann:'#7fd4d9', vannKant:'#dff2f2', fyr:'#f1f5f9', fyrRod:'#d63a2e',

      // Havet er bevisst den største flaten av de fem: fjorten rader på
      // UTSIDEN, langs en tredel av banen. Det er ikke mengde for mengdens
      // skyld — et hav har ingen bredd man ser slutten på, og radene renner ut
      // av canvaset, så flaten får aldri en motsatt strand som gjør den til et
      // tjern. Banen går langs kysten; dette er det man kjører forbi.
      s.vann(s.belte(0.02,0.36,s.utside(),s.TW+s.GRAVEL_SAFE+30,R,14,280),
        {flate:P.vann,kant:P.vannKant});
    },
    // Fyrtårn på en molo. De røde båndene er ikke pynt: et hvitt tårn uten dem
    // er en stolpe, og det er stripene som sier fyr.
    landmark(s){
      const P=s.TH.lagPal, bx=s.bx;
      const p=s.plasser(s.TH.landmarkT,1,150,s.TW+s.GRAVEL_SAFE+88);
      const L=p.halvLengde*2;
      bx.save(); bx.translate(p.x,p.y); bx.rotate(p.ang+(p.side>0?Math.PI:0));
      bx.fillStyle=P.molo; bx.fillRect(-L/2,-13,L,18);
      // Tårnet er smalere i toppen enn i foten — en trapes, ikke et rektangel,
      // for det er innsmalningen som leses som høyde ovenfra.
      const fx=-L/2+34, fb=26, ft=15, fh=78;
      bx.fillStyle=P.fyr;
      bx.beginPath();
      bx.moveTo(fx-fb/2,-13); bx.lineTo(fx-ft/2,-13-fh);
      bx.lineTo(fx+ft/2,-13-fh); bx.lineTo(fx+fb/2,-13);
      bx.closePath(); bx.fill();
      bx.fillStyle=P.fyrRod;
      for(let k=0;k<2;k++) bx.fillRect(fx-fb/2+2,-13-fh*(0.3+k*0.35),fb-4,12);
      // Lykta på toppen, og havnelys langs moloen.
      bx.fillStyle=P.lys;
      bx.beginPath(); bx.arc(fx,-13-fh-6,7,0,Math.PI*2); bx.fill();
      for(let k=1;k<=3;k++) bx.fillRect(-L/2+L*k/4-2.5,-19,5,6);
      bx.restore();
      // Gløden legges på lykta og på havnelysene, i samme lokale punkter som de
      // ble tegnet i — `s.lokal` tar både vendingen og høyden over moloen.
      const lykt=s.lokal(p,fx,-13-fh-6);
      s.lys(lykt.x,lykt.y,P.lys,38);
      for(let k=1;k<=3;k++){
        const h=s.lokal(p,-L/2+L*k/4,-16);
        s.lys(h.x,h.y,P.lys,14);
      }
      s.sperr(p.x,p.y,L*0.6);
    } },

// Standardverdiene ligger her i stedet for spredt utover tegnekoden, slik at en
// bane som mangler et felt får det samme som alle andre og ikke en tilfeldig
// `||`-fallback på hvert kallested.
function makeTheme(navn){
  const t=THEMES[navn]||{};
  return {
    ground: t.ground || ['#0d1a0f','#13220f','#1a2b14'],
    speckle: t.speckle || 'grass',
    asphalt: t.asphalt || ASPHALT_BASE,
    runoff: t.runoff || {type:'grus',clr:'#7a6c54'},
    curb: t.curb || CURB_RW,
    cluster: t.cluster==null ? 0.45 : t.cluster,
    ads: t.ads!==false,
    mow: t.mow || null,
    treeTint: t.treeTint || null,
    rockTint: t.rockTint || null,
    bushTint: t.bushTint || null,
    cityPal: t.cityPal || null,
    roofPal: t.roofPal || null,
    landmarkT: t.landmarkT==null ? null : t.landmarkT,
    groundLayer: t.groundLayer || null,
    landmark: t.landmark || null,
    // Fargene bakkelaget og landemerket tegner med, oppgitt som DATA og ikke
    // som literaler inne i tegnefunksjonene. HVORFOR: test_banetema.js måler
    // dem mot bakken de står på, og en farge som bor midt i en tegnefunksjon
    // kan bare måles ved å kjøre tegningen og lese piksler. Samme grep som
    // GHOST_TXT i del 3 steg F — tonen ligger der testen kan nå den, så en
    // dimmere farge ikke kan snike seg inn uten å bli målt.
    lagPal: t.lagPal || null,
    // Unntakene: en tone som leses mot en ANNEN tone i samme lag, ikke mot
    // bakken. Et kirketak står mot kirkeveggen, ikke mot skogbunnen, og å måle
    // det mot bakken ville krevd et lyst tak på en mørk bane — altså motsatt av
    // hva et skifertak er. Nøkkel = tonen, verdi = nøkkelen den leses mot.
    lagMot: t.lagMot || null
  };
}

// ── Kontrastsjekk (WCAG 2.1 relativ luminans) ──────────────────────────
// En bil på 28 px har ingen kontur og ingen tekst å støtte seg på: leses den
// ikke mot asfalten, forsvinner den. Derfor måles hver lakkering mot de tre
// flatene den faktisk ligger oppå, og tallene kan skrives ut med
// contrastReport() i konsollen i stedet for å måtte vurderes med øyemål.
const ASPHALT=ASPHALT_BASE;        // banedekket bilen ses mot (se ASPHALT_BASE)
const COCKPIT_BG='#0b0b0e';        // cockpitåpningen hjelmen ligger i
function srgbToLin(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
function relLuminance(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return 0.2126*srgbToLin(r)+0.7152*srgbToLin(g)+0.0722*srgbToLin(b);
}
function contrastRatio(a,b){
  const la=relLuminance(a), lb=relLuminance(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
// Kravene: enten base eller acc må nå 3:1 mot asfalten (bilen må skille seg
// fra banen), acc bør nå 3:1 mot base (mønsteret må synes på bilen), og hjelm
// bør nå 3:1 mot cockpiten (hodet må synes i åpningen).
function contrastCheck(lv){
  const vsAsfaltBase=contrastRatio(lv.base,ASPHALT);
  const vsAsfaltAcc =contrastRatio(lv.acc, ASPHALT);
  const accVsBase   =contrastRatio(lv.acc, lv.base);
  const helVsCockpit=contrastRatio(lv.hel, COCKPIT_BG);
  return {
    vsAsfaltBase, vsAsfaltAcc, accVsBase, helVsCockpit,
    okAsfalt:  Math.max(vsAsfaltBase,vsAsfaltAcc)>=3,
    okAccBase: accVsBase>=3,
    okHelm:    helVsCockpit>=3
  };
}
function contrastReport(){
  const rows=[];
  SKINS.forEach(s=>{ if(s.base) rows.push({type:'LAKK', navn:s.name, lv:skinLivery(s)}); });
  TEAMS.forEach(t=>  rows.push({type:'LAG',  navn:t.name, lv:skinLivery(t)}));
  const out=rows.map(r=>{
    const c=contrastCheck(r.lv);
    return {
      type:r.type, navn:r.navn,
      base_vs_asfalt:+c.vsAsfaltBase.toFixed(2),
      acc_vs_asfalt:+c.vsAsfaltAcc.toFixed(2),
      acc_vs_base:+c.accVsBase.toFixed(2),
      hjelm_vs_cockpit:+c.helVsCockpit.toFixed(2),
      // Lakken slik den brukes som TEKST i menyene. Skal alltid være ≥4,5 —
      // kommer den under, er teamInk i stykker, for det er hele jobben dens.
      tekst_vs_ui:+contrastRatio(teamInk(r.lv.base),UI_BG).toFixed(2),
      asfaltOK:c.okAsfalt, accOK:c.okAccBase, hjelmOK:c.okHelm
    };
  });
  if(typeof console!=='undefined'&&console.table) console.table(out);
  return out;
}

// ── lagfarge brukt som TEKST ───────────────────────────────────────────
// Lakkeringen er valgt mot asfalten, som er lys nok (#33333e) til at en mørk
// bil fortsatt leses. HUD-en og menyene ligger derimot på nesten svart, og der
// forsvinner de mørkeste lagene helt: ONYX (#232328) lander på 1,26:1 mot
// bakgrunnen og NORDHAV (#1b2e4a) på 1,44:1 — altså uleselig som skrift.
// Fargen lysnes derfor til den når 4,5:1, som er WCAG-kravet for vanlig tekst.
//
// Lysningen skjer i HSL, ikke ved å blande mot hvitt. Blanding mot hvitt var
// første forsøk, og den trekker metningen ut samtidig: NORDHAV endte på
// #748091 og GRANITT på #747a88 — to lag som ble praktisk talt samme grå.
// Å bare skru opp L holder fargetonen og metningen i ro, så et mørkeblått lag
// blir lyst BLÅTT og ikke grått, og lagene er fortsatt til å skille fra
// hverandre. Lag som allerede er lyse nok røres ikke.
const UI_BG='#0b0b0e';
const inkCache={};
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
  if(!d) return [0,0,l];
  const s=d/(1-Math.abs(2*l-1));
  let h;
  if(mx===r)      h=((g-b)/d)%6;
  else if(mx===g) h=(b-r)/d+2;
  else            h=(r-g)/d+4;
  return [h*60,s,l];
}
function hslToHex(h,s,l){
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=l-c/2;
  let r,g,b;
  if(h<60)       [r,g,b]=[c,x,0];
  else if(h<120) [r,g,b]=[x,c,0];
  else if(h<180) [r,g,b]=[0,c,x];
  else if(h<240) [r,g,b]=[0,x,c];
  else if(h<300) [r,g,b]=[x,0,c];
  else           [r,g,b]=[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function teamInk(hex){
  if(inkCache[hex]) return inkCache[hex];
  const [h,s,l0]=rgbToHsl(...hex.replace('#','').match(/../g).map(v=>parseInt(v,16)));
  let l=l0, out=hex;
  // 2 % lysere om gangen. Taket på L=0,92 hindrer at en farge som aldri når
  // kravet (finnes ikke blant dagens lag, men kan legges til) løper til hvitt.
  while(contrastRatio(out,UI_BG)<4.5 && l<0.92){
    l=Math.min(0.92,l+0.02);
    out=hslToHex(h,s,l);
  }
  return inkCache[hex]=out;
}

// AI difficulty tiers — rebuilt so the tiers are differentiated by TECHNIQUE,
// not raw straight-line pace. baseMax (flat-out speed) is now nearly IDENTICAL
// across every tier (≈6% spread total, down from the old ~51%) — on a clean
// straight, an ENKEL car and an ULTRA car accelerate to almost the same top

//  - curveK: cornering confidence. HIGHEST on ENKEL, LOWEST on ULTRA — a weak
//    driver lifts off far more than a corner actually needs (overly cautious,
//    loses time), a great driver stays confident and carries speed through
//    the bend. This is the single biggest technique lever.
//  - steerPrec / overspeed: how tightly a tier holds its line and its braking
//    margin into a corner — sloppier and more cautious on ENKEL, razor-sharp
//    on ULTRA.

const SKINS=[
  // base:null er signalet om at lagets egen lakkering skal brukes i stedet.
  {name:'STANDARD',    base:null,      acc:null,      dark:null,      hel:null,      pat:null},
  {name:'ROSSO',       base:'#c8102e', acc:'#f4ecd8', dark:'#4a0812', hel:'#f4ecd8', pat:'split'},
  {name:'OXFORD',      base:'#2e4a5e', acc:'#c99a5e', dark:'#080d13', hel:'#e5e2d6', pat:'sash'},
  {name:'RACINGGRØNN', base:'#1f5c45', acc:'#e9c46a', dark:'#0c2a1f', hel:'#f4ecd8', pat:'spine'},
  {name:'PETROL',      base:'#1f8a8a', acc:'#ffe2c4', dark:'#0d3b3b', hel:'#f8fafc', pat:'chevron'},
  {name:'ARKTISK',     base:'#ecebe4', acc:'#1d3557', dark:'#5c6b7a', hel:'#e63946', pat:'tail'},
  {name:'KARBON',      base:'#2b2b31', acc:'#ff6b1a', dark:'#0e0e12', hel:'#ff6b1a', pat:'edges'},
  // hel er lys her mens spc holder på den mørke dekalfargen: hjelmen ligger i
  // en nesten svart cockpitåpning og må være lys, men sponsorflatene ligger på
  // den lyse sanden og må være mørke. Derfor kan ikke spc bare arve hel.
  {name:'SAND',        base:'#d9b26f', acc:'#2f2a26', dark:'#5a4630', hel:'#f4ecd8', spc:'#2f2a26', pat:'spine'},
  {name:'FIOLETT',     base:'#5b3e96', acc:'#f2d49b', dark:'#241640', hel:'#f2d49b', pat:'sash'}
];
let skinSel=0;
// Hvis et lagret valg peker på en lakkering som ikke finnes lenger — f.eks.
// «TIGER» fra den gamle lista, eller et tall utenfor rekkevidde — skal spillet
// falle tilbake til STANDARD, ikke krasje på `undefined.base` midt i et løp.
// Alt som leser en lakkering går gjennom denne, så det finnes bare ett sted
// dette kan gå galt.
function skinAt(i){
  return (Number.isInteger(i) && i>=0 && i<SKINS.length) ? SKINS[i] : SKINS[0];
}

// Spillerens lag trekkes tilfeldig, men det MÅ trekkes før baneutvalget tegnes.
// Før lå trekningen inne i buildCars, altså først når løpet startet, og da løy
// STANDARD-forhåndsvisningen: den viste alltid det første laget i lista, mens
// du i praksis kunne havne i et hvilket som helst av de ti. Nå trekkes
// identiteten når du går inn i baneutvalget og holdes fast derfra til løpet er
// bygget, slik at bilen du ser er bilen du får.
let playerIdent=null;
function rollPlayerIdent(){
  playerIdent={
    team:TEAMS[Math.floor(Math.random()*TEAMS.length)],
    num:1+Math.floor(Math.random()*DRIVERS_PER_TEAM)
  };
}

// Selectable time-of-day — purely atmospheric (lighting overlay + night
// floodlights/headlights, see drawTrackScene/drawCar), no effect on physics.
// DAG is an explicit, named option (not just "the only look there is") so
// picking a day race is as deliberate a choice as picking a night race.
const TOD=[
  {name:'DAG',         clr:'#facc15', night:false, overlay:null},
  {name:'SOLNEDGANG',  clr:'#fb923c', night:false, overlay:'rgba(120,45,10,0.22)'},
  {name:'NATT',        clr:'#818cf8', night:true,  overlay:'rgba(5,8,20,0.58)'}
];
let todIdx=0;

// Selectable race distance — replaces the old hardcoded 5-lap race. LAPS is
// kept as the live value everything else reads (finish check + HUD), while
// LAP_OPTIONS/lapsIdx drive the trackselect UI (Q/E to cycle).
const LAP_OPTIONS=[3,5,8,12,20];
let lapsIdx=1, LAPS=LAP_OPTIONS[lapsIdx];

// ── tidtakingspunkter ──────────────────────────────────────────────────────
// Ekte F1-tidtaking måler ikke avstand, den måler TID: banen er delt i et
// antall punkter, og hver bil får et tidsstempel hver gang den passerer ett av
// dem. Gapet mellom to biler er da differansen mellom tidsstemplene deres på
// SAMME punkt — ikke en omregning fra avstand, som ville blitt feil i det
// øyeblikket to biler holder ulik fart.
//
// HVORFOR 50 PUNKTER: en runde tar rundt 40 sekunder, altså cirka 2400 steg.
// 50 punkter gir et oppdatert gap hvert 48. steg, altså cirka hvert 0,8
// sekund. Det er omtrent takten en ekte tidtakingsskjerm oppdateres i, og det
// er tett nok til at tallet føles levende uten at det flimrer.
const GAP_MARKS=50;
// To runder med punkter. Lengre historikk trengs ikke: gapet leses alltid på
// det punktet bilen SIST passerte, og trendfargen sammenligner med forrige
// runde på samme punkt. Begge ligger innenfor to runder.
const GAP_RING=GAP_MARKS*2;

class Car{
  constructor(x,y,ang,team,isPlayer){
    this.x=x;this.y=y;this.angle=ang;
    this.vx=0;this.vy=0;this.speed=0;
    this.team=team;this.isPlayer=isPlayer;
    this.lap=0;this.curProg=0;this.prevProg=0;this.seenHalf=false;
    this.raceDist=0; // continuous, wrap-aware distance-since-start — see buildCars()
    this.sectorIdx=0;this.sectorStartT=0;this.lapStartT=0;this.lapTimes=[];
    this.aiIdx=0;this.aiSpd=2.25+Math.random()*.45;
    this.skillVar=0.94+Math.random()*0.12; // overwritten per grid slot for AI, see buildCars()
    this.num=1; // driver number within the team (1 or 2)
    this.rubberMul=1; this.mistakeT=0;
    this.stuckRefDist=0; this.stuckT=180; // stuck-in-gravel recovery bookkeeping (AI only)
    this.overtakeSide=0; this.overtakeT=0; // which way (and for how long) this AI is currently swinging out to pass a blocker ahead
    this.defendSide=0; this.defendT=0; // which way (and for how long) this AI is currently covering to defend against an attacker from behind
    this.trail=[];this.finished=false;this.place=1;
    // Avkjølingsrunde, se COOL_*-konstantene. finishDist er raceDist i det
    // målstreken krysses, slik at halvrunden måles i DISTANSE og ikke i tid —
    // en bil som bråbremser skal ikke få en kortere avkjølingsrunde av det.
    this.finishDist=null;this.coolAlpha=1;this.coolDone=false;
    this.offtrack=false;this.straightMode=false;this.wallHit=false; // street-circuit barrier contact — see update()
    this.battery=100; this.boostActive=false; // boost-batteri: 0-100, se update()
    // Ladetaket per runde. HVORFOR det trengs: uten tak lader bilen fritt hver
    // gang den slipper gassen, og en runde har så mange gassløft at batteriet i
    // praksis ble uendelig — boosten var gratis og dermed alltid på. Taket gjør
    // energien til et budsjett som må fordeles over runden.
    this.lapCharge=0;
    // Overtake mode varer HELE neste runde, så svaret må hentes ved målepunktet
    // (progress 0,95) men brukes først ved målpasseringen. otPending holder det
    // i mellomtiden.
    this.overtakeMode=false; this.otPending=false;
    this.steerVel=0; // smoothed angular velocity — see turnRate in update()
    this.braking=false; // ren tegnetilstand: speiler bremse-inputet dette steget, slik at
                        // bremselyset og endeplatelysene (se endplateColor) kan vise det.
                        // Fysikken leser den ALDRI — `brake` i update() er fortsatt fasiten.
    this.spr=null; // [sprite med lukkede klaffer, sprite med åpne] — se buildCarSprites()
    this.slipstreamActive=false; this.slipstreamT=0; this.slipTarget=null; // draft tow — see update()
    // ── banegrenser (se checkTrackLimits i update()) ───────────────────────
    this.limitViolations=0;   // antall brudd i dette løpet / denne økta
    this.limitOffT=0;         // antall steg på rad lenger ut enn TW+LIMIT_MARGIN
    this.limitArmed=true;     // må være tilbake innenfor TW før neste brudd kan telles
    this.lapHadViolation=false; // for øvingsmodus: skal denne runden slettes?
    this.penaltySec=0;        // tidsstraff i sekunder (bare spilleren får straff)
    this.warnFlag=false;      // svart-hvitt-flagg vist resten av løpet
    this.contactT=0;          // steg siden siste bil-mot-bil-kontakt, teller ned
    this.lat=0;               // FORTEGNSATT avstand fra senterlinja, forrige steg.
                              // nearestOnPath gir bare den usignerte avstanden, men
                              // AI-en nedenfor må vite HVILKEN side den ligger ute på
                              // for å kunne styre innover igjen. Settes i update() rett
                              // etter `near`, altså ETTER at AI-en har styrt — AI-en
                              // leser derfor verdien fra forrige steg. Det er ett steg
                              // på 1/60 s og uten praktisk betydning, mens alternativet
                              // er et ekstra nearestOnPath-kall per bil per steg.
    this.finishT=null;        // raceTime da bilen fullførte — resultatlista trenger den
    this.lapMarks=[];         // raceTime ved hver målpassering, for fartsanslag
    this.sectorBuf=[null,null,null]; // sektortider i runden som kjøres nå, se målpasseringen
    this.finalPlace=0;        // plassering etter at straffetid er lagt til, se finalizeResults()
    // ── tidtakingspunkter (se recordGapMarks / gapAhead) ───────────────────
    // Ringbuffer over de to siste rundene. markT er raceTime da punktet ble
    // passert, markI er det GLOBALE punktnummeret som ligger i den plassen.
    // Uten markI ville en bil som er mer enn to runder bak lest en gammel tid
    // fra en overskrevet plass og fått et gap som så rimelig ut, men var feil.
    this.markT=new Float64Array(GAP_RING);
    this.markI=new Int32Array(GAP_RING).fill(-1<<30);
    this.lastMark=null;       // globalt punktnummer bilen sist passerte
    this.aheadCar=null; this.behindCar=null; // naboer i kampen, settes i update()
    this.gapHist=new Float64Array(GAP_MARKS).fill(NaN); // gapet forrige runde, per punkt i runden
    this.gapTrend=0;          // -1 krymper (grønn), +1 vokser (rød), 0 vet ikke
  }
  get totalDist(){return this.lap+this.curProg;}
}

let TR=TRACKS[0];
let cars=[],player,state='menu',raceTime=0,keys={},particles=[],texts=[];
let shake=0, confetti=[], winTimer=0, toasts=[], podiumCrowd=[];
let trackSel=0, cntTimer=0;
let camX=0,camY=0,camAngle=0;
const CHASE_Y = HY+(H-HY)*0.68; // chase-cam anchor: car sits lower on screen, more track visible ahead
let bestSector=[Infinity,Infinity,Infinity];
let bestLap=Infinity;     // beste GYLDIGE runde — slettede runder teller ikke, se målpasseringen
let finalResults=null;    // resultatlista med straffetid, satt av finalizeResults()

function addShake(n){ shake=Math.min(16,shake+n); }
function toast(t,clr){ toasts.push({t,clr,life:1}); }

// ── banegrenser ─────────────────────────────────────────────────────────────
// F1-regelen er at den hvite linja er en DEL av banen, mens asfalten utenfor
// den (kerben) ikke er det. Bilen er utenfor først når ingen del av den lenger
// berører banen. TR.TW er halve banebredden målt fra senterlinja, så en bil med
// senter TW + LIMIT_MARGIN ute har hele bredden sin forbi den hvite linja.
//
// HVORFOR 8 px: bilen er 28 px lang og rundt 16 px bred, altså ~8 px fra senter
// til ytterkant. Grusen begynner også ved TW og strekker seg GRAVEL_SAFE = 23 px
// ut, så 8 px er godt inne i grusen. Dermed dekker én terskel begge reglene:
// grusen er fortsatt fysisk nøytral å kjøre i, men å kjøre HELT ut i den er et
// brudd.
const LIMIT_MARGIN=8;
// HVORFOR 8 steg: med fast tidssteg er det 0,13 sekunder. Et enkelt bilde der
// hjulet nipper utenfor i en kerbe er ikke et brudd — det ville gitt straff for
// normal kjøring på de banene der racinglinja ligger tett på kanten. 0,13 s er
// derimot lenger enn et overtramp, det er en kjøretur utenfor.
const LIMIT_STEPS=8;
// HVORFOR 30 steg: et halvt sekund. Blir du dyttet ut av en annen bil, er det
// ikke ditt brudd. Vinduet må være langt nok til at bilen faktisk rekker å
// havne utenfor etter kontakten, men kort nok til at det ikke blir et fribillett
// til å skjære svinger lenge etterpå.
const CONTACT_GRACE=30;
const LIMIT_PENALTY_SEC=5; // straffen fra og med fjerde brudd

// Teller brudd for én bil. Kalles hvert steg for hver bil, med avstanden fra
// senterlinja som allerede er regnet ut i update().
//
// Brudd telles for ALLE biler, også AI-en. AI-en får ingen straff (den har ikke
// en dommer å forholde seg til), men tallene må finnes for at headless-testen
// skal kunne svare på om AI-en faktisk holder seg innenfor.
function checkTrackLimits(c,dist){
  if(c.contactT>0) c.contactT--;
  // Tilbake innenfor den hvite linja: nå kan et nytt brudd telles. Terskelen
  // for å «nullstille» er TW, ikke TW+LIMIT_MARGIN — ellers kunne en bil
  // balansere på kanten og få et nytt brudd for hver lille bølge.
  if(dist<=TR.TW){ c.limitArmed=true; }
  if(dist>TR.TW+LIMIT_MARGIN){
    c.limitOffT++;
    if(c.limitOffT>=LIMIT_STEPS && c.limitArmed){
      c.limitArmed=false; // ett brudd per utflukt
      // Dyttet ut av en annen bil? Da er det ikke et brudd — men utflukten er
      // «brukt opp» uansett, så den ikke kan telles senere i samme sving.
      if(c.contactT>0) return;
      c.limitViolations++;
      c.lapHadViolation=true;
      if(c.isPlayer) announceViolation(c);
    }
  } else {
    c.limitOffT=0;
  }
}

// Anslått målgang for en bil som ennå ikke er ferdig, i sekunder.
//
// HVORFOR anslag i det hele tatt: løpet avsluttes i det SPILLEREN kommer i mål,
// og da har de fleste AI-bilene en bit igjen. Rangerer man dem på tilbakelagt
// distanse alene, kan ikke straffetid sammenlignes med noe — straff måles i
// sekunder. Så alle må ha en tid.
//
// Farten hentes fra de to siste rundene, ikke fra hele løpet: starten fra
// stillestående og en eventuell grusutflukt tidlig i løpet sier ingenting om
// farten bilen holder nå.
function estimateFinishSec(c){
  const nowSec=raceTime/60;
  const remaining=LAPS-c.raceDist; // i runder
  if(remaining<=0) return nowSec;
  let lapsPerSec=0;
  const m=c.lapMarks;
  if(m.length>=3){
    const dt=(m[m.length-1]-m[m.length-3])/60; // to runder
    if(dt>0) lapsPerSec=2/dt;
  }
  if(lapsPerSec<=0 && nowSec>0 && c.raceDist>0) lapsPerSec=c.raceDist/nowSec; // reserve: snitt over hele løpet
  if(lapsPerSec<=0) return nowSec+remaining*60; // siste utvei, bilen har aldri beveget seg
  return nowSec+remaining/lapsPerSec;
}

// Sluttiden en bil rangeres på: løpstid pluss straffetid.
function finalTimeSec(c){
  const base = c.finished && c.finishT!=null ? c.finishT/60 : estimateFinishSec(c);
  return base+c.penaltySec;
}

// Kalles i det spilleren fullfører. Låser rekkefølgen på resultatskjermen.
//
// HVORFOR en egen, frosset liste: c.place oppdateres hvert steg ut fra
// raceDist, som er riktig MENS løpet går, men den kjenner ikke straffetid. En
// spiller med +10 s skal falle bakover på resultatlista selv om bilen fysisk
// krysset streken først.
function finalizeResults(){
  finalResults=[...cars].map(c=>({car:c,time:finalTimeSec(c)}))
    .sort((a,b)=>a.time-b.time);
  finalResults.forEach((r,i)=>{ r.rank=i+1; r.car.finalPlace=i+1; });
}

// Straffeteksten som vises etter navnet i resultatlista og på pallen.
function penaltyLabel(c){ return c.penaltySec>0 ? ` +${c.penaltySec}s` : ''; }

// ── tidtaking og gap ────────────────────────────────────────────────────────
// Stempler bilen inn på hvert tidtakingspunkt den passerer. Kalles hvert steg
// for hver bil, rett etter at raceDist er oppdatert.
//
// raceDist er bevisst brukt i stedet for lap+curProg: den er sammenhengende
// over målstreken og kan starte litt NEGATIV for biler som står foran streken
// på startgriden, slik at punktnummeret er entydig selv før første runde er
// registrert. Derfor må modulo-regningen tåle negative tall.
function recordGapMarks(c){
  const idx=Math.floor(c.raceDist*GAP_MARKS);
  if(c.lastMark===null){ stampMark(c,idx); c.lastMark=idx; return; }
  if(idx<=c.lastMark) return; // samme punkt, eller bilen har rygget litt
  // Normalt passeres ett punkt om gangen (cirka hvert 48. steg). Skulle et
  // steg likevel dekke flere punkter, stemples de mellomliggende med samme tid
  // i stedet for å bli stående tomme — et hull ville gjort gapet utilgjengelig
  // for alle som leste det punktet senere.
  const start=Math.max(c.lastMark+1, idx-GAP_RING+1);
  for(let m=start;m<=idx;m++) stampMark(c,m);
  c.lastMark=idx;
  // Trendfargen: gapet nå mot gapet på SAMME punkt i runden forrige gang.
  const naa=gapAhead(c);
  const p=markSlotInLap(idx);
  const gammel=c.gapHist[p];
  if(naa!=null && !Number.isNaN(gammel)) c.gapTrend = naa<gammel ? -1 : 1;
  else if(naa==null) c.gapTrend=0;
  if(naa!=null) c.gapHist[p]=naa;
}
function stampMark(c,m){
  const slot=((m%GAP_RING)+GAP_RING)%GAP_RING;
  c.markT[slot]=raceTime; c.markI[slot]=m;
}
function markSlotInLap(m){ return ((m%GAP_MARKS)+GAP_MARKS)%GAP_MARKS; }
// Tiden bilen passerte et bestemt punkt, eller null hvis den aldri gjorde det
// (eller det er så lenge siden at plassen er overskrevet).
function markTime(c,m){
  const slot=((m%GAP_RING)+GAP_RING)%GAP_RING;
  return c.markI[slot]===m ? c.markT[slot] : null;
}
// Bilen rett foran / rett bak i løpsstillingen. Naboene settes én gang per
// steg sammen med plasseringene (se slutten av update()), ikke ved å lete i
// `cars` her — gapAhead kalles for hver bil hvert steg, og et søk per kall
// ville blitt 400 gjennomganger av feltet i sekundet uten å gi noe nytt svar.
//
// Biler som har fullført er ikke med: de ruller en avkjølingsrunde og er ute
// av kampen. Naboene hopper derfor OVER dem, i stedet for at gapet forsvinner
// for alle som ligger bak en bil som nettopp gikk i mål.
function carAhead(c){ return c.aheadCar; }
function carBehind(c){ return c.behindCar; }

// Gapet til bilen foran, i sekunder, eller null når det ikke kan måles.
//
// Hovedleddet tas på det punktet BILEN SELV sist passerte: «da jeg var her,
// hvor lenge var det siden han var her?». Begge tidene er låste tidsstempler,
// så tallet står stille mellom punktene. Prompten ba om «nå minus tiden bilen
// foran passerte mitt siste punkt», men da vokser gapet jevnt fram til neste
// punkt og faller tilbake idet det passeres — et sagtannmønster på opptil 0,8
// sekunder, som er mer enn gapet man faktisk kjemper om.
//
// Et låst tidsstempel alene er likevel for lite: står bilen stille, blir tallet
// hengende på den siste målingen for alltid (målt i nettleseren: «▲ +0.00» mens
// bilen i praksis var sju sekunder bak). Derfor et andre ledd — hvor lenge det
// er siden bilen foran forlot punktet JEG er på vei mot. Det leddet begynner
// først å vokse når jeg bruker lengre tid på strekket enn han gjorde, altså
// bare når gapet virkelig øker, og treffer akkurat hovedleddet i det jeg
// passerer punktet. Maksimum av de to gir derfor et tall som står stille når
// farten holder, vokser når den ikke gjør det, og aldri hopper.
function gapAhead(c){
  if(c.lastMark===null || c.finished) return null;
  const a=carAhead(c); if(!a) return null;
  const tMeg=markTime(c,c.lastMark), tHan=markTime(a,c.lastMark);
  if(tMeg==null || tHan==null) return null;
  let g=tMeg-tHan;
  const tHanNeste=markTime(a,c.lastMark+1);
  if(tHanNeste!=null) g=Math.max(g, raceTime-tHanNeste);
  return g/60;
}
// Gapet til bilen bak, målt på det punktet BILEN BAK sist passerte — det er
// det ferskeste punktet begge to har vært innom. Samme tillegg som over, bare
// speilvendt: mister bilen bak farten, er det tiden siden JEG forlot punktet
// han er på vei mot som vokser.
function gapBehind(c){
  if(c.lastMark===null || c.finished) return null;
  const b=carBehind(c); if(!b || b.lastMark===null) return null;
  const tHan=markTime(b,b.lastMark), tMeg=markTime(c,b.lastMark);
  if(tMeg==null || tHan==null) return null;
  let g=tHan-tMeg;
  const tMegNeste=markTime(c,b.lastMark+1);
  if(tMegNeste!=null) g=Math.max(g, raceTime-tMegNeste);
  return g/60;
}
// To desimaler under ti sekunder, én over — samme oppløsning som en ekte
// tidtakingsskjerm, der det femte sifferet uansett ikke rekker å leses.
function fmtGap(s){ const a=Math.abs(s); return a>=10 ? a.toFixed(1) : a.toFixed(2); }

// Alt spilleren får se og merke av et brudd. Skilt fra tellingen over, slik at
// AI-en kan telles med helt samme regel uten at noe vises på skjermen.
function announceViolation(c){
  const n=c.limitViolations;
  if(state==='practice') return; // øvingsmodus sletter runden i stedet, se nedenfor
  if(n<3){
    toast(`BANEGRENSER ${n}/3`,'#f97316');
  } else if(n===3){
    c.warnFlag=true;
    toast('SVART-HVITT FLAGG – ADVARSEL','#f1f5f9');
  } else {
    c.penaltySec+=LIMIT_PENALTY_SEC;
    toast(`+${LIMIT_PENALTY_SEC} SEK STRAFF`,'#ef4444');
  }
}
function spawnConfetti(){
  const clrs=['#4ade80','#38bdf8','#facc15','#ef4444','#f97316','#f1f5f9'];
  for(let i=0;i<70;i++){
    confetti.push({x:Math.random()*W,y:-10-Math.random()*H*.5,vx:(Math.random()-.5)*1.8,vy:1.4+Math.random()*2.2,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,clr:clrs[Math.floor(Math.random()*clrs.length)],w:4+Math.random()*3,life:1});
  }
}
// a loose, organic crowd pattern for the podium backdrop grandstand — built
// once when the win screen opens (not re-rolled every frame, else it'd look
// like static/noise instead of a crowd of people sitting still).
function buildPodiumCrowd(){
  podiumCrowd=[];
  const cols=['#ef4444','#38bdf8','#eab308','#f1f5f9','#4ade80','#fb923c','#f472b6'];
  for(let r=0;r<4;r++) for(let c=0;c<38;c++){
    if(Math.random()<0.18) continue;
    podiumCrowd.push({x:c,y:r,clr:cols[Math.floor(Math.random()*cols.length)]});
  }
}
function dust(x,y,clr){
  for(let i=0;i<3;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*.6+.1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.25,life:.8,d:.02,r:Math.random()*2.2+1.2,clr});
  }
}

function buildCars(){
  cars=[];
  const PN=TR.PN;
  // full 20-car identity pool (10 teams × 2 drivers), shuffled so grid
  // colours/numbers vary race to race — then the PLAYER is always pulled
  // out for the very last grid slot, and the 19 AI identities fill the
  // slots ahead in the shuffled order. Real overtaking through the whole
  // field is therefore mandatory, every single race.
  const pool=[];
  TEAMS.forEach(t=>{ for(let n=1;n<=DRIVERS_PER_TEAM;n++) pool.push({team:t,num:n}); });
  // Spillerens identitet er alt trukket (rollPlayerIdent), fordi baneutvalget
  // må kunne vise den før løpet finnes. Den plukkes derfor UT av poolen her i
  // stedet for å trekkes her, ellers ville spilleren kunne møte sin egen
  // bil-identitet blant de 19 AI-ene.
  if(!playerIdent) rollPlayerIdent();
  const playerId=playerIdent;
  const pi=pool.findIndex(p=>p.team===playerId.team&&p.num===playerId.num);
  if(pi>=0) pool.splice(pi,1);
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  // Grid slots are placed by walking BACKWARD along the actual track path
  // (not a straight-line projection from the start point), so the grid
  // stays glued to the real geometry even on a tight track where the
  // pre-start straight curves. The 19 AI cars fill two-wide rows 0-8 plus
  // a lone car in row 9; the player then gets its OWN row 10, strictly
  // further back than every AI car. This has to be a physical placement,
  // not a one-off progress-value override: curProg gets recomputed from
  // the car's real (x,y) every single frame once the race is live (see
  // the nearestOnPath call in the main update loop below), so anything
  // that doesn't come from genuinely being further back on the tarmac
  // gets silently overwritten the instant the lights go out. A dedicated
  // last row is the only thing that survives that recompute, which is
  // what actually guarantees the player is always dead last at the start.
  const ROW_IDX_STEP=2, COL_OFFSET=14;
  function gridPose(row,col){
    const idx=((0-row*ROW_IDX_STEP)%PN+PN)%PN;
    const [px,py]=TR.PATH[idx], h=TR.heading[idx];
    const nx=-Math.sin(h), ny=Math.cos(h);
    return {x:px+nx*col*COL_OFFSET, y:py+ny*col*COL_OFFSET, ang:h};
  }
  // Grid rows parked behind the start/finish line land at raw path-progress
  // close to 1.0 (idx counts backward from the line toward PN), while pole
  // position sits at progress≈0 right on the line. Left as-is, that makes
  // raceDist/place sort the whole grid BACKWARDS at the green light — the
  // deeper in the field a car starts, the LARGER its raw progress number,
  // so it would rank ahead of cars in front of it. Un-wrap it once here:
  // anything parked behind the line (progress>0.5) is still finishing a
  // lap that never really happened, so treat it as slightly negative
  // instead, preserving true grid order from pole all the way back.
  function initRaceDist(c){
    c.raceDist = c.curProg>0.5 ? c.curProg-1 : c.curProg;
    c.stuckRefDist=c.raceDist; // so the first stuck-check window measures from each car's real start, not a shared 0
  }

  const AI_COUNT=NUM_CARS-1; // 19
  for(let p=0;p<AI_COUNT;p++){
    const id=pool[p];
    const row=Math.floor(p/2), col=(p%2===0)?-1:1;
    const {x,y,ang}=gridPose(row,col);
    const c=new Car(x,y,ang,id.team,false);
    c.num=id.num;
    c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
    c.prevProg=c.curProg;
    initRaceDist(c);
    // pace spread across the grid: pole-sitters are the tiers' strongest
    // drivers, backmarkers (just ahead of the player) are its weakest —
    // so starting last means picking off easy traffic first before facing
    // real resistance up front, instead of 19 identical clones.
    // Spennet ble strammet fra 0,22 til 0,06 da gummistrikken ble svekket.
    // HVORFOR: gummistrikken skjulte før hvor stort spennet egentlig var — den
    // dro de raske ned til 85 % og de trege opp til 118 %, så feltet holdt seg
    // samlet uansett. Med spennet urørt og strikken borte ble siste bil 1,4–1,8
    // runder bak etter åtte runder (målt på alle 13 banene), altså rundet av
    // lederen. Det er ikke et felt, det er en oppstilling.
    //
    // Så strammet videre fra 0,06 til 0,04 i steg G. HVORFOR: 0,06 traff
    // riktig den gang, men det var FØR boost og overtake kom inn i steg D, og
    // de legger på spredning som posFactor ikke kontrollerer. Sluttmålingen
    // viste snitt 0,750 over alle 52 konfigurasjoner og VULCANO/CASUAL/ULTRA
    // på 1,0642 — altså siste bil rundet av lederen, nettopp det 0,06 skulle
    // hindre. Målt på de fem verste banene:
    //
    //     0,06 → maks 1,0642, snitt 0,795
    //     0,05 → maks 0,9499, snitt 0,745
    //     0,04 → maks 0,8639, snitt 0,688
    //
    // 0,05 ble forkastet fordi 0,05 margin til taket er mindre enn
    // variasjonen mellom to kjøringer (0,02–0,03 med bare 2 forsøk). 0,04 gir
    // maks 0,864 med reell margin, og snittet ligger fortsatt inne i
    // målbåndet 0,5–0,8.
    //
    // Midtpunktet er med vilje holdt på 0,97 (som før: snittet av 1,08…0,86).
    // Flyttes det, endres AI-ens absolutte fart og dermed balansen mot
    // spillerens egen toppfart — og det er ikke det dette steget skal gjøre.
    const posFactor=1.00-0.04*(p/(AI_COUNT-1));
    c.skillVar=posFactor*(0.97+Math.random()*0.06);
    cars.push(c);
  }
  {
    const lastAiRow=Math.floor((AI_COUNT-1)/2);
    const row=lastAiRow+1, col=0;
    const {x,y,ang}=gridPose(row,col);
    const c=new Car(x,y,ang,playerId.team,true);
    c.num=playerId.num;
    c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
    c.prevProg=c.curProg;
    initRaceDist(c);
    cars.push(c);
  }
  player=cars.find(c=>c.isPlayer);
  camX=player.x; camY=player.y; camAngle=player.angle;
}

// Bakgrunnen bygges her, i det banen faktisk startes — ikke ved oppstart.
// Målt i nettleseren tar det 3–14 ms per bane (90 ms for alle 13 til sammen),
// altså under ett enkelt 60Hz-bilde, så den bygges rett ut synkront i stedet
// for bak en «LASTER BANE…»-mellomskjerm: en lasteskjerm som bare vises i ett
// bilde ville vært et uleselig glimt ved hver eneste løpsstart. Skulle en
// svakere maskin bruke vesentlig lenger tid, er det eneste utslaget et kort
// hakk, og det tapte tidshoppet fanges allerede av >250ms-nullstillingen i
// loop() slik at spillet ikke byks framover etterpå.
function startRace(){
  TR=TRACKS[trackSel];
  ensureTrackBg(TR);
  buildCars(); buildCarSprites();
  particles=[]; texts=[]; confetti=[]; toasts=[]; shake=0; winTimer=0; raceTime=0;
  bestSector=[Infinity,Infinity,Infinity]; bestLap=Infinity; finalResults=null;
  state='countdown'; cntTimer=180;
}

function startPractice(){
  TR=TRACKS[trackSel];
  ensureTrackBg(TR);
  // Samme lag som i løp, slik at STANDARD-lakkeringen ser lik ut i begge modi.
  if(!playerIdent) rollPlayerIdent();
  const c=new Car(TR.sfx,TR.sfy,TR.sfAng,playerIdent.team,true);
  c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
  c.prevProg=c.curProg;
  cars=[c]; player=c;
  buildCarSprites();
  // MÅ komme etter buildCarSprites(): den kaller freeCarSprites(), som krymper
  // alle sprites til 0×0 — også spøkelsets, hvis det ble bygd først.
  ghostSpr=makeCarSprite(GHOST_LIVERY,false);
  camX=player.x; camY=player.y; camAngle=player.angle;
  particles=[]; texts=[]; confetti=[]; toasts=[]; shake=0; raceTime=0;
  bestSector=[Infinity,Infinity,Infinity]; bestLap=Infinity; finalResults=null;
  // MÅ komme etter raceTime=0: nyGhostRunde() setter tidspunktet for neste
  // opptakspunkt ut fra raceTime, og med forrige løps klokke ville det punktet
  // ligget tusenvis av steg fram i tid — altså ingen opptak i det hele tatt.
  ghostLap=lesGhost();
  nyGhostRunde(c);
  state='practice';
}

function inStraightZone(prog){
  return TR.straightZones.some(z=> z.b<z.a ? (prog>=z.a||prog<=z.b) : (prog>=z.a&&prog<=z.b));
}

// ── 2026-reglene: rett-modus, boost og overtake ───────────────────────────
// Tallene står samlet her, og ikke strødd utover update(), fordi de bare gir
// mening i forhold til hverandre: et batteri som varer seks sekunder, et
// ladetak som gir to og en halv slike utladninger per runde, og en overtake-
// bonus som er omtrent halvparten av en utladning. Endrer man ett av dem uten
// å se de to andre, er balansen borte.
const BOOST_DRAIN=0.28;        // 100/0,28 = 357 steg ≈ 5,95 s med full stang
const BOOST_CHARGE_BRAKE=0.35; // bremsing gir mest tilbake
const BOOST_CHARGE_COAST=0.08; // et gassløft gir lite — det skal ikke lønne seg å seile
const LAP_CHARGE_CAP=60;       // maks ladet energi per runde, nullstilles ved mål
const BOOST_MAX_MUL=1.06;      // toppfart med boost
const BOOST_MAX_MUL_OT=1.09;   // ... og i overtake mode
const BOOST_ACCEL_MUL=1.15;    // boostens virkelige verdi: akselerasjonen ut av svingen
const STRAIGHT_MAX_MUL=1.12;   // rett-modus, bare i lilla sone
const OT_PROG=0.95;            // målepunktet overtake avgjøres på
const OT_GAP_SEC=1.0;          // innenfor dette gapet foran utløses overtake
const OT_BATTERY=25;           // ekstra energi, UTENFOR ladetaket for runden
const OT_COL='#facc15';

// ── Avkjølingsrunde ──────────────────────────────────────────────────────────
// En bil som er i mål sto før bom stille på sporet, midt på den racinglinja de
// som fortsatt kjører skal bruke. Den var tatt ut av kollisjonen, så feltet
// kjørte rett gjennom den — et vrak man ser igjennom er verre enn ingen bil.
// Nå ruller den ut runden slik det gjøres i virkeligheten, og forsvinner.
const COOL_SPEED=0.55;   // andel av normal AI-fart, ingen boost
const COOL_ALPHA=0.40;   // 60 % gjennomsiktig: tydelig «ikke i løpet lenger»
const COOL_LAPS=0.50;    // borte etter en halv runde
// HVORFOR nedtoningen starter så sent: en lineær fade over hele halvrunden
// gjorde bilen praktisk talt usynlig alt etter en fjerdedel, mens den fortsatt
// lå i veien visuelt. Den holder COOL_ALPHA mesteparten av tiden og toner ned
// først over den siste tredjedelen, så den er synlig så lenge den er der.
const COOL_FADE_AT=0.34; // runder siden mål før nedtoningen begynner

// ── Spøkelsesbil (bare i øving) ──────────────────────────────────────────────
// Den beste GYLDIGE runden lagres og spilles av igjen som en hvit bil. Den er
// ikke en AI: den gjentar punkt for punkt posisjonene du selv kjørte, så linja
// du jager er garantert en linje som er mulig å kjøre — og den er din egen.
const GHOST_STEP=3;              // ett punkt hvert tredje fysikksteg ...
const GHOST_HZ=60/GHOST_STEP;    // ... altså 20 punkter i sekundet
const GHOST_FIELDS=4;            // x, y, vinkel og tilbakelagt runde per punkt
const GHOST_VER=1;               // formatversjon i localStorage
// HVORFOR 20 Hz og ikke ett punkt per fysikksteg: en runde på 90 s er 5400
// steg, og med fire tall per steg blir det en JSON-streng på over en halv
// megabyte — i et localStorage som deles med alle de andre spillene i
// katalogen. Mellom punktene interpoleres det lineært, og en bil som flytter
// seg rundt 6 px på de 50 ms et punktintervall varer, har ingen knekk stor nok
// til å avsløre at punktene ligger så spredt.
const GHOST_MAX=4800;            // tak på 240 s runde, se lagreGhostRunde()
// HVORFOR 0,36 og ikke 0,35: spøkelset er hvitt oppå asfalten, og 35 % hvitt
// blandet med ASPHALT gir #7a7a82 — 2,94:1, altså rett UNDER prosjektets
// 3:1-krav for en bil mot banedekket. 36 % gir #7c7c83 og 3,03:1. De to er
// ikke til å skille med øyet, men bare den ene består kravet.
const GHOST_ALPHA=0.36;
// Flat hvit, ikke en lysnet utgave av din egen lakkering: lå spøkelset i dine
// farger, var det umulig å se hvem som var hvem i en sving der de to ligger
// oppå hverandre — og det er nettopp DER du leser av hvem som kjører best
// linje. Formen er den samme bilformen som alt annet bruker (drawCarStatic),
// slik at det er LINJA og ikke silhuetten som skiller dem.
const GHOST_LIVERY={base:'#ffffff',acc:'#ffffff',dark:'#ffffff',hel:'#ffffff',spc:'#ffffff',pat:'solid'};
const GHOST_COL='#f8fafc';       // spøkelsets farge i HUD-en og i toastene
// Teksten i spøkelsespanelet. HVORFOR ikke ledertavlas egne toner: panelet har
// samme bakgrunn som ledertavla — rgba(5,7,10,.78) oppå asfalten, altså #0f1115
// — og der måler ledertavlas #475569 bare 2,49:1 og #64748b 3,97:1. Begge er
// under 4,5:1-kravet for 9 px tekst. Den dempede tonen er målt til det dimmeste
// som faktisk består (#707f96 = 4,65:1), ikke til det som så dempet nok ut.
const GHOST_TXT='#94a3b8';       // 7,37:1 — overskrift når spøkelset er på
// Avslått tilstand kan ikke vises ved å dempe under lesbarhetsgrensa, så det er
// TEKSTEN som bærer forskjellen («G AV» / «G PÅ»); denne tonen er bare et hint.
const GHOST_TXT_DIM='#707f96';   // 4,65:1 — avslått overskrift, rundetid, Δ-strek

let ghostOn=true;        // slås av og på med G
let ghostRec=[];         // punktene i runden som kjøres nå
let ghostLap=null;       // {t, pts} — beste lagrede runde for denne banen og modusen
let ghostSpr=null;       // den hvite sprite-en
let ghostDist0=0;        // raceDist da inneværende runde begynte
let ghostProgMax=0;      // største tilbakelagte del av runden, se ghostDelta()
let ghostNextT=0;        // raceTime for neste punkt som skal tas opp

// Nøkkelen skiller på bane OG modus: realistisk og casual har ulik toppfart og
// ulikt grep, så en tid satt i den ene er ikke en tid det er meningsfullt å
// jage i den andre.
function ghostKey(){ return `gp_ghost_${TR.name}_${REALISTIC?'REALISTISK':'CASUAL'}`; }

// Både lesing og skriving må tåle at lagring er blokkert: i privat modus, med
// avslåtte cookies eller full kvote kaster selve localStorage-oppslaget. Da
// skal øvingen gå videre uten spøkelse, ikke dø på en hvit skjerm.
function lesGhost(){
  let raa=null;
  try { raa=localStorage.getItem(ghostKey()); }
  catch(e){ return null; }
  if(!raa) return null;
  try {
    const d=JSON.parse(raa);
    // Ukjent eller manglende versjon: kjør uten spøkelse framfor å tolke tall
    // vi ikke kjenner rekkefølgen på. Et punkt er fire tall, så en liste som
    // ikke går opp i fire er ødelagt uansett hva versjonen sier.
    if(!d || typeof d!=='object' || d.v!==GHOST_VER) return null;
    if(typeof d.t!=='number' || !(d.t>0) || !Array.isArray(d.pts)) return null;
    if(d.pts.length%GHOST_FIELDS!==0 || d.pts.length<GHOST_FIELDS*2) return null;
    if(d.pts.some(n=>typeof n!=='number' || !isFinite(n))) return null;
    return {t:d.t, pts:d.pts};
  } catch(e){ return null; }
}

function skrivGhost(t,pts){
  try { localStorage.setItem(ghostKey(),JSON.stringify({v:GHOST_VER,t:+t.toFixed(3),pts})); }
  catch(e){ /* lagring blokkert eller kvoten full — spøkelset lever da bare ut økten */ }
}

// Nullstilling ved rundestart. ghostDist0 er raceDist i det runden begynte, og
// det er DEN runden regnes fra. HVORFOR raceDist og ikke curProg: raceDist er
// sammenhengende og vet om rundeskiftet, mens curProg hopper fra 0,99 til 0,00
// ved streken — samme grunn som recordGapMarks bruker den.
// Punkt nummer 0 tas med én gang, altså posisjonen i det runden begynner.
// Uten det ville punkt 0 på øktas FØRSTE runde blitt posisjonen tre steg inn
// (det tar tre steg før neste punkt er ventet), mens det på alle senere runder
// er posisjonen på streken — og da betyr ikke punkt i det samme tidspunktet
// fra runde til runde.
function nyGhostRunde(c){
  ghostRec=[]; ghostProgMax=0; ghostDist0=c.raceDist; ghostNextT=raceTime;
  tickGhost(c);
}

// Ett skritt av opptaket. Punktene lagres som heltall, og det er de SAMME
// tallene som spilles av i minnet. HVORFOR det er viktig: hadde avrundingen
// bare skjedd på vei til localStorage, ville spøkelset flyttet seg litt i det
// du lastet siden på nytt, og en Δ-tid som endrer seg uten at du har kjørt
// annerledes er en feil ingen klarer å forstå. 1 px og 0,001 rad er dessuten
// langt under det som er synlig på en bil som er 28 px lang.
//
// Det er ALLTID den største tilbakelagte delen som lagres, aldri den
// øyeblikkelige. Da er punktlista garantert stigende, og halveringssøket i
// ghostDelta() har et sortert grunnlag å lete i.
//
// ghostNextT er tidspunktet neste punkt er ventet, og den økes med GHOST_STEP
// i stedet for å settes til raceTime+GHOST_STEP: da ligger punktene på et fast
// rutenett, og punkt i er garantert tiden i/GHOST_HZ inn i runden. Den er
// samtidig sperra mot å ta opp det samme punktet to ganger på steget runden
// skifter — der kalles tickGhost() både av nyGhostRunde() og av update().
function tickGhost(c){
  const d=c.raceDist-ghostDist0;
  if(d>ghostProgMax) ghostProgMax=d;
  if(raceTime<ghostNextT) return;
  if(ghostRec.length>=GHOST_MAX*GHOST_FIELDS) return;
  ghostNextT+=GHOST_STEP;
  ghostRec.push(
    Math.round(c.x), Math.round(c.y),
    Math.round(wrapPi(c.angle)*1000),
    Math.round(ghostProgMax*1e5)
  );
}

// Kalles bare for runder som ER gyldige — slettede runder kommer aldri hit.
// Returnerer om runden ble den nye rekorden.
function lagreGhostRunde(t){
  const n=ghostRec.length/GHOST_FIELDS;
  if(n<2) return false;
  // Runden traff taket, så punktene dekker bare de første 240 sekundene. Et
  // halvt spøkelse er verre enn ingen: det ville forsvunnet midt på banen.
  if(n>=GHOST_MAX) return false;
  if(ghostLap && t>=ghostLap.t) return false;
  ghostLap={t, pts:ghostRec.slice()};
  skrivGhost(t,ghostLap.pts);
  return true;
}

// Posisjonen spøkelset hadde t sekunder inn i runden sin. null når t er forbi
// slutten — da er spøkelset i mål, og borte fra banen til du selv krysser
// streken og runden begynner på nytt.
function ghostPose(t){
  if(!ghostLap) return null;
  const pts=ghostLap.pts, n=pts.length/GHOST_FIELDS;
  const f=t*GHOST_HZ;
  if(!(f>=0) || f>n-1) return null;
  const i=Math.min(n-2,Math.floor(f)), u=f-i;
  const a=i*GHOST_FIELDS, b=a+GHOST_FIELDS;
  const a0=pts[a+2]/1000, a1=pts[b+2]/1000;
  return {
    x: pts[a]  +(pts[b]  -pts[a]  )*u,
    y: pts[a+1]+(pts[b+1]-pts[a+1])*u,
    // Vinkelen må interpoleres den KORTE veien rundt: fra +3,14 til −3,14 rad
    // er 0,003 rad over π-skillet, ikke 6,28 rad tilbake. Uten wrapPi her
    // snurret spøkelset én gang helt rundt hver gang det passerte det skillet,
    // altså på det ene punktet på banen der bilen peker rett «bakover».
    ang: a0+wrapPi(a1-a0)*u
  };
}

// Δ-tid: din tid minus tiden spøkelset brukte på å komme like langt. Negativ
// betyr at du leder. Målt på TILBAKELAGT RUNDE og ikke på klokka, fordi det er
// det samme spørsmålet en tidtakingsskjerm svarer på: hvem var først hit?
function ghostDelta(t){
  if(!ghostLap) return null;
  const pts=ghostLap.pts, n=pts.length/GHOST_FIELDS;
  const q=ghostProgMax*1e5;
  if(q<=pts[3]) return null;                    // ikke forbi spøkelsets første punkt ennå
  const sisteProg=pts[(n-1)*GHOST_FIELDS+3];
  // Du har kommet lenger enn spøkelset rakk før det var i mål. Da er svaret
  // ferdig kjent: differansen mot hele rundetiden dens.
  if(q>=sisteProg) return t-ghostLap.t;
  let lo=0, hi=n-1;
  while(hi-lo>1){
    const mid=(lo+hi)>>1;
    if(pts[mid*GHOST_FIELDS+3]<=q) lo=mid; else hi=mid;
  }
  const p0=pts[lo*GHOST_FIELDS+3], p1=pts[hi*GHOST_FIELDS+3];
  const u=p1>p0 ? (q-p0)/(p1-p0) : 0;
  return t-(lo+u)/GHOST_HZ;
}

// Lading med runde-tak. Returnerer hvor mye som faktisk kom inn, slik at
// endeplatelyset kan slutte å blinke når taket er nådd — et lys som sier
// «lader» mens ingenting lades, ville vært en direkte løgn om spillreglene.
function chargeBattery(c,amount){
  const rom=Math.min(amount, LAP_CHARGE_CAP-c.lapCharge, 100-c.battery);
  if(rom<=0) return 0;
  c.battery+=rom; c.lapCharge+=rom;
  return rom;
}
function canCharge(c){ return c.lapCharge<LAP_CHARGE_CAP && c.battery<100; }

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function update(){
  // decay / animate regardless of state
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life-=p.d;return p.life>0;});
  texts=texts.filter(t=>{t.y+=t.vy;t.life-=.018;return t.life>0;});
  toasts=toasts.filter(t=>{t.life-=.01;return t.life>0;});
  if(shake>0){shake*=.85; if(shake<.08)shake=0;}
  if(state==='win'){ winTimer++; confetti=confetti.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.vy+=.02;return f.y<H+20;}); }

  if(state==='countdown'){
    cntTimer--; if(cntTimer<=0) state='playing';
    return;
  }
  if(state!=='playing' && state!=='practice') return;
  raceTime++;

  cars.forEach(c=>{
    // Biler i mål kjører videre på avkjølingsrunde i stedet for å returnere
    // her. De beholder AI-styringen (så de følger banen), men farten settes
    // ned og boosten slås av der AI-en bestemmer seg, lenger ned. Kollisjon
    // var de alt tatt ut av — se de tre o.finished-sjekkene.
    if(c.finished){
      if(c.coolDone) return;           // ferdig utonet: ikke tegn, ikke regn
      const kjort=c.raceDist-c.finishDist;
      if(kjort>=COOL_LAPS){ c.coolDone=true; c.coolAlpha=0; return; }
      const f=(kjort-COOL_FADE_AT)/(COOL_LAPS-COOL_FADE_AT);
      c.coolAlpha=COOL_ALPHA*(1-Math.max(0,Math.min(1,f)));
    }
    let gas=false,steerL=false,steerR=false,brake=false,straightKey=false;
    if(c.isPlayer){
      gas=!!(keys['ArrowUp']||keys['w']||keys['W']);
      brake=!!(keys['ArrowDown']||keys['s']||keys['S']);
      steerL=!!(keys['ArrowLeft']||keys['a']||keys['A']);
      steerR=!!(keys['ArrowRight']||keys['d']||keys['D']);
      straightKey=!!(keys[' ']);
      // Boosten har sin egen tast (Shift), atskilt fra rett-modus (Space):
      // de to skal kunne stå på samtidig, for det er nettopp kombinasjonen
      // på en lang rett som er den store forbikjøringssjansen.
      c.boostActive=!!(keys['Shift']||keys['ShiftLeft']||keys['ShiftRight']) && c.battery>0;
    } else {
      const PN=TR.PN;
      const D=DIFFICULTIES[difficulty];
      const li=Math.floor(c.curProg*PN);

      // overtaking: scan for the closest car in a forward cone ahead. If one
      // is found, commit to passing it on one side for a short persistent
      // window (so the choice doesn't flip-flop frame to frame), and nudge
      // the steering target laterally so this car actually swings around the
      // blocker instead of just nose-to-tailing it via collision-separation.
      const cosA=Math.cos(c.angle), sinA=Math.sin(c.angle);
      // single pass over the field finds both a blocker ahead (to overtake)
      // and an attacker behind (to defend against) — genuine technique on
      // both sides of a fight, not just a one-way AI chasing the player.
      let blockerLat=0, blockerFound=false, blockerD=Infinity;
      let attackerLat=0, attackerFound=false, attackerD=Infinity;
      for(let bi=0;bi<cars.length;bi++){
        const o=cars[bi];
        if(o===c||o.finished) continue;
        const dx=o.x-c.x, dy=o.y-c.y, d=Math.hypot(dx,dy);
        if(d>OVERTAKE_RANGE) continue;
        const fwd=dx*cosA+dy*sinA, lat=-dx*sinA+dy*cosA;
        if(fwd>0 && fwd>=d*OVERTAKE_CONE){
          if(d<blockerD){ blockerD=d; blockerLat=lat; blockerFound=true; }
        } else if(fwd<0 && -fwd>=d*OVERTAKE_CONE && o.speed>c.speed*1.02){
          if(d<attackerD){ attackerD=d; attackerLat=lat; attackerFound=true; }
        }
      }
      if(c.overtakeT>0) c.overtakeT--;
      if(blockerFound){
        if(c.overtakeT<=0){
          // swing away from whichever side the blocker currently sits on; if
          // it's dead-center ahead, fall back to a stable per-car side bias
          // (driver #1 of each team defaults right, #2 defaults left).
          c.overtakeSide = Math.abs(blockerLat)>2 ? -Math.sign(blockerLat) : (c.num===1?1:-1);
        }
        // overtakeCommit: how long/decisively a tier holds the passing move —
        // a weak driver barely commits before bailing back onto the racing line.
        c.overtakeT=20+25*D.overtakeCommit;
      }
      const curvNow=Math.abs(TR.smoothCurv[li]);

      // real corner-speed planning: scan ahead (window grows with current
      // speed, like a real braking distance) for the sharpest upcoming bend.
      // maxCurv (signed-average TR.smoothCurv, same metric as always) drives
      // the normal corner-speed target further below — untouched, so normal
      // AI pace/tuning doesn't shift. maxSeverity (TR.severity, an UNSIGNED
      // local-turning-intensity metric — see computeHeadingCurv) specifically
      // flags genuine hairpin/chicane-grade corners, since a signed average
      // can net out deceptively low on a tight chicane's quick left-right-
      // left even though it's a hard corner. Used below to brake earlier and
      // stop swinging wide into exactly those corners, without changing how
      // the AI treats an ordinary medium-speed bend.
      const win=Math.round(20+c.speed*9);
      let maxCurv=0, maxSeverity=0;
      for(let k=0;k<win;k++){
        const idx=(li+k)%PN;
        const cv=Math.abs(TR.smoothCurv[idx]);
        if(cv>maxCurv) maxCurv=cv;
        const sv=TR.severity[idx];
        if(sv>maxSeverity) maxSeverity=sv;
      }
      const HAIRPIN_T=0.065; // severity level at which a corner genuinely counts as hairpin/chicane-grade
      const hairpinSev=Math.max(0,maxSeverity-HAIRPIN_T);

      // defending: react to an attacker closing from behind by moving to
      // cover that side — but only ever on a low-curvature stretch (a real
      // driver defends on the straight/braking zone, never mid-corner).
      // defendSkill sets both how often this tier even reacts, and (below)
      // how far it's willing to move to do it.
      if(c.defendT>0) c.defendT--;
      if(attackerFound && D.defendSkill>0 && Math.abs(curvNow)<0.012 && Math.random()<D.defendSkill*0.08){
        c.defendSide = Math.abs(attackerLat)>2 ? -Math.sign(attackerLat) : (c.num===1?1:-1);
        c.defendT=50;
      }

      // hairpinScale: the easy/cautious tiers (high curveK) already brake
      // hard for every corner by design — stacking the hairpin-specific
      // caution on top there just makes an already-slow AI crawl even more
      // without actually fixing anything (nothing was running wide there to
      // begin with). The confident tiers (low curveK — VANSKELIG/ULTRA) are
      // where "fires wide into a hairpin" is an actual real behaviour, so
      // that's where this fix should bite hardest. Scales down to ~1/8th on
      // ENKEL, full strength by curveK<=4 (VANSKELIG/ULTRA).
      const hairpinScale=Math.min(1,4/D.curveK);

      // curvAllow eases overtake/defend lateral swings not just mid-corner
      // (curvNow) but also on the APPROACH to an upcoming hairpin/chicane
      // (hairpinSev) — so cars stop lining up side-by-side ("four wide")
      // trying to out-brake each other right as a hairpin arrives.
      const curvAllow=1/(1+curvNow*D.curveK*1.5+hairpinSev*40*hairpinScale); // ease the swing off deep in tight corners
      const ramp=Math.min(1,c.overtakeT/20);
      const maxOvertakeOffset=TR.TW*0.5*D.overtakeCommit;
      const overtakeOffset = c.overtakeT>0 ? c.overtakeSide*maxOvertakeOffset*curvAllow*ramp : 0;
      const defendRamp=Math.min(1,c.defendT/25);
      const maxDefendOffset=TR.TW*0.4*D.defendSkill;
      const defendOffset = c.defendT>0 ? c.defendSide*maxDefendOffset*defendRamp*curvAllow : 0;

      // Hvitlinje-disiplin. AI-en hadde ingen: den planla farten mot FYSIKKEN,
      // der grusen fra TW til TW+GRAVEL_SAFE (23 px) er helt fartsnøytral, mens
      // REGELEN teller brudd alt fra TW+LIMIT_MARGIN (8 px). Mellom de to ligger
      // et 15 px bredt felt der en bil bryter banegrensene uten å tape noe som
      // helst, og en fartsoptimaliserende AI bor naturligvis der.
      //
      // Målingen var entydig: ARDENNE hadde 4,6–6,7 brudd per bil, men
      // offFracPerCar på 0–0,0006 — altså så godt som ingen tid forbi grusen.
      // Bilene lå ikke utenfor banen, de lå i gratisfeltet. SERPENTINA 8,9 og
      // DISCESA 2,6 på samme vis, mens ni baner lå på null.
      //
      // Korreksjonen er den en ekte sjåfør gjør: strammer linja når han merker
      // at han er på vei ut over linja. Den biter først 10 px INNENFOR linja, så
      // bilen rekker å svare før bruddet er et faktum, og styrker seg
      // proporsjonalt med hvor langt ute den er. Den står med vilje UTENFOR
      // curvAllow-dempingen som overtake/defend har: det er nettopp midt i
      // svingen, der curvAllow er lavest, at en bil skyter vidt.
      //
      // HVORFOR ikke lavere svingfart i stedet: farten er finstemt mot
      // spillerens toppfart (se baseMax/overspeed per nivå), og å senke den
      // ville flyttet hele balansen for å rette noe som er et linjeproblem.
      const keepIn=TR.TW-16;
      const over=Math.abs(c.lat)-keepIn;
      const lineKeep = over>0 ? -Math.sign(c.lat)*over*2.5 : 0;
      const lateralOffset = overtakeOffset+defendOffset+lineKeep;

      const lookI=(li+D.lookAhead)%PN;
      const [rtx,rty]=TR.raceLine[lookI];
      const hd=TR.heading[lookI];
      const tx=rtx-Math.sin(hd)*lateralOffset, ty=rty+Math.cos(hd)*lateralOffset;
      const da=Math.atan2(ty-c.y,tx-c.x);
      let diff=wrapPi(da-c.angle);
      steerL=diff<-D.steerPrec; steerR=diff>D.steerPrec;

      // occasional misjudged braking point — more frequent on easier tiers,
      // never happens on ULTRA. While active, the AI brakes far less than it
      // should for the upcoming corner, so it genuinely runs wide/off-track.
      if(c.mistakeT>0) c.mistakeT--;
      else if(D.mistakeChance>0 && Math.random()<D.mistakeChance) c.mistakeT=40;
      const effK = c.mistakeT>0 ? D.curveK*0.25 : D.curveK;
      // hairpin braking margin is only partially suppressed during a mistake
      // (not zeroed out like effK) — a misjudged hairpin should still mostly
      // play out like a genuine mistake, just a little less likely to end in
      // a full barrier shunt than before this fix.
      const hairpinExtra=hairpinSev*6*hairpinScale*(c.mistakeT>0?0.4:1);

      // straightPace er farten bilen ville holdt uten sving i det hele tatt.
      // Den trengs nedenfor for å kunne tynne ut gummistrikkens påslag i
      // svingene, og er samtidig teller i `corner`, så den beregnes bare én
      // gang her.
      const straightPace=c.skillVar*D.baseMax;
      // Lagres på bilen fordi svingtaket (cornerCap, nedenfor) må bygges på
      // farten UTEN svingreduksjon. `aiSpd` er alt redusert for svingen, så et
      // tak regnet av den ville straffet AI-en for samme sving to ganger.
      c.straightPace=straightPace;
      const corner=straightPace/(1+maxCurv*effK+hairpinExtra);

      // Gummistrikk, versjon 3: nesten usynlig.
      //
      // HVORFOR den ble strammet inn så kraftig: tidligere lå `rubberMul`
      // mellom 0,85 og 1,18. Siden spilleren ALLTID starter sist, og
      // referansepunktet er spillerens `raceDist`, betydde det i praksis at
      // hele feltet ventet på spilleren — de foran kjørte på 85 % fart, og de
      // bak fikk 118 % også gjennom svinger de ikke er stilt inn for. Et godt
      // innhentingssystem skal ikke nulle ut et godt kjørt løp, og spillere vil
      // kjøre under samme regler som de de kjører mot. Nå er spennet 0,97–1,03,
      // og den naturlige spredningen i feltet kommer i stedet fra `skillVar` og
      // `posFactor` i buildCars().
      const gap=c.raceDist-player.raceDist;
      // Taket på endringsraten gjør at utslaget bygger seg opp over sekunder,
      // ikke på et par bilder — ellers ville en bil som så vidt krysser
      // terskelen rykke merkbart til.
      const rRate=Math.min(D.rubberRate,0.0005);
      // De som ligger FORAN bremses først når forspranget er over en tredjedel
      // av en runde, og aldri under 0,99. Under det er avstanden et resultat av
      // løpet, ikke noe spillet skal reparere.
      const AHEAD_THRESH=0.35, AHEAD_FLOOR=0.99;
      let rTarget=0;
      if(gap>AHEAD_THRESH) rTarget=-rRate;
      else if(gap<-D.rubberThresh) rTarget=rRate;
      c.rubberMul=Math.max(.97,Math.min(1.03,c.rubberMul+rTarget));
      if(gap>0 && c.rubberMul<AHEAD_FLOOR) c.rubberMul=AHEAD_FLOOR;
      // ULTRA har ingen gummistrikk i det hele tatt: der er hele poenget at
      // feltet kjører på sin egen fart.
      if(D.name==='ULTRA') c.rubberMul=1;

      // Et påslag (rubberMul > 1) skal aldri løfte SVINGFARTEN. `corner` er
      // taket svingen tillater, og en bil som henger etter skal få ta igjen på
      // rettstrekkene — ikke ved å kaste seg inn i svingene fortere enn den er
      // stilt inn for. Derfor skaleres påslaget med hvor lite svingen alt har
      // tatt bort: cornerFrac er ~1 på rettstrekke (fullt påslag) og lite i en
      // hårnål (nesten ingenting).
      let rMul=c.rubberMul;
      if(rMul>1) rMul=1+(rMul-1)*(corner/straightPace);

      c.aiSpd=corner*rMul;
      gas = c.speed < c.aiSpd;
      brake = c.speed > c.aiSpd*D.overspeed;

      // Boost-bruk: et skarpere nivå (høyere ersSkill — feltnavnet står urørt,
      // siden DIFFICULTIES-konstantene ikke skal endres i dette steget) sparer
      // batteriet til det faktisk betyr noe (en kamp eller en rett strekning)
      // i stedet for å brenne det i det sekundet det er tilgjengelig.
      //
      // I overtake mode senkes reserven fra 25 til 5: hele poenget med
      // modusen er at den runden skal brukes på å angripe, og en AI som
      // fortsatt sparer på batteriet ville aldri fått noe igjen for den.
      const reserve = c.overtakeMode ? 5 : 25;
      c.boostActive = c.battery>reserve && (blockerFound||attackerFound||Math.abs(curvNow)<0.008)
        && Math.random()<(0.35+0.5*D.ersSkill);

      // Avkjølingsrunde: 55 % fart og ingen boost. Farten settes ved å skalere
      // c.aiSpd, for det er den ENE størrelsen både gass/brems her og taket
      // MAX lenger ned leser — da trenger ikke nedsettelsen gjentas to steder
      // og kan ikke komme i utakt med seg selv. Bremsen får ingen
      // overspeed-margin: bilen skal legge seg på den nye farten, ikke pendle.
      if(c.finished){
        c.aiSpd*=COOL_SPEED;
        gas   = c.speed < c.aiSpd;
        brake = c.speed > c.aiSpd;
        c.boostActive=false; c.overtakeMode=false; c.otPending=false;
      }
    }

    const near=nearestOnPath(TR.PATH,c.x,c.y);
    const dist=near.dist;

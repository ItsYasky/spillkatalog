    // Fortegnet på avstanden, langs samme normal (-sin h, cos h) som kjørelinja
    // og AI-ens sidesving bruker. Positiv = ute på den ene siden, negativ = den
    // andre; hvilken er uvesentlig, AI-en bruker den bare til å styre motsatt vei.
    {
      const hN=TR.heading[near.idx], pN=TR.PATH[near.idx];
      c.lat=-(c.x-pN[0])*Math.sin(hN)+(c.y-pN[1])*Math.cos(hN);
    }
    const wasOff=c.offtrack;
    // the gravel/runoff fringe (GRAVEL_SAFE px beyond the tarmac, see top of
    // file) is now a genuinely usable, pace-neutral part of the surface —
    // true off-track only starts once you're past the gravel, in the grass.
    c.offtrack = dist>TR.TW+GRAVEL_SAFE;
    const deepOff = dist>TR.TW*2.3+GRAVEL_SAFE;
    if(c.offtrack && !wasOff && c.isPlayer){
      toast('UTENFOR BANEN — taper fart!','#ef4444');
    }
    if(!c.offtrack && wasOff && c.isPlayer){
      toast('TILBAKE PÅ ASFALT','#4ade80');
    }
    // Banegrenser telles på den RÅ avstanden fra senterlinja, ikke på
    // c.offtrack. c.offtrack starter først utenfor grusen (TW+GRAVEL_SAFE),
    // mens den hvite linja ligger på TW — en bil kan altså være godt forbi
    // linja og fortsatt ikke være «offtrack» i fysikkens forstand.
    // !c.finished: en bil på avkjølingsrunde skal ikke kunne samle banegrenser.
    // Straffetiden går inn i finalTimeSec(), som finalizeResults() rangerer
    // etter — uten denne sperra kunne en bil som alt var i mål bli straffet
    // for å kjøre vidt på utrullingen og dermed falle på resultatlista
    // etterpå, for noe som ikke var en del av løpet.
    if((state==='playing'||state==='practice') && !c.finished) checkTrackLimits(c,dist);

    // stuck-in-gravel recovery (AI only) — if an AI car makes essentially no
    // lap progress for 3s straight (overshot a corner, wedged on the outer
    // wall, whatever the cause), snap it back onto the track centerline
    // instead of leaving it permanently stranded for the rest of the race.
    if(!c.isPlayer){
      c.stuckT--;
      if(c.stuckT<=0){
        if(c.raceDist-c.stuckRefDist<0.015){
          const [px,py]=TR.PATH[near.idx];
          c.x=px; c.y=py; c.angle=TR.heading[near.idx];
          c.speed=1.2; c.vx=Math.cos(c.angle)*1.2; c.vy=Math.sin(c.angle)*1.2;
          c.offtrack=false;
        }
        c.stuckRefDist=c.raceDist; c.stuckT=180;
      }
    }

    // Rett-modus: ingen avstandskrav og ingen ventetid — står du i den lilla
    // sonen og holder Space, er klaffene åpne. HVORFOR kravet om å ligge
    // innenfor ett sekund av bilen foran er borte: det gjorde rett-modus til
    // noe som bare skjedde i tette kamper, og i et felt på 20 biler med store
    // gap var det ofte ikke tilgjengelig en hel runde. Nå er det et verktøy man
    // alltid har, og det er bremsingen som koster — klaffene lukkes i det
    // bremsen røres, akkurat som de lukkes ved slutten av sonen.
    // `near.progress` og ikke `c.curProg`: curProg skrives først nederst i
    // loopen, så den holder forrige steg sin posisjon. Forskjellen er ett
    // bilde, men den gjorde at fysikken og HUD-en leste to ulike sannheter —
    // HUD-en tegnes ETTER update() og ser den nye verdien, så klaffene kunne
    // vises åpne et bilde etter at farten de ga var borte. Nå ser begge samme.
    const straightOn = !brake && inStraightZone(near.progress) && (c.isPlayer ? straightKey : true);
    c.straightMode = straightOn;

    // Batteriet: tappes mens boosten står på, lades tilbake under bremsing
    // (mest) eller bare ved å slippe gassen (lite). Ladingen går gjennom
    // chargeBattery() og ikke direkte på c.battery, fordi den må gjennom
    // runde-taket. c.boostActive er allerede avgjort over (spiller: Shift +
    // batteri; AI: sin egen vurdering) — her brukes den bare.
    const boostOn = c.boostActive && c.battery>0;
    c.boostActive = boostOn;
    if(boostOn) c.battery=Math.max(0,c.battery-BOOST_DRAIN);
    else if(brake) chargeBattery(c,BOOST_CHARGE_BRAKE);
    else if(!gas) chargeBattery(c,BOOST_CHARGE_COAST);
    // Rent kosmetisk avlesning av bremsingen, satt her fordi dette er det
    // eneste stedet `brake` finnes for BÅDE spiller og AI (spilleren leser
    // tastaturet øverst i loopen, AI-en bestemmer seg i sin egen gren). Ingen
    // fysikk leser c.braking — den finnes bare så bremselyset og det ladende
    // endeplatelyset kan tegnes uten å gjette seg til tilstanden.
    c.braking=brake;

    // slipstream/draft: sitting almost dead-straight behind another car cuts
    // drag and gives a tow — strongest right on their gearbox, fading out by
    // SLIP_RANGE, and only in a tight cone (not the wider overtake cone) so
    // it genuinely rewards lining up behind someone rather than being beside
    // them. Applies to player and AI alike, and only on reasonably straight
    // ground — a mid-corner "tow" isn't realistic so curvature kills it off.
    let slipStrength=0, slipTarget=null;
    {
      const cosA2=Math.cos(c.angle), sinA2=Math.sin(c.angle);
      for(let si=0;si<cars.length;si++){
        const o=cars[si];
        if(o===c||o.finished) continue;
        const dx=o.x-c.x, dy=o.y-c.y, d=Math.hypot(dx,dy);
        if(d>SLIP_RANGE||d<1) continue;
        const fwd=dx*cosA2+dy*sinA2;
        if(fwd<d*SLIP_CONE) continue;
        const s=Math.max(0,Math.min(1,(SLIP_RANGE-d)/(SLIP_RANGE-16)));
        if(s>slipStrength){ slipStrength=s; slipTarget=o; }
      }
      const curvHere=Math.abs(TR.smoothCurv[Math.floor(c.curProg*TR.PN)]||0);
      if(curvHere>0.02) slipStrength*=Math.max(0,1-(curvHere-0.02)*60);
    }
    c.slipstreamActive = slipStrength>0.05;
    c.slipTarget = c.slipstreamActive ? slipTarget : null;
    c.slipstreamT = c.slipstreamActive ? Math.min(1,c.slipstreamT+0.15) : Math.max(0,c.slipstreamT-0.08);

    const PLAYER_MAX=REALISTIC?PLAYER_MAX_REALISTIC:PLAYER_MAX_CASUAL;
    // `severity` og ikke `smoothCurv` her. HVORFOR: smoothCurv er det SIGNERTE
    // snittet over 21 punkter, og kommentaren ved computeHeadingCurv sier selv
    // at det målet kan nulle seg ut nær null i en chicane — det er nettopp
    // derfor severity ble laget. Brukt som fartstak arvet physSafe den
    // svakheten, og taket forsvant på de stedene banen faktisk svinger mest.
    // Målt: minste physSafe gikk fra 77–85 % av toppfarten til 68–79 %.
    // Alene flyttet byttet lite (de åpne banene har lav severity også) — det er
    // kombinasjonen med PHYS_SCRUB som gjør svingen dyr.
    const curvForPhys=TR.severity[Math.floor(c.curProg*TR.PN)]||0;
    // REALISTISK adds a universal physical grip-loss: a shared safe-speed
    // ceiling grounded in the track's actual curvature right under the car,
    // applied to player AND AI alike. Go in hotter than this and you
    // genuinely start losing the car — reduced steering authority and
    // reduced grip — no matter how good your reflexes are. CASUAL has no
    // such ceiling: steering alone can always carry the corner.
    const physSafe=PLAYER_MAX/(1+curvForPhys*PHYS_K);
    const overRatio=REALISTIC?Math.max(0,c.speed/physSafe-1):0;
    const turnPenalty=1/(1+overRatio*2.4);
    const gripPenalty=1/(1+overRatio*1.3);

    // Boosten gir lite toppfart (1,06, i overtake mode 1,09) men mye
    // akselerasjon — se accelMul nedenfor. HVORFOR fordelingen er sånn: en ren
    // toppfartsbonus merkes bare på de to-tre lengste rettstrekkene, mens
    // akselerasjonen merkes ut av hver eneste sving, og det er der et løp
    // faktisk avgjøres. Rett-modus er det motsatte: bare toppfart, og bare i
    // sonen, slik at de to systemene ikke blir to navn på samme ting.
    const boostMaxMul = boostOn ? (c.overtakeMode?BOOST_MAX_MUL_OT:BOOST_MAX_MUL) : 1;
    let MAX=(c.isPlayer?PLAYER_MAX:c.aiSpd)*(straightOn?STRAIGHT_MAX_MUL:1)*boostMaxMul*(1+slipStrength*0.10);
    let GRIP=0.82, accelMul=1, dragMul=1;
    if(c.offtrack){
      accelMul = deepOff? 0.28 : 0.45;
      MAX *= deepOff? 0.5 : 0.68;
      dragMul = deepOff? 0.90 : 0.95;
      GRIP = 0.6;
      if(Math.random()<.6) dust(c.x-Math.cos(c.angle)*8,c.y-Math.sin(c.angle)*8, deepOff?'rgba(122,108,84,.8)':'rgba(70,110,60,.7)');
      // Her lå det før `raceTime += 1.0` når spilleren var utenfor banen.
      // HVORFOR den er borte: raceTime er den GLOBALE løpsklokka, felles for
      // alle bilene. Å legge til tid der flyttet aldri spilleren én plass —
      // det eneste den gjorde var å forfalske runde- og sektortidene, og en
      // forfalsket sektortid kunne bli lagret som beste sektor. Farten
      // spilleren taper utenfor banen ligger i accelMul/MAX/GRIP rett over,
      // og det er den som faktisk er straffen. Sanksjonene for å kjøre
      // utenfor ligger nå i checkTrackLimits().
    }
    if(REALISTIC) GRIP*=gripPenalty;
    if(boostOn) accelMul*=BOOST_ACCEL_MUL;
    if(slipStrength>0) accelMul*=(1+slipStrength*0.12);

    if(REALISTIC){
      if(gas)    c.speed=Math.min(MAX,c.speed+.24*accelMul);
      else       c.speed*=.992;
      if(brake)  c.speed*=.82;
    } else {
      if(gas)    c.speed=Math.min(MAX,c.speed+.17*accelMul);
      else       c.speed*=.978;
      if(brake)  c.speed*=.86;
    }
    // Dekkene skrubber fart når bilen bærer mer inn i svingen enn den tåler.
    // Dette er den ENE linja som gjør svingen dyr for spilleren — se PHYS_SCRUB.
    //
    // MERK at taket her regnes av `MAX` og IKKE av physSafe over. Det var
    // nødvendig: physSafe bygges på PLAYER_MAX og vet ingenting om boost eller
    // rett-modus, så et skrubb mot den straffet bilen for å bruke 2026-reglene
    // på en RETT strekke. Målt ble toppfarten med Shift+Space 7,05 i stedet for
    // 7,62 — altså spiste skrubbet nesten hele rett-modusen, og da forsvinner
    // poenget med steg D. Med `MAX` som utgangspunkt er taket lik MAX på en
    // rett (krumning ~0, ingen straff i det hele tatt), mens det i en hårnål
    // ligger langt under og biter som det skal.
    //
    // physSafe beholdes uendret for turnPenalty/gripPenalty: der SKAL taket
    // være felles for alle biler og bygd på banens krumning alene, slik
    // kommentaren over sier.
    // Grunnlaget er bilens RETTSTREKKFART, ikke `MAX`. For spilleren er de to
    // det samme, men for AI-en er MAX bygd på `aiSpd`, som alt er redusert for
    // svingen — et tak regnet av den ville trukket fra for samme sving to
    // ganger og gjort AI-en kunstig treg uten at noe var galt.
    const capBase=(c.isPlayer?PLAYER_MAX:(c.straightPace||c.aiSpd))
      *(straightOn?STRAIGHT_MAX_MUL:1)*boostMaxMul*(1+slipStrength*0.10);
    const cornerCap=capBase/(1+curvForPhys*PHYS_K);
    if(REALISTIC && c.speed>cornerCap) c.speed/=(1+(c.speed/cornerCap-1)*PHYS_SCRUB);
    c.speed*=dragMul;
    c.speed=Math.max(0,Math.min(c.speed,MAX*1.02));

    // smoothed steering: instead of snapping the heading by a fixed amount
    // the instant a key is down, ease an angular velocity toward a target —
    // real steering-rack inertia instead of a twitchy on/off turn.
    // CASUAL: max rate just ramps in with current speed (no curvature-based
    // penalty). REALISTISK: full rate is available any time the car is under
    // the physical safe-speed ceiling above; overspeeding into a corner costs
    // steering authority on top of the grip loss, so a car that didn't brake
    // enough genuinely can't just steer its way out of it.
    const maxTurn=REALISTIC ? TURN_BASE*turnPenalty
      : 0.040*(0.32+0.68*Math.min(1,c.speed/((c.isPlayer?PLAYER_MAX:c.aiSpd))));
    const steerTarget=(steerR?1:0)-(steerL?1:0);
    c.steerVel=c.steerVel*0.80+steerTarget*maxTurn*0.20;
    c.angle+=c.steerVel;

    c.vx+=(Math.cos(c.angle)*c.speed-c.vx)*GRIP;
    c.vy+=(Math.sin(c.angle)*c.speed-c.vy)*GRIP;
    const preX=c.x+c.vx, preY=c.y+c.vy;
    // outer boundary: a genuine Armco barrier right past the gravel on
    // street circuits (TR.walls) — much tighter and far more punishing than
    // the generic "soft outer wall" every other track still uses way out at
    // TW*3.0. Scraping the barrier kills speed hard and visibly throws
    // orange sparks instead of the usual dust-coloured "ran out of grass".
    const farD=Math.hypot(preX-TR.PATH[near.idx][0],preY-TR.PATH[near.idx][1]);
    // wall threshold now reads the same per-point runoff-aware offset the
    // barrier is actually drawn at (TR.wallOffsArr, see buildTrack) instead
    // of one flat value — the -2 preserves the original render/collision gap.
    const wallThresh = TR.walls ? (TR.wallOffsArr[near.idx]-2) : TR.TW*3.0+GRAVEL_SAFE;
    if(farD>wallThresh){
      if(TR.walls){
        c.speed*=0.22; c.vx*=0.12; c.vy*=0.12;
        if(c.isPlayer) addShake(Math.min(14,c.speed*2.4+4));
        for(let i=0;i<10;i++){
          const a=Math.random()*Math.PI*2, s=Math.random()*3+1;
          particles.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.045,r:Math.random()*1.8+.8,clr:Math.random()<.5?'#fb923c':'#f1f5f9'});
        }
        if(!c.wallHit && c.isPlayer) toast('VEGGKONTAKT!','#f97316');
        c.wallHit=true;
      } else {
        c.speed*=0.5; c.vx*=0.35; c.vy*=0.35;
        if(c.isPlayer) addShake(Math.min(9,c.speed*1.6));
        for(let i=0;i<6;i++){
          const a=Math.random()*Math.PI*2, s=Math.random()*2.2+.5;
          particles.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.05,r:Math.random()*1.6+.6,clr:'#fde68a'});
        }
      }
    } else {
      c.wallHit=false;
      c.x=preX; c.y=preY;
    }

    // skid trail
    const slip=Math.abs(c.vx*Math.sin(c.angle)-c.vy*Math.cos(c.angle));
    if(slip>.42||c.speed>4.6){
      c.trail.push({x:c.x-Math.cos(c.angle)*7,y:c.y-Math.sin(c.angle)*7,life:.85,d:.02});
    }
    c.trail=c.trail.filter(t=>{t.life-=t.d;return t.life>0;});

    // Gnist fra rett-modus — lilla, samme farge som sonen på banen
    if(c.straightMode && Math.random()<.4){
      const a=c.angle+Math.PI+(Math.random()-.5)*.5;
      particles.push({x:c.x,y:c.y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,life:.6,d:.04,r:1.8,clr:'#c084fc'});
    }
    // Gnist fra boosten — cyan, og gull i overtake mode. Fargene er de samme
    // som endeplatelysene bruker, slik at man kan lese tilstanden til en bil
    // man ser forfra like godt som en man ser bakfra.
    if(c.boostActive && Math.random()<.5){
      const a=c.angle+Math.PI+(Math.random()-.5)*.5;
      particles.push({x:c.x,y:c.y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,life:.6,d:.04,r:1.8,clr:c.overtakeMode?OT_COL:'#38bdf8'});
    }

    // progress / lap / sector tracking
    const pr=near.progress;
    // continuous wrap-aware distance tracker for ranking/gap/stuck checks —
    // unlike lap+curProg, this never jumps at the start/finish crossing, so
    // it stays honest even before the anti-cheese seenHalf lap-gate below
    // has registered a real lap (see initRaceDist() in buildCars()).
    let dRace=pr-c.prevProg; if(dRace<-0.5)dRace+=1; else if(dRace>0.5)dRace-=1;
    c.raceDist+=dRace;
    recordGapMarks(c); // tidsstempel på tidtakingspunktene, se gapAhead()
    // Overtake mode avgjøres ÉN gang per runde, på vei inn mot mål.
    // HVORFOR et fast punkt og ikke en løpende sjekk: en løpende «gap < 1 s»
    // ville slått modusen av og på flere ganger i samme sving, og da hadde
    // verken spilleren eller AI-en kunnet planlegge bruken av energien.
    // Punktet ligger på 0,95 og ikke på selve mållinja fordi gapet må leses
    // FØR begge bilene krysser målet, ellers måler man mot en bil som
    // allerede har startet en ny runde. Svaret lagres og brukes ved
    // målpasseringen rett nedenfor.
    if(c.prevProg<OT_PROG && pr>=OT_PROG){
      const g=gapAhead(c);
      c.otPending = g!=null && g<OT_GAP_SEC;
    }
    c.curProg=pr;
    if(pr>.38&&pr<.62)c.seenHalf=true;
    const sOf=Math.min(2,Math.floor(pr*3));
    if(sOf!==c.sectorIdx && ((c.sectorIdx+1)%3)===sOf){
      const t=(raceTime-c.sectorStartT)/60;
      if(c.isPlayer){
        const sNum=c.sectorIdx+1;
        let clr='#f1f5f9';
        // I øvingsmodus kan runden bli slettet, og da skal heller ikke
        // sektorene i den stå som beste. Derfor legges tiden i en buffer og
        // skrives til bestSector FØRST når runden er fullført uten brudd (se
        // målpasseringen nedenfor). I løp finnes ingen sletting, så der
        // skrives den med én gang, som før. Den lilla fargen er i øving
        // dermed en antydning om at tiden ER best, ikke en bekreftelse.
        const wouldBeBest = t<bestSector[c.sectorIdx];
        if(wouldBeBest) clr='#c084fc';
        if(state==='practice') c.sectorBuf[c.sectorIdx]=t;
        else if(wouldBeBest) bestSector[c.sectorIdx]=t;
        toast(`SEKTOR ${sNum}: ${t.toFixed(2)}s`,clr);
      }
      c.sectorIdx=sOf; c.sectorStartT=raceTime;
    }
    if(c.prevProg>.88&&pr<.12&&c.seenHalf){
      c.lap++; c.seenHalf=false; c.sectorIdx=0; c.sectorStartT=raceTime;
      // raceTime ved hver målpassering. Resultatlista bruker de to siste for å
      // anslå når en bil som ennå ikke er ferdig ville kommet i mål.
      c.lapMarks.push(raceTime);
      // Ladebudsjettet nullstilles ved mål — hele poenget med taket er at det
      // er et budsjett PER RUNDE, ikke per løp.
      c.lapCharge=0;
      // Overtake mode gjelder én hel runde, så den settes (og dermed også
      // slås av) her, med svaret som ble målt på 0,95. De 25 ekstra enhetene
      // legges rett på batteriet og UTENOM c.lapCharge, slik at de kommer inn
      // også når ladetaket for runden alt er brukt opp — det er nettopp det
      // som skal gjøre modusen verdt noe sent i en runde.
      const hadOT=c.overtakeMode;
      c.overtakeMode=c.otPending; c.otPending=false;
      if(c.overtakeMode){
        c.battery=Math.min(100,c.battery+OT_BATTERY);
        if(c.isPlayer && !hadOT) toast('OVERTAKE AKTIV',OT_COL);
      }
      if(c.isPlayer){
        const ltNum=(raceTime-c.lapStartT)/60;
        const lt=ltNum.toFixed(2);
        c.lapStartT=raceTime;
        // En slettet runde skal ikke finnes i lapTimes i det hele tatt. Alt som
        // regner ut «beste runde» leser den lista, så da er den automatisk
        // utelatt overalt — også på resultatskjermen.
        const deleted = state==='practice' && c.lapHadViolation;
        if(deleted){
          toast(`RUNDE ${c.lap} SLETTET – BANEGRENSER`,'#ef4444');
        } else {
          c.lapTimes.push(lt);
          if(ltNum<bestLap) bestLap=ltNum;
          if(state==='practice'){
            for(let s=0;s<3;s++){
              const sb=c.sectorBuf[s];
              if(sb!=null && sb<bestSector[s]) bestSector[s]=sb;
            }
            toast(`RUNDE ${c.lap} FERDIG: ${lt}s`,'#38bdf8');
            if(lagreGhostRunde(ltNum)) toast('NYTT SPØKELSE',GHOST_COL);
          }
        }
        c.sectorBuf=[null,null,null];
        // Opptaket begynner på nytt enten runden ble stående eller slettet:
        // punktene fra en slettet runde skal ikke henge med inn i den neste.
        if(state==='practice') nyGhostRunde(c);
      }
      c.lapHadViolation=false;
      // !c.finished: avkjølingsrunden er bare en halv runde, så en bil rekker
      // ikke tilbake til streken — men sperra står her likevel, for uten den
      // ville en lengre COOL_LAPS overskrevet finishT med en ny, senere tid og
      // dermed flyttet bilen bakover på resultatlista.
      if(state==='playing' && !c.finished && c.lap>=LAPS){
        c.finished=true;
        c.finishT=raceTime;
        c.finishDist=c.raceDist;   // nullpunkt for avkjølingsrunden
        // MÅ settes her, ikke bare i avkjølingsgrenen øverst i løkken:
        // målpasseringen skjer ETTER den grenen i samme bilde, så en bil som
        // nettopp ble ferdig ville blitt tegnet ett bilde med alpha=1 og først
        // deretter hoppet til 0,40 — et synlig blaff i det bilen krysser
        // streken. Testen «gjennomsiktigheten starter på COOL_ALPHA» fanget det.
        c.coolAlpha=COOL_ALPHA;
        if(c.isPlayer){ finalizeResults(); state='win'; winTimer=0; buildPodiumCrowd(); if(player.finalPlace===1) spawnConfetti(); }
      }
    }
    // Opptaket står ETTER målpasseringen i denne løkka med vilje: krysses
    // streken dette steget, er opptaket alt nullstilt, og punktet havner som
    // punkt 0 i den nye runden i stedet for som siste punkt i den forrige.
    if(c.isPlayer && state==='practice') tickGhost(c);
    c.prevProg=pr;
  });

  // car-vs-car contact: prevents free pass-through so overtaking is a real,
  // contested act (bump and lose speed if a pass is misjudged).
  if(cars.length>1){
    for(let i=0;i<cars.length;i++){
      for(let j=i+1;j<cars.length;j++){
        const a=cars[i], b=cars[j];
        if(a.finished||b.finished) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), minD=15;
        if(d>0&&d<minD){
          const overlap=(minD-d)/2, nx=dx/d, ny=dy/d;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          a.speed*=.92; b.speed*=.92;
          a.vx-=nx*.4; a.vy-=ny*.4; b.vx+=nx*.4; b.vy+=ny*.4;
          // Begge bilene får nådevinduet, ikke bare den som ble dyttet: i en
          // berøring er det ikke mulig å avgjøre hvem som dyttet hvem, og det
          // er bedre å unnlate å straffe et brudd som kanskje var selvforskyldt
          // enn å straffe et som helt sikkert ikke var det.
          a.contactT=CONTACT_GRACE; b.contactT=CONTACT_GRACE;
          if(a.isPlayer||b.isPlayer) addShake(3);
        }
      }
    }
  }

  const ordered=[...cars].sort((a,b)=>b.raceDist-a.raceDist);
  ordered.forEach((c,i)=>c.place=i+1);
  // Naboene i kampen, brukt av gapAhead/gapBehind. Biler på avkjølingsrunde
  // tas ut av rekka her, slik at gapet hopper over dem i stedet for å slutte
  // å virke for alle som ligger bak.
  const racing=ordered.filter(c=>!c.finished);
  racing.forEach((c,i)=>{ c.aheadCar=racing[i-1]||null; c.behindCar=racing[i+1]||null; });
  ordered.forEach(c=>{ if(c.finished){ c.aheadCar=null; c.behindCar=null; } });
  camX+=(player.x-camX)*.14;
  camY+=(player.y-camY)*.14;
  camAngle+=wrapPi(player.angle-camAngle)*.12;
}

// ══════════════════════════════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════════════════════════════
// ── BILEN: 2026-generasjonen ──────────────────────────────────────
// Bilen er tegnet etter 2026-reglementet: kortere akselavstand (3400 mm mot
// 3600) og 100 mm smalere bil, ingen hjulbuer over forhjulene så hjulene står
// fritt, færre vingeelementer, og ingen bjelkevinge under bakvingen.
//
// Men den virkelige grunnen til omskrivingen er lesbarhet. Bilen er cirka
// 28 px lang på skjermen. Den gamle bilen stablet gradientfyll, glansstrek,
// halo-ring, diagonal sponsorstripe, nesetipp i aksentfarge, sidepod-gløder
// for boost og slipstream OG et plassnummer oppå hverandre innenfor de samme
// 28 pikslene. Hver detalj var fin alene; til sammen smeltet de til én grøtete
// flekk så snart bilen beveget seg, og to lag var ikke til å skille fra
// hverandre i fart. Den nye bilen bruker FÅ, STORE former med harde kanter og
// ÉN eneste skyggelegging (den flate lysflaten), slik at både silhuetten og
// lakkeringen fortsatt leses i full fart.
//
// Lokalt koordinatsystem: nesen peker mot +x, én enhet = én spillpiksel.
const CAR_SHADOW_COL='rgba(0,0,0,.3)';
const TYRE_COL='#141418';
const COCKPIT_COL='#0b0b0e';
const CAR_SHEEN='rgba(255,255,255,.14)';
const BRAKE_COL='#ff2a2a';
// Endeplatelysene på bakvingen. Fargene er navngitte konstanter fordi de er
// spillregler gjort synlige, ikke pynt: gull = overtake mode med boosten på,
// cyan = boost, blinkende rødt = bilen bremser og henter energi tilbake,
// mørk grå = av.
const EP_OFF='#3a3a44', EP_BOOST='#38bdf8', EP_CHARGE='#ff3b3b', EP_OVERTAKE=OT_COL;

// Karosseriet som ETT lukket, symmetrisk polygon. Det ligger i en egen
// funksjon og ikke inline, fordi nøyaktig samme bane brukes tre ganger per
// bil: som fyll, som klippemaske for mønsteret/sponsorflatene/lysflaten, og
// som strek for 'edges'-mønsteret. Ett sted å endre = ingen fare for at
// masken og fyllet sklir fra hverandre.
const BODY_PTS=[[14,0],[5,-1.8],[1.2,-2.7],[-0.6,-4.8],[-6.2,-4.4],[-10,-2],
                [-12,-1.4],[-12,1.4],[-10,2],[-6.2,4.4],[-0.6,4.8],[1.2,2.7],[5,1.8]];
function bodyPath(g){
  g.beginPath();
  g.moveTo(BODY_PTS[0][0],BODY_PTS[0][1]);
  for(let i=1;i<BODY_PTS.length;i++) g.lineTo(BODY_PTS[i][0],BODY_PTS[i][1]);
  g.closePath();
}
// roundRect finnes ikke i eldre nettlesere. Der faller vi tilbake til skarpe
// hjørner i stedet for å kaste en feil — en bil med firkantede dekk er langt
// bedre enn et spill som ikke tegner noe i det hele tatt.
function rrectFill(g,x,y,w,h,r){
  g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h);
  g.fill();
}

// Lakkeringsmønstrene. Alle tegnes i aksentfargen og klippet til karosseri-
// polygonet, slik at et mønster aldri kan lekke utenfor bilen uansett hvor
// grovt rektangelet eller streken er lagt opp.
function drawPattern(g,pat,acc){
  if(!pat||pat==='solid') return;
  g.save(); bodyPath(g); g.clip();
  g.fillStyle=acc; g.strokeStyle=acc;
  if(pat==='split')       g.fillRect(1.5,-6,14,12);          // front halv i aksent
  else if(pat==='spine')  g.fillRect(-13,-1.1,28,2.2);       // stripe langs midten
  else if(pat==='tail')   g.fillRect(-14,-6,9,12);           // bakre del i aksent
  else if(pat==='sash'){                                     // diagonal over sidepodene
    g.beginPath(); g.moveTo(1,-6); g.lineTo(4.2,-6); g.lineTo(-3.4,6); g.lineTo(-6.6,6);
    g.closePath(); g.fill();
  } else if(pat==='chevron'){                                // to piler bakover
    g.lineWidth=1.6; g.lineCap='butt'; g.lineJoin='miter';
    [-9.5,-5].forEach(cx=>{
      g.beginPath(); g.moveTo(cx-2,-3.2); g.lineTo(cx+1.2,0); g.lineTo(cx-2,3.2); g.stroke();
    });
  } else if(pat==='edges'){                                  // kant rundt hele bilen
    g.lineWidth=1.6; bodyPath(g); g.stroke();
  }
  g.restore();
}

// Sponsorflater. I spillstørrelse er tekst fullstendig uleselig, så sponsorene
// er rene fargeflater på de to stedene ekte biler faktisk selger: sidepodene
// og bakvingens hovedplan. Sidepod-flatene tegnes ETTER mønsteret (de skal
// ligge oppå det, som ekte dekaler) og klippes til karosseriet.
function drawSponsorPanels(g,spc){
  g.save(); bodyPath(g); g.clip();
  g.fillStyle=spc;
  g.fillRect(-5.4,-4.3,3.6,1.2);
  g.fillRect(-5.4,3.1,3.6,1.2);
  g.restore();
}

// Den STATISKE delen av bilen: alt som bare avhenger av lakkeringen og
// klaffstillingen, og derfor ser helt likt ut bilde etter bilde. Nøyaktig
// dette innholdet forhåndstegnes til en sprite (se makeCarSprite).
function drawCarStatic(g,lv,flapOpen){
  const base=lv.base, acc=lv.acc, dark=lv.dark, hel=lv.hel, spc=lv.spc||lv.hel;
  // Bakvinge: hovedplan → sponsorfelt → klaff. Klaffen ligger bakerst og blir
  // synlig smalere sett ovenfra når den åpnes, slik ekte aktiv aero ser ut.
  g.fillStyle=dark; g.fillRect(-13.8,-6,2.6,12);
  g.fillStyle=spc;  g.fillRect(-13.4,-4,1.8,8);
  g.fillStyle=acc;  if(flapOpen) g.fillRect(-13.8,-6,0.7,12); else g.fillRect(-14.2,-6,1.3,12);
  // Frontvinge: hovedplan + klaff. Vingene tegnes FØR karosseriet slik at
  // nesen legger seg oppå frontvingen, som på en ekte bil sett ovenfra.
  g.fillStyle=dark; g.fillRect(11.8,-6.4,1.8,12.8);
  g.fillStyle=acc;  g.fillRect(13.6,-6,flapOpen?0.5:1.1,12);
  // Karosseriet, mønsteret og sponsorflatene
  g.fillStyle=base; bodyPath(g); g.fill();
  drawPattern(g,lv.pat,acc);
  drawSponsorPanels(g,spc);
  // Den ENESTE skyggeleggingen på bilen: én flat, lys flate over den ene
  // halvdelen. Ingen gradient — en gradient på 28 px gjør bare lakkeringen
  // uskarp uten at noen ser at den er der.
  g.save(); bodyPath(g); g.clip();
  g.fillStyle=CAR_SHEEN; g.fillRect(-13,-6,28,4.6);
  g.restore();
  // Cockpit og hjelm. Hjelmen er det mest gjenkjennelige punktet på bilen i
  // spillstørrelse, derfor en lys farge rett oppå den nesten svarte cockpiten
  // — høy kontrast her er det som gjør at øyet finner bilens «hode» med én gang.
  g.fillStyle=COCKPIT_COL; g.beginPath(); g.ellipse(1.2,0,2.4,1.6,0,0,Math.PI*2); g.fill();
  g.fillStyle=hel; g.beginPath(); g.arc(0.8,0,1.4,0,Math.PI*2); g.fill();
}

// Skyggen skal peke samme vei i VERDEN uansett hvilken vei bilen kjører — sola
// står fast. Siden konteksten allerede er rotert med bilens vinkel, må
// forskyvningen roteres TILBAKE med samme vinkel før den brukes, ellers ville
// skyggen svingt rundt bilen som en viser hver gang bilen snudde.
function drawCarShadow(g,ang){
  const ca=Math.cos(ang), sa=Math.sin(ang);
  g.save();
  g.translate(1.5*ca+2.2*sa, -1.5*sa+2.2*ca);
  g.fillStyle=CAR_SHADOW_COL;
  rrectFill(g,-13,-7.8,27,15.6,4);
  g.restore();
}

// Hjulene tegnes live og ikke inn i sprite-en, fordi forhjulene må kunne
// svinge: et styrt forhjul er den tydeligste pekepinnen på hva en bil holder
// på med, og 2026-bilen har ingen hjulbuer som skjuler det.
function drawCarWheels(g,steer){
  g.fillStyle=TYRE_COL;
  rrectFill(g,-10.2,-9.1,6.4,4.4,1.3); // bakhjul, sentrum (-7,-6.9)
  rrectFill(g,-10.2, 4.7,6.4,4.4,1.3); // bakhjul, sentrum (-7, 6.9)
  for(let s=-1;s<=1;s+=2){
    g.save(); g.translate(7,6.2*s); g.rotate(steer);
    rrectFill(g,-2.6,-1.9,5.2,3.8,1.2);
    g.restore();
  }
}

// Endeplatelys + bremselys. Begge er live fordi de endrer farge/tilstand fra
// bilde til bilde og derfor ikke kan bakes inn i en sprite.
// a er alpha-faktoren fra drawCar (1 for alle biler som ikke er på
// avkjølingsrunde). Den trengs bare på bremselyset, som er det ene stedet her
// som setter alpha absolutt; de faste flatene over arver alpha fra konteksten.
function drawCarLights(g,epCol,braking,a){
  if(a===undefined) a=1;   // drawCarShape() tegner forhåndsvisningen uten faktor
  g.fillStyle=epCol;
  g.fillRect(-14.4,-6.9,2.4,0.9);
  g.fillRect(-14.4, 6.0,2.4,0.9);
  g.fillStyle=BRAKE_COL; g.fillRect(-14.9,-0.7,0.6,1.4);
  if(braking){
    g.save(); g.globalAlpha=.45*a; g.fillStyle=BRAKE_COL;
    g.beginPath(); g.arc(-14.6,0,2,0,Math.PI*2); g.fill();
    g.restore();
  }
}

// Fargen på endeplatelysene, i prioritert rekkefølge. Skrevet som en kjede av
// tidlige returer nettopp FORDI den skal utvides — gullfargen under er lagt
// inn som ett nytt `if` øverst, og ingen andre steder i tegnekoden trengte å
// vite at det kom en ny tilstand.
function endplateColor(c){
  // Gull står øverst og krever BÅDE overtake mode og boost på. HVORFOR ikke
  // gull på overtake mode alene: modusen varer en hel runde, og et lys som
  // står konstant gult i et helt minutt slutter å betyr noe. Gull akkurat i
  // det en bil faktisk bruker den ekstra energien er derimot et varsel om at
  // den kommer.
  if(c.overtakeMode && c.boostActive) return EP_OVERTAKE;
  if(c.boostActive) return EP_BOOST;
  // Blinker på 4 Hz: raceTime teller bilder à 1/60 s, så et halvt blink er
  // 60/(4*2) = 7,5 bilder. canCharge() er med fordi ladetaket per runde kan
  // være oppbrukt — da bremser bilen uten å hente noe tilbake, og et lys som
  // sier «lader» ville løyet om spillreglene.
  if(c.braking && canCharge(c)) return (Math.floor(raceTime/7.5)%2===0) ? EP_CHARGE : EP_OFF;
  return EP_OFF;
}

// steerVel er den faktiske vinkelhastigheten fysikken bruker, og ligger på
// maks ±TURN_BASE (0,046 rad per steg) — altfor lite til å se. Her skaleres
// den opp til et synlig utslag på ca. 0,38 rad ved fullt ratt. Dette er REN
// avlesning: fysikken er uendret, vi viser bare det den allerede gjør.
const STEER_VIS_MAX=0.38, STEER_VIS_GAIN=STEER_VIS_MAX/TURN_BASE;
function steerAngle(c){
  return Math.max(-STEER_VIS_MAX,Math.min(STEER_VIS_MAX,c.steerVel*STEER_VIS_GAIN));
}

// Lakkering = ett samlet sett farger pluss ett mønster. Både lagene og
// spillerens valgbare skins leverer det samme settet, slik at all tegnekode
// bare trenger å forholde seg til ÉN form for lakkering og aldri trenger å
// vite hvor fargene kom fra.
// Både SKINS og TEAMS leverer settet direkte nå, så det finnes ingen
// konvertering igjen — et lag ER en lakkering.
// Spillerlakkeringene har ingen egen sponsorfarge (`spc`) — der brukes
// hjelmfargen, som alltid er den lyseste fargen i settet og derfor leser som
// en dekal uansett hvilken grunnfarge bilen har.
function skinLivery(sk){
  return {base:sk.base, acc:sk.acc, dark:sk.dark, hel:sk.hel, spc:sk.spc||sk.hel, pat:sk.pat};
}
function liveryOf(c){
  const sk=c.isPlayer?skinAt(skinSel):null;
  if(sk && sk.base) return skinLivery(sk);
  return skinLivery(c.team);
}
// Lakkeringen som skal vises i menyene. STANDARD har ingen egne farger, så den
// må vise et lag — og det er hele poenget med STANDARD, at du kjører lagets bil.
function previewLivery(sk){
  if(sk.base) return skinLivery(sk);
  if(!playerIdent) rollPlayerIdent();
  return skinLivery(playerIdent.team);
}

// Den FELLES bilfunksjonen: tegner en hel bil med en gitt lakkering til hvilken
// som helst kontekst, i hvilken som helst skala. Brukes av forhåndsvisningen i
// baneutvalget, lagoversikten og podiet, slik at bilen de stedene garantert er
// den samme bilen du faktisk kjører — ikke en håndtegnet etterligning som sakte
// kommer ut av sync med den ekte.
function drawCarShape(g,lv,o){
  o=o||{};
  g.save();
  g.translate(o.x||0,o.y||0);
  g.rotate(o.angle||0);
  const sc=o.scale||1; g.scale(sc,sc);
  if(o.shadow!==false) drawCarShadow(g,o.angle||0);
  drawCarWheels(g,o.steer||0);
  drawCarStatic(g,lv,!!o.flapOpen);
  drawCarLights(g,o.epCol||EP_OFF,false);
  g.restore();
}

// ── forhåndstegnede sprites ───────────────────────────────────────
// Den statiske delen av bilen er identisk hvert eneste bilde, men besto av
// over tjue tegnekall med tre klippeoperasjoner. Med 20 biler ble det ~400
// kall per bilde på å tegne nøyaktig det samme om igjen. I stedet tegnes den
// ÉN gang per bil til en liten offscreen-canvas og kopieres med drawImage —
// standardrådet for gjentatte former på canvas.
// 3× oppløsning: sprite-en vises alltid nedskalert til 1× på banen, og
// nedskalering av et skarpt bilde gir ren antialiasing, mens oppskalering av
// et 1×-bilde ville gitt synlige trappetrinn når bilen roterer.
// To varianter per bil (klaffer lukket/åpen) — det er den eneste tilstanden i
// den statiske delen som endrer seg under løpet, og å gjøre den til to ferdige
// bilder er billigere enn å tegne vingen live for alle 20.
const CAR_SPR_HW=16, CAR_SPR_HH=9, CAR_SPR_RES=3;
let carSprites=[];
// WebKit frigjør først minnet bak en canvas når den krympes til 0×0 — å bare
// slippe referansen er ikke nok. Samme grep som for banebakgrunnen.
function freeCarSprites(){
  carSprites.forEach(s=>{ s.width=0; s.height=0; });
  carSprites=[];
}
function makeCarSprite(lv,flapOpen){
  const s=document.createElement('canvas');
  s.width=CAR_SPR_HW*2*CAR_SPR_RES; s.height=CAR_SPR_HH*2*CAR_SPR_RES;
  const g=s.getContext('2d');
  g.scale(CAR_SPR_RES,CAR_SPR_RES);
  g.translate(CAR_SPR_HW,CAR_SPR_HH);
  drawCarStatic(g,lv,flapOpen);
  carSprites.push(s);
  return s;
}
function buildCarSprites(){
  freeCarSprites(); // sprite-ene fra forrige løp skal ikke bli liggende
  cars.forEach(c=>{
    const lv=liveryOf(c);
    c.spr=[makeCarSprite(lv,false),makeCarSprite(lv,true)];
  });
}

// ── forhåndstegnet glød ───────────────────────────────────────────
// Alt mykt lys i spillet ble før laget på nytt for hvert eneste bilde, på to
// måter som begge er dyre:
//   • Lyktene på bilene brukte shadowBlur. Det er en ekte uskarphet som
//     canvas regner ut på nytt for hver form den tegner — fire lykter per
//     bil ganger tjue biler er åtti uskarpheter i sekstidelssekundet.
//   • Flomlysene kalte createRadialGradient inne i løkka, altså 27 nye
//     gradientobjekter per bilde som ble bygd, brukt én gang og kastet.
// Begge deler lager det samme: en rund flekk som er sterkest i midten og
// toner ut mot kanten. Den tegnes nå ÉN gang per farge til et lite offscreen-
// canvas og kopieres inn med drawImage i akkurat den størrelsen hvert lys
// trenger. Et radialt forløp er rotasjonssymmetrisk, så den samme sprite-en
// kan strekkes fra en 5 px lykt til et 46 px flomlys uten at noen ser det.
// 32×32 holder: et radialt forløp har ingen skarpe kanter, så det ser like
// mykt ut om det strekkes opp til 92 px for et flomlys som om det krympes ned
// til 8 px for en billykt. Større sprite kostet bare mer filtrering per kall.
const GLOW_RES=32; // sprite-en er GLOW_RES×GLOW_RES med gløden tegnet inn i sirkelen
function makeGlow(r,g,b){
  const cv=document.createElement('canvas');
  cv.width=GLOW_RES; cv.height=GLOW_RES;
  const q=cv.getContext('2d'), h=GLOW_RES/2;
  const grd=q.createRadialGradient(h,h,0,h,h,h);
  grd.addColorStop(0,'rgba('+r+','+g+','+b+',1)');
  grd.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  q.fillStyle=grd; q.fillRect(0,0,GLOW_RES,GLOW_RES);
  return cv;
}
// To varianter dekker alt: varmhvit brukes av frontlyktene OG flomlysmastene
// (samme lyse, litt gulaktige tone), rød av baklysene. Begge bygges én gang
// ved innlasting og lever hele økta — to 64×64-canvas er neglisjerbart minne,
// og de er like for alle baner, alle løp og alle tider på døgnet.
const GLOW_WHITE=makeGlow(255,250,220);
const GLOW_RED=makeGlow(255,60,45);
// Nattlysene på banene (opplyste vindu, havnelys, rullebanelys, neon) har flere
// farger enn de to bilene trenger, og hvilke farger det blir avgjøres av temaet
// — altså først når en bane bygges. De kan derfor ikke bygges ved innlasting
// som de to over. Spriten lages i stedet første gang en farge dukker opp og
// lever resten av økta: en bane bruker to–tre farger, så bufferet blir aldri
// stort, og en bane som bygges om igjen betaler ingenting andre gang.
const glowCache={};
function glowFor(hex){
  let g=glowCache[hex];
  if(!g){
    const n=parseInt(hex.slice(1),16);
    g=glowCache[hex]=makeGlow((n>>16)&255,(n>>8)&255,n&255);
  }
  return g;
}
// Tegner en glød sentrert i (x,y) med ytre radius `rad` og styrke `a`.
// Styrken settes med globalAlpha i stedet for egne sprites per intensitet,
// slik at det fortsatt bare finnes to bilder.
// Merk at alpha lagres og settes tilbake for hånd i stedet for med save()/
// restore(). Det er ikke pirk: save() tar en kopi av HELE tegnetilstanden —
// transformasjon, klipping, farger, linjestiler — og med fire lykter på tjue
// biler ble det 80 slike kopier per bilde. Målt isolert var det save/restore,
// ikke selve drawImage, som gjorde den første versjonen av denne funksjonen
// tregere enn shadowBlur-en den skulle erstatte.
function drawGlow(g,spr,x,y,rad,a){
  const prev=g.globalAlpha;
  g.globalAlpha=a;
  g.drawImage(spr,x-rad,y-rad,rad*2,rad*2);
  g.globalAlpha=prev;
}

// Hvor nær spilleren en AI-bil må være før plassnummeret vises. Nummeret lå før
// midt på karosseriet og dekket cockpiten — på en 28 px bil spiste det hele
// midtpartiet og skjulte hjelmen. Nå er det en egen liten etikett bak bilen,
// og den vises bare for biler du faktisk kjemper mot; ellers ville 19 etiketter
// ligget strødd utover banen og skjult selve løpet.
const AI_LABEL_DIST=160;

function drawCar(c){
  if(c.coolDone) return;   // i mål og ferdig utonet — bilen er ute av bildet
  const night=TOD[todIdx].night;
  // Avkjølingsrunden tegnes gjennomsiktig. A er en FAKTOR alle alpha-verdiene
  // i funksjonen ganges med, og er 1 for alle andre biler — altså uendret
  // tegning for dem.
  //
  // HVORFOR en faktor og ikke bare ctx.globalAlpha=... på toppen: funksjonen
  // setter alpha med absolutte verdier flere steder nedenfor (sporet, lysene,
  // slipstream-strekene), og hver av dem ville nullet ut en alpha satt på
  // toppen. Da ble resultatet en bil der karosseriet var gjennomsiktig mens
  // skyggen og lysene var massive — det leser som en grafikkfeil, ikke som en
  // bil på utrulling.
  const A=c.coolAlpha;
  c.trail.forEach(t=>{ ctx.globalAlpha=t.life*.22*A; ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.arc(t.x,t.y,2.6,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=A;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  drawCarShadow(ctx,c.angle);
  drawCarWheels(ctx,steerAngle(c));
  // Sprite-en dekker karosseri, mønster, sponsorflater, lysflate, cockpit,
  // hjelm og vingene. Faller tilbake til live tegning hvis den mangler (kan
  // skje for en bil som ikke gikk gjennom buildCarSprites).
  const spr=c.spr&&c.spr[c.straightMode?1:0];
  if(spr) ctx.drawImage(spr,-CAR_SPR_HW,-CAR_SPR_HH,CAR_SPR_HW*2,CAR_SPR_HH*2);
  else drawCarStatic(ctx,liveryOf(c),c.straightMode);
  drawCarLights(ctx,endplateColor(c),c.braking,A);
  if(night){
    // frontlyskjegle + lykter, bak-/baklys — rent visuelt, styrt av den globalt
    // valgte tiden på døgnet, ikke av noen tilstand på bilen selv.
    ctx.save(); ctx.globalAlpha=.3*A; ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(33,-6); ctx.lineTo(33,6); ctx.closePath(); ctx.fill();
    ctx.restore();
    // Lyktene: forhåndstegnet glød (se GLOW_WHITE/GLOW_RED) pluss en liten
    // hard kjerne oppå, slik at selve lyspunktet fortsatt leses som et punkt
    // og ikke bare som en uskarp flekk. Dette erstatter shadowBlur, som ga
    // nøyaktig samme uttrykk til en langt høyere pris.
    // Radius og styrke er prøvd ut mot den gamle shadowBlur-varianten på en
    // 5× forstørret bil: en bredere glød enn dette vasker ut forvingen helt,
    // og vingene er noe av det som gjør bilen lesbar i 28 px.
    drawGlow(ctx,GLOW_WHITE,12.7,-4.6,4.2,.45*A);
    drawGlow(ctx,GLOW_WHITE,12.7, 4.6,4.2,.45*A);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(12.7,-4.6,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12.7, 4.6,1,0,Math.PI*2); ctx.fill();
    drawGlow(ctx,GLOW_RED,-12.5,-4.6,3.8,.45*A);
    drawGlow(ctx,GLOW_RED,-12.5, 4.6,3.8,.45*A);
    ctx.fillStyle='#ff4444';
    ctx.beginPath(); ctx.arc(-12.5,-4.6,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-12.5, 4.6,1,0,Math.PI*2); ctx.fill();
  }
  if(c.slipstreamT>0.05){
    // luft som dras av bilen foran — korte streker rett bakover fra bakvingen,
    // flimrende slik at det leses som luftstrøm og ikke som faste linjer.
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.2;
    for(let k=0;k<3;k++){
      ctx.globalAlpha=c.slipstreamT*(0.35+Math.random()*0.55)*A;
      const yy=(k-1)*3.4;
      ctx.beginPath(); ctx.moveTo(-15,yy); ctx.lineTo(-21-Math.random()*6,yy+(Math.random()-.5)*2); ctx.stroke();
    }
    ctx.globalAlpha=A;
  }
  ctx.restore();
  // Plassnummeret: en skjermjustert etikett like bak bilen. Konteksten er
  // rotert med kameraet, så den roteres tilbake her for at teksten skal stå
  // rett opp og ned på skjermen uansett hvilken vei banen svinger.
  // Ikke under nedtellingen: plasseringene regnes først ut når løpet går, så
  // der ville hver eneste bil på startgriden fått etiketten «1» — tjue like
  // ettall strødd utover en grid som allerede viser rekkefølgen helt tydelig.
  if(!c.isPlayer && player && state!=='countdown' && Math.hypot(c.x-player.x,c.y-player.y)<AI_LABEL_DIST){
    const lx=c.x-Math.cos(c.angle)*17, ly=c.y-Math.sin(c.angle)*17;
    ctx.save(); ctx.translate(lx,ly); ctx.rotate(camAngle+Math.PI/2);
    const txt=String(c.place);
    ctx.font='bold 11px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const bw2=ctx.measureText(txt).width/2+4;
    ctx.fillStyle='rgba(5,7,10,.72)'; ctx.fillRect(-bw2,-7,bw2*2,14);
    ctx.fillStyle='#e2e8f0'; ctx.fillText(txt,0,0);
    ctx.restore();
  }
  // MÅ stå her: alpha er fortsatt A på dette punktet, og bilene tegnes etter
  // hverandre på samme kontekst. Uten nullstillingen ville den utonede bilen
  // gjort alle bilene som tegnes etter den gjennomsiktige også.
  ctx.globalAlpha=1;
}

// Spøkelset: ingen skygge, ingen hjul og ingen lys — bare karosserisilhuetten.
// HVORFOR: alt det andre er mørkt, og på 36 % synlighet leses mørke detaljer
// som hull i bilen i stedet for som deler av den. Silhuetten alene er dessuten
// det eneste du trenger for å sammenligne to linjer gjennom en sving.
function drawGhost(){
  const g=ghostPose((raceTime-player.lapStartT)/60);
  if(!g) return;
  ctx.save();
  ctx.globalAlpha=GHOST_ALPHA;
  ctx.translate(g.x,g.y); ctx.rotate(g.ang);
  ctx.drawImage(ghostSpr,-CAR_SPR_HW,-CAR_SPR_HH,CAR_SPR_HW*2,CAR_SPR_HH*2);
  ctx.restore();
}

// Flomlysets ytre radius, og hvor langt utenfor bildekanten en mast fortsatt
// må tegnes. Marginen er radiusen pluss mastehøyden (26) med litt slakk, slik
// at en mast rett utenfor kanten fortsatt rekker å kaste lyset sitt inn i
// bildet — kutter man for tett, blinker lyset på når masta kommer inn.
const FLOOD_R=46, FLOOD_MARGIN=FLOOD_R+34;

// Chase-cam: world is rotated so the player's heading always points "up"
// on screen, with the camera anchored behind/below the car (CHASE_Y).
function worldToScreen(wx,wy){
  const dx=wx-camX, dy=wy-camY;
  const rot=-(camAngle+Math.PI/2);
  const cs=Math.cos(rot), sn=Math.sin(rot);
  return [dx*cs-dy*sn+W/2, dx*sn+dy*cs+CHASE_Y];
}

function drawTrackScene(){
  ctx.save();
  ctx.translate(W/2,CHASE_Y);
  ctx.rotate(-(camAngle+Math.PI/2));
  ctx.translate(-camX,-camY);

  // Bakkeflisen legges FØR bakgrunnsbildet, inne i SAMME verdenstransform.
  // Det er hele poenget: mønsteret forankres da i verdenskoordinater, ikke i
  // skjermkoordinater, så det roterer og flytter seg med banen i stedet for å
  // gli under den når bilen svinger.
  //
  // Men den må fylles SMALT. Første versjon la et kvadrat rundt kameraet som var
  // stort nok i alle rotasjoner (hjørnet ligger 545 px ute på et 520×680 lerret)
  // og lot lerretsklippen ta resten — og bildetiden steg 1,3 ms (opp mot
  // 1,89 → 4,59 på VULCANO/NATT). Et roterende mønsterfyll er ikke gratis per
  // piksel: nettleseren må regne teksturkoordinatet gjennom transformen for hver
  // piksel, og her dekket den hele skjermen hvert bilde — også det meste av den,
  // der bakgrunnsbildet alt er helt dekkende og mønsteret ikke kan ses.
  //
  // Derfor: skjermhjørnene regnes tilbake til verden, og av den boksen trekkes
  // den delen av bakgrunnsbildet som er HELT ugjennomsiktig (omrisset minus
  // fjæra). Begge bokser er akseparallelle i verdensrommet, så differansen er
  // eksakt og blir opptil fire striper. Midt på banen ligger skjermen helt inne
  // i bildet, og da fylles ingenting i det hele tatt.
  if(TR.groundTile){
    const rot=-(camAngle+Math.PI/2), cs=Math.cos(rot), sn=Math.sin(rot);
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    [[0,HY],[W,HY],[0,H],[W,H]].forEach(p=>{
      const ex=p[0]-W/2, ey=p[1]-CHASE_Y;
      const wx=camX+ex*cs+ey*sn, wy=camY-ex*sn+ey*cs;
      if(wx<x0)x0=wx; if(wx>x1)x1=wx; if(wy<y0)y0=wy; if(wy>y1)y1=wy;
    });
    // Den dekkende delen av bildet. `bgMinX/bgMinY` er bildets hjørne i verden;
    // fjæra spises innenfra, så det ugjennomsiktige er omrisset krympet BG_FJAER.
    const dx0=TR.bgMinX+BG_FJAER, dy0=TR.bgMinY+BG_FJAER;
    const dx1=TR.bgMinX+TR.bgW-BG_FJAER, dy1=TR.bgMinY+TR.bgH-BG_FJAER;
    const striper=[];
    if(x0<dx0||x1>dx1||y0<dy0||y1>dy1){
      if(x0<dx0){ striper.push([x0,y0,Math.min(x1,dx0)-x0,y1-y0]); }
      if(x1>dx1){ const a=Math.max(x0,dx1); striper.push([a,y0,x1-a,y1-y0]); }
      const mx0=Math.max(x0,dx0), mx1=Math.min(x1,dx1);
      if(mx1>mx0){
        if(y0<dy0) striper.push([mx0,y0,mx1-mx0,Math.min(y1,dy0)-y0]);
        if(y1>dy1){ const b=Math.max(y0,dy1); striper.push([mx0,b,mx1-mx0,y1-b]); }
      }
    }
    if(striper.length){
      if(!TR.groundPat) TR.groundPat=ctx.createPattern(TR.groundTile,'repeat');
      // Nærmeste nabo, ikke bilineær. Flisen legges i skala 1:1 — én flispiksel
      // er én skjermpiksel — så filtreringen har ingenting å interpolere bort
      // fra. Målt gevinst er liten (VULCANO/NATT 0,50 → 0,40 ms, på kanten av
      // målerens 0,1 ms-oppløsning), men den er gratis. Må settes TILBAKE etter
      // fyllet: bakgrunnsbildet på de fire største banene tegnes med bgScale<1
      // og TRENGER utjevning for ikke å bli trappetrinnet.
      ctx.imageSmoothingEnabled=false;
      ctx.fillStyle=TR.groundPat;
      striper.forEach(s=>{ if(s[2]>0&&s[3]>0) ctx.fillRect(s[0],s[1],s[2],s[3]); });
      ctx.imageSmoothingEnabled=true;
    }
  }

  // Målstørrelsen er alltid banens fulle verdensstørrelse (bgW/bgH). For de
  // største banene er selve canvaset tegnet i redusert oppløsning (bgScale<1,
  // se buildTrackBg), og blir dermed skalert opp hit igjen; for alle andre er
  // dette identisk med å tegne canvaset i sin naturlige størrelse.
  ctx.drawImage(TR.bg, TR.bgMinX, TR.bgMinY, TR.bgW, TR.bgH);

  // ── track "life" layer: everything here is drawn fresh every frame in
  // world space (unlike the grandstands/trees/etc. baked into TR.bg once),
  // which is what lets it actually move — flags flutter, floodlights glow,
  // marshals wave, crowds flash cameras. Positions come from TR.flagPoles/
  // marshalPosts/floodlights/standRects, computed once in buildTrack.
  if(TOD[todIdx].night && TR.floodlights) TR.floodlights.forEach(f=>{
    // Culling: en bane har 27 flomlysmaster fordelt over hele runden, men bare
    // en håndfull er innenfor bildet om gangen. Før ble alle 27 tegnet med full
    // glød, mast og lampe hvert bilde — canvas måtte klippe bort hver eneste
    // piksel av de ~22 som lå utenfor. Marginen er gløden pluss mastehøyden, så
    // en mast like utenfor kanten fortsatt kaster lyset sitt inn i bildet.
    const sp=worldToScreen(f.x,f.y);
    if(sp[0]<-FLOOD_MARGIN||sp[0]>W+FLOOD_MARGIN||sp[1]<HY-FLOOD_MARGIN||sp[1]>H+FLOOD_MARGIN) return;
    drawGlow(ctx,GLOW_WHITE,f.x,f.y,FLOOD_R,.35);
    ctx.fillStyle='#1b1f29'; ctx.fillRect(f.x-1.6,f.y-26,3.2,26);
    ctx.fillStyle='#fff7cc'; ctx.beginPath(); ctx.arc(f.x,f.y-26,3,0,Math.PI*2); ctx.fill();
  });
  // Temaets egne lys: fyrtårnet og havnelysene på DUNA, vindusrekkene i
  // alpelandsbyen, rullebanelysene på DESERTO. Flaten er alt malt inn i
  // bakgrunnen, så dette legger BARE gløden oppå — og bare om natta, for på dag
  // er en lysflate uten glød nettopp det den skal være. Samme culling som
  // flomlysene, av samme grunn: taket er 150 lys per bane, og bare en håndfull
  // er innenfor bildet om gangen.
  if(TOD[todIdx].night && TR.nightLights) TR.nightLights.forEach(l=>{
    const sp=worldToScreen(l.x,l.y);
    const m=l.size+34;
    if(sp[0]<-m||sp[0]>W+m||sp[1]<HY-m||sp[1]>H+m) return;
    drawGlow(ctx,glowFor(l.clr),l.x,l.y,l.size,.5);
  });
  if(TR.flagPoles) TR.flagPoles.forEach((f,i)=>{
    ctx.save(); ctx.translate(f.x,f.y);
    ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,-20); ctx.stroke();
    const wave=Math.sin(raceTime*0.15+i*1.7)*2.5;
    ctx.beginPath();
    ctx.moveTo(0,-20); ctx.lineTo(13,-19+wave*0.4); ctx.lineTo(10,-16+wave);
    ctx.lineTo(13,-13+wave*0.4); ctx.lineTo(0,-12); ctx.closePath();
    if(f.checkered){
      ctx.save(); ctx.clip();
      for(let r=0;r<4;r++) for(let c=0;c<3;c++){
        ctx.fillStyle=(r+c)%2===0?'#f1f5f9':'#0a0a0a';
        ctx.fillRect(c*4.5,-20+r*2,4.5,2);
      }
      ctx.restore();
    } else { ctx.fillStyle=TR.walls?'#e10600':'#38bdf8'; ctx.fill(); }
    ctx.restore();
  });
  if(TR.marshalPosts) TR.marshalPosts.forEach((m,i)=>{
    ctx.save(); ctx.translate(m.x,m.y);
    ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(0,-10,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ea580c'; ctx.fillRect(-2,-8,4,7);
    const wv=Math.sin(raceTime*0.3+i*2.3)*4;
    ctx.strokeStyle='#78350f'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(6,-13+wv*0.3); ctx.stroke();
    ctx.fillStyle='#facc15';
    ctx.beginPath(); ctx.moveTo(6,-13+wv*0.3); ctx.lineTo(11,-12+wv); ctx.lineTo(6,-9+wv*0.3); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  if(TR.standRects) TR.standRects.forEach(r=>{
    if(Math.random()<0.018){
      const lx=(Math.random()-0.5)*r.w*0.8, ly=(Math.random()-0.5)*r.h*0.6;
      const tx=Math.cos(r.ang), ty=Math.sin(r.ang), nx=-Math.sin(r.ang), ny=Math.cos(r.ang);
      ctx.save(); ctx.globalAlpha=0.8; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(r.x+tx*lx+nx*ly, r.y+ty*lx+ny*ly,1.4,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });

  // animated racing line overlay
  ctx.save();
  ctx.strokeStyle='rgba(56,189,248,.8)'; ctx.lineWidth=2.2;
  ctx.setLineDash([8,10]); ctx.lineDashOffset=-raceTime*.6;
  ctx.beginPath();
  const rl=TR.raceLine;
  ctx.moveTo(rl[0][0],rl[0][1]);
  for(let i=1;i<rl.length;i++) ctx.lineTo(rl[i][0],rl[i][1]);
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.clr;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // slipstream tow-beam: a soft dashed line from a drafting car back to
  // whoever it's drafting off, so the effect reads visually and isn't just
  // a HUD number — brighter the stronger the current draft, gently pulsing.
  cars.forEach(c=>{
    if(c.slipstreamT>0.05 && c.slipTarget && !c.slipTarget.finished){
      ctx.save();
      ctx.globalAlpha=c.slipstreamT*0.4*(0.7+0.3*Math.sin(raceTime*0.4+c.num));
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.2;
      ctx.setLineDash([3,5]); ctx.lineDashOffset=-raceTime*1.3;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.slipTarget.x,c.slipTarget.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  });

  // Spøkelset tegnes FØR bilene, altså under dem. Det er en referanse å måle
  // seg mot, og en referanse skal aldri kunne legge seg oppå bilen du styrer.
  if(state==='practice' && ghostOn && ghostLap) drawGhost();

  // cars — already inside the camera transform, draw directly in world space.
  // Rekkefølgen er fortsatt «dårligst plassering nederst, lederen øverst», men
  // spilleren løftes ALLTID helt til topps til slutt. Uten det havnet din egen
  // bil under hver eneste AI-bil du lå bak — og det som faktisk ødela bildet
  // var ikke bilene, men plass-etikettene deres: etiketten tegnes 17 px bak
  // bilen den hører til, så en AI rett foran deg la en nesten ugjennomsiktig
  // boks midt oppå cockpiten din. På en bil som er 28 px lang forsvant hele
  // midtpartiet. Egen bil må alltid være synlig, uansett plassering.
  // sort() er stabil i moderne JS, så den andre sorteringen flytter bare
  // spilleren bakerst og lar AI-enes innbyrdes rekkefølge stå urørt.
  [...cars].sort((a,b)=>a.place-b.place).reverse()
           .sort((a,b)=>(a.isPlayer?1:0)-(b.isPlayer?1:0))
           .forEach(drawCar);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const shx=shake?(Math.random()-.5)*shake:0, shy=shake?(Math.random()-.5)*shake:0;
  ctx.save(); ctx.translate(shx,shy);

  ctx.fillStyle='#05070a'; ctx.fillRect(0,0,W,H);

  if(state==='menu'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const accent=REALISTIC?'#f59e0b':'#e10600';
    ctx.fillStyle=accent; ctx.font='bold 42px Courier New'; ctx.fillText('GRAND PRIX',W/2,H/2-150);
    ctx.fillStyle='#64748b'; ctx.font='10px Courier New';
    ctx.fillText(REALISTIC
      ? `mye høyere toppfart · ekte dekkgrep · ${TRACKS.length} baner · 20 sjåfører · 4 AI-nivåer`
      : `ekte GP-stil · ${TRACKS.length} baner · 20 sjåfører · øvingsmodus · 4 AI-nivåer`, W/2,H/2-122);
    // mode toggle — picked here on the main menu, before you ever touch
    // track-select, exactly where "before you enter the game" belongs.
    ctx.fillStyle='rgba(255,255,255,.04)'; ctx.fillRect(W/2-120,H/2-104,240,22);
    ctx.strokeStyle=accent; ctx.lineWidth=1.4; ctx.strokeRect(W/2-120,H/2-104,240,22);
    ctx.fillStyle=accent; ctx.font='bold 12px Courier New';
    ctx.fillText(`MODUS: ${REALISTIC?'REALISTISK':'CASUAL'}`,W/2,H/2-93);
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('TAB — bytt modus',W/2,H/2-76);
    ctx.fillStyle='#334155'; ctx.font='10px Courier New';
    // Sju rader nå, ikke seks. Linjeavstanden er kuttet fra 17 til 15 px og
    // starten flyttet 4 px opp, ellers hadde den siste raden landet oppå
    // setningen om grep/fart lenger nede (den står fast på H/2+56).
    [['↑ / W','Gass'],['↓ / S',REALISTIC?'Brems — kreves før svinger!':'Brems'],['← → / A D','Styr'],['SPACE','Rett-modus i lilla sone'],['SHIFT','Boost (batteri)'],['(auto)','Overtake: innenfor 1 s ved mål'],['(auto)','Slipstream tett bak andre']].forEach(([k,v],i)=>{
      ctx.fillStyle=accent; ctx.textAlign='right'; ctx.fillText(k,W/2-6,H/2-54+i*15);
      ctx.fillStyle='#64748b'; ctx.textAlign='left'; ctx.fillText(v,W/2+6,H/2-54+i*15);
    });
    ctx.fillStyle='#94a3b8'; ctx.font='11px Courier New'; ctx.textAlign='center';
    ctx.fillText(REALISTIC
      ? 'For mye fart inn i en sving = du mister grepet og kjører av.'
      : 'Utenfor banen = du mister fart og tid.', W/2,H/2+56);
    ctx.fillStyle=accent; ctx.font='bold 14px Courier New';
    ctx.fillText('ENTER — velg bane',W/2,H/2+84);
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H-20);
    ctx.restore(); return;
  }

  // ── lagoversikt ───────────────────────────────────────────────────────
  // Egen skjerm fordi sponsorene bare er fargeflater på bilen: i 28 px er det
  // fysisk umulig å lese et navn på en sidepod, så den eneste måten å faktisk
  // presentere lagene og sponsorene deres på er å gi dem plass et sted der de
  // ikke konkurrerer med selve løpet. To kolonner × fem rader, med den ekte
  // bilen tegnet i hver celle, slik at lakkeringen i oversikten er den samme
  // du møter på banen.
  if(state==='teams'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 18px Courier New';
    ctx.fillText('LAGOVERSIKT',W/2,36);
    ctx.fillStyle='#334155'; ctx.font='9px Courier New';
    ctx.fillText('10 lag · 20 sjåfører · L eller ESC lukker',W/2,54);
    const colW=248, rowH=112, y0=74;
    TEAMS.forEach((t,i)=>{
      const col=i%2, row=(i/2)|0;
      const cx0=8+col*(colW+8), cy0=y0+row*rowH;
      const mine=playerIdent&&playerIdent.team===t;
      // Ditt eget lag markeres med ramme, ikke med farge — fargen er opptatt
      // av lakkeringen og kan ikke også bety «dette er deg».
      ctx.fillStyle=mine?'rgba(225,6,0,.10)':'rgba(255,255,255,.03)';
      ctx.fillRect(cx0,cy0,colW,rowH-8);
      ctx.strokeStyle=mine?'#e10600':'#1e293b'; ctx.lineWidth=mine?2:1;
      ctx.strokeRect(cx0,cy0,colW,rowH-8);
      drawCarShape(ctx,skinLivery(t),{x:cx0+42,y:cy0+(rowH-8)/2,angle:-Math.PI/2,scale:2.2,shadow:false});
      const tx=cx0+84;
      ctx.textAlign='left';
      ctx.font='bold 12px Courier New'; ctx.fillStyle=teamInk(t.color);
      ctx.fillText(`${t.name} (${t.short})`,tx,cy0+20);
      ctx.font='9px Courier New'; ctx.fillStyle='#cbd5e1';
      ctx.fillText(t.sponsor,tx,cy0+36);
      ctx.fillStyle='#475569';
      ctx.fillText('Sponsorer:',tx,cy0+56);
      ctx.fillStyle='#64748b';
      ctx.fillText(t.sponsors[0],tx,cy0+70);
      ctx.fillText(t.sponsors[1],tx,cy0+84);
      ctx.textAlign='center';
    });
    // Bevisst ingen «ESC Katalog» her: på denne skjermen lukker ESC oversikten
    // og går tilbake til baneutvalget, ikke ut av spillet.
    ctx.restore(); return;
  }

  if(state==='trackselect'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // Skjermen er omorganisert fordi bil-forhåndsvisningen trenger ekte plass
    // (den er 74×46 px) og fordi lagvalget kommer til på toppen. Innstillingene
    // under karusellen står derfor i to kolonner i stedet for én lang stabel,
    // og karusellboksen er kortet ned fra 420 til 290 px — de nederste 160 av
    // dem var tom boks under baneteksten uansett.
    // Ingen tekst under 9 px: de to 8 px-linjene (baneteller og ESC-hintet) er
    // hevet til 9, som er grensen der Courier New fortsatt er til å lese.
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 20px Courier New'; ctx.fillText('VELG BANE',W/2,62);
    // mode reminder — chosen back on the main menu, just a small corner tag here
    ctx.textAlign='right'; ctx.font='bold 9px Courier New';
    ctx.fillStyle=REALISTIC?'#f59e0b':'#38bdf8';
    ctx.fillText(REALISTIC?'MODUS: REALISTISK':'MODUS: CASUAL',W-12,22);
    ctx.textAlign='center';
    ctx.fillStyle='#334155'; ctx.font='9px Courier New';
    ctx.fillText('← → bytt bane   ENTER kjør løp   P øvingskjøring',W/2,82);
    ctx.fillStyle='#1e293b'; ctx.font='9px Courier New';
    ctx.fillText(`BANE ${trackSel+1} / ${TRACKS.length}  ·  20 sjåfører på startgrid`,W/2,96);
    // Laget ditt er trukket allerede (rollPlayerIdent), så det kan vises her.
    // Plassen mellom banetelleren og karusellen var ledig fra før.
    {
      if(!playerIdent) rollPlayerIdent();
      ctx.font='bold 11px Courier New'; ctx.fillStyle=teamInk(playerIdent.team.color);
      ctx.fillText(`DITT LAG: ${teamFullName(playerIdent.team)}`,W/2,116);
      ctx.font='9px Courier New'; ctx.fillStyle='#334155';
      ctx.fillText('L — lagoversikt',W/2,130);
    }
    // carousel: only render prev/current/next out of all TRACKS, so the
    // 6-track (and growing) roster still fits the 520px-wide canvas.
    const N=TRACKS.length;
    [-1,0,1].forEach(d=>{
      const ti=((trackSel+d)%N+N)%N;
      const t=TRACKS[ti];
      const sel=d===0;
      const bx0=60+(d+1)*150, by0=142, bw0=130, bh0=290;
      ctx.fillStyle=sel?'rgba(225,6,0,.12)':'rgba(255,255,255,.03)';
      ctx.fillRect(bx0,by0,bw0,bh0);
      ctx.strokeStyle=sel?'#e10600':'#1e293b'; ctx.lineWidth=sel?2.5:1;
      ctx.strokeRect(bx0,by0,bw0,bh0);
      // mini track preview
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
      t.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
      const pw=bw0-20, ph=180;
      const sc=Math.min(pw/(maxX-minX),ph/(maxY-minY))*.92;
      const ccx=bx0+bw0/2, ccy=by0+30+ph/2;
      ctx.save();
      ctx.strokeStyle='#475569'; ctx.lineWidth=6; ctx.beginPath();
      t.PATH.forEach(([x,y],j)=>{
        const px=ccx+(x-(minX+maxX)/2)*sc, py=ccy+(y-(minY+maxY)/2)*sc;
        j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      });
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle=sel?'#38bdf8':'#334155'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
      ctx.fillStyle=sel?'#f1f5f9':'#64748b'; ctx.font='bold 13px Courier New';
      ctx.fillText(t.name,ccx,by0+ph+40);
      // t.info er en hel setning og var aldri smal nok til å få plass i en boks
      // på 130 px: den rant ut til begge sider og la seg oppå nabobanenes
      // tekst. Den brytes derfor på ordgrenser til bredden inne i boksen, så
      // hver bane holder seg på sin egen flate uansett hvor lang infoen er.
      ctx.fillStyle='#475569'; ctx.font='9px Courier New';
      const maxW=bw0-14, words=t.info.split(' '), lines=[];
      let cur='';
      words.forEach(w=>{
        const tryLine=cur?cur+' '+w:w;
        if(cur && ctx.measureText(tryLine).width>maxW){ lines.push(cur); cur=w; }
        else cur=tryLine;
      });
      if(cur) lines.push(cur);
      lines.forEach((ln,k)=>ctx.fillText(ln,ccx,by0+ph+56+k*11));
      // «RETT» og ikke «RETT-MODUS»: boksen er 116 px innvendig, og i 9 px
      // Courier er hvert tegn 5,4 px — altså plass til 21 tegn. Hele ordet
      // ville gjort linja 140 px og stukket ut av boksen på hver side. Det
      // samme skjedde med «DRS-soner» her tidligere.
      ctx.fillText(`Bredde ${t.TW*2}  ·  RETT ${t.straightZones.length}`,ccx,by0+ph+60+lines.length*11);
    });
    // ── AI difficulty ──
    {
      const D=DIFFICULTIES[difficulty];
      ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('↑ ↓ AI-nivå',W/2,448);
      ctx.fillStyle=D.clr; ctx.font='bold 12px Courier New'; ctx.fillText(`AI: ${D.name}`,W/2,462);
    }
    // ── two columns: distance on the left, time of day on the right ──
    // De sto før i én stabel nedover, men stabelen endte på y=662 og lot ikke
    // bil-forhåndsvisningen få plass noe sted. To kolonner frigjør ~56 px.
    const COL_L=140, COL_R=380;
    ctx.fillStyle='#334155'; ctx.font='9px Courier New';
    ctx.fillText('Q E rundelengde',COL_L,486);
    ctx.fillText('C V tid på døgnet',COL_R,486);
    ctx.fillStyle='#facc15'; ctx.font='bold 12px Courier New';
    ctx.fillText(`DISTANSE: ${LAPS} RUNDER`,COL_L,500);
    {
      const td=TOD[todIdx];
      ctx.fillStyle=td.clr; ctx.font='bold 12px Courier New';
      ctx.fillText(`TID: ${td.name}`,COL_R,500);
    }
    // ── skin selector ──
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('Z X bil-skin',W/2,518);
    {
      // Den gamle 16×10-fargeprøven sa ingenting om hvordan bilen faktisk ville
      // se ut — den viste to farger uten å vise hvor de havnet. Nå tegnes hele
      // bilen i valgt lakkering med den samme funksjonen som brukes på banen,
      // så det du ser her er nøyaktig det du får i løpet. Den koster 74×46 px,
      // og det er grunnen til at hele skjermen er omorganisert: navnet står til
      // venstre for bilen i stedet for over den, slik at linjeavstanden holder.
      const sk=skinAt(skinSel);
      ctx.fillStyle='#f1f5f9'; ctx.font='bold 12px Courier New'; ctx.textAlign='right';
      ctx.fillText(`SKIN: ${sk.name}`,250,556);
      drawCarShape(ctx,previewLivery(sk),{x:310,y:556,scale:2.5,shadow:false});
      ctx.textAlign='center';
    }
    ctx.fillStyle='#1e293b'; ctx.font='9px Courier New'; ctx.fillText('ESC Katalog',W/2,660);
    ctx.restore(); return;
  }

  // ── racing scene ──
  drawTrackScene();

  // time-of-day wash — screen-space (drawn after the camera-rotated world
  // content is done, so it's unaffected by camera rotation), clipped to just
  // the track viewport so it never tints the HUD bar above it.
  if(TOD[todIdx].overlay){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,HY,W,H-HY); ctx.clip();
    ctx.fillStyle=TOD[todIdx].overlay; ctx.fillRect(0,HY,W,H-HY);
    ctx.restore();
  }

  // ambient life: drifting birds over forest/mountain tracks, rising heat-
  // shimmer wisps over arid ones — screen-space, driven purely by raceTime
  // (no particle state to manage), so they just keep looping for free.
  if(TR.terrain==='forest'||TR.terrain==='mountain'){
    // Fuglene lå før i rene skjermkoordinater og fulgte derfor IKKE kameraet:
    // når bilen svingte sto de bom fast på skjermen, som om de var malt på
    // glasset, mens hele banen under dem roterte. Nå tegnes hele flokken i et
    // rom som roterer med kameraet, så de står stille i forhold til landskapet
    // og V-formen peker den veien fuglen faktisk flyr.
    // Valget: rotere med kameraet, ikke flytte dem til ekte verdenskoordinater.
    // Det ble klart minst kode — verdenskoordinater ville krevd egen tilstand
    // per fugl (de må jo holde seg i nærheten av bilen gjennom hele runden), og
    // de måtte tegnes inne i drawTrackScene, der nattoverlegget hadde mørknet
    // dem helt bort. Her beholdes de nøyaktig som før, bare i et rotert rom.
    // Posisjonene er nå målt fra midten av bane-visningen i stedet for fra
    // skjermkanten, og holdes innenfor en radius som er mindre enn halve
    // visningen, slik at rotasjonen aldri kan slenge en fugl ut av bildet.
    const vcx=W/2, vcy=HY+(H-HY)/2;
    ctx.save();
    ctx.translate(vcx,vcy);
    ctx.rotate(-(camAngle+Math.PI/2));
    ctx.globalAlpha=.55; ctx.strokeStyle='#1b1b22'; ctx.lineWidth=1.3; ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const t=raceTime*0.5+i*260;
      const bx2=(t%300)-150;
      const by2=-118+i*30+Math.sin(raceTime*0.04+i*2)*8;
      const flap=Math.sin(raceTime*0.35+i)*4;
      ctx.beginPath(); ctx.moveTo(bx2-5,by2+flap*.4); ctx.lineTo(bx2,by2-flap); ctx.lineTo(bx2+5,by2+flap*.4); ctx.stroke();
    }
    ctx.restore();
  } else if(TR.terrain==='arid'){
    for(let i=0;i<4;i++){
      const cyc=4200, ph=(raceTime*8+i*(cyc/4))%cyc, prog=ph/cyc;
      const hx=60+i*120+Math.sin(raceTime*0.02+i*3)*20;
      const hy=(H-14)-prog*(H-HY-30);
      ctx.save(); ctx.globalAlpha=(1-prog)*.18; ctx.fillStyle='#fcd9a8';
      ctx.beginPath(); ctx.ellipse(hx,hy,9+prog*10,4+prog*5,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // speed-lines vignette
  if(state==='playing'||state==='practice'){
    const pspd=Math.hypot(player.vx,player.vy);
    if(pspd>4.4){
      const amt=Math.min(1,(pspd-4.4)/2.4);
      ctx.save(); ctx.globalAlpha=amt*.45; ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1.2;
      const ccx=W/2, ccy=HY+(H-HY)/2;
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2+raceTime*.01;
        const r1=Math.max(W,H)*.46, r2=r1+14+amt*20;
        ctx.beginPath(); ctx.moveTo(ccx+Math.cos(a)*r1,ccy+Math.sin(a)*r1); ctx.lineTo(ccx+Math.cos(a)*r2,ccy+Math.sin(a)*r2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── top HUD bar ── (and everything else race-UI below it) is skipped
  // entirely once state==='win' — it used to just sit underneath the podium
  // overlay, which is only 88% opaque, so the old lap counter/speed/boost bar
  // and the leaderboard/minimap panels visibly bled through behind the
  // ceremony. Hiding this whole block is the real fix (bumping the overlay
  // to fully opaque would've worked too, but would've lost the subtle crowd/
  // track backdrop the win screen is drawn over).
  if(state!=='win'){
  ctx.fillStyle='rgba(5,7,10,.92)'; ctx.fillRect(0,0,W,HY);
  ctx.fillStyle=TEAMS[0].color; ctx.fillRect(0,HY-3,W,3);
  ctx.textBaseline='middle';
  if(state==='practice'){
    ctx.fillStyle='#38bdf8'; ctx.font='bold 14px Courier New'; ctx.textAlign='left'; ctx.fillText('ØVING',8,HY/2-5);
    // Beste GYLDIGE runde står fast i HUD-en. Rundetiden kommer ellers bare som
    // en toast som forsvinner, og i øving er hele poenget å jage én tid — da må
    // den man skal slå være synlig mens man kjører. Lilla er samme fargekode
    // som beste sektor bruker. Slettede runder er aldri med i bestLap.
    if(bestLap<Infinity){
      ctx.fillStyle='#c084fc'; ctx.font='bold 9px Courier New';
      ctx.fillText(`BESTE ${bestLap.toFixed(2)}s`,8,HY/2+11);
    }
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${player.lap+1}  ·  ${TR.name}`,W/2,HY/2-9);
  } else {
    const posLbl=`P${player.place}`;
    const posClr=player.place===1?'#4ade80':player.place===2?'#38bdf8':player.place===3?'#f97316':player.place<=10?'#f1f5f9':'#64748b';
    // P-merket er flyttet 5 px opp for å gi plass til tidsgapene under seg.
    // Toppfeltet er bare 50 px høyt, så dette er den eneste ledige linja som
    // ikke kolliderer med rundetelleren i midten eller farten til høyre.
    ctx.fillStyle=posClr; ctx.font='bold '+(player.place>=10?18:22)+'px Courier New'; ctx.textAlign='left'; ctx.fillText(posLbl,8,HY/2-5);
    // ── tidsgap, som på en tidtakingsskjerm ──
    // Begge gapene står på samme linje fordi det ikke finnes to ledige linjer
    // under P-merket. Fargen gjelder bare gapet FORAN: den sier om du tar inn
    // på bilen foran eller mister, sammenlignet med forrige runde på samme
    // punkt. Gapet bakover får ingen trendfarge — det er informasjon, ikke et
    // mål du jager.
    const gA=gapAhead(player), gB=gapBehind(player);
    ctx.font='bold 9px Courier New'; ctx.textAlign='left';
    let gx=8;
    if(gA!=null){
      ctx.fillStyle = player.gapTrend<0 ? '#4ade80' : player.gapTrend>0 ? '#ef4444' : '#94a3b8';
      const sA=`▲ +${fmtGap(gA)}`;
      ctx.fillText(sA,gx,HY/2+13);
      gx+=ctx.measureText(sA).width+9;
    }
    if(gB!=null){
      ctx.fillStyle='#94a3b8';
      ctx.fillText(`▼ −${fmtGap(gB)}`,gx,HY/2+13);
    }
    const displayLap=Math.min(player.lap+1,LAPS);
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${displayLap}/${LAPS}  ·  ${TR.name}  ·  ${DIFFICULTIES[difficulty].name}`,W/2,HY/2-9);
  }
  const ts=raceTime/60;
  ctx.fillStyle='#64748b'; ctx.font='9px Courier New';
  ctx.fillText(`${Math.floor(ts/60).toString().padStart(2,'0')}:${(ts%60).toFixed(2).padStart(5,'0')}`,W/2,HY/2+9);
  const spd=Math.round(Math.hypot(player.vx,player.vy)*56);
  const gear=Math.min(8,1+Math.floor(spd/48));
  ctx.fillStyle='#94a3b8'; ctx.font='bold 13px Courier New'; ctx.textAlign='right';
  ctx.fillText(`${spd} km/t  G${gear}`,W-8,HY/2-8);
  // Rett-modus. Står som «AERO» i HUD-en og ikke «RETT-MODUS»: feltet er bare
  // 24 px bredt mellom farten og boost-prosenten, og den lange varianten er
  // 66 px i 10 px Courier. AERO er dessuten det ordet som sier HVA man får —
  // åpne klaffer, mindre luftmotstand — der «rett-modus» bare sier hvor.
  const straightReady=inStraightZone(player.curProg);
  ctx.font='bold 10px Courier New'; ctx.textAlign='right';
  ctx.fillStyle = player.straightMode?'#c084fc' : straightReady?'rgba(168,85,247,.5)':'#334155';
  ctx.fillText('AERO',W-8,HY/2+9);
  // Boost-batteriet
  const batPct=Math.round(player.battery);
  ctx.fillStyle = player.boostActive?'#38bdf8' : batPct>50?'#4ade80' : batPct>20?'#f97316':'#ef4444';
  ctx.fillText(`BOOST ${batPct}%`,W-38,HY/2+9);
  // slipstream/tow indicator
  if(player.slipstreamT>0.05){
    ctx.fillStyle=`rgba(255,255,255,${0.5+0.5*player.slipstreamT})`;
    ctx.fillText('TOW',W-104,HY/2+9);
  }
  // Overtake mode. Gull, og lengst til venstre i rekka av indikatorer, fordi
  // den er den eneste av dem som gjelder en hel runde og ikke bare dette
  // øyeblikket — den hører sammen med rundetelleren, ikke med farten.
  if(player.overtakeMode){
    ctx.fillStyle=OT_COL;
    ctx.fillText('OVERTAKE',W-128,HY/2+9);
  }

  // off-track indicator
  if((state==='playing'||state==='practice') && player.offtrack){
    ctx.fillStyle='rgba(239,68,68,.9)'; ctx.font='bold 10px Courier New'; ctx.textAlign='center';
    ctx.fillText('UTENFOR BANEN',W/2,HY+16);
  }

  // ── banegrense-status ──
  // Bruddene kom bare som toast før, og en toast er borte etter halvannet
  // sekund. Står man på 3/3 er neste brudd +5 s, og det må være mulig å vite
  // UTEN å huske en melding fra fire svinger siden. Venstrestilt på x=8 fordi
  // «UTENFOR BANEN» er sentrert (spenner 221–299 px) — de to kan vises
  // samtidig, og da skal de ikke ligge oppå hverandre.
  if(state==='playing'||state==='practice'){
    ctx.textAlign='left'; ctx.font='bold 10px Courier New';
    if(state==='practice'){
      // I øving finnes ingen straff, bare sletting. Det nyttige å vite er om
      // runden man kjører NÅ allerede er tapt — da kan man la den gå og
      // begynne på nytt i stedet for å presse en tid som ikke blir stående.
      if(player.lapHadViolation){
        ctx.fillStyle='#ef4444'; ctx.fillText('RUNDEN SLETTES',8,HY+16);
      }
    } else if(player.warnFlag){
      // Svart-hvitt-flagget henger ute resten av løpet: det er en advarsel som
      // ikke nullstilles, og etter det koster hvert brudd tid. Flagget tegnes
      // som to ruter i stedet for tekst — det er sånn det ser ut på banen, og
      // to 7 px-ruter er lettere å oppfatte i periferien enn et ord.
      ctx.fillStyle='#f1f5f9'; ctx.fillRect(8,HY+10,7,7); ctx.fillRect(15,HY+17,7,7);
      ctx.fillStyle='#0b0e14'; ctx.fillRect(15,HY+10,7,7); ctx.fillRect(8,HY+17,7,7);
      ctx.fillStyle='#f1f5f9';
      ctx.fillText(player.penaltySec>0?`+${player.penaltySec}s`:'ADVARSEL',26,HY+18);
    } else if(player.limitViolations>0){
      ctx.fillStyle='#f97316'; ctx.fillText(`GRENSER ${player.limitViolations}/3`,8,HY+16);
    }
    ctx.textAlign='center';
  }

  // toasts
  toasts.forEach((t,i)=>{
    ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.fillStyle=t.clr; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(t.t,W/2,HY+34+i*16);
  });
  ctx.globalAlpha=1;

  // countdown overlay
  if(state==='countdown'){
    const sec=Math.ceil(cntTimer/60);
    const a=((cntTimer%60)/60);
    ctx.fillStyle=`rgba(5,7,10,${a*.5})`; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(sec>0){ ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.font=`bold ${80+a*20}px Courier New`; ctx.fillText(sec,W/2,H/2); }
    else { ctx.fillStyle='#4ade80'; ctx.font='bold 56px Courier New'; ctx.fillText('LIGHTS OUT!',W/2,H/2); }
  }

  // ── spøkelsespanel (øving) ──
  // Plassen ledertavla har i løp står tom i øving, og Δ-tiden hører hjemme
  // nettopp her og ikke i toppfeltet: feltet er bare 50 px høyt og alt fullt
  // (fart, gir, AERO, BOOST), mens Δ er tallet man leser hele tiden og derfor
  // trenger ro rundt. Samme ramme og samme x som ledertavla, slik at øyet
  // finner det på den plassen det er vant til at tall står.
  if(state==='practice'){
    const vis=ghostOn && !!ghostLap;
    const gx0=W-116, gy0=HY+8, gw=108, gh=vis?52:26;
    ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(gx0,gy0,gw,gh);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(gx0,gy0,gw,gh);
    ctx.textAlign='left'; ctx.font='bold 9px Courier New';
    ctx.fillStyle=ghostOn?GHOST_TXT:GHOST_TXT_DIM;
    ctx.fillText(ghostOn?'SPØKELSE  G AV':'SPØKELSE  G PÅ',gx0+6,gy0+11);
    if(vis){
      const d=ghostDelta((raceTime-player.lapStartT)/60);
      // Δ-en er det klart største tallet i panelet, for det er det eneste her
      // man leser i periferien mens man kjører. Grønt = du leder spøkelset.
      // Strek når du ennå ikke har kommet forbi spøkelsets første punkt — et
      // «+0,00» der ville vært et svar, og vi har ikke noe svar å gi ennå.
      ctx.font='bold 15px Courier New';
      if(d==null){ ctx.fillStyle=GHOST_TXT_DIM; ctx.fillText('—',gx0+6,gy0+28); }
      else {
        ctx.fillStyle = d<0 ? '#4ade80' : '#ef4444';
        ctx.fillText(`${d<0?'−':'+'}${Math.abs(d).toFixed(2)}`,gx0+6,gy0+28);
      }
      ctx.font='bold 9px Courier New'; ctx.fillStyle=GHOST_TXT_DIM;
      ctx.fillText(`RUNDE ${ghostLap.t.toFixed(2)}s`,gx0+6,gy0+44);
    }
    ctx.textAlign='center';
  }

  // ── leaderboard panel (top-right) ── with 20 cars on track, show only the
  // top 5 plus the player's own row (with a "···" gap) instead of all 20.
  if(state!=='practice'){
    const ordered=[...cars].sort((a,b)=>a.place-b.place);
    const top=ordered.slice(0,5);
    const rows = player.place<=5 ? top.map((c,i)=>({c,rank:i+1})) :
      [...top.map((c,i)=>({c,rank:i+1})), {gap:true}, {c:player,rank:player.place}];
    const lbX=W-116, lbY=HY+8, lbW=108;
    ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(lbX,lbY,lbW,18+rows.length*16);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(lbX,lbY,lbW,18+rows.length*16);
    ctx.fillStyle='#475569'; ctx.font='bold 8px Courier New'; ctx.textAlign='left'; ctx.fillText('LEDERTAVLE',lbX+6,lbY+11);
    rows.forEach((row,i)=>{
      const ry=lbY+24+i*16;
      if(row.gap){
        ctx.fillStyle='#334155'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
        ctx.fillText('···',lbX+lbW/2,ry); ctx.textAlign='left';
        return;
      }
      const c=row.c;
      // Samme lysning som lagnavnene: fargeruta ligger på den nesten svarte
      // HUD-boksen, ikke på asfalten, så den mørkeste lakken ville vært en
      // usynlig rute her.
      ctx.fillStyle=teamInk(c.team.color); ctx.fillRect(lbX+6,ry-5,8,8);
      ctx.fillStyle=c.isPlayer?'#f1f5f9':'#94a3b8'; ctx.font='bold 9px Courier New';
      ctx.fillText(`${row.rank}. ${c.isPlayer?'DU':c.team.short+' '+c.num}`,lbX+18,ry);
    });
  } else {
    ctx.fillStyle='rgba(5,7,10,.7)'; ctx.font='bold 8px Courier New'; ctx.textAlign='right';
    ctx.fillText('T bane-valg · R restart',W-8,HY+16);
  }

  // ── minimap (bottom-left) ──
  const mmX=10,mmY=H-92,mmS=82;
  ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(mmX-2,mmY-2,mmS+4,mmS+4);
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(mmX-2,mmY-2,mmS+4,mmS+4);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  TR.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});

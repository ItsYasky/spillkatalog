<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>GRAND PRIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#05070a;display:flex;align-items:center;justify-content:center;height:100vh;}

<body>
<canvas id="g" width="520" height="680"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=520,H=680,HY=50;

// ══════════════════════════════════════════════════════════════════
// TRACK GENERATION — star-shaped polar curve => guaranteed simple loop
// ══════════════════════════════════════════════════════════════════
function wrapPi(a){ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; }

function genCP(cfg){
  const NCP=cfg.ncp||30, cps=[];
  for(let i=0;i<NCP;i++){
    const theta=i/NCP*Math.PI*2;
    let r=cfg.R0+cfg.wobbleAmp*Math.sin(cfg.wobbleFreq*theta+cfg.wobblePhase);
    cfg.features.forEach(f=>{
      let dt=theta-f.a0;
      dt=((dt+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      r+=f.depth*Math.exp(-(dt*dt)/(2*f.width*f.width));
    });
    cps.push([cfg.cx+Math.cos(theta)*r, cfg.cy+Math.sin(theta)*r]);
  }
  return cps;
}
function catmull(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return[
    .5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
function buildPath(CP,steps){
  const N=CP.length, PATH=[];
  for(let i=0;i<N;i++){
    const p0=CP[(i-1+N)%N],p1=CP[i],p2=CP[(i+1)%N],p3=CP[(i+2)%N];
    for(let s=0;s<steps;s++) PATH.push(catmull(p0,p1,p2,p3,s/steps));
  }
  return PATH;
}
function nearestOnPath(PATH,gx,gy){
  const PN=PATH.length; let best=1e15,bi=0,bt=0;
  for(let i=0;i<PN;i++){
    const a=PATH[i],b=PATH[(i+1)%PN];
    const dx=b[0]-a[0],dy=b[1]-a[1],ll=dx*dx+dy*dy||1;
    const t=Math.max(0,Math.min(1,((gx-a[0])*dx+(gy-a[1])*dy)/ll));
    const px=a[0]+dx*t,py=a[1]+dy*t;
    const d=(gx-px)**2+(gy-py)**2;
    if(d<best){best=d;bi=i;bt=t;}
  }
  return {progress:(bi+bt)/PN, dist:Math.sqrt(best), idx:bi};
}
function computeHeadingCurv(PATH){
  const PN=PATH.length, heading=new Array(PN), rawCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    const a=PATH[i], b=PATH[(i+1)%PN];
    heading[i]=Math.atan2(b[1]-a[1],b[0]-a[0]);
  }
  for(let i=0;i<PN;i++) rawCurv[i]=wrapPi(heading[i]-heading[(i-1+PN)%PN]);
  const WIN=10, smoothCurv=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN;k<=WIN;k++) s+=rawCurv[(i+k+PN)%PN];
    smoothCurv[i]=s/(WIN*2+1);
  }
  return {heading,smoothCurv};
}
function buildRaceLine(PATH,heading,smoothCurv,TW){
  const PN=PATH.length, GAIN=34, maxOff=TW*0.64;
  const raw=new Array(PN);
  for(let i=0;i<PN;i++) raw[i]=Math.max(-maxOff,Math.min(maxOff,-smoothCurv[i]*GAIN));
  const WIN2=5, off2=new Array(PN);
  for(let i=0;i<PN;i++){
    let s=0; for(let k=-WIN2;k<=WIN2;k++) s+=raw[(i+k+PN)%PN];
    off2[i]=s/(WIN2*2+1);
  }
  const line=new Array(PN);
  for(let i=0;i<PN;i++){
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    line[i]=[PATH[i][0]+nx*off2[i], PATH[i][1]+ny*off2[i]];
  }
  return line;
}

// Locate genuinely straight sections (low curvature) for DRS zone placement,
// instead of guessing from feature angles (corner features have wide gaussian tails).
function findDrsZones(smoothCurv, want){
  const PN=smoothCurv.length, thresh=0.014;
  const ext=smoothCurv.concat(smoothCurv);
  const runs=[]; let runStart=-1;
  for(let k=0;k<ext.length;k++){
    const low=Math.abs(ext[k])<thresh;
    if(low){ if(runStart<0) runStart=k; }
    else if(runStart>=0){ runs.push([runStart,k]); runStart=-1; }
  }
  const clean=runs.filter(([s,e])=>s<PN&&(e-s)<PN).sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  const zones=[], usedCenters=[];
  for(const [s,e] of clean){
    if(zones.length>=want) break;
    const len=e-s;
    if(len<PN*0.10) continue;
    const center=(s+e)/2;
    if(usedCenters.some(c=>Math.abs(((c-center+PN*1.5)%PN)-PN*0.5)<PN*0.12)) continue;
    const trim=len*0.20;
    const ts=s+trim, te=e-trim;
    const a=((ts%PN)+PN)%PN/PN, b=((te%PN)+PN)%PN/PN;
    zones.push({a,b});
    usedCenters.push(center);
  }
  return zones;
}

function buildTrack(cfg){
  const CP=genCP(cfg);
  const PATH=buildPath(CP,18);
  const PN=PATH.length;
  const {heading,smoothCurv}=computeHeadingCurv(PATH);
  const raceLine=buildRaceLine(PATH,heading,smoothCurv,cfg.TW);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const pad=cfg.TW*4+40;
  minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const bw=Math.ceil(maxX-minX), bh=Math.ceil(maxY-minY);

  // ── prerender background ──
  const bg=document.createElement('canvas'); bg.width=bw; bg.height=bh;
  const bx=bg.getContext('2d');
  const ox=-minX, oy=-minY; // world -> bg canvas offset
  bx.fillStyle='#0d1a0f'; bx.fillRect(0,0,bw,bh);
  for(let i=0;i<1400;i++){
    bx.fillStyle=`rgba(${20+Math.random()*26},${60+Math.random()*40},${20+Math.random()*18},.55)`;
    bx.fillRect(Math.random()*bw,Math.random()*bh,1+Math.random(),2+Math.random()*5);
  }
  function tPath(ctxr){
    ctxr.beginPath();
    ctxr.moveTo(PATH[0][0]+ox,PATH[0][1]+oy);
    for(let i=1;i<PN;i++) ctxr.lineTo(PATH[i][0]+ox,PATH[i][1]+oy);
    ctxr.closePath();
  }
  bx.lineCap='round'; bx.lineJoin='round';
  // gravel/runoff fringe
  bx.strokeStyle='#7a6c54'; bx.lineWidth=cfg.TW*2+46; tPath(bx); bx.stroke();
  // tarmac border + surface
  bx.strokeStyle='#15151c'; bx.lineWidth=cfg.TW*2+10; tPath(bx); bx.stroke();
  bx.strokeStyle='#33333e'; bx.lineWidth=cfg.TW*2; tPath(bx); bx.stroke();
  bx.strokeStyle='rgba(255,255,255,.025)'; bx.lineWidth=cfg.TW*2-14; tPath(bx); bx.stroke();
  // edge lines
  bx.strokeStyle='rgba(241,245,249,.55)'; bx.lineWidth=2.4; tPath(bx); bx.stroke();
  // curbs on hard corners (red/white)
  const CURB_T=0.034;
  for(let i=0;i<PN;i+=2){
    if(Math.abs(smoothCurv[i])<CURB_T) continue;
    const h=heading[i], nx=-Math.sin(h), ny=Math.cos(h);
    [1,-1].forEach(side=>{
      const px=PATH[i][0]+nx*side*(cfg.TW+2), py=PATH[i][1]+ny*side*(cfg.TW+2);
      bx.save(); bx.translate(px+ox,py+oy); bx.rotate(h);
      bx.fillStyle=(Math.floor(i/2)%2===0)?'#d63a2e':'#f1f5f9';
      bx.fillRect(-4,-6,8,12);
      bx.restore();
    });
  }
  // start/finish checker
  const sfAng=heading[0], sfPerp=sfAng+Math.PI/2, [sfx,sfy]=PATH[0];
  for(let k=0;k<10;k++){
    const t=(k/10-.5)*(cfg.TW*2-4);
    bx.save(); bx.translate(sfx+ox+Math.cos(sfPerp)*t, sfy+oy+Math.sin(sfPerp)*t);
    bx.rotate(sfAng); bx.fillStyle=k%2?'#111':'#eee'; bx.fillRect(-4,-9,8,18);
    bx.restore();
  }
  // sector tick marks (1/3, 2/3)
  [Math.floor(PN/3), Math.floor(PN*2/3)].forEach(idx=>{
    const h=heading[idx], perp=h+Math.PI/2, [px,py]=PATH[idx];
    bx.strokeStyle='rgba(250,204,21,.85)'; bx.lineWidth=2.5; bx.setLineDash([4,4]);
    bx.beginPath();
    bx.moveTo(px+ox+Math.cos(perp)*cfg.TW, py+oy+Math.sin(perp)*cfg.TW);
    bx.lineTo(px+ox-Math.cos(perp)*cfg.TW, py+oy-Math.sin(perp)*cfg.TW);
    bx.stroke(); bx.setLineDash([]);
  });
  // DRS zone tint + markers
  const drsZones=findDrsZones(smoothCurv, cfg.drsCount||1);
  drsZones.forEach(z=>{
    const i0=Math.floor(z.a*PN), i1raw=Math.floor(z.b*PN), i1=i1raw<i0?i1raw+PN:i1raw;
    for(let i=i0;i<i1;i+=2){
      const ii=i%PN;
      const [px,py]=PATH[ii];
      bx.strokeStyle='rgba(168,85,247,.22)'; bx.lineWidth=cfg.TW*2-6;
      bx.beginPath();
      bx.moveTo(px+ox, py+oy);
      const nx=PATH[(ii+2)%PN];
      bx.lineTo(nx[0]+ox, nx[1]+oy);
      bx.stroke();
    }
    const mid=Math.floor(((i0+i1)/2))%PN;
    const [mx,my]=PATH[mid], mh=heading[mid];
    bx.save(); bx.translate(mx+ox,my+oy); bx.rotate(mh+Math.PI/2);
    bx.fillStyle='#a855f7'; bx.font='bold 11px Courier New'; bx.textAlign='center';
    bx.fillText('DRS',0,-cfg.TW-10);
    bx.restore();
  });
  bx.globalAlpha=1;

  return {CP,PATH,PN,heading,smoothCurv,raceLine,TW:cfg.TW,name:cfg.name,info:cfg.info,
    drsZones,bg,bgOx:ox,bgOy:oy,bgMinX:minX,bgMinY:minY,sfAng,sfx,sfy};
}

const TRACKS=[
  buildTrack({name:'MONTE SPIRA', info:'Trangt · Hårnålskurver', ncp:30, R0:1144, cx:1240, cy:1240,
    wobbleAmp:52, wobbleFreq:5, wobblePhase:.4, TW:48,
    features:[
      {a0:.10*Math.PI*2,width:.05*Math.PI*2,depth:-624},
      {a0:.28*Math.PI*2,width:.07*Math.PI*2,depth:364},
      {a0:.45*Math.PI*2,width:.04*Math.PI*2,depth:-780},
      {a0:.62*Math.PI*2,width:.06*Math.PI*2,depth:-468},
      {a0:.80*Math.PI*2,width:.05*Math.PI*2,depth:312}
    ],
    drsCount:2
  }),
  buildTrack({name:'ARDENNE', info:'Flytende · Lange svinger', ncp:32, R0:1664, cx:1760, cy:1680,
    wobbleAmp:94, wobbleFreq:3, wobblePhase:1.1, TW:68,
    features:[
      {a0:.08*Math.PI*2,width:.09*Math.PI*2,depth:286},
      {a0:.18*Math.PI*2,width:.035*Math.PI*2,depth:-364},
      {a0:.50*Math.PI*2,width:.10*Math.PI*2,depth:-520},
      {a0:.78*Math.PI*2,width:.08*Math.PI*2,depth:338}
    ],
    drsCount:3
  }),
  buildTrack({name:'AUTODROMO', info:'Høy fart · Lange rettstrekk', ncp:30, R0:1872, cx:1720, cy:1720,
    wobbleAmp:42, wobbleFreq:2, wobblePhase:0, TW:74,
    features:[
      {a0:.05*Math.PI*2,width:.025*Math.PI*2,depth:-676},
      {a0:.12*Math.PI*2,width:.025*Math.PI*2,depth:260},
      {a0:.45*Math.PI*2,width:.05*Math.PI*2,depth:-728},
      {a0:.60*Math.PI*2,width:.03*Math.PI*2,depth:-520},
      {a0:.66*Math.PI*2,width:.03*Math.PI*2,depth:312}
    ],
    drsCount:3
  })
];

// ══════════════════════════════════════════════════════════════════
// TEAMS / CARS
// ══════════════════════════════════════════════════════════════════
const TEAMS=[
  {name:'ROSSO',   color:'#e10600', dark:'#7a0000'},
  {name:'SILVER',  color:'#c9d4dc', dark:'#5c666e'},
  {name:'AZZURRO', color:'#1e6fd9', dark:'#0d3a73'},
  {name:'ORANGE',  color:'#ff8700', dark:'#a85900'}
];

class Car{
  constructor(x,y,ang,team,isPlayer){
    this.x=x;this.y=y;this.angle=ang;
    this.vx=0;this.vy=0;this.speed=0;
    this.team=team;this.isPlayer=isPlayer;
    this.lap=0;this.curProg=0;this.prevProg=0;this.seenHalf=false;
    this.sectorIdx=0;this.sectorStartT=0;this.lapStartT=0;this.lapTimes=[];
    this.aiIdx=0;this.aiSpd=2.25+Math.random()*.45;
    this.trail=[];this.finished=false;this.place=1;
    this.offtrack=false;this.drsActive=false;
  }
  get totalDist(){return this.lap+this.curProg;}
}

let TR=TRACKS[0];
let cars=[],player,state='menu',raceTime=0,keys={},particles=[],texts=[];
let shake=0, confetti=[], winTimer=0, toasts=[];
let trackSel=0, cntTimer=0;
let camX=0,camY=0,camAngle=0;
const LAPS=3;
const CHASE_Y = HY+(H-HY)*0.68; // chase-cam anchor: car sits lower on screen, more track visible ahead
let bestSector=[Infinity,Infinity,Infinity];

function addShake(n){ shake=Math.min(16,shake+n); }
function toast(t,clr){ toasts.push({t,clr,life:1}); }
function spawnConfetti(){
  const clrs=['#4ade80','#38bdf8','#facc15','#ef4444','#f97316','#f1f5f9'];
  for(let i=0;i<70;i++){
    confetti.push({x:Math.random()*W,y:-10-Math.random()*H*.5,vx:(Math.random()-.5)*1.8,vy:1.4+Math.random()*2.2,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,clr:clrs[Math.floor(Math.random()*clrs.length)],w:4+Math.random()*3,life:1});
  }
}
function dust(x,y,clr){
  for(let i=0;i<3;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*.6+.1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.25,life:.8,d:.02,r:Math.random()*2.2+1.2,clr});
  }
}

function buildCars(){
  cars=[];
  // shuffle which team occupies which grid slot, so the player doesn't
  // always start in pole position — real overtaking becomes necessary.
  const order=[0,1,2,3];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  const slots=[[-1,0],[1,0],[-1,1],[1,1]];
  const behind=TR.sfAng+Math.PI;
  slots.forEach(([col,row],i)=>{
    const idx=order[i];
    const gx=TR.sfx+Math.cos(TR.sfAng+Math.PI/2)*col*16+Math.cos(behind)*row*28;
    const gy=TR.sfy+Math.sin(TR.sfAng+Math.PI/2)*col*16+Math.sin(behind)*row*28;
    const c=new Car(gx,gy,TR.sfAng,TEAMS[idx],idx===0);
    c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
    c.prevProg=c.curProg;
    cars.push(c);
  });
  player=cars.find(c=>c.isPlayer);
  camX=player.x; camY=player.y; camAngle=player.angle;
}

function startRace(){
  TR=TRACKS[trackSel];
  buildCars(); particles=[]; texts=[]; confetti=[]; toasts=[]; shake=0; winTimer=0; raceTime=0;
  bestSector=[Infinity,Infinity,Infinity];
  state='countdown'; cntTimer=180;
}

function startPractice(){
  TR=TRACKS[trackSel];
  const c=new Car(TR.sfx,TR.sfy,TR.sfAng,TEAMS[0],true);
  c.curProg=nearestOnPath(TR.PATH,c.x,c.y).progress;
  c.prevProg=c.curProg;
  cars=[c]; player=c;
  camX=player.x; camY=player.y; camAngle=player.angle;
  particles=[]; texts=[]; confetti=[]; toasts=[]; shake=0; raceTime=0;
  bestSector=[Infinity,Infinity,Infinity];
  state='practice';
}

function inDRSZone(prog){
  return TR.drsZones.some(z=> z.b<z.a ? (prog>=z.a||prog<=z.b) : (prog>=z.a&&prog<=z.b));
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function update(){
  // decay / animate regardless of state
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life-=p.d;return p.life>0;});
  texts=texts.filter(t=>{t.y+=t.vy;t.life-=.018;return t.life>0;});
  toasts=toasts.filter(t=>{t.life-=.01;return t.life>0;});
  if(shake>0){shake*=.85; if(shake<.08)shake=0;}
  if(state==='win'){ winTimer++; confetti=confetti.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.vy+=.02;return f.y<H+20;}); }

  if(state==='countdown'){
    cntTimer--; if(cntTimer<=0) state='playing';
    return;
  }
  if(state!=='playing' && state!=='practice') return;
  raceTime++;

  cars.forEach(c=>{
    if(c.finished)return;
    let gas=false,steerL=false,steerR=false,brake=false,drsKey=false;
    if(c.isPlayer){
      gas=!!(keys['ArrowUp']||keys['w']||keys['W']);
      brake=!!(keys['ArrowDown']||keys['s']||keys['S']);
      steerL=!!(keys['ArrowLeft']||keys['a']||keys['A']);
      steerR=!!(keys['ArrowRight']||keys['d']||keys['D']);
      drsKey=!!(keys[' ']||keys['Shift']||keys['ShiftLeft']||keys['ShiftRight']);
    } else {
      const PN=TR.PN;
      const li=Math.floor(c.curProg*PN);
      const lookI=(li+16)%PN;
      const [tx,ty]=TR.raceLine[lookI];
      const da=Math.atan2(ty-c.y,tx-c.x);
      let diff=wrapPi(da-c.angle);
      steerL=diff<-0.05; steerR=diff>0.05; gas=true;
      const gap=c.totalDist-player.totalDist;
      // tight rubber-band: keeps rivals genuinely close the whole race (not just
      // within half a lap, which on these much bigger tracks would mean they
      // could vanish for minutes) — forces real, repeated overtaking battles.
      c.aiSpd=Math.max(1.9,Math.min(4.05,c.aiSpd+(gap>.05?-.013:gap<-.05?.013:0)));
    }

    const near=nearestOnPath(TR.PATH,c.x,c.y);
    const dist=near.dist;
    const wasOff=c.offtrack;
    c.offtrack = dist>TR.TW;
    const deepOff = dist>TR.TW*2.3;
    if(c.offtrack && !wasOff && c.isPlayer){
      toast('UTENFOR BANEN — taper fart!','#ef4444');
    }
    if(!c.offtrack && wasOff && c.isPlayer){
      toast('TILBAKE PÅ ASFALT','#4ade80');
    }

    const DRSon = c.isPlayer ? (drsKey && inDRSZone(c.curProg)) : inDRSZone(c.curProg);
    c.drsActive = DRSon;
    let MAX=(c.isPlayer?4.8:c.aiSpd)*(DRSon?1.12:1);
    let GRIP=0.82, accelMul=1, dragMul=1;
    if(c.offtrack){
      accelMul = deepOff? 0.28 : 0.45;
      MAX *= deepOff? 0.5 : 0.68;
      dragMul = deepOff? 0.90 : 0.95;
      GRIP = 0.6;
      if(Math.random()<.6) dust(c.x-Math.cos(c.angle)*8,c.y-Math.sin(c.angle)*8, deepOff?'rgba(122,108,84,.8)':'rgba(70,110,60,.7)');
      if(c.isPlayer) raceTime += 1.0; // time penalty: lose extra time off-track
    }

    if(gas)    c.speed=Math.min(MAX,c.speed+.17*accelMul);
    else       c.speed*=.978;
    if(brake)  c.speed*=.86;
    c.speed*=dragMul;
    c.speed=Math.max(0,Math.min(c.speed,MAX*1.02));

    const turnRate=0.046*(0.32+0.68*Math.min(1,c.speed/((c.isPlayer?4.8:c.aiSpd))));
    if(steerL)c.angle-=turnRate;
    if(steerR)c.angle+=turnRate;

    c.vx+=(Math.cos(c.angle)*c.speed-c.vx)*GRIP;
    c.vy+=(Math.sin(c.angle)*c.speed-c.vy)*GRIP;
    const preX=c.x+c.vx, preY=c.y+c.vy;
    // soft outer wall far beyond gravel
    const farD=Math.hypot(preX-TR.PATH[near.idx][0],preY-TR.PATH[near.idx][1]);
    if(farD>TR.TW*3.0){
      c.speed*=0.5; c.vx*=0.35; c.vy*=0.35;
      if(c.isPlayer) addShake(Math.min(9,c.speed*1.6));
      for(let i=0;i<6;i++){
        const a=Math.random()*Math.PI*2, s=Math.random()*2.2+.5;
        particles.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.05,r:Math.random()*1.6+.6,clr:'#fde68a'});
      }
    } else {
      c.x=preX; c.y=preY;
    }

    // skid trail
    const slip=Math.abs(c.vx*Math.sin(c.angle)-c.vy*Math.cos(c.angle));
    if(slip>.42||c.speed>4.6){
      c.trail.push({x:c.x-Math.cos(c.angle)*7,y:c.y-Math.sin(c.angle)*7,life:.85,d:.02});
    }
    c.trail=c.trail.filter(t=>{t.life-=t.d;return t.life>0;});

    // DRS exhaust spark
    if(c.drsActive && Math.random()<.4){
      const a=c.angle+Math.PI+(Math.random()-.5)*.5;
      particles.push({x:c.x,y:c.y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,life:.6,d:.04,r:1.8,clr:'#c084fc'});
    }

    // progress / lap / sector tracking
    const pr=near.progress;
    c.curProg=pr;
    if(pr>.38&&pr<.62)c.seenHalf=true;
    const sOf=Math.min(2,Math.floor(pr*3));
    if(sOf!==c.sectorIdx && ((c.sectorIdx+1)%3)===sOf){
      const t=(raceTime-c.sectorStartT)/60;
      if(c.isPlayer){
        const sNum=c.sectorIdx+1;
        let clr='#f1f5f9';
        if(t<bestSector[c.sectorIdx]){bestSector[c.sectorIdx]=t;clr='#c084fc';}
        toast(`SEKTOR ${sNum}: ${t.toFixed(2)}s`,clr);
      }
      c.sectorIdx=sOf; c.sectorStartT=raceTime;
    }
    if(c.prevProg>.88&&pr<.12&&c.seenHalf){
      c.lap++; c.seenHalf=false; c.sectorIdx=0; c.sectorStartT=raceTime;
      if(c.isPlayer){
        const lt=((raceTime-c.lapStartT)/60).toFixed(2);
        c.lapTimes.push(lt);
        c.lapStartT=raceTime;
        if(state==='practice') toast(`RUNDE ${c.lap} FERDIG: ${lt}s`,'#38bdf8');
      }
      if(state==='playing' && c.lap>=LAPS){
        c.finished=true;
        if(c.isPlayer){ state='win'; winTimer=0; if(c.place===1) spawnConfetti(); }
      }
    }
    c.prevProg=pr;
  });

  // car-vs-car contact: prevents free pass-through so overtaking is a real,
  // contested act (bump and lose speed if a pass is misjudged).
  if(cars.length>1){
    for(let i=0;i<cars.length;i++){
      for(let j=i+1;j<cars.length;j++){
        const a=cars[i], b=cars[j];
        if(a.finished||b.finished) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), minD=15;
        if(d>0&&d<minD){
          const overlap=(minD-d)/2, nx=dx/d, ny=dy/d;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          a.speed*=.92; b.speed*=.92;
          a.vx-=nx*.4; a.vy-=ny*.4; b.vx+=nx*.4; b.vy+=ny*.4;
          if(a.isPlayer||b.isPlayer) addShake(3);
        }
      }
    }
  }

  [...cars].sort((a,b)=>b.totalDist-a.totalDist).forEach((c,i)=>c.place=i+1);
  camX+=(player.x-camX)*.14;
  camY+=(player.y-camY)*.14;
  camAngle+=wrapPi(player.angle-camAngle)*.12;
}

// ══════════════════════════════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════════════════════════════
function drawCar(c){
  c.trail.forEach(t=>{ ctx.globalAlpha=t.life*.22; ctx.fillStyle='#0a0a12'; ctx.beginPath(); ctx.arc(t.x,t.y,2.6,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-12,5,24,6); // shadow
  // rear wing
  ctx.fillStyle=c.team.dark; ctx.fillRect(-13,-8,3,16);
  // rear tires
  ctx.fillStyle='#111'; ctx.fillRect(-9,-8,5,5); ctx.fillRect(-9,3,5,5);
  // body
  ctx.fillStyle=c.team.color;
  ctx.beginPath();
  ctx.moveTo(13,0); ctx.lineTo(7,-3.2); ctx.lineTo(-10,-4.2); ctx.lineTo(-11,4.2); ctx.lineTo(7,3.2);
  ctx.closePath(); ctx.fill();
  // sidepods
  ctx.fillStyle=c.team.dark; ctx.fillRect(-6,-4.6,6,2); ctx.fillRect(-6,2.6,6,2);
  // halo/cockpit
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(1,0,3.2,2.1,0,0,Math.PI*2); ctx.fill();
  // front wing
  ctx.fillStyle=c.team.dark; ctx.fillRect(11,-6,2.4,12);
  // front tires
  ctx.fillStyle='#111'; ctx.fillRect(5,-7,4,4); ctx.fillRect(5,3,4,4);
  if(c.drsActive){ ctx.fillStyle='rgba(192,132,252,.9)'; ctx.fillRect(-13,-7,3,14); }
  if(!c.isPlayer){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(-3,-3,7,6);
    ctx.fillStyle='#fff'; ctx.font='bold 5px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.place,0.5,0);
  }
  ctx.restore();
}

// Chase-cam: world is rotated so the player's heading always points "up"
// on screen, with the camera anchored behind/below the car (CHASE_Y).
function worldToScreen(wx,wy){
  const dx=wx-camX, dy=wy-camY;
  const rot=-(camAngle+Math.PI/2);
  const cs=Math.cos(rot), sn=Math.sin(rot);
  return [dx*cs-dy*sn+W/2, dx*sn+dy*cs+CHASE_Y];
}

function drawTrackScene(){
  ctx.save();
  ctx.translate(W/2,CHASE_Y);
  ctx.rotate(-(camAngle+Math.PI/2));
  ctx.translate(-camX,-camY);

  ctx.drawImage(TR.bg, TR.bgMinX, TR.bgMinY);

  // animated racing line overlay
  ctx.save();
  ctx.strokeStyle='rgba(56,189,248,.8)'; ctx.lineWidth=2.2;
  ctx.setLineDash([8,10]); ctx.lineDashOffset=-raceTime*.6;
  ctx.beginPath();
  const rl=TR.raceLine;
  ctx.moveTo(rl[0][0],rl[0][1]);
  for(let i=1;i<rl.length;i++) ctx.lineTo(rl[i][0],rl[i][1]);
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.clr;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // cars — already inside the camera transform, draw directly in world space
  [...cars].sort((a,b)=>a.place-b.place).reverse().forEach(drawCar);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const shx=shake?(Math.random()-.5)*shake:0, shy=shake?(Math.random()-.5)*shake:0;
  ctx.save(); ctx.translate(shx,shy);

  ctx.fillStyle='#05070a'; ctx.fillRect(0,0,W,H);

  if(state==='menu'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#e10600'; ctx.font='bold 42px Courier New'; ctx.fillText('GRAND PRIX',W/2,H/2-150);
    ctx.fillStyle='#64748b'; ctx.font='10px Courier New'; ctx.fillText('ekte F1-stil · tre store baner · øvingsmodus',W/2,H/2-122);
    ctx.fillStyle='#334155'; ctx.font='10px Courier New';
    [['↑ / W','Gass'],['↓ / S','Brems'],['← → / A D','Styr'],['SPC / SHIFT','DRS i grønn/lilla zone']].forEach(([k,v],i)=>{
      ctx.fillStyle='#e10600'; ctx.textAlign='right'; ctx.fillText(k,W/2-6,H/2-70+i*20);
      ctx.fillStyle='#64748b'; ctx.textAlign='left'; ctx.fillText(v,W/2+6,H/2-70+i*20);
    });
    ctx.fillStyle='#94a3b8'; ctx.font='11px Courier New'; ctx.textAlign='center';
    ctx.fillText('Utenfor banen = du mister fart og tid.',W/2,H/2+30);
    ctx.fillStyle='#e10600'; ctx.font='bold 14px Courier New';
    ctx.fillText('ENTER — velg bane',W/2,H/2+70);
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H-20);
    ctx.restore(); return;
  }

  if(state==='trackselect'){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 20px Courier New'; ctx.fillText('VELG BANE',W/2,70);
    ctx.fillStyle='#334155'; ctx.font='9px Courier New'; ctx.fillText('← → bytt   ENTER kjør løp',W/2,94);
    ctx.fillStyle='#38bdf8'; ctx.fillText('P — øvingskjøring (ingen motstandere)',W/2,110);
    TRACKS.forEach((t,i)=>{
      const sel=i===trackSel;
      const bx0=60+i*150, by0=140, bw0=130, bh0=420;
      ctx.fillStyle=sel?'rgba(225,6,0,.12)':'rgba(255,255,255,.03)';
      ctx.fillRect(bx0,by0,bw0,bh0);
      ctx.strokeStyle=sel?'#e10600':'#1e293b'; ctx.lineWidth=sel?2.5:1;
      ctx.strokeRect(bx0,by0,bw0,bh0);
      // mini track preview
      let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
      t.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
      const pw=bw0-20, ph=180;
      const sc=Math.min(pw/(maxX-minX),ph/(maxY-minY))*.92;
      const ccx=bx0+bw0/2, ccy=by0+30+ph/2;
      ctx.save();
      ctx.strokeStyle='#475569'; ctx.lineWidth=6; ctx.beginPath();
      t.PATH.forEach(([x,y],j)=>{
        const px=ccx+(x-(minX+maxX)/2)*sc, py=ccy+(y-(minY+maxY)/2)*sc;
        j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      });
      ctx.closePath(); ctx.stroke();
      ctx.strokeStyle=sel?'#38bdf8':'#334155'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
      ctx.fillStyle=sel?'#f1f5f9':'#64748b'; ctx.font='bold 13px Courier New';
      ctx.fillText(t.name,ccx,by0+ph+40);
      ctx.fillStyle='#475569'; ctx.font='8px Courier New';
      ctx.fillText(t.info,ccx,by0+ph+58);
      ctx.fillText(`Bredde ${t.TW*2}  ·  DRS-zoner ${t.drsZones.length}`,ccx,by0+ph+74);
    });
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H-16);
    ctx.restore(); return;
  }

  // ── racing scene ──
  drawTrackScene();

  // speed-lines vignette
  if(state==='playing'||state==='practice'){
    const pspd=Math.hypot(player.vx,player.vy);
    if(pspd>4.4){
      const amt=Math.min(1,(pspd-4.4)/2.4);
      ctx.save(); ctx.globalAlpha=amt*.45; ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1.2;
      const ccx=W/2, ccy=HY+(H-HY)/2;
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2+raceTime*.01;
        const r1=Math.max(W,H)*.46, r2=r1+14+amt*20;
        ctx.beginPath(); ctx.moveTo(ccx+Math.cos(a)*r1,ccy+Math.sin(a)*r1); ctx.lineTo(ccx+Math.cos(a)*r2,ccy+Math.sin(a)*r2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── top HUD bar ──
  ctx.fillStyle='rgba(5,7,10,.92)'; ctx.fillRect(0,0,W,HY);
  ctx.fillStyle=TEAMS[0].color; ctx.fillRect(0,HY-3,W,3);
  ctx.textBaseline='middle';
  if(state==='practice'){
    ctx.fillStyle='#38bdf8'; ctx.font='bold 14px Courier New'; ctx.textAlign='left'; ctx.fillText('ØVING',8,HY/2);
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${player.lap+1}  ·  ${TR.name}`,W/2,HY/2-9);
  } else {
    const posLbl=['P1','P2','P3','P4'][player.place-1]||'';
    const posClr=[,'#4ade80','#38bdf8','#f97316','#ef4444'][player.place];
    ctx.fillStyle=posClr; ctx.font='bold 22px Courier New'; ctx.textAlign='left'; ctx.fillText(posLbl,8,HY/2);
    const displayLap=Math.min(player.lap+1,LAPS);
    ctx.fillStyle='#f1f5f9'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(`RUNDE ${displayLap}/${LAPS}  ·  ${TR.name}`,W/2,HY/2-9);
  }
  const ts=raceTime/60;
  ctx.fillStyle='#64748b'; ctx.font='9px Courier New';
  ctx.fillText(`${Math.floor(ts/60).toString().padStart(2,'0')}:${(ts%60).toFixed(2).padStart(5,'0')}`,W/2,HY/2+9);
  const spd=Math.round(Math.hypot(player.vx,player.vy)*56);
  const gear=Math.min(8,1+Math.floor(spd/48));
  ctx.fillStyle='#94a3b8'; ctx.font='bold 13px Courier New'; ctx.textAlign='right';
  ctx.fillText(`${spd} km/t  G${gear}`,W-8,HY/2-8);
  // DRS indicator
  const drsReady=inDRSZone(player.curProg);
  ctx.font='bold 10px Courier New';
  ctx.fillStyle = player.drsActive?'#c084fc' : drsReady?'rgba(168,85,247,.5)':'#334155';
  ctx.fillText('DRS',W-8,HY/2+9);

  // off-track indicator
  if((state==='playing'||state==='practice') && player.offtrack){
    ctx.fillStyle='rgba(239,68,68,.9)'; ctx.font='bold 10px Courier New'; ctx.textAlign='center';
    ctx.fillText('UTENFOR BANEN',W/2,HY+16);
  }

  // toasts
  toasts.forEach((t,i)=>{
    ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.fillStyle=t.clr; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(t.t,W/2,HY+34+i*16);
  });
  ctx.globalAlpha=1;

  // countdown overlay
  if(state==='countdown'){
    const sec=Math.ceil(cntTimer/60);
    const a=((cntTimer%60)/60);
    ctx.fillStyle=`rgba(5,7,10,${a*.5})`; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(sec>0){ ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.font=`bold ${80+a*20}px Courier New`; ctx.fillText(sec,W/2,H/2); }
    else { ctx.fillStyle='#4ade80'; ctx.font='bold 56px Courier New'; ctx.fillText('LIGHTS OUT!',W/2,H/2); }
  }

  // ── leaderboard panel (top-right) ──
  if(state!=='practice'){
    const lbX=W-108, lbY=HY+8, lbW=100;
    ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(lbX,lbY,lbW,18+cars.length*16);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(lbX,lbY,lbW,18+cars.length*16);
    ctx.fillStyle='#475569'; ctx.font='bold 8px Courier New'; ctx.textAlign='left'; ctx.fillText('LEDERTAVLE',lbX+6,lbY+11);
    [...cars].sort((a,b)=>a.place-b.place).forEach((c,i)=>{
      const ry=lbY+24+i*16;
      ctx.fillStyle=c.team.color; ctx.fillRect(lbX+6,ry-5,8,8);
      ctx.fillStyle=c.isPlayer?'#f1f5f9':'#94a3b8'; ctx.font='bold 9px Courier New';
      ctx.fillText(`${i+1}. ${c.team.name}`,lbX+18,ry);
    });
  } else {
    ctx.fillStyle='rgba(5,7,10,.7)'; ctx.font='bold 8px Courier New'; ctx.textAlign='right';
    ctx.fillText('T bane-valg · R restart',W-8,HY+16);
  }

  // ── minimap (bottom-left) ──
  const mmX=10,mmY=H-92,mmS=82;
  ctx.fillStyle='rgba(5,7,10,.78)'; ctx.fillRect(mmX-2,mmY-2,mmS+4,mmS+4);
  ctx.strokeStyle='#1e293b'; ctx.lineWidth=1; ctx.strokeRect(mmX-2,mmY-2,mmS+4,mmS+4);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  TR.PATH.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const msc=mmS/Math.max(maxX-minX,maxY-minY)*.9;
  const mox=mmX+(mmS-(maxX-minX)*msc)/2-minX*msc;
  const moy=mmY+(mmS-(maxY-minY)*msc)/2-minY*msc;
  function mmPt(gx,gy){return[mox+gx*msc,moy+gy*msc];}
  ctx.strokeStyle='#334155'; ctx.lineWidth=5; ctx.beginPath();
  const [mp0x,mp0y]=mmPt(TR.PATH[0][0],TR.PATH[0][1]); ctx.moveTo(mp0x,mp0y);
  for(let i=1;i<TR.PN;i++){ const [mpx,mpy]=mmPt(TR.PATH[i][0],TR.PATH[i][1]); ctx.lineTo(mpx,mpy); }
  ctx.closePath(); ctx.stroke();
  cars.forEach(c=>{
    const [mcx,mcy]=mmPt(c.x,c.y);
    ctx.fillStyle=c.team.color; ctx.globalAlpha=c.isPlayer?1:.8;
    ctx.beginPath(); ctx.arc(mcx,mcy,c.isPlayer?3.2:2,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // ── win screen ──
  if(state==='win'){
    ctx.fillStyle='rgba(5,7,10,.84)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const won=player.place===1;
    if(won){
      const pulse=.75+.25*Math.sin(winTimer*.08);
      ctx.save(); ctx.shadowColor='#4ade80'; ctx.shadowBlur=18*pulse; ctx.fillStyle='#4ade80';
      ctx.font='bold 34px Courier New'; ctx.fillText('SEIER!',W/2,H/2-150);
      ctx.restore();
    } else {
      ctx.fillStyle='#94a3b8'; ctx.font='bold 34px Courier New'; ctx.fillText('FERDIG!',W/2,H/2-150);
    }
    ctx.fillStyle='#64748b'; ctx.font='12px Courier New';
    ctx.fillText(`${player.place}. plass · Totaltid: ${(raceTime/60).toFixed(1)}s`,W/2,H/2-116);
    player.lapTimes.forEach((lt,i)=>{
      ctx.fillStyle='#334155'; ctx.font='10px Courier New';
      ctx.fillText(`Runde ${i+1}: ${lt}s`,W/2,H/2-88+i*18);
    });
    ctx.fillStyle='#1e293b'; ctx.font='9px Courier New';
    [...cars].sort((a,b)=>a.place-b.place).forEach((c,i)=>{
      ctx.fillStyle=c.team.color;
      ctx.fillText(`${i+1}. ${c.isPlayer?'DU':c.team.name}`,W/2,H/2-10+i*16);
    });
    ctx.fillStyle='#e10600'; ctx.font='bold 12px Courier New';
    ctx.fillText('ENTER — kjør igjen',W/2,H/2+90);
    ctx.fillStyle='#38bdf8'; ctx.font='bold 11px Courier New';
    ctx.fillText('T — velg bane',W/2,H/2+112);
    ctx.fillStyle='#1e293b'; ctx.font='8px Courier New'; ctx.fillText('ESC Katalog',W/2,H/2+134);

    confetti.forEach(f=>{
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.globalAlpha=Math.min(1,f.life);
      ctx.fillStyle=f.clr; ctx.fillRect(-f.w/2,-f.w*.6,f.w,f.w*1.2);
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }

  ctx.textBaseline='alphabetic';
  ctx.restore();
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(e.key==='Enter'){
    if(state==='menu') state='trackselect';
    else if(state==='trackselect') startRace();
    else if(state==='win') startRace();
  }
  if(state==='trackselect'){
    if(e.key==='ArrowLeft') trackSel=(trackSel+TRACKS.length-1)%TRACKS.length;
    if(e.key==='ArrowRight') trackSel=(trackSel+1)%TRACKS.length;
    if(e.key==='p'||e.key==='P') startPractice();
  }
  if(state==='win' && (e.key==='t'||e.key==='T')) state='trackselect';
  if(state==='practice'){
    if(e.key==='t'||e.key==='T') state='trackselect';
    if(e.key==='r'||e.key==='R') startPractice();
  }
  if(e.key===' ')e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>

<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>KLODDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#070712;display:flex;align-items:center;justify-content:center;height:100vh;}
</style>
</head>
<body>
<canvas id="g" width="480" height="600"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=480,H=600,HY=44;
const GROUND_Y=H-70;
const GRAVITY=0.6,FRICTION=0.82,MOVE_SPEED=0.9,MAX_SPEED=5,JUMP_VELOCITY=-12.5;

// ── Varm-svart / bronse palett ──────────────────────────────────
const C={
  black:'#150f0a',
  panel:'#241a10',
  panelDeep:'#1a130c',
  line:'#3a2a18',
  bronze:'#cd7f32',
  bronzeDark:'#6b4423',
  text:'#f0e6d8',
  muted:'#8a715a',
};

// ── Input ────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.key==='Enter'){
    if(state==='menu'||state==='over'||state==='win'){resetLevel(true);state='playing';}
    return;
  }
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// ── Level ────────────────────────────────────────────────────────
function buildLevel(){
  return{
    width:3200,
    platforms:[
      {x:0,y:GROUND_Y,w:900,h:40},
      {x:980,y:GROUND_Y,w:500,h:40},
      {x:1560,y:GROUND_Y,w:400,h:40},
      {x:2040,y:GROUND_Y,w:1160,h:40},
      {x:300,y:450,w:100,h:20},
      {x:470,y:390,w:100,h:20},
      {x:650,y:450,w:120,h:20},
      {x:1050,y:430,w:120,h:20},
      {x:1250,y:370,w:100,h:20},
      {x:1620,y:430,w:100,h:20},
      {x:1780,y:370,w:100,h:20},
      {x:2100,y:450,w:120,h:20},
      {x:2320,y:390,w:100,h:20},
      {x:2550,y:450,w:140,h:20},
      {x:2800,y:390,w:120,h:20},
    ],
    coins:[
      {x:330,y:410},{x:500,y:350},{x:690,y:410},
      {x:1080,y:390},{x:1280,y:330},{x:1650,y:390},
      {x:1810,y:330},{x:2140,y:410},{x:2350,y:350},
      {x:2590,y:410},{x:2840,y:350},
      {x:1100,y:GROUND_Y-40},{x:1150,y:GROUND_Y-40},{x:1200,y:GROUND_Y-40},
    ],
    enemies:[
      {x:500,y:GROUND_Y-24,w:24,h:24,range:[400,850],dir:1,speed:1.4,alive:true},
      {x:1650,y:GROUND_Y-24,w:24,h:24,range:[1560,1900],dir:1,speed:1.6,alive:true},
      {x:2150,y:GROUND_Y-24,w:24,h:24,range:[2040,2400],dir:-1,speed:1.5,alive:true},
      {x:2700,y:GROUND_Y-24,w:24,h:24,range:[2550,3100],dir:1,speed:1.8,alive:true},
    ],
    flagX:3100,
  };
}

let level=buildLevel();
function makePlayer(){return{x:40,y:GROUND_Y-32,w:24,h:32,vx:0,vy:0,onGround:false,facing:1};}
let player=makePlayer();
let camera={x:0};
let score=0,coinCount=0,lives=3;
let state='menu'; // menu | playing | over | win
let particles=[],texts=[],shake=0,confetti=[],wasOnGround=false;

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function addShake(n){shake=Math.min(14,shake+n);}
function boom(x,y,clr,n=10,spread=1){
  for(let i=0;i<n;i++){
    const a=Math.PI*2*Math.random(), s=(Math.random()*3+.6)*spread;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,d:.025+Math.random()*.03,r:Math.random()*2.4+.7,clr,g:.12});
  }
}
function dustPuff(x,y,n=6){
  for(let i=0;i<n;i++){
    const a=Math.PI+(Math.random()-.5)*2.4, s=Math.random()*1.6+.3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.4-.3,life:1,d:.04+Math.random()*.03,r:Math.random()*2+1,clr:'rgba(240,230,216,.4)',g:0});
  }
}
function ftxt(x,y,t,clr){texts.push({x,y,t,clr,life:1,vy:-1.1});}
function spawnConfettiMario(){
  const clrs=['#cd7f32','#f0e6d8','#6b4423','#facc15','#4ade80'];
  for(let i=0;i<60;i++){
    confetti.push({x:Math.random()*W,y:-10-Math.random()*H*.4,vx:(Math.random()-.5)*1.6,vy:1.2+Math.random()*2,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,clr:clrs[Math.floor(Math.random()*clrs.length)],w:4+Math.random()*3});
  }
}

function resetLevel(fullReset){
  level=buildLevel();
  player=makePlayer();
  camera.x=0;
  particles=[];texts=[];shake=0;confetti=[];wasOnGround=false;
  if(fullReset){score=0;coinCount=0;lives=3;}
}

function loseLife(){
  lives--;
  addShake(10);
  boom(player.x-camera.x+player.w/2,player.y+player.h/2,C.bronze,16,1.3);
  if(lives<=0){state='over';}
  else{player=makePlayer();camera.x=0;}
}

// ── Update ───────────────────────────────────────────────────────
function updatePlayer(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.life-=p.d;return p.life>0;});
  texts=texts.filter(t=>{t.y+=t.vy;t.life-=.02;return t.life>0;});
  if(shake>0){shake*=.84;if(shake<.08)shake=0;}
  confetti=confetti.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;f.vy+=.02;return f.y<H+20;});
  if(state!=='playing')return;
  if(keys.ArrowLeft||keys.KeyA){player.vx-=MOVE_SPEED;player.facing=-1;}
  if(keys.ArrowRight||keys.KeyD){player.vx+=MOVE_SPEED;player.facing=1;}
  if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.onGround){
    player.vy=JUMP_VELOCITY;player.onGround=false;
    dustPuff(player.x-camera.x+player.w/2,player.y+player.h,5);
  }

  player.vx*=FRICTION;
  if(player.vx>MAX_SPEED)player.vx=MAX_SPEED;
  if(player.vx<-MAX_SPEED)player.vx=-MAX_SPEED;
  if(Math.abs(player.vx)<0.05)player.vx=0;

  player.vy+=GRAVITY;
  if(player.vy>15)player.vy=15;

  player.x+=player.vx;
  if(player.x<0)player.x=0;
  for(const p of level.platforms){
    if(rectsOverlap(player,p)){
      if(player.vx>0)player.x=p.x-player.w;
      else if(player.vx<0)player.x=p.x+p.w;
      player.vx=0;
    }
  }

  player.onGround=false;
  player.y+=player.vy;
  const fallSpd=player.vy;
  for(const p of level.platforms){
    if(rectsOverlap(player,p)){
      if(player.vy>0){
        player.y=p.y-player.h;player.vy=0;player.onGround=true;
        if(fallSpd>7)dustPuff(player.x-camera.x+player.w/2,player.y+player.h,Math.min(10,Math.round(fallSpd)));
      }
      else if(player.vy<0){player.y=p.y+p.h;player.vy=0;}
    }
  }
  if(!wasOnGround&&player.onGround)dustPuff(player.x-camera.x+player.w/2,player.y+player.h,4);
  wasOnGround=player.onGround;

  if(player.y>H+100){loseLife();return;}

  for(const c of level.coins){
    if(c.taken)continue;
    const cb={x:c.x-8,y:c.y-8,w:16,h:16};
    if(rectsOverlap(player,cb)){
      c.taken=true;coinCount++;score+=100;
      const sx=c.x-camera.x;
      boom(sx,c.y,C.bronze,10,0.8);
      ftxt(sx,c.y-10,'+100','#facc15');
    }
  }

  for(const e of level.enemies){
    if(!e.alive)continue;
    if(rectsOverlap(player,e)){
      const stomping=player.vy>0&&player.y+player.h-e.y<16;
      const sx=e.x-camera.x+e.w/2;
      if(stomping){
        e.alive=false;player.vy=JUMP_VELOCITY*0.6;score+=200;
        boom(sx,e.y+e.h/2,C.bronzeDark,14,1.1);
        ftxt(sx,e.y-6,'+200','#4ade80');
        addShake(3);
      }
      else{loseLife();return;}
    }
  }

  if(state==='playing'&&player.x+player.w>=level.flagX){
    score+=500;state='win';spawnConfettiMario();
  }

  camera.x=Math.max(0,Math.min(player.x-W/2,level.width-W));
}

function updateEnemies(){
  if(state!=='playing')return;
  for(const e of level.enemies){
    if(!e.alive)continue;
    e.x+=e.speed*e.dir;
    if(e.x<e.range[0]||e.x+e.w>e.range[1]){e.dir*=-1;e.x+=e.speed*e.dir;}
  }
}

// ── Draw ─────────────────────────────────────────────────────────
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBackground(){
  ctx.fillStyle=C.black;
  ctx.fillRect(0,0,W,H);

  // Distant silhouette hills (slowest parallax layer)
  const hOff=-((camera.x*0.08)%260);
  ctx.fillStyle='rgba(107,68,35,0.14)';
  for(let x=hOff-260;x<W+260;x+=260){
    ctx.beginPath();
    ctx.moveTo(x,GROUND_Y);
    ctx.quadraticCurveTo(x+90,GROUND_Y-120,x+180,GROUND_Y);
    ctx.quadraticCurveTo(x+220,GROUND_Y-60,x+260,GROUND_Y);
    ctx.closePath();ctx.fill();
  }
  // Mid silhouette panels (medium parallax)
  const mOff=-((camera.x*0.2)%180);
  ctx.fillStyle='rgba(58,42,24,0.5)';
  for(let x=mOff-180;x<W+180;x+=180){
    ctx.fillRect(x,GROUND_Y-70,70,70);
    ctx.fillRect(x+100,GROUND_Y-46,50,46);
  }

  // Near dot-grid (original fine parallax detail)
  ctx.fillStyle=C.line;
  const step=32,offset=-((camera.x*0.4)%step);
  for(let x=offset;x<W;x+=step)for(let y=HY+20;y<GROUND_Y;y+=step)ctx.fillRect(x,y,2,2);
  ctx.fillStyle=C.bronzeDark;
  ctx.fillRect(0,GROUND_Y-1,W,1);
}

function drawPlatforms(){
  for(const p of level.platforms){
    const sx=p.x-camera.x;
    if(sx+p.w<0||sx>W)continue;
    ctx.fillStyle=C.panel;
    roundRect(sx,p.y,p.w,p.h,5);
    ctx.fill();
    ctx.fillStyle=C.bronze;
    ctx.fillRect(sx+3,p.y,Math.max(p.w-6,0),2);
  }
}

function drawCoins(){
  for(const c of level.coins){
    if(c.taken)continue;
    const sx=c.x-camera.x;
    if(sx<-20||sx>W+20)continue;
    ctx.fillStyle=C.bronze;
    ctx.beginPath();ctx.arc(sx,c.y,6,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemies(){
  for(const e of level.enemies){
    if(!e.alive)continue;
    const sx=e.x-camera.x;
    if(sx+e.w<0||sx>W)continue;
    ctx.fillStyle=C.bronzeDark;
    roundRect(sx,e.y,e.w,e.h,7);
    ctx.fill();
    ctx.fillStyle=C.text;
    ctx.fillRect(sx+5,e.y+8,3,3);
    ctx.fillRect(sx+e.w-8,e.y+8,3,3);
  }
}

function drawPlayer(){
  const sx=player.x-camera.x;
  ctx.fillStyle=C.bronze;
  roundRect(sx,player.y,player.w,player.h,6);
  ctx.fill();
  ctx.fillStyle=C.panelDeep;
  const eyeX=player.facing>0?sx+player.w-9:sx+5;
  ctx.fillRect(eyeX,player.y+8,4,4);
}

function drawFlag(){
  const sx=level.flagX-camera.x;
  if(sx<-20||sx>W+20)return;
  ctx.fillStyle=C.line;
  ctx.fillRect(sx,GROUND_Y-200,2,200);
  ctx.fillStyle=C.bronze;
  ctx.beginPath();
  ctx.moveTo(sx+2,GROUND_Y-195);
  ctx.lineTo(sx+34,GROUND_Y-182);
  ctx.lineTo(sx+2,GROUND_Y-169);
  ctx.fill();
}

function drawHud(){
  ctx.fillStyle=C.panelDeep;
  ctx.fillRect(0,0,W,HY);
  ctx.fillStyle=C.bronzeDark;
  ctx.fillRect(0,HY-1,W,1);
  ctx.textBaseline='middle';
  ctx.font='bold 13px Courier New';
  ctx.fillStyle=C.bronze;ctx.textAlign='left';
  ctx.fillText(`POENG ${score}`,10,HY/2);
  ctx.fillStyle=C.text;ctx.textAlign='center';
  ctx.fillText(`◆ ${coinCount}`,W/2,HY/2);
  ctx.fillStyle=C.muted;ctx.textAlign='right';
  ctx.fillText(`LIV ${lives}`,W-70,HY/2);
  ctx.font='8px Courier New';
  ctx.fillText('ESC Katalog',W-10,HY/2);
}

function centerText(text,y,font,color){
  ctx.font=font;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,W/2,y);
}

function drawMenu(){
  ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);
  centerText('KLODDE',H/2-90,'bold 40px Courier New',C.bronze);
  centerText('─────────────────────',H/2-64,'9px Courier New',C.bronzeDark);
  const rows=[['← → / A D','GÅ'],['MELLOMROM / W / ↑','HOPP'],['HOPP PÅ FIENDER','TA DEM']];
  rows.forEach(([k,v],i)=>{
    ctx.font='10px Courier New';
    ctx.fillStyle=C.bronze;ctx.textAlign='right';ctx.fillText(k,W/2-6,H/2-30+i*18);
    ctx.fillStyle=C.muted;ctx.textAlign='left';ctx.fillText(v,W/2+6,H/2-30+i*18);
  });
  centerText('ENTER for å starte',H/2+56,'bold 13px Courier New',C.bronze);
  centerText('ESC Katalog',H-16,'8px Courier New',C.muted);
}

function drawEndScreen(won){
  ctx.fillStyle='rgba(21,15,10,0.9)';ctx.fillRect(0,0,W,H);
  centerText(won?'DU VANT! 🏁':'GAME OVER',H/2-40,'bold 30px Courier New',C.bronze);
  centerText(`Poeng: ${score}  ·  Mynter: ${coinCount}`,H/2+2,'12px Courier New',C.muted);
  centerText('ENTER — Spill igjen',H/2+40,'bold 12px Courier New',C.bronze);
  centerText('ESC Katalog',H-16,'8px Courier New',C.muted);
}

function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.clr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  texts.forEach(t=>{
    ctx.globalAlpha=Math.max(t.life,0);ctx.fillStyle=t.clr;ctx.font='bold 11px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.t,t.x,t.y);
  });
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}
function drawConfetti(){
  confetti.forEach(f=>{
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.fillStyle=f.clr;ctx.fillRect(-f.w/2,-f.w*.6,f.w,f.w*1.2);
    ctx.restore();
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  const shx=shake?(Math.random()-.5)*shake:0, shy=shake?(Math.random()-.5)*shake:0;
  ctx.save();ctx.translate(shx,shy);
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawFlag();
  drawPlayer();
  drawParticles();
  drawHud();
  if(state==='over')drawEndScreen(false);
  if(state==='win'){drawEndScreen(true);drawConfetti();}
  ctx.restore();
}

function loop(){
  updatePlayer();
  updateEnemies();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

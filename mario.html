<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>KLODDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#070712;display:flex;align-items:center;justify-content:center;height:100vh;}
</style>
</head>
<body>
<canvas id="g" width="480" height="600"></canvas>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=480,H=600,HY=44;
const GROUND_Y=H-70;
const GRAVITY=0.6,FRICTION=0.82,MOVE_SPEED=0.9,MAX_SPEED=5,JUMP_VELOCITY=-12.5;

// ── Varm-svart / bronse palett ──────────────────────────────────
const C={
  black:'#150f0a',
  panel:'#241a10',
  panelDeep:'#1a130c',
  line:'#3a2a18',
  bronze:'#cd7f32',
  bronzeDark:'#6b4423',
  text:'#f0e6d8',
  muted:'#8a715a',
};

// ── Input ────────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){window.location.href='index.html';return;}
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.key==='Enter'){
    if(state==='menu'||state==='over'||state==='win'){resetLevel(true);state='playing';}
    return;
  }
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// ── Level ────────────────────────────────────────────────────────
function buildLevel(){
  return{
    width:3200,
    platforms:[
      {x:0,y:GROUND_Y,w:900,h:40},
      {x:980,y:GROUND_Y,w:500,h:40},
      {x:1560,y:GROUND_Y,w:400,h:40},
      {x:2040,y:GROUND_Y,w:1160,h:40},
      {x:300,y:450,w:100,h:20},
      {x:470,y:390,w:100,h:20},
      {x:650,y:450,w:120,h:20},
      {x:1050,y:430,w:120,h:20},
      {x:1250,y:370,w:100,h:20},
      {x:1620,y:430,w:100,h:20},
      {x:1780,y:370,w:100,h:20},
      {x:2100,y:450,w:120,h:20},
      {x:2320,y:390,w:100,h:20},
      {x:2550,y:450,w:140,h:20},
      {x:2800,y:390,w:120,h:20},
    ],
    coins:[
      {x:330,y:410},{x:500,y:350},{x:690,y:410},
      {x:1080,y:390},{x:1280,y:330},{x:1650,y:390},
      {x:1810,y:330},{x:2140,y:410},{x:2350,y:350},
      {x:2590,y:410},{x:2840,y:350},
      {x:1100,y:GROUND_Y-40},{x:1150,y:GROUND_Y-40},{x:1200,y:GROUND_Y-40},
    ],
    enemies:[
      {x:500,y:GROUND_Y-24,w:24,h:24,range:[400,850],dir:1,speed:1.4,alive:true},
      {x:1650,y:GROUND_Y-24,w:24,h:24,range:[1560,1900],dir:1,speed:1.6,alive:true},
      {x:2150,y:GROUND_Y-24,w:24,h:24,range:[2040,2400],dir:-1,speed:1.5,alive:true},
      {x:2700,y:GROUND_Y-24,w:24,h:24,range:[2550,3100],dir:1,speed:1.8,alive:true},
    ],
    flagX:3100,
  };
}

let level=buildLevel();
function makePlayer(){return{x:40,y:GROUND_Y-32,w:24,h:32,vx:0,vy:0,onGround:false,facing:1};}
let player=makePlayer();
let camera={x:0};
let score=0,coinCount=0,lives=3;
let state='menu'; // menu | playing | over | win

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function resetLevel(fullReset){
  level=buildLevel();
  player=makePlayer();
  camera.x=0;
  if(fullReset){score=0;coinCount=0;lives=3;}
}

function loseLife(){
  lives--;
  if(lives<=0){state='over';}
  else{player=makePlayer();camera.x=0;}
}

// ── Update ───────────────────────────────────────────────────────
function updatePlayer(){
  if(state!=='playing')return;
  if(keys.ArrowLeft||keys.KeyA){player.vx-=MOVE_SPEED;player.facing=-1;}
  if(keys.ArrowRight||keys.KeyD){player.vx+=MOVE_SPEED;player.facing=1;}
  if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.onGround){player.vy=JUMP_VELOCITY;player.onGround=false;}

  player.vx*=FRICTION;
  if(player.vx>MAX_SPEED)player.vx=MAX_SPEED;
  if(player.vx<-MAX_SPEED)player.vx=-MAX_SPEED;
  if(Math.abs(player.vx)<0.05)player.vx=0;

  player.vy+=GRAVITY;
  if(player.vy>15)player.vy=15;

  player.x+=player.vx;
  if(player.x<0)player.x=0;
  for(const p of level.platforms){
    if(rectsOverlap(player,p)){
      if(player.vx>0)player.x=p.x-player.w;
      else if(player.vx<0)player.x=p.x+p.w;
      player.vx=0;
    }
  }

  player.onGround=false;
  player.y+=player.vy;
  for(const p of level.platforms){
    if(rectsOverlap(player,p)){
      if(player.vy>0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
      else if(player.vy<0){player.y=p.y+p.h;player.vy=0;}
    }
  }

  if(player.y>H+100){loseLife();return;}

  for(const c of level.coins){
    if(c.taken)continue;
    const cb={x:c.x-8,y:c.y-8,w:16,h:16};
    if(rectsOverlap(player,cb)){c.taken=true;coinCount++;score+=100;}
  }

  for(const e of level.enemies){
    if(!e.alive)continue;
    if(rectsOverlap(player,e)){
      const stomping=player.vy>0&&player.y+player.h-e.y<16;
      if(stomping){e.alive=false;player.vy=JUMP_VELOCITY*0.6;score+=200;}
      else{loseLife();return;}
    }
  }

  if(player.x+player.w>=level.flagX){score+=500;state='win';}

  camera.x=Math.max(0,Math.min(player.x-W/2,level.width-W));
}

function updateEnemies(){
  if(state!=='playing')return;
  for(const e of level.enemies){
    if(!e.alive)continue;
    e.x+=e.speed*e.dir;
    if(e.x<e.range[0]||e.x+e.w>e.range[1]){e.dir*=-1;e.x+=e.speed*e.dir;}
  }
}

// ── Draw ─────────────────────────────────────────────────────────
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBackground(){
  ctx.fillStyle=C.black;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.line;
  const step=32,offset=-((camera.x*0.4)%step);
  for(let x=offset;x<W;x+=step)for(let y=HY+20;y<GROUND_Y;y+=step)ctx.fillRect(x,y,2,2);
  ctx.fillStyle=C.bronzeDark;
  ctx.fillRect(0,GROUND_Y-1,W,1);
}

function drawPlatforms(){
  for(const p of level.platforms){
    const sx=p.x-camera.x;
    if(sx+p.w<0||sx>W)continue;
    ctx.fillStyle=C.panel;
    roundRect(sx,p.y,p.w,p.h,5);
    ctx.fill();
    ctx.fillStyle=C.bronze;
    ctx.fillRect(sx+3,p.y,Math.max(p.w-6,0),2);
  }
}

function drawCoins(){
  for(const c of level.coins){
    if(c.taken)continue;
    const sx=c.x-camera.x;
    if(sx<-20||sx>W+20)continue;
    ctx.fillStyle=C.bronze;
    ctx.beginPath();ctx.arc(sx,c.y,6,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemies(){
  for(const e of level.enemies){
    if(!e.alive)continue;
    const sx=e.x-camera.x;
    if(sx+e.w<0||sx>W)continue;
    ctx.fillStyle=C.bronzeDark;
    roundRect(sx,e.y,e.w,e.h,7);
    ctx.fill();
    ctx.fillStyle=C.text;
    ctx.fillRect(sx+5,e.y+8,3,3);
    ctx.fillRect(sx+e.w-8,e.y+8,3,3);
  }
}

function drawPlayer(){
  const sx=player.x-camera.x;
  ctx.fillStyle=C.bronze;
  roundRect(sx,player.y,player.w,player.h,6);
  ctx.fill();
  ctx.fillStyle=C.panelDeep;
  const eyeX=player.facing>0?sx+player.w-9:sx+5;
  ctx.fillRect(eyeX,player.y+8,4,4);
}

function drawFlag(){
  const sx=level.flagX-camera.x;
  if(sx<-20||sx>W+20)return;
  ctx.fillStyle=C.line;
  ctx.fillRect(sx,GROUND_Y-200,2,200);
  ctx.fillStyle=C.bronze;
  ctx.beginPath();
  ctx.moveTo(sx+2,GROUND_Y-195);
  ctx.lineTo(sx+34,GROUND_Y-182);
  ctx.lineTo(sx+2,GROUND_Y-169);
  ctx.fill();
}

function drawHud(){
  ctx.fillStyle=C.panelDeep;
  ctx.fillRect(0,0,W,HY);
  ctx.fillStyle=C.bronzeDark;
  ctx.fillRect(0,HY-1,W,1);
  ctx.textBaseline='middle';
  ctx.font='bold 13px Courier New';
  ctx.fillStyle=C.bronze;ctx.textAlign='left';
  ctx.fillText(`POENG ${score}`,10,HY/2);
  ctx.fillStyle=C.text;ctx.textAlign='center';
  ctx.fillText(`◆ ${coinCount}`,W/2,HY/2);
  ctx.fillStyle=C.muted;ctx.textAlign='right';
  ctx.fillText(`LIV ${lives}`,W-70,HY/2);
  ctx.font='8px Courier New';
  ctx.fillText('ESC Katalog',W-10,HY/2);
}

function centerText(text,y,font,color){
  ctx.font=font;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,W/2,y);
}

function drawMenu(){
  ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);
  centerText('KLODDE',H/2-90,'bold 40px Courier New',C.bronze);
  centerText('─────────────────────',H/2-64,'9px Courier New',C.bronzeDark);
  const rows=[['← → / A D','GÅ'],['MELLOMROM / W / ↑','HOPP'],['HOPP PÅ FIENDER','TA DEM']];
  rows.forEach(([k,v],i)=>{
    ctx.font='10px Courier New';
    ctx.fillStyle=C.bronze;ctx.textAlign='right';ctx.fillText(k,W/2-6,H/2-30+i*18);
    ctx.fillStyle=C.muted;ctx.textAlign='left';ctx.fillText(v,W/2+6,H/2-30+i*18);
  });
  centerText('ENTER for å starte',H/2+56,'bold 13px Courier New',C.bronze);
  centerText('ESC Katalog',H-16,'8px Courier New',C.muted);
}

function drawEndScreen(won){
  ctx.fillStyle='rgba(21,15,10,0.9)';ctx.fillRect(0,0,W,H);
  centerText(won?'DU VANT! 🏁':'GAME OVER',H/2-40,'bold 30px Courier New',C.bronze);
  centerText(`Poeng: ${score}  ·  Mynter: ${coinCount}`,H/2+2,'12px Courier New',C.muted);
  centerText('ENTER — Spill igjen',H/2+40,'bold 12px Courier New',C.bronze);
  centerText('ESC Katalog',H-16,'8px Courier New',C.muted);
}

function draw(){
  if(state==='menu'){drawMenu();return;}
  drawBackground();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawFlag();
  drawPlayer();
  drawHud();
  if(state==='over')drawEndScreen(false);
  if(state==='win')drawEndScreen(true);
}

function loop(){
  updatePlayer();
  updateEnemies();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
